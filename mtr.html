<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KCR EMU — ui-kit</title>
<link rel="stylesheet" href="shared/site-header.css?v=6">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  body[data-page="mtr"] {
    --site-ink: #e7eef6;
    --site-muted: #9aa8b8;
    --site-line: rgba(255, 255, 255, 0.14);
    --site-bar-bg: color-mix(in srgb, #000 62%, transparent);
    --site-pill: rgba(255, 255, 255, 0.08);
    --site-accent: #8fdfff;
  }
  body[data-page="mtr"] > .site-header {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    height: calc(var(--site-header-h, 56px) + env(safe-area-inset-top, 0px));
  }
  body[data-page="mtr"] .site-header__panel {
    background: color-mix(in srgb, #05070c 94%, transparent);
  }
  #stage {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
  }
  #stage-pre {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    border: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    color: #e4e4e7;
    font-family: Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
    letter-spacing: 0;
    white-space: pre;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .credit {
    position: fixed;
    z-index: 40;
    right: max(12px, env(safe-area-inset-right, 0px));
    bottom: max(10px, env(safe-area-inset-bottom, 0px));
    margin: 0;
    max-width: min(52vw, 420px);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.35;
    letter-spacing: 0.01em;
    color: rgba(176, 196, 214, 0.72);
    text-align: right;
    pointer-events: none;
  }
</style>
</head>
<body data-page="mtr">
<h1 class="sr-only">KCR first-generation EMU</h1>
<div id="stage">
  <pre id="stage-pre" aria-hidden="true"></pre>
</div>
<p class="credit">KCR first-generation EMU — original</p>
<script type="module">
import { play } from "./vendor/ascii-magic/runtime/player.js";
import { CELL_W } from "./vendor/ascii-magic/runtime/canvas.js";
import * as piece from "./vendor/ascii-mtr/metro.js?v=4";

var pre = document.getElementById("stage-pre");

function fit() {
  var cols = piece.meta.cols;
  var rows = piece.meta.rows;
  var availW = document.documentElement.clientWidth;
  var availH = document.documentElement.clientHeight;
  var px = Math.min((availW - 2) / (cols * CELL_W), (availH - 2) / (rows * CELL_W));
  if (!isFinite(px) || px < 1) px = 8;
  pre.style.fontSize = px + "px";
}

fit();
play(pre, piece, { look: { look: "dots" } });
window.addEventListener("resize", fit);
</script>
<script src="shared/site-header.js?v=10" defer></script>
</body>
</html>
