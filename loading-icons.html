/* TYPE */

.bell { animation: swing 0.85s var(--ease) infinite alternate; transform-origin: 50% 28%; }
.sound { animation: sound 0.85s ease-in-out infinite; opacity: 0; }
@keyframes swing {
  from { transform: rotate(-14deg); }
  to { transform: rotate(14deg); }
}
@keyframes sound {
  0%, 100% { opacity: 0; }
  45%, 70% { opacity: 0.9; }
}
.shackle { animation: unlock 2.4s var(--ease) infinite; transform-origin: 36% 48%; }
@keyframes unlock {
  0%, 24% { transform: none; }
  46%, 70% { transform: translateY(-7%) rotate(-32deg); }
  100% { transform: none; }
}
.sun { opacity: 0; animation: sun 4.8s ease-in-out infinite; }
.moon { opacity: 1; animation: moon 4.8s ease-in-out infinite; }
.rays { transform-box: view-box; transform-origin: 50% 50%; animation: rays 4.8s ease-in-out infinite; }
@keyframes sun {
  0%, 16% { opacity: 0; }
  36%, 64% { opacity: 1; }
  84%, 100% { opacity: 0; }
}
@keyframes moon {
  0%, 16% { opacity: 1; }
  36%, 64% { opacity: 0; }
  84%, 100% { opacity: 1; }
}
@keyframes rays {
  0%, 16% { transform: scale(0.35); opacity: 0; }
  36%, 64% { transform: scale(1); opacity: 1; }
  84%, 100% { transform: scale(0.35); opacity: 0; }
}
.ecg-clip { width: 74%; height: 56%; overflow: hidden; }
.ecg-clip svg {
  position: relative;
  inset: auto;
  width: 200%;
  height: 100%;
  animation: trace 1.6s linear infinite;
}
@keyframes trace { to { transform: translateX(-50%); } }

@media (max-width: 800px) {
  .stage { width: calc(100% - 32px); margin: 24px auto 48px; }

}

html[data-motion="reduce"] .ecg-clip svg { animation: none !important; }

(function () {

  }
  function smooth(x) { return x * x * (3 - 2 * x); }
  function frame(now) {
    if (!document.hidden) {
      var t = (now - t0) / 1000;
      var u = (t % 3) / 3;
      var p = u < 0.54 ? Math.round(smooth(u / 0.54) * 100) : (u < 0.9 ? 100 : 0);
      if (num.textContent !== String(p)) num.textContent = String(p);

      var cyc = t % 2.4;
      var n;
      var busy = true;
      if (cyc < 0.6) n = Math.max(0, 4 - Math.floor(cyc / 0.15));

      var dest = idx % 100;
      var o = dest % 10;
      var tn = Math.floor(dest / 10);
      var oPos = o === 0 ? 9 + roll : (o - 1) + roll;
      var tPos = tn;
      if (o === 0) tPos = (tn === 0 ? 9 : tn - 1) + roll;
      ones.style.transform = "translateY(" + (-oPos) + "em)";
      tens.style.transform = "translateY(" + (-tPos) + "em)";
