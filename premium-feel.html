<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Premium feel · ui-kit</title>
  <meta name="description" content="Why premium apps feel smooth. Six physics studies — button spring, pull resistance, rolling digits, drag lift, ease-out expand, and a drawn check — each with a slow-motion graph, a with/without comparison, and copyable prompt and code." />
  <script>
    (function () {
      var q = location.search || "";
      var forceReduce = /(?:^|[?&])reduce=1(?:&|$)/.test(q);
      var forceMotion = /(?:^|[?&])motion=1(?:&|$)/.test(q);
      var reduce = false;
      try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
      if (forceMotion) reduce = false;
      if (forceReduce) reduce = true;
      document.documentElement.classList.add("js");
      document.documentElement.setAttribute("data-motion", reduce ? "reduce" : "ok");
    })();
  </script>
  <link rel="stylesheet" href="shared/site-header.css?v=7" />
  <style>
    :root {
      --bg: #070d16;
      --card: #111B2E;
      --stage: #0B1424;
      --ink: #F4F8FC;
      --muted: #93A4B8;
      --accent: #4CC9FF;
      --accent-ink: #062033;
      --line: rgba(255, 255, 255, 0.08);
      --radius: 16px;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html { color-scheme: dark; }

    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(900px 420px at 88% -10%, rgba(76, 201, 255, 0.16), transparent 58%),
        radial-gradient(700px 380px at -12% 8%, rgba(76, 201, 255, 0.07), transparent 52%),
        var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    body[data-page="premium-feel"] {
      --site-ink: #e8f4ff;
      --site-muted: #93a4b8;
      --site-line: rgba(76, 201, 255, 0.16);
      --site-bar-bg: color-mix(in srgb, #070d16 84%, transparent);
      --site-pill: rgba(76, 201, 255, 0.12);
      --site-accent: #4CC9FF;
    }

    body[data-page="premium-feel"] .site-header__panel {
      background: color-mix(in srgb, #070d16 94%, transparent);
    }

    ::selection { background: rgba(76, 201, 255, 0.32); color: #fff; }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    [hidden] { display: none !important; }

    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 32px 20px calc(56px + env(safe-area-inset-bottom, 0px));
    }

    .tile,
    .back,
    .jumps button,
    .mode button,
    .go,
    .replay,
    .copy,
    .money,
    .row,
    .lisbon,
    .check-btn {
      font-family: inherit;
      color: var(--ink);
    }

    .page :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .go:focus-visible,
    .mode button[aria-pressed="true"]:focus-visible,
    .jumps button[aria-current="true"]:focus-visible,
    .copy.is-done:focus-visible {
      outline-color: #fff;
    }

    h1 {
      margin: 0;
      max-width: 16ch;
      font-size: clamp(2.5rem, 7vw, 4.4rem);
      font-weight: 700;
      letter-spacing: -0.048em;
      line-height: 0.96;
      text-wrap: balance;
    }

    .accent { color: var(--accent); }

    .lede {
      margin: 16px 0 0;
      max-width: 36rem;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 28px;
    }

    @media (min-width: 740px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    @media (min-width: 980px) {
      .grid { grid-template-columns: 1fr 1fr 1fr; }
    }

    .tile {
      appearance: none;
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 16px;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      cursor: pointer;
      font-size: 1rem;
      -webkit-tap-highlight-color: transparent;
    }

    .tile:hover { border-color: rgba(76, 201, 255, 0.45); }

    .tile__meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tile__n {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .tile__chev { color: var(--muted); }

    .tile__name {
      display: block;
      margin-top: 8px;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .tile__demo {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 148px;
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: var(--stage);
      overflow: hidden;
      pointer-events: none;
    }

    .tile .row { min-height: 34px; font-size: 13px; }
    .tile .rows { width: min(100%, 240px); }
    .tile .money { font-size: 40px; }
    .tile .lisbon { width: min(100%, 220px); }

    .study {
      position: relative;
      margin-top: 28px;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      scroll-margin-top: 72px;
    }

    .study.is-in { animation: rise 350ms cubic-bezier(0.16, 1, 0.3, 1); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .study__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .back {
      appearance: none;
      margin: 0;
      padding: 0 2px;
      min-height: 44px;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .slowmo {
      margin: 0;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1;
      white-space: nowrap;
    }

    h2 {
      margin: 4px 0 0;
      font-size: clamp(1.6rem, 3vw, 2.15rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.1;
    }

    h2 .accent { margin-right: 8px; font-size: 0.72em; letter-spacing: 0.08em; }

    .jumps {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .jumps button {
      appearance: none;
      flex: 0 0 auto;
      min-height: 44px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(76, 201, 255, 0.28);
      background: transparent;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .jumps button[aria-current="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .mode {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-top: 14px;
      padding: 4px;
      border-radius: 999px;
      background: var(--stage);
      border: 1px solid rgba(76, 201, 255, 0.22);
    }

    .mode button {
      appearance: none;
      min-height: 44px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .mode button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-ink);
    }

    .stage {
      margin-top: 14px;
      padding: 16px;
      border-radius: var(--radius);
      background: var(--stage);
      border: 1px solid var(--line);
    }

    .stage__view {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 200px;
    }

    .stage__view--pull,
    .stage__view--stack { align-items: stretch; }

    .stage__view--stack {
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stage__bar { display: flex; margin-top: 12px; }

    .hint {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .replay,
    .copy {
      appearance: none;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid rgba(76, 201, 255, 0.45);
      background: transparent;
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .replay:hover,
    .copy:hover { background: rgba(76, 201, 255, 0.1); }

    .copy.is-done {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .go {
      appearance: none;
      border: 0;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      cursor: pointer;
      transform-origin: center center;
      -webkit-tap-highlight-color: transparent;
    }

    .rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 48px;
      margin: 0;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      -webkit-tap-highlight-color: transparent;
    }

    button.row { cursor: grab; }
    button.row:active { cursor: grabbing; }

    .money {
      appearance: none;
      display: inline-flex;
      align-items: flex-end;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: clamp(52px, 16vw, 80px);
      font-weight: 600;
      letter-spacing: -0.05em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }

    .slot {
      position: relative;
      width: 0.62em;
      height: 1.12em;
      overflow: hidden;
      flex: none;
    }

    .slot__n {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .delta {
      min-height: 1.2em;
      margin: 10px 0 0;
      color: var(--accent);
      font-weight: 800;
      letter-spacing: 0.02em;
      text-align: center;
      opacity: 0;
      transform: translateY(6px);
    }

    .delta.is-on {
      opacity: 1;
      transform: none;
      transition: opacity 180ms linear, transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pull {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 14px;
      width: 100%;
      touch-action: none;
      user-select: none;
      cursor: ns-resize;
    }

    .pull__lane {
      position: relative;
      height: 220px;
      border-radius: 999px;
      background: rgba(76, 201, 255, 0.1);
    }

    .pull__pip {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 0;
      height: 32px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 8px 18px rgba(76, 201, 255, 0.28);
    }

    .pull__window {
      height: 200px;
      overflow: hidden;
      border-radius: 12px;
    }

    .reorder {
      position: relative;
      width: 100%;
      touch-action: none;
      user-select: none;
    }

    .reorder .row {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 52px;
      min-height: 52px;
      touch-action: none;
    }

    .reorder .row.is-lifted {
      background: #16283f;
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.38), 0 0 0 1px rgba(76, 201, 255, 0.45);
    }

    .grip {
      margin-left: auto;
      width: 14px;
      height: 18px;
      flex: none;
      background-image: radial-gradient(circle, #93A4B8 1.15px, transparent 1.35px);
      background-size: 7px 6px;
    }

    .fit { width: 100%; display: flex; justify-content: center; }

    .lisbon {
      appearance: none;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 88px;
      padding: 0 16px;
      border-radius: var(--radius);
      border: 1px solid rgba(76, 201, 255, 0.28);
      background: #101c31;
      color: var(--ink);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.03em;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      flex: none;
    }

    .lisbon__orb {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(76, 201, 255, 0.16);
      flex: none;
    }

    .check-btn {
      appearance: none;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }

    .check { width: 128px; height: 128px; display: block; }
    .tile .check { width: 72px; height: 72px; }

    .badge {
      display: inline-flex;
      align-items: center;
      margin: 14px 0 0;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(76, 201, 255, 0.12);
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .graph { margin: 14px 0 0; min-width: 0; }

    .plot { width: min(100%, 640px); height: auto; display: block; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 8px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .swatch {
      width: 22px;
      border-top: 2px solid var(--accent);
      font-style: normal;
    }

    .swatch--dash { border-top-style: dashed; }

    .graph figcaption {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .sheets {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .sheet {
      min-width: 0;
      background: var(--stage);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .sheet__bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 8px 0 14px;
    }

    .sheet h3 {
      margin: 0;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .sheet pre {
      margin: 0;
      padding: 8px 14px 14px;
      overflow: auto;
      max-width: 100%;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.55;
      color: #E7F4FF;
      white-space: pre;
      user-select: text;
    }

    @media (prefers-reduced-motion: reduce) {
      .study.is-in { animation: none; }
    }

    html[data-motion="reduce"] .study.is-in { animation: none; }
  </style>
</head>
<body data-page="premium-feel">
  <main class="page">
    <h1>Why premium apps <span class="accent">feel smooth</span>.</h1>
    <p class="lede">Physics, not speed. Open a card for the graph.</p>

    <div class="grid" id="grid">
      <button type="button" class="tile" data-study="button">
        <span class="tile__meta"><span class="tile__n">01</span><svg class="tile__chev" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="tile__name">Sink, then spring</span>
        <span class="sr">Open the slow-motion breakdown.</span>
        <span class="tile__demo" aria-hidden="true"><span class="go">Continue</span></span>
      </button>
      <button type="button" class="tile" data-study="pull">
        <span class="tile__meta"><span class="tile__n">02</span><svg class="tile__chev" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="tile__name">Resist the pull</span>
        <span class="sr">Open the slow-motion breakdown.</span>
        <span class="tile__demo" aria-hidden="true"><span class="rows"><span class="row">Messages</span><span class="row">Calendar</span><span class="row">Notes</span></span></span>
      </button>
      <button type="button" class="tile" data-study="roll">
        <span class="tile__meta"><span class="tile__n">03</span><svg class="tile__chev" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="tile__name">Roll, don’t jump</span>
        <span class="sr">Open the slow-motion breakdown.</span>
        <span class="tile__demo" aria-hidden="true"><span class="money">$486</span></span>
      </button>
      <button type="button" class="tile" data-study="drag">
        <span class="tile__meta"><span class="tile__n">04</span><svg class="tile__chev" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="tile__name">Lift, then make room</span>
        <span class="sr">Open the slow-motion breakdown.</span>
        <span class="tile__demo" aria-hidden="true"><span class="rows"><span class="row">Gym at 7</span><span class="row">Groceries</span><span class="row">Read 20 pages</span></span></span>
      </button>
      <button type="button" class="tile" data-study="card">
        <span class="tile__meta"><span class="tile__n">05</span><svg class="tile__chev" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="tile__name">Fast, then slow</span>
        <span class="sr">Open the slow-motion breakdown.</span>
        <span class="tile__demo" aria-hidden="true"><span class="lisbon"><span class="lisbon__orb"></span><span>Lisbon nights</span></span></span>
      </button>
      <button type="button" class="tile" data-study="success">
        <span class="tile__meta"><span class="tile__n">06</span><svg class="tile__chev" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="tile__name">Draw the win</span>
        <span class="sr">Open the slow-motion breakdown.</span>
        <span class="tile__demo" aria-hidden="true">
          <svg class="check" viewBox="0 0 100 100"><circle cx="50" cy="50" r="32" fill="none" stroke="rgba(76,201,255,0.22)" stroke-width="3"/><circle cx="50" cy="50" r="32" fill="none" stroke="#4CC9FF" stroke-width="3"/><path d="M32 52 L45 65 L70 36" fill="none" stroke="#4CC9FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>
    </div>

    <section class="study" id="study" hidden aria-labelledby="study-title">
      <div class="study__top">
        <button type="button" class="back" id="study-back">All six</button>
        <p class="slowmo" id="slowmo">SLOW-MO 1/4x</p>
      </div>
      <h2 id="study-title" tabindex="-1"></h2>
      <div class="jumps" id="jumps" role="navigation" aria-label="Studies"></div>
      <div class="mode" role="group" aria-label="Compare physics">
        <button type="button" id="mode-with" aria-pressed="true">With</button>
        <button type="button" id="mode-without" aria-pressed="false">Without</button>
      </div>
      <div class="stage" id="stage"></div>
      <p class="badge" id="badge"></p>
      <figure class="graph">
        <div id="graph-host"></div>
        <div class="legend" id="legend"></div>
        <figcaption id="graph-cap"></figcaption>
      </figure>
      <div class="sheets">
        <section class="sheet" aria-labelledby="prompt-label">
          <div class="sheet__bar">
            <h3 id="prompt-label">Prompt</h3>
            <button type="button" class="copy" id="copy-prompt">Copy</button>
          </div>
          <pre id="prompt-text"></pre>
        </section>
        <section class="sheet" aria-labelledby="code-label">
          <div class="sheet__bar">
            <h3 id="code-label">Code</h3>
            <button type="button" class="copy" id="copy-code">Copy</button>
          </div>
          <pre id="code-text"></pre>
        </section>
      </div>
      <p class="sr" id="copy-status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var reduce = document.documentElement.getAttribute("data-motion") === "reduce";
      var SLOW = 4;
      var session = 0;
      var physics = true;
      var currentId = null;
      var lastId = null;
      var SVG_NS = "http://www.w3.org/2000/svg";

      function clamp(v, a, b) {
        if (v < a) return a;
        if (v > b) return b;

            api.draw(u);
            if (u === 1) {
              drag = null;
              clearTransitions();
              place();
            }
          });
        }

        function play() {
          token += 1;
          job.cancel();
          drag = null;
          order = IDS.slice();
          clearTransitions();
          place();
          root.getBoundingClientRect();
          arm("groceries");
          var sid = token;
          var reordered = false;
          drag = { id: "groceries", y: SLOT, scale: 1 };
          job = animate(1200, function (u) {
            if (sid !== token) return;
            var t = u * 1200;
            drag.y = scriptY(t);
            drag.scale = liftScale(t, api.physics);
            var target = clamp(Math.round(drag.y / SLOT), 0, 2);
            if (!reordered && target !== indexOf("groceries")) {
              reordered = true;
              var from = indexOf("groceries");
              order.splice(from, 1);
              order.splice(target, 0, "groceries");
            }
            place();
            api.draw(u);
            if (u === 1) {
              drag = null;
              clearTransitions();
              place();
            }
          });
        }

        place();
        addReplay(stage, play, "Replay the lift and slide");
        play();
      }

      function mountCard(stage, api) {
        var view = document.createElement("div");
        view.className = "stage__view";
        var fit = document.createElement("div");
        fit.className = "fit";
        var button = document.createElement("button");
        button.type = "button";
        button.className = "lisbon";
        button.id = "lisbon";
        button.setAttribute("aria-expanded", "false");
        var orb = document.createElement("span");
        orb.className = "lisbon__orb";
        orb.setAttribute("aria-hidden", "true");
        var label = document.createElement("span");
        label.textContent = "Lisbon nights";
        button.appendChild(orb);
        button.appendChild(label);
        fit.appendChild(button);
        view.appendChild(fit);
        stage.appendChild(view);

        var current = 0;
        var job = { cancel: function () {} };
        var token = 0;

        function apply(u) {
          current = clamp(u, 0, 1);
          var max = fit.clientWidth || 280;
          var min = Math.min(200, max);
          button.style.width = (min + (max - min) * current).toFixed(2) + "px";
          button.setAttribute("aria-expanded", current > 0.85 ? "true" : "false");
        }

        function runTo(target, id) {
          if (id == null) id = ++token;
          job.cancel();
          var from = current;
          job = animate(350, function (p) {
            if (id !== token) return;
            var eased = api.physics ? quint(p) : p;
            apply(from + (target - from) * eased);
            api.draw(p);
          });
        }

        function replay() {
          var id = ++token;
          var sid = session;
          job.cancel();
          apply(0);
          api.draw(0);
          if (reduce) {
            apply(1);
            api.draw(1);
            return;
          }
          var timer = setTimeout(function () {
            if (sid !== session || id !== token) return;
            runTo(1, id);
          }, 160 * SLOW);
          job = { cancel: function () { clearTimeout(timer); } };
        }

        button.addEventListener("click", function () {
          runTo(current > 0.5 ? 0 : 1);
        });
        addReplay(stage, replay, "Replay the card expand");
        replay();
      }

      function mountSuccess(stage, api) {
        var view = document.createElement("div");
        view.className = "stage__view";
        var button = document.createElement("button");
        button.type = "button";
        button.className = "check-btn";
        button.id = "check";
        button.setAttribute("aria-label", "Play the success check");
        var svg = svgEl("svg", { viewBox: "0 0 100 100", class: "check", "aria-hidden": "true" });
        var track = svgEl("circle", {
          cx: "50", cy: "50", r: "32", fill: "none",
          stroke: "rgba(76,201,255,0.22)", "stroke-width": "3"
        });
        var group = svgEl("g", {});
        var circle = svgEl("circle", {
          cx: "50", cy: "50", r: "32", fill: "none", stroke: "#4CC9FF",
          "stroke-width": "3", "stroke-linecap": "round",
          pathLength: "1", "stroke-dasharray": "1", "stroke-dashoffset": "1",
          transform: "rotate(-90 50 50)"
        });
        var tick = svgEl("path", {
          d: "M32 52 L45 65 L70 36", fill: "none", stroke: "#4CC9FF",
          "stroke-width": "3.5", "stroke-linecap": "round", "stroke-linejoin": "round",
          pathLength: "1", "stroke-dasharray": "1", "stroke-dashoffset": "1"
        });
        group.appendChild(circle);
        group.appendChild(tick);
        svg.appendChild(track);
        svg.appendChild(group);
        button.appendChild(svg);
        view.appendChild(button);
        stage.appendChild(view);

        var job = { cancel: function () {} };

        function apply(u) {
          var t = u * 470;
          if (api.physics) {
            group.removeAttribute("transform");
            circle.setAttribute("stroke-dashoffset", String(1 - circleDrawn(t)));
            tick.setAttribute("stroke-dashoffset", String(1 - tickDrawn(t)));
          } else {
            circle.setAttribute("stroke-dashoffset", "0");
            tick.setAttribute("stroke-dashoffset", "0");
            var scale = popScale(t);
            group.setAttribute("transform", "translate(50 50) scale(" + scale.toFixed(4) + ") translate(-50 -50)");
          }
          api.draw(u);
        }
        function play() {
          job.cancel();
          apply(0);
          job = animate(470, apply);
        }
        button.addEventListener("click", play);
        addReplay(stage, play, "Replay the success check");
        play();
      }

      function lines() {
        var args = Array.prototype.slice.call(arguments);
        return args.join("\n");
      }

              xTicks: [{ u: 0, text: "0" }, { u: 600 / 800, text: "600" }, { u: 1, text: "800ms" }],
              series: [

                { name: "10s", color: "#8FDBFF", width: withPhysics ? "2.2" : "1.4", sample: function (u) { return digitY(u * 800, 100, true); } },
                { name: "1s", color: "#D7F3FF", width: withPhysics ? "2" : "1.3", sample: function (u) { return digitY(u * 800, 200, true); } },
                { name: "Jump", color: "#93A4B8", dash: "5 4", width: withPhysics ? "1.5" : "2.6", sample: function (u) { return digitY(u * 800, 0, false); } }
              ]
            };
          }
        },
        {
          id: "drag",
          n: "04",
          short: "Lift",
          name: "Lift, then make room",
          badge: "LIFT 105% - OTHERS SLIDE 200ms",
          badgeOff: "NO LIFT - SLIDE NOW",
          caption: "Lift vs time · 1200ms",
          prompt: "Drag-to-reorder list where dragged item lifts to 105% scale with shadow, other items only slide to make room after 200ms delay.",
          code: lines(
            "dragged.style.transform = \"scale(1.05)\";",

            "});"
          ),
          mount: mountDrag,
          graph: function (withPhysics) {
            return {

              yTicks: [{ v: 1, text: "1.00" }, { v: 1.05, text: "1.05" }],
              xTicks: [{ u: 0, text: "0" }, { u: 200 / 1200, text: "200" }, { u: 1, text: "1200ms" }],
              guides: [1.05],
              guidesX: [200 / 1200],
              series: [
                { name: "With", color: "#4CC9FF", width: withPhysics ? "2.75" : "1.7", sample: function (u) { return liftScale(u * 1200, true); } },
                { name: "Without", color: "#93A4B8", dash: "5 4", width: withPhysics ? "1.7" : "2.75", sample: function (u) { return liftScale(u * 1200, false); } }
              ]
            };
          }
        },
        {
          id: "card",
          n: "05",
          short: "Expand",
          name: "Fast, then slow",
          badge: "EASE-OUT - 350ms",

          code: lines(
            ".lisbon {",

          mount: mountCard,

              xTicks: [{ u: 0, text: "0" }, { u: 1, text: "350ms" }],
              series: [
                { name: "Ease-out", color: "#4CC9FF", width: withPhysics ? "2.75" : "1.7", sample: function (u) { return quint(u); } },
                { name: "Linear", color: "#93A4B8", dash: "5 4", width: withPhysics ? "1.7" : "2.75", sample: function (u) { return u; } }
              ]
            };
          }
        },
        {
          id: "success",
          n: "06",
          short: "Check",
          name: "Draw the win",
          badge: "CIRCLE, THEN TICK - 470ms",
          badgeOff: "POP THE CHECK",
          caption: "Tick drawn · 470ms",
          prompt: "Success checkmark animation - draw circle stroke first (300ms) then draw tick (170ms), total 470ms, use SVG pathLength animation.",
          code: lines(
            "circle.style.strokeDasharray = \"1\";",
            "tick.style.strokeDasharray = \"1\";",
            "circle.style.transition = \"stroke-dashoffset 300ms ease-out\";",
            "tick.style.transition = \"stroke-dashoffset 170ms cubic-bezier(0.45, 0, 0.55, 1) 170ms\";",
            "circle.style.strokeDashoffset = \"0\";",
            "tick.style.strokeDashoffset = \"0\";",
            "",
            "// pathLength 0 -> 1",
            "// circle duration 0.3s",
            "// tick delay 0.17s, duration 0.17s"
          ),
          mount: mountSuccess,
          graph: function (withPhysics) {
            return {
              yMin: 0, yMax: 1.08,
              yTicks: [{ v: 0, text: "0" }, { v: 1, text: "1" }],
              xTicks: [{ u: 0, text: "0" }, { u: 170 / 470, text: "170" }, { u: 1, text: "470ms" }],
              guidesX: [170 / 470, 300 / 470],
              series: [
                { name: "Circle", color: "#8FDBFF", width: withPhysics ? "1.8" : "1.3", sample: function (u) { return circleDrawn(u * 470); } },
                { name: "Tick", color: "#4CC9FF", width: withPhysics ? "2.75" : "1.6", sample: function (u) { return tickDrawn(u * 470); } },
                { name: "Pop", color: "#93A4B8", dash: "5 4", width: withPhysics ? "1.5" : "2.6", sample: function (u) { return (popScale(u * 470) - 0.4) / 0.6; } }
              ]

      ];

      function findStudy(id) {
        var i;
        for (i = 0; i < STUDIES.length; i++) {
          if (STUDIES[i].id === id) return STUDIES[i];
        }
        return null;
      }

      function setHash(id) {
        if (!history.replaceState) return;
        var url = location.pathname + location.search;
        if (id) url += "#" + id;
        history.replaceState(null, "", url);
      }

      function syncMode() {
        document.getElementById("mode-with").setAttribute("aria-pressed", physics ? "true" : "false");
        document.getElementById("mode-without").setAttribute("aria-pressed", physics ? "false" : "true");
      }

      function syncJumps() {
        var buttons = document.querySelectorAll("#jumps button");
        Array.prototype.forEach.call(buttons, function (button) {
          var on = button.getAttribute("data-jump") === currentId;
          if (on) button.setAttribute("aria-current", "true");
          else button.removeAttribute("aria-current");
        });
      }

      function render() {
        session += 1;
        var spec = findStudy(currentId);
        if (!spec) return;
        var title = document.getElementById("study-title");
        title.textContent = "";
        var num = document.createElement("span");
        num.className = "accent";
        num.textContent = spec.n;
        title.appendChild(num);
        title.appendChild(document.createTextNode(" " + spec.name));
        document.getElementById("badge").textContent = physics ? spec.badge : spec.badgeOff;
        document.getElementById("graph-cap").textContent = spec.caption;
        document.getElementById("prompt-text").textContent = spec.prompt;
        document.getElementById("code-text").textContent = spec.code;
        document.getElementById("slowmo").textContent = reduce ? "REDUCED MOTION" : "SLOW-MO 1/4x";
        syncMode();
        syncJumps();
        var graph = createGraph(
          document.getElementById("graph-host"),
          document.getElementById("legend"),
          spec.graph(physics)
        );
        var stage = document.getElementById("stage");
        stage.replaceChildren();
        spec.mount(stage, {
          physics: physics,
          draw: function (p) { graph.draw(p); }
        });
      }

      function openStudy(id, opts) {
        opts = opts || {};
        if (!findStudy(id)) return;
        currentId = id;
        lastId = id;
        document.getElementById("grid").hidden = true;
        var study = document.getElementById("study");
        study.hidden = false;
        study.classList.add("is-in");
        render();
        setHash(id);
        if (!opts.keepFocus) document.getElementById("study-title").focus();
        if (opts.scroll !== false) {
          study.scrollIntoView({ block: "start", behavior: reduce ? "auto" : "smooth" });
        }
      }

      function closeStudy() {
        session += 1;
        var id = lastId;
        currentId = null;
        document.getElementById("study").hidden = true;
        document.getElementById("grid").hidden = false;
        setHash("");
        if (id) {
          var tile = document.querySelector('.tile[data-study="' + id + '"]');
          if (tile) tile.focus();
        }
      }

      function copyText(text) {
        function legacy() {
          return new Promise(function (resolve, reject) {
            var area = document.createElement("textarea");
            area.value = text;
            area.setAttribute("readonly", "");
            area.style.position = "fixed";
            area.style.left = "-9999px";
            document.body.appendChild(area);
            area.select();
            var ok = false;
            try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
            document.body.removeChild(area);
            if (ok) resolve();
            else reject(new Error("copy failed"));
          });
        }
        if (navigator.clipboard && window.isSecureContext && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text).catch(legacy);
        }
        return legacy();
      }

      function bindCopy(button, read, what) {
        button.addEventListener("click", function () {
          copyText(read()).then(function () {
            button.textContent = "Copied";
            button.classList.add("is-done");
            document.getElementById("copy-status").textContent = "Copied " + what;
            setTimeout(function () {
              button.textContent = "Copy";
              button.classList.remove("is-done");
            }, 1400);
          }).catch(function () {
            document.getElementById("copy-status").textContent = "Copy failed";
          });
        });
      }

      var jumps = document.getElementById("jumps");
      STUDIES.forEach(function (spec) {
        var button = document.createElement("button");
        button.type = "button";
        button.textContent = spec.short;
        button.setAttribute("data-jump", spec.id);
        button.addEventListener("click", function () {
          openStudy(spec.id, { keepFocus: true, scroll: false });
        });
        jumps.appendChild(button);
      });

      document.getElementById("grid").addEventListener("click", function (e) {
        var node = e.target;
        while (node && node !== document) {
          if (node.classList && node.classList.contains("tile")) {
            openStudy(node.getAttribute("data-study"));
            return;
          }
          node = node.parentNode;
        }
      });

      document.getElementById("study-back").addEventListener("click", closeStudy);
      document.getElementById("mode-with").addEventListener("click", function () {
        if (physics || !currentId) return;
        physics = true;
        render();
      });
      document.getElementById("mode-without").addEventListener("click", function () {
        if (!physics || !currentId) return;
        physics = false;
        render();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && currentId) {
          e.preventDefault();
          closeStudy();
        }
      });

      bindCopy(document.getElementById("copy-prompt"), function () {
        return document.getElementById("prompt-text").textContent;
      }, "prompt");
      bindCopy(document.getElementById("copy-code"), function () {
        return document.getElementById("code-text").textContent;
      }, "code");

      window.addEventListener("hashchange", function () {
        var id = (location.hash || "").replace(/^#/, "");
        if (findStudy(id)) {
          if (id !== currentId) openStudy(id, { keepFocus: true, scroll: false });
        } else if (currentId) {
          closeStudy();
        }
      });

      var params = new URLSearchParams(location.search);
      var initial = params.get("open") || (location.hash || "").replace(/^#/, "");
      if (findStudy(initial)) openStudy(initial, { scroll: false });
    })();
  </script>
