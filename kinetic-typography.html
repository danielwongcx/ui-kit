<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motion prompt · ui-kit</title>
<meta name="description" content="192 looping canvas effects from Shohei Ohtaki’s Motion Prompt gallery. Filter by pack. MIT License.">
<!--
  Rank: primary = the effect canvases. Secondary = each effect name. Tertiary = the number, the meaning, and the credit.
  Primary action = the pack filter. All is the resting choice.
  Tokens: space 4–64, type 12–18, ink / muted / page, radius 12, the wave-grid shadow.
  Effects: vendor/motion-prompt/ (MIT, Shohei Ohtaki). #008 is one card in the grid.
-->
<script>
  (function () {
    var q = location.search || "";
    var forceReduce = /(?:^|[?&])reduce=1(?:&|$)/.test(q);
    var forceMotion = /(?:^|[?&])motion=1(?:&|$)/.test(q);
    var reduce = false;
    try {
      reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    } catch (e) {}
    if (forceMotion) reduce = false;
    if (forceReduce) reduce = true;
    document.documentElement.classList.add("js");
    if (reduce) document.documentElement.setAttribute("data-motion", "reduce");
  })();
</script>
<link rel="stylesheet" href="shared/site-header.css?v=7">
<style>
  :root {
    --space-4: 4px;
    --space-8: 8px;
    --space-12: 12px;
    --space-16: 16px;
    --space-24: 24px;
    --space-32: 32px;
    --space-48: 48px;
    --space-64: 64px;
    --text-12: 12px;
    --text-14: 14px;
    --text-16: 16px;
    --text-18: 18px;
    --ink: #1c1c22;
    --muted: #5c5c66;
    --page: #f6f5f3;
    --card: #ffffff;
    --line: rgba(28, 28, 34, 0.1);
    --track: #eceae6;
    --radius: 12px;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --shadow:
      0 1px 2px rgba(28, 28, 34, 0.06),
      0 8px 16px rgba(28, 28, 34, 0.05);
  }

  html, body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
  }

  body {
    font-family: var(--sans);
    font-size: var(--text-16);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page, .page *, .page *::before, .page *::after {
    box-sizing: border-box;
  }

  .page [hidden] {
    display: none !important;
  }

  .page {
    max-width: 1120px;
    margin: 0 auto;
    padding: var(--space-32) var(--space-24) var(--space-64);
  }

  .hero {
    display: flex;
    flex-direction: column;
    gap: var(--space-8);
  }

  h1 {
    margin: 0;
    font-size: var(--text-18);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.3;
  }

  .lede {
    margin: 0;
    max-width: 40em;
    font-size: var(--text-14);
    font-weight: 400;
    line-height: 1.5;
    color: var(--muted);
  }

  .lede a {
    color: var(--ink);
    font-weight: 600;
    text-underline-offset: 0.15em;
  }

  .filters {
    display: flex;
    flex-direction: column;
    gap: var(--space-16);
    margin: var(--space-32) 0;
  }

  .filter {
    display: flex;
    flex-direction: column;
    gap: var(--space-8);
  }

  .filter__label {
    font-size: var(--text-12);
    font-weight: 600;
    letter-spacing: 0.02em;
    line-height: 1.3;
    color: var(--muted);
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-8);
  }

  .chip {
    min-height: 44px;
    max-width: 100%;
    padding: var(--space-8) var(--space-16);
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    font: 600 var(--text-14)/1.2 var(--sans);
    text-align: center;
    cursor: pointer;
  }

  .chip:hover {
    border-color: rgba(28, 28, 34, 0.28);
  }

  .chip[aria-checked="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }

  .chip[aria-checked="true"]:hover {
    background: #2a2a32;
    border-color: #2a2a32;
  }

  .count,
  .status {
    margin: 0;
    font-size: var(--text-14);
    font-weight: 400;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }

  .count {
    color: var(--muted);
  }

  .status {
    color: var(--ink);
    margin-bottom: var(--space-16);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
    gap: var(--space-24);
  }

  .card {
    min-width: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    scroll-margin-top: calc(var(--site-header-h, 56px) + var(--space-16));
    scroll-margin-bottom: var(--space-16);
  }

  .card.is-target,
  .card:target {
    box-shadow:
      0 0 0 2px var(--ink),
      var(--shadow);
  }

  .card:focus {
    outline: none;
  }

  .card__stage {
    background: var(--track);
    line-height: 0;
  }

  .card__stage canvas {
    display: block;
    width: 100%;
    height: auto;
  }

  .card__body {
    display: flex;
    flex-direction: column;
    gap: var(--space-8);
    padding: var(--space-16);
  }

  .card__name {
    margin: 0;
    font-size: var(--text-16);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.3;
  }

  .card__name a {
    color: var(--ink);
    text-decoration: none;
  }

  .card__name a:hover {
    text-decoration: underline;
    text-underline-offset: 0.15em;
  }

  .card__id {
    color: var(--muted);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .card__meaning {
    margin: 0;
    font-size: var(--text-14);
    font-weight: 400;
    line-height: 1.5;
    color: var(--muted);
  }

  .lede a:focus-visible,
  .chip:focus-visible,
  .card__name a:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  @media (min-width: 800px) {
    .page {
      padding: var(--space-48) var(--space-48) var(--space-64);
    }
  }
</style>
</head>
<body data-page="kinetic-typography">
<main class="page">
  <header class="hero">
    <h1 id="page-title">Motion prompt</h1>
    <p class="lede" id="lede">
      192 looping canvas effects from
      <a href="https://showheyohtaki.github.io/motion-prompt/" target="_blank" rel="noopener noreferrer">Shohei Ohtaki’s Motion Prompt</a>
      gallery, including
      <a href="#008">kinetic typography</a>.
      MIT License. Source on
      <a href="https://github.com/showheyohtaki/motion-prompt" target="_blank" rel="noopener noreferrer">GitHub</a>.
    </p>
  </header>

  <div class="filters">
    <div class="filter">
      <span class="filter__label" id="pack-label">Pack</span>
      <div class="chips" id="pack-chips" role="radiogroup" aria-labelledby="pack-label" aria-controls="grid"></div>
    </div>
    <div class="filter" id="cat-filter" hidden>
      <span class="filter__label" id="cat-label">Category</span>
      <div class="chips" id="cat-chips" role="radiogroup" aria-labelledby="cat-label" aria-controls="grid"></div>
    </div>
    <p class="count" id="count" hidden></p>
  </div>
  <p class="status" id="status" role="status" hidden></p>
  <div class="grid" id="grid"></div>
</main>

<script src="vendor/motion-prompt/pack-motion.js" defer></script>

<script src="kinetic-typography.js" defer></script>
<script src="shared/site-header.js?v=17" defer></script>
</body>
</html>
