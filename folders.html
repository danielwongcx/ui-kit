<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ui-kit · Folders</title>
  <link rel="stylesheet" href="shared/site-header.css?v=6" />
  <style>
    :root {
      --page: #ececf0;
      --card: #fbfbfc;
      --ink: #1c1c22;
      --muted: #6b6b76;
      --shadow: 0 20px 44px rgba(15, 17, 21, 0.09), 0 2px 8px rgba(15, 17, 21, 0.04);
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      background: var(--page);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 20px 72px;
      min-width: 0;
      display: flex;
      justify-content: center;
    }

    /* Sea / smoke teal. Fixed specimen — no glass-color controls. */
    .folders-card {
      --glass-top: rgba(206, 228, 222, 0.86);
      --glass-mid: rgba(92, 136, 132, 0.8);
      --glass-bot: rgba(36, 58, 60, 0.92);
      --glass-tab-top: rgba(232, 244, 240, 0.96);
      --glass-tab-mid: rgba(148, 184, 178, 0.9);
      --glass-tab-bot: rgba(96, 138, 134, 0.88);
      --glass-shadow: rgba(16, 34, 36, 0.32);
      --glass-shadow-soft: rgba(16, 34, 36, 0.16);
      --glass-inset: rgba(8, 22, 24, 0.22);
      background: var(--card);
      border-radius: 28px;
      padding: 28px 28px 32px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(15, 17, 21, 0.045);
      width: min(420px, 100%);
      min-width: 0;
    }

    .folders-card > .label {
      margin: 0 0 22px;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .folder-stage {
      display: flex;
      justify-content: center;
      margin: 0 0 22px;
      min-width: 0;
    }

    .folder {
      container-type: inline-size;
      position: relative;
      width: min(300px, 100%);
      aspect-ratio: 300 / 228;
      max-width: 100%;
    }

    .folder-back {
      position: absolute;
      left: 6%;
      right: 6%;
      top: 23%;
      height: 44%;
      border-radius: 16px 16px 10px 10px;
      background: linear-gradient(180deg, #3c4046 0%, #23262b 42%, #1a1d21 100%);
      box-shadow:
        0 12px 20px rgba(15, 17, 21, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 10px 16px rgba(0, 0, 0, 0.28);
      z-index: 1;
    }

    .paper {
      position: absolute;
      background: linear-gradient(180deg, #ffffff 0%, #f5f6f8 100%);
      border-radius: 5px 3px 8px 8px;
      box-shadow:
        0 10px 18px rgba(15, 17, 21, 0.16),
        0 1px 0 rgba(255, 255, 255, 0.9) inset;
      z-index: 2;
      overflow: hidden;
    }

    .paper .ear {
      position: absolute;
      top: 0;
      right: 0;
      width: 34%;
      aspect-ratio: 1;
      background: linear-gradient(225deg, #c5cad2 0 46%, #e6e8ed 49%, #f7f8fa 54%, #ffffff 62%);
      clip-path: polygon(100% 0, 0 100%, 100% 100%);
      box-shadow: -1px 1px 0 rgba(255, 255, 255, 0.65);
    }

    .paper .lines {
      position: absolute;
      left: 13%;
      right: 30%;
      top: 30%;
      display: flex;
      flex-direction: column;
      gap: 0.55em;
    }

    .paper .lines span {
      display: block;
      height: 3px;
      border-radius: 2px;
      background: #d3d7de;
    }

    .paper .lines span:nth-child(1) { width: 70%; }
    .paper .lines span:nth-child(2) { width: 96%; }
    .paper .lines span:nth-child(3) { width: 52%; }

    .paper-a {
      left: 14%;
      top: 1%;
      width: 44%;
      height: 62%;
      transform: rotate(-11deg);
      transform-origin: 55% 100%;
      z-index: 2;
      font-size: 14px;
    }

    .paper-b {
      left: 40%;
      top: 0;
      width: 46%;
      height: 60%;
      transform: rotate(8deg);
      transform-origin: 40% 100%;
      z-index: 3;
      font-size: 14px;
    }

    .paper-b .lines { top: 28%; right: 34%; }

    .folder-front {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 54%;
      z-index: 4;
      border-radius: 3px 20px 22px 22px;
      background:
        radial-gradient(85% 110% at -8% 8%, rgba(255, 255, 255, 0.62), transparent 46%),
        linear-gradient(
          128deg,
          var(--glass-top) 0%,
          var(--glass-mid) 42%,
          var(--glass-bot) 100%
        );
      box-shadow:
        0 18px 32px var(--glass-shadow),
        0 4px 10px var(--glass-shadow-soft),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.5),
        inset 0 -12px 24px var(--glass-inset);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      backdrop-filter: blur(14px) saturate(1.2);
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-top-color: rgba(255, 255, 255, 0.08);
      border-left-color: rgba(255, 255, 255, 0.4);
    }

    .folder-front .tab {
      position: absolute;
      left: -1px;
      bottom: calc(100% - 2px);
      width: 46%;
      height: 34%;
      border-radius: 14px 16px 0 0;
      background: linear-gradient(
        168deg,
        var(--glass-tab-top) 0%,
        var(--glass-tab-mid) 48%,
        var(--glass-tab-bot) 100%
      );
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 0.75),
        0 -6px 12px rgba(16, 34, 36, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-bottom: none;
      z-index: 1;
    }

    .folder-front .tab::after {
      content: "";
      position: absolute;
      right: -11px;
      bottom: 0;
      width: 20px;
      height: 14px;
      background: inherit;
      border-radius: 0 0 12px 0;
      transform: skewX(-20deg);
      transform-origin: left bottom;
      z-index: -1;
    }

    .folder-front .lip {
      position: absolute;
      left: 50%;
      right: 10px;
      top: 0;
      height: 1.5px;
      border-radius: 2px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.12));
      z-index: 2;
      pointer-events: none;
    }

    .folder-front .sheen {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        radial-gradient(62% 88% at 0% 28%, rgba(255, 255, 255, 0.5), transparent 58%),
        linear-gradient(100deg, rgba(255, 255, 255, 0.16), transparent 40%),
        linear-gradient(112deg, transparent 38%, rgba(255, 255, 255, 0.2) 49%, transparent 60%);
      pointer-events: none;
      z-index: 2;
    }

    .folder-ui {
      position: absolute;
      left: 7%;
      bottom: 17%;
      display: flex;
      align-items: center;
      gap: 3.6cqi;
      z-index: 5;
      max-width: 88%;
    }

    .avatars {
      display: flex;
      align-items: center;
      flex: none;
    }

    .avatars .av {
      width: 12.4cqi;
      height: 12.4cqi;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 5cqi;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #fff;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.22);
      border: 2px solid rgba(255, 255, 255, 0.88);
      box-shadow: 0 2px 6px rgba(15, 17, 21, 0.24);
    }

    .avatars .av + .av { margin-left: -3.4cqi; }

    .av-m {
      background: linear-gradient(155deg, #b9a0fb, #7c4fe0 58%, #6b3fd4);
      z-index: 1;
    }

    .av-a {
      background: linear-gradient(155deg, #8af0c6, #34d399 52%, #14b87c);
      z-index: 2;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      height: 10.2cqi;
      padding: 0 3.8cqi;
      border-radius: 999px;
      font-size: 4.35cqi;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #fff;
      background: rgba(18, 24, 26, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      white-space: nowrap;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .meta { text-align: center; }

    .meta h2 {
      margin: 0 0 6px;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .meta p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--muted);
      letter-spacing: -0.01em;
    }

    @media (max-width: 380px) {
      main { padding: 28px 16px 48px; }
      .folders-card { padding: 22px 18px 26px; }
      .folders-card > .label { margin-bottom: 16px; font-size: 1.25rem; }
      .meta h2 { font-size: 1.3rem; }
      .meta p { font-size: 0.88rem; }
    }
  </style>
</head>
<body data-page="folders">
  <main>
    <article class="folders-card" aria-labelledby="folders-label">
      <h1 class="label" id="folders-label">Folders</h1>

      <div class="folder-stage">
        <div class="folder" role="img" aria-label="Onboarding folder with two documents, avatars M and A, updated 2 hours ago">
          <div class="folder-back" aria-hidden="true"></div>

          <div class="paper paper-a" aria-hidden="true">
            <span class="ear"></span>
            <div class="lines">
              <span></span><span></span><span></span>
            </div>
          </div>
          <div class="paper paper-b" aria-hidden="true">
            <span class="ear"></span>
            <div class="lines">
              <span></span><span></span><span></span>
            </div>
          </div>

          <div class="folder-front">
            <span class="tab" aria-hidden="true"></span>
            <span class="lip" aria-hidden="true"></span>
            <span class="sheen" aria-hidden="true"></span>
            <div class="folder-ui">
              <div class="avatars" aria-hidden="true">
                <span class="av av-m">M</span>
                <span class="av av-a">A</span>
              </div>
              <span class="badge">Updated 2h</span>
            </div>
          </div>
        </div>
      </div>

      <div class="meta">
        <h2>Onboarding</h2>
        <p>15 files · 3 subfolders</p>
      </div>
    </article>
  </main>
  <script src="shared/site-header.js?v=6" defer></script>
</body>
</html>
