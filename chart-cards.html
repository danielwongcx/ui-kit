<script>
  (function () {
    var q = location.search || "";
    var forceReduce = /(?:^|[?&])reduce=1(?:&|$)/.test(q);
    var forceMotion = /(?:^|[?&])motion=1(?:&|$)/.test(q);
    var reduce = false;
    try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
    if (forceMotion) reduce = false;
    if (forceReduce) reduce = true;
    if (reduce) document.documentElement.setAttribute("data-motion", "reduce");
    var theme = "light";
    var asked = q.match(/(?:^|[?&])theme=(light|dark)(?:&|$)/);
    if (asked) theme = asked[1];
    else {
      try {
        var stored = localStorage.getItem("chart-cards-theme");
        if (stored === "light" || stored === "dark") theme = stored;
      } catch (e) {}
    }
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>

<style>
  html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--text); }
  html { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  :root, html {
    --page: #FBFCFD;
    --card: #FFFFFF;
    --border: #E5E7EB;
    --text: #111827;
    --label: #6B7280;
    --muted: #767676;
    --indigo: #4F46E5;
    --green: #15803D;
    --down: #DC2626;
    --grid: #E5E7EB;
    --prev: #D1D5DB;
    --track: #F3F4F6;
    --blob: #7C3AED;
    --shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 12px 32px -18px rgba(31, 41, 80, 0.28);
    --raised: 0 1px 2px rgba(17, 24, 39, 0.06), 0 4px 10px -6px rgba(17, 24, 39, 0.18);
  }
  html[data-theme="dark"] {
    --page: #111111;
    --card: #1F1F1F;
    --border: #2A2A2A;
    --text: #FFFFFF;
    --label: #D1D5DB;
    --muted: #9CA3AF;
    --indigo: #818CF8;
    --green: #16A34A;
    --down: #F87171;
    --grid: #333333;
    --prev: #D1D5DB;
    --track: #171717;
    --blob: #A78BFA;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 16px 32px -20px rgba(0, 0, 0, 0.75);
    --raised: 0 1px 2px rgba(0, 0, 0, 0.5), 0 6px 14px -8px rgba(0, 0, 0, 0.65);
  }
  .page, .page * { box-sizing: border-box; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .page button { font: inherit; cursor: pointer; }
  .page :focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
  h1, p, figure { margin: 0; }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  .page {
    width: min(1200px, 100%);
    margin: 0 auto;
    padding: 48px 32px 64px;
  }
  .page-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;

    margin-bottom: 32px;
  }
  .page-head h1 {

  }
  .credit {

  }
  .theme {

    border: 1px solid var(--border);

  .study { min-width: 0; }

  .ranges {

  .ranges button {

    border: 1px solid transparent;

  .ranges button[aria-selected="true"] {

    box-shadow: var(--raised);
  }
  .ranges button:hover { color: var(--text); }
  .stats {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 46%);
    column-gap: 16px;

  .kicker {

  .badge-layer { position: absolute; inset: 0; }
  .badge {
    position: absolute;
    padding: 4px 8px;
    border-radius: 999px;
    background: #4F46E5;

    font-size: 12px;

    line-height: 1.2;

  }
  .grid line { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 3 4; }
  .series-prev {

  .guide { stroke: var(--indigo); stroke-width: 1; stroke-dasharray: 2 3; opacity: 0.55; }
  .axis { position: relative; margin-top: var(--axis-gap); }
  .cols {
    display: grid;
    grid-template-columns: repeat(var(--n), minmax(0, 1fr));
  }
  .cols button {
    position: relative;
    min-width: 0;
    min-height: 44px;
    padding: 8px 0 0;
    border: 0;
    border-radius: 8px;
    background: transparent;

    font-size: 12px;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;

  .cols button .label {

  .cols button::before {

  .cols button:focus-visible::before {

  }
  .cols button[aria-pressed="true"] { color: var(--indigo); font-weight: 700; }
  .cols button[aria-pressed="true"]::before {
    background: color-mix(in srgb, var(--indigo) 14%, transparent);
  }
  .cols button:focus-visible { outline-offset: -2px; z-index: 1; }
  .ticks {
    display: none;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
    font-size: 12px;
    line-height: 1.2;

    font-variant-numeric: tabular-nums;
  }
  .ticks span { white-space: nowrap; }
  .axis.is-dense .ticks {
    display: flex;
    position: absolute;
    left: 0;
    right: 0;
    bottom: 8px;
    margin-top: 0;
    pointer-events: none;
  }
  .axis.is-dense .cols button .label {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  @media (max-width: 900px) {
    .page { padding: 32px 16px 48px; }
    .compare { grid-template-columns: 1fr; gap: 32px; }
    .card { padding: 16px; }
    .page-head { margin-bottom: 24px; }
  }
  @keyframes cc-rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  html:not([data-motion="reduce"]) .study {
    animation: cc-rise 520ms cubic-bezier(0.16, 0.84, 0.32, 1) both;
  }
  html:not([data-motion="reduce"]) .study-after { animation-delay: 80ms; }
</style>

<body data-page="chart-cards">
<main class="page">
  <header class="page-head">
    <div>
      <h1>Chart cards</h1>
      <p class="credit">A before / after study of dashboard chart hierarchy.</p>
    </div>
    <button type="button" class="theme" id="theme">Dark</button>
  </header>

  <div class="compare">
    <figure class="study">
      <figcaption>Before</figcaption>
      <div class="card card-before">
        <div class="before-top">
          <p class="before-title">420 Users</p>
          <span class="pill">+26.9%</span>
        </div>
        <svg class="before-chart" id="before-chart" role="img" aria-label="Area chart of the week, with no scale, dates, or comparison"></svg>
      </div>
    </figure>

    <figure class="study study-after">
      <figcaption>After</figcaption>
      <div class="card">
        <div class="ranges" id="ranges" role="tablist" aria-label="Time range">
          <button type="button" role="tab" id="tab-1w" data-range="1w" aria-selected="true" aria-controls="panel" tabindex="0">1W</button>
          <button type="button" role="tab" id="tab-4w" data-range="4w" aria-selected="false" aria-controls="panel" tabindex="-1">4W</button>
          <button type="button" role="tab" id="tab-1y" data-range="1y" aria-selected="false" aria-controls="panel" tabindex="-1">1Y</button>
          <button type="button" role="tab" id="tab-mtd" data-range="mtd" aria-selected="false" aria-controls="panel" tabindex="-1">MTD</button>
          <button type="button" role="tab" id="tab-qtd" data-range="qtd" aria-selected="false" aria-controls="panel" tabindex="-1">QTD</button>
          <button type="button" role="tab" id="tab-ytd" data-range="ytd" aria-selected="false" aria-controls="panel" tabindex="-1">YTD</button>
        </div>
        <div class="panel" id="panel" role="tabpanel" aria-labelledby="tab-1w">
          <div class="stats">
            <p class="kicker" id="metric">New users</p>
            <p class="pct is-up" id="pct">+23.5%</p>
            <p class="value" id="value">420</p>
            <p class="prev" id="prev">340</p>
            <p class="when" id="when">23 Apr - Today</p>
            <p class="when when-end" id="when-prev">16 Apr - 22 Apr</p>
          </div>
          <div class="chart" id="chart">
            <div class="plot" id="plot">
              <svg id="chart-svg" aria-hidden="true"></svg>
              <div class="badge-layer" id="badges"></div>
            </div>
            <div class="axis" id="axis">
              <div class="cols" id="cols" role="group" aria-label="Dates in this range. Arrow keys move between dates. Escape clears the selection."></div>
              <div class="ticks" id="ticks" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>
    </figure>
  </div>
  <p class="sr" id="live" aria-live="polite"></p>
</main>
<script>
(function () {
  "use strict";

  // Assumed "Today" is Wednesday 29 Apr 2026, so 1W is Thu 23 Apr–Wed 29 Apr
  // and the previous week is Thu 16 Apr–Wed 22 Apr.
  // Demo fiscal quarter starts 1 Mar, so QTD is not the same window as MTD.
  // Percent change is (current − previous) / previous, rounded half-up to 1 decimal.
  // Period: (420 − 340) / 340 = +23.5%. 26 Apr: (110 − 64) / 64 = +71.9%.
  var TODAY = utc(2026, 3, 29);
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var CANON = {
    "2026-04-16": 38,
    "2026-04-17": 46,
    "2026-04-18": 54,
    "2026-04-19": 64,
    "2026-04-20": 52,
    "2026-04-21": 46,
    "2026-04-22": 40,
    "2026-04-23": 8,
    "2026-04-24": 14,
    "2026-04-25": 36,
    "2026-04-26": 110,
    "2026-04-27": 156,
    "2026-04-28": 82,
    "2026-04-29": 14
  };

  var themeBtn = document.getElementById("theme");
  var rangesEl = document.getElementById("ranges");
  var panel = document.getElementById("panel");
  var plot = document.getElementById("plot");
  var svg = document.getElementById("chart-svg");
  var badgesEl = document.getElementById("badges");
  var axis = document.getElementById("axis");
  var cols = document.getElementById("cols");
  var ticks = document.getElementById("ticks");
  var beforeSvg = document.getElementById("before-chart");
  var live = document.getElementById("live");
  var elValue = document.getElementById("value");
  var elPrev = document.getElementById("prev");
  var elPct = document.getElementById("pct");
  var elWhen = document.getElementById("when");
  var elWhenPrev = document.getElementById("when-prev");

  var state = {
    range: "1w",
    lock: null,
    hover: null,
    model: null,
    geom: null,
    w: 0,
    h: 0
  };
  var fineHover = false;
  try { fineHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches; } catch (e) {}

  function utc(y, m, d) { return new Date(Date.UTC(y, m, d)); }
  function addDays(date, n) { return new Date(date.getTime() + n * 86400000); }
  function iso(date) { return date.toISOString().slice(0, 10); }
  function sameDay(a, b) { return iso(a) === iso(b); }

  function baseDaily(date) {
    var t = Math.round((date.getTime() - Date.UTC(2024, 0, 1)) / 86400000);
    var dow = date.getUTCDay();
    var weekend = (dow === 0 || dow === 6) ? 0.82 : 1;
    var trend = 28 + t * 0.018;
    var annual = 7 * Math.sin(((t - 100) / 365) * Math.PI * 2);
    var wave = 3.2 * Math.sin(t / 13);
    return Math.max(12, Math.round((trend + annual + wave) * weekend));
  }

  function daily(date) {
    var key = iso(date);
    if (Object.prototype.hasOwnProperty.call(CANON, key)) return CANON[key];
    var daysBefore = Math.round((Date.UTC(2026, 3, 16) - date.getTime()) / 86400000);
    if (daysBefore > 0 && daysBefore <= 5) {
      var raw = baseDaily(date);
      var blend = (6 - daysBefore) / 6;
      return Math.max(12, Math.round(raw * (1 - blend) + 38 * blend));
    }
    return baseDaily(date);
  }

  function eachDay(start, end) {
    var out = [];
    for (var d = new Date(start.getTime()); d.getTime() <= end.getTime(); d = addDays(d, 1)) out.push(d);
    return out;
  }

  function chunkSize(days, size) {
    var groups = [];
    for (var i = 0; i < days.length; i += size) groups.push(days.slice(i, i + size));
    return groups;
  }

  function chunkEven(days, parts) {
    var groups = [];
    var n = days.length;
    for (var i = 0; i < parts; i++) {
      var a = Math.round((i * n) / parts);
      var b = Math.round(((i + 1) * n) / parts);
      if (b > a) groups.push(days.slice(a, b));
    }
    return groups;
  }

  function windowFor(id) {
    if (id === "1w") return { start: utc(2026, 3, 23), end: TODAY, mode: "day" };
    if (id === "4w") return { start: addDays(TODAY, -27), end: TODAY, mode: "day" };
    if (id === "1y") return { start: addDays(TODAY, -364), end: TODAY, mode: "month" };
    if (id === "mtd") return { start: utc(2026, 3, 1), end: TODAY, mode: "day" };
    if (id === "qtd") return { start: utc(2026, 2, 1), end: TODAY, mode: "week" };
    return { start: utc(2026, 0, 1), end: TODAY, mode: "week" };
  }

  function previousOf(start, end) {
    var n = Math.round((end.getTime() - start.getTime()) / 86400000) + 1;
    var prevEnd = addDays(start, -1);
    return { start: addDays(prevEnd, -(n - 1)), end: prevEnd };
  }

  function bucketsFor(start, end, mode) {
    var days = eachDay(start, end);
    var groups = mode === "day" ? days.map(function (d) { return [d]; })
      : mode === "month" ? chunkEven(days, 12)
      : chunkSize(days, 7);
    return groups.map(function (group) {
      var total = 0;
      group.forEach(function (d) { total += daily(d); });
      return { start: group[0], end: group[group.length - 1], value: total };
    });
  }

  function buildModel(rangeId) {
    var curWin = windowFor(rangeId);
    var prevWin = previousOf(curWin.start, curWin.end);
    var current = bucketsFor(curWin.start, curWin.end, curWin.mode);
    var previous = bucketsFor(prevWin.start, prevWin.end, curWin.mode);
    var n = Math.min(current.length, previous.length);
    current = current.slice(0, n);
    previous = previous.slice(0, n);
    var curTotal = 0;
    var prevTotal = 0;
    eachDay(curWin.start, curWin.end).forEach(function (d) { curTotal += daily(d); });
    eachDay(prevWin.start, prevWin.end).forEach(function (d) { prevTotal += daily(d); });
    return {
      id: rangeId,
      current: current,
      previous: previous,
      curTotal: curTotal,
      prevTotal: prevTotal,
      curStart: curWin.start,
      curEnd: curWin.end,
      prevStart: prevWin.start,
      prevEnd: prevWin.end
    };
  }

  function formatNum(n) { return Math.round(n).toLocaleString("en-US"); }

  function formatPct(cur, prev) {
    if (!prev) return "—";
    var raw = ((cur - prev) / prev) * 100;
    var rounded = Math.round(raw * 10) / 10;
    var sign = rounded > 0 ? "+" : "";
    return sign + rounded.toFixed(1) + "%";
  }

  function pctClass(cur, prev) {
    if (cur > prev) return "is-up";
    if (cur < prev) return "is-down";
    return "is-flat";
  }

  function fmtDay(date) { return date.getUTCDate() + " " + MONTHS[date.getUTCMonth()]; }
  function fmtLong(date) { return date.getUTCDate() + " " + MONTHS_LONG[date.getUTCMonth()]; }

  function fmtRange(start, end, endsToday) {
    if (sameDay(start, end)) return endsToday && sameDay(end, TODAY) ? "Today" : fmtDay(start);
    var showYear = start.getUTCFullYear() !== end.getUTCFullYear() || end.getUTCFullYear() !== TODAY.getUTCFullYear();
    var a = fmtDay(start) + (showYear ? " " + start.getUTCFullYear() : "");
    var b = endsToday && sameDay(end, TODAY) ? "Today" : fmtDay(end) + (showYear ? " " + end.getUTCFullYear() : "");
    return a + " - " + b;
  }

  function smoothPath(points) {
    if (!points.length) return "";
    var d = "M " + points[0].x.toFixed(2) + " " + points[0].y.toFixed(2);
    if (points.length === 1) return d;
    for (var i = 0; i < points.length - 1; i++) {
      var p0 = points[i - 1] || points[i];
      var p1 = points[i];
      var p2 = points[i + 1];
      var p3 = points[i + 2] || p2;
      var c1x = p1.x + (p2.x - p0.x) / 6;
      var c1y = p1.y + (p2.y - p0.y) / 6;
      var c2x = p2.x - (p3.x - p1.x) / 6;
      var c2y = p2.y - (p3.y - p1.y) / 6;
      d += " C " + [c1x, c1y, c2x, c2y, p2.x, p2.y].map(function (n) { return n.toFixed(2); }).join(" ");
    }
    return d;
  }

  function badgeIndexes(model) {
    var cur = model.current;
    if (model.id === "1w") {
      var marked = [];
      cur.forEach(function (bucket, i) {
        if (bucket.value === 156 || bucket.value === 82) marked.push(i);
      });
      return marked;
    }
    var maxI = 0;
    cur.forEach(function (bucket, i) { if (bucket.value > cur[maxI].value) maxI = i; });
    var other = cur.length - 1 === maxI ? 0 : cur.length - 1;
    return [maxI, other];
  }

  function activeIndex() {
    if (state.hover != null) return state.hover;
    if (state.lock != null) return state.lock;
    return null;
  }

  function readout() {
    var model = state.model;
    var index = activeIndex();
    if (index == null) {
      return {
        cur: model.curTotal,
        prev: model.prevTotal,
        when: fmtRange(model.curStart, model.curEnd, true),
        whenPrev: fmtRange(model.prevStart, model.prevEnd, false)
      };
    }
    var bucket = model.current[index];
    var prevBucket = model.previous[index];
    return {
      cur: bucket.value,
      prev: prevBucket.value,
      when: fmtRange(bucket.start, bucket.end, false),
      whenPrev: fmtRange(prevBucket.start, prevBucket.end, false)
    };
  }

  function syncThemeButton() {
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    themeBtn.setAttribute("aria-pressed", dark ? "true" : "false");
    themeBtn.textContent = dark ? "Light" : "Dark";
    themeBtn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
  }

  function reduced() {
    return document.documentElement.getAttribute("data-motion") === "reduce";
  }

  function drawBefore() {
    var w = beforeSvg.clientWidth;
    var h = beforeSvg.clientHeight;
    if (!w || !h) return;
    var vals = [];
    for (var i = 0; i < 7; i++) vals.push(daily(addDays(utc(2026, 3, 23), i)));
    var max = Math.max.apply(null, vals);
    var pts = vals.map(function (v, i) {
      return {
        x: ((i + 0.5) * w) / vals.length,
        y: 8 + (1 - v / max) * (h - 16)
      };
    });
    var line = smoothPath(pts);
    var area = line + " L " + pts[pts.length - 1].x.toFixed(2) + " " + h.toFixed(2) + " L " + pts[0].x.toFixed(2) + " " + h.toFixed(2) + " Z";
    beforeSvg.setAttribute("viewBox", "0 0 " + w + " " + h);
    beforeSvg.replaceChildren();
    var defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
    var grad = document.createElementNS("http://www.w3.org/2000/svg", "linearGradient");
    grad.setAttribute("id", "before-fill");
    grad.setAttribute("x1", "0");
    grad.setAttribute("y1", "0");
    grad.setAttribute("x2", "0");
    grad.setAttribute("y2", "1");
    ["0", "1"].forEach(function (offset, index) {
      var stop = document.createElementNS("http://www.w3.org/2000/svg", "stop");
      stop.setAttribute("offset", offset);
      stop.setAttribute("stop-color", "var(--blob)");
      stop.setAttribute("stop-opacity", index === 0 ? "0.55" : "0.03");
      grad.appendChild(stop);
    });
    defs.appendChild(grad);
    var fill = document.createElementNS("http://www.w3.org/2000/svg", "path");
    fill.setAttribute("d", area);
    fill.setAttribute("fill", "url(#before-fill)");
    var stroke = document.createElementNS("http://www.w3.org/2000/svg", "path");
    stroke.setAttribute("d", line);
    stroke.setAttribute("fill", "none");
    stroke.setAttribute("stroke", "var(--blob)");
    stroke.setAttribute("stroke-width", "2");
    stroke.setAttribute("stroke-linejoin", "round");
    stroke.setAttribute("stroke-linecap", "round");
    stroke.setAttribute("vector-effect", "non-scaling-stroke");
    beforeSvg.append(defs, fill, stroke);
  }

  function xy(index, value, count, max, w, h) {
    var pad = { l: 12, r: 12, t: 32, b: 12 };
    return {
      x: pad.l + ((index + 0.5) * (w - pad.l - pad.r)) / count,
      y: pad.t + (1 - value / max) * (h - pad.t - pad.b)
    };
  }

  function drawSeries(opts) {
    var model = state.model;
    var w = plot.clientWidth;
    var h = plot.clientHeight;
    if (!w || !h) return;
    state.w = w;
    state.h = h;
    var count = model.current.length;
    var max = 1;
    model.current.forEach(function (b) { if (b.value > max) max = b.value; });
    model.previous.forEach(function (b) { if (b.value > max) max = b.value; });
    var curPts = model.current.map(function (b, i) { return xy(i, b.value, count, max, w, h); });
    var prevPts = model.previous.map(function (b, i) { return xy(i, b.value, count, max, w, h); });
    state.geom = { cur: curPts, prev: prevPts, max: max };
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.replaceChildren();
    var grid = document.createElementNS("http://www.w3.org/2000/svg", "g");
    grid.setAttribute("class", "grid");
    for (var c = 0; c <= 4; c++) {
      var x = (w * c) / 4;
      var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", x.toFixed(2));
      line.setAttribute("x2", x.toFixed(2));
      line.setAttribute("y1", "0");
      line.setAttribute("y2", String(h));
      grid.appendChild(line);
    }
    var prev = document.createElementNS("http://www.w3.org/2000/svg", "path");
    prev.setAttribute("class", "series-prev");
    prev.setAttribute("d", smoothPath(prevPts));
    var current = document.createElementNS("http://www.w3.org/2000/svg", "path");
    current.setAttribute("class", "series-current");
    current.setAttribute("d", smoothPath(curPts));
    var guide = document.createElementNS("http://www.w3.org/2000/svg", "line");
    guide.setAttribute("class", "guide");
    guide.setAttribute("id", "guide");
    guide.setAttribute("visibility", "hidden");
    var dots = document.createElementNS("http://www.w3.org/2000/svg", "g");
    dots.setAttribute("id", "dots");
    [0, curPts.length - 1].forEach(function (i) {
      if (i < 0 || !curPts[i]) return;
      var dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("class", "dot");
      dot.setAttribute("cx", curPts[i].x.toFixed(2));
      dot.setAttribute("cy", curPts[i].y.toFixed(2));
      dot.setAttribute("r", "3.5");
      dots.appendChild(dot);
    });
    badgeIndexes(model).forEach(function (i) {
      var dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("class", "dot");
      dot.setAttribute("cx", curPts[i].x.toFixed(2));
      dot.setAttribute("cy", curPts[i].y.toFixed(2));
      dot.setAttribute("r", "3.5");
      dots.appendChild(dot);
    });
    var hotPrev = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    hotPrev.setAttribute("id", "hot-prev");
    hotPrev.setAttribute("class", "dot-prev");
    hotPrev.setAttribute("r", "3");
    hotPrev.setAttribute("visibility", "hidden");
    var hotCur = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    hotCur.setAttribute("id", "hot-cur");
    hotCur.setAttribute("class", "dot");
    hotCur.setAttribute("r", "4");
    hotCur.setAttribute("visibility", "hidden");
    dots.append(hotPrev, hotCur);
    svg.append(grid, prev, current, guide, dots);
    placeBadges(curPts);
    if (opts && opts.animate && !reduced()) {
      var len = current.getTotalLength();
      current.style.transition = "none";
      current.style.strokeDasharray = String(len);
      current.style.strokeDashoffset = String(len);
      current.getBoundingClientRect();
      current.style.transition = "stroke-dashoffset 700ms cubic-bezier(0.16, 0.84, 0.32, 1)";
      current.style.strokeDashoffset = "0";
    }
    syncReadout({ announce: false });
  }

  function placeBadges(points) {
    badgesEl.replaceChildren();
    var model = state.model;
    badgeIndexes(model).forEach(function (i) {
      var badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = formatNum(model.current[i].value);
      var x = points[i].x;
      var y = points[i].y;
      var shift = "-50%";
      if (x < 28) shift = "0";
      else if (x > state.w - 28) shift = "-100%";
      badge.style.left = x + "px";
      badge.style.top = y + "px";
      badge.style.transform = "translate(" + shift + ", calc(-100% - 6px))";
      badge.style.zIndex = String(1000 - Math.round(y));
      badgesEl.appendChild(badge);
    });
  }

  function pointName(bucket) {
    if (sameDay(bucket.start, bucket.end)) return fmtLong(bucket.start);
    return fmtLong(bucket.start) + " to " + fmtLong(bucket.end);
  }

  function syncReadout(opts) {
    var view = readout();
    elValue.textContent = formatNum(view.cur);
    elPrev.textContent = formatNum(view.prev);
    elPct.textContent = formatPct(view.cur, view.prev);
    elPct.className = "pct " + pctClass(view.cur, view.prev);
    elWhen.textContent = view.when;
    elWhenPrev.textContent = view.whenPrev;
    var index = activeIndex();
    var buttons = cols.querySelectorAll("button");
    buttons.forEach(function (btn, i) {
      var on = state.lock === i;
      btn.setAttribute("aria-pressed", on ? "true" : "false");
      var bucket = state.model.current[i];
      var prevBucket = state.model.previous[i];
      btn.setAttribute("aria-label", pointName(bucket) + ", " + formatNum(bucket.value) + " new users, compared with " + formatNum(prevBucket.value) + " on " + pointName(prevBucket) + ", " + formatPct(bucket.value, prevBucket.value));
    });
    var guide = document.getElementById("guide");
    var hotCur = document.getElementById("hot-cur");
    var hotPrev = document.getElementById("hot-prev");
    if (guide && state.geom) {
      if (index == null) {
        guide.setAttribute("visibility", "hidden");
        hotCur.setAttribute("visibility", "hidden");
        hotPrev.setAttribute("visibility", "hidden");
      } else {
        var curPt = state.geom.cur[index];
        var prevPt = state.geom.prev[index];
        guide.setAttribute("visibility", "visible");
        guide.setAttribute("x1", curPt.x.toFixed(2));
        guide.setAttribute("x2", curPt.x.toFixed(2));
        guide.setAttribute("y1", "0");
        guide.setAttribute("y2", String(state.h));
        hotCur.setAttribute("visibility", "visible");
        hotCur.setAttribute("cx", curPt.x.toFixed(2));
        hotCur.setAttribute("cy", curPt.y.toFixed(2));
        hotPrev.setAttribute("visibility", "visible");
        hotPrev.setAttribute("cx", prevPt.x.toFixed(2));
        hotPrev.setAttribute("cy", prevPt.y.toFixed(2));
      }
    }
    if (opts && opts.announce) {
      var sentence = view.when + ". " + formatNum(view.cur) + " new users, compared with " + formatNum(view.prev) + ", " + formatPct(view.cur, view.prev) + ".";
      if (live.textContent !== sentence) live.textContent = sentence;
    }
  }

  function buildAxis() {
    var model = state.model;
    var dense = model.current.length > 8;
    axis.classList.toggle("is-dense", dense);
    cols.style.setProperty("--n", String(model.current.length));
    cols.replaceChildren();
    model.current.forEach(function (bucket, i) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.dataset.i = String(i);
      btn.tabIndex = i === (state.lock || 0) ? 0 : -1;
      var label = document.createElement("span");
      label.className = "label";
      label.textContent = sameDay(bucket.start, bucket.end) ? fmtDay(bucket.start) : fmtDay(bucket.start);
      btn.appendChild(label);
      cols.appendChild(btn);
    });
    ticks.replaceChildren();
    if (dense) {
      var last = model.current.length - 1;
      var marks = [0, Math.round(last / 3), Math.round((2 * last) / 3), last];
      var seen = {};
      marks.forEach(function (i) {
        if (seen[i]) return;
        seen[i] = true;
        var span = document.createElement("span");
        var bucket = model.current[i];
        span.textContent = sameDay(bucket.end, TODAY) ? "Today" : fmtDay(bucket.start);
        ticks.appendChild(span);
      });
    }
  }

  function syncTabs() {
    var tabs = rangesEl.querySelectorAll('[role="tab"]');
    tabs.forEach(function (tab) {
      var on = tab.dataset.range === state.range;
      tab.setAttribute("aria-selected", on ? "true" : "false");
      tab.tabIndex = on ? 0 : -1;
      if (on) panel.setAttribute("aria-labelledby", tab.id);
    });
  }

  function selectRange(id) {
    state.range = id;
    state.lock = null;
    state.hover = null;
    state.model = buildModel(id);
    syncTabs();
    buildAxis();
    drawSeries({ animate: true });
    syncReadout({ announce: true });
  }

  themeBtn.addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("chart-cards-theme", next); } catch (e) {}
    syncThemeButton();
    drawBefore();
  });

  rangesEl.addEventListener("click", function (e) {
    var tab = e.target.closest("[role='tab']");
    if (!tab) return;
    selectRange(tab.dataset.range);
  });

  rangesEl.addEventListener("keydown", function (e) {
    var tabs = [].slice.call(rangesEl.querySelectorAll("[role='tab']"));
    var i = tabs.findIndex(function (tab) { return tab.dataset.range === state.range; });
    var next = null;
    if (e.key === "ArrowRight") next = (i + 1) % tabs.length;
    else if (e.key === "ArrowLeft") next = (i - 1 + tabs.length) % tabs.length;
    else if (e.key === "Home") next = 0;
    else if (e.key === "End") next = tabs.length - 1;
    else return;
    e.preventDefault();
    selectRange(tabs[next].dataset.range);
    tabs[next].focus();
  });

  cols.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    var i = +btn.dataset.i;
    if (state.lock === i) {
      state.lock = null;
      state.hover = fineHover ? i : null;
    } else {
      state.lock = i;
      state.hover = null;
    }
    syncReadout({ announce: true });
  });

  cols.addEventListener("pointerover", function (e) {
    if (!fineHover) return;
    var btn = e.target.closest("button");
    if (!btn || btn.parentElement !== cols) return;
    state.hover = +btn.dataset.i;
    syncReadout({ announce: false });
  });

  cols.addEventListener("pointerout", function (e) {
    if (!fineHover) return;
    var btn = e.target.closest("button");
    if (!btn || btn.parentElement !== cols) return;
    var next = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest("button") : null;
    if (next && next.parentElement === cols) return;
    state.hover = null;
    syncReadout({ announce: false });
  });

  cols.addEventListener("keydown", function (e) {
    var buttons = [].slice.call(cols.querySelectorAll("button"));
    var i = buttons.indexOf(document.activeElement);
    if (i < 0) return;
    if (e.key === "Escape") {
      state.lock = null;
      state.hover = null;
      syncReadout({ announce: true });
      return;
    }
    var next = null;
    if (e.key === "ArrowRight") next = Math.min(buttons.length - 1, i + 1);
    else if (e.key === "ArrowLeft") next = Math.max(0, i - 1);
    else if (e.key === "Home") next = 0;
    else if (e.key === "End") next = buttons.length - 1;
    else return;
    e.preventDefault();
    buttons.forEach(function (btn, n) { btn.tabIndex = n === next ? 0 : -1; });
    buttons[next].focus();
    state.lock = next;
    state.hover = null;
    syncReadout({ announce: true });
  });

  var seenW = 0;
  var seenH = 0;
  var animated = false;
  var observer = new ResizeObserver(function () {
    var w = plot.clientWidth;
    var h = plot.clientHeight;
    if (!w || !h || (w === seenW && h === seenH)) return;
    var shouldAnimate = !animated;
    seenW = w;
    seenH = h;
    drawBefore();
    drawSeries({ animate: shouldAnimate });
    animated = true;
  });

  (function init() {
    var cur = 0;
    var prev = 0;
    for (var i = 0; i < 7; i++) {
      cur += daily(addDays(utc(2026, 3, 23), i));
      prev += daily(addDays(utc(2026, 3, 16), i));
    }
    if (cur !== 420 || prev !== 340 || daily(utc(2026, 3, 26)) !== 110 || daily(utc(2026, 3, 19)) !== 64) {
      throw new Error("Canonical 1W series failed its checksum");
    }
    syncThemeButton();
    state.model = buildModel("1w");
    buildAxis();
    observer.observe(plot);
    observer.observe(beforeSvg);
  })();
})();
</script>
