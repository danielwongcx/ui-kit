<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII — ui-kit</title>
<script>
(function () {
  var q = new URLSearchParams(location.search).get("scene");
  if (q === "ferry") location.replace("ferry.html");
  else if (q === "mtr") location.replace("mtr.html");
})();
document.documentElement.setAttribute("data-ocean", (function () {
  var q = new URLSearchParams(location.search).get("theme");
  if (q === "light" || q === "dark") return q;
  try {
    var stored = localStorage.getItem("ascii-sharks-theme");
    if (stored === "light" || stored === "dark") return stored;
  } catch (e) {}
  return "dark";
})());
document.documentElement.setAttribute("data-scene", (function () {
  var q = new URLSearchParams(location.search).get("scene");
  if (q === "sharks" || q === "train" || q === "hrtd") return q;
  try {
    var stored = localStorage.getItem("ascii-scene");
    if (stored === "sharks" || stored === "train" || stored === "hrtd") return stored;
  } catch (e) {}
  return "sharks";
})());
document.title = (function () {
  var scene = document.documentElement.getAttribute("data-scene");
  if (scene === "train") return "Viaduct Steam Train — ui-kit";
  if (scene === "hrtd") return "Made with love by HRTD — ui-kit";
  return "ASCII Sharks — ui-kit";
})();
</script>
<link rel="stylesheet" href="shared/site-header.css">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  html[data-ocean="light"][data-scene="sharks"],
  html[data-ocean="light"][data-scene="sharks"] body {
    background: #f4f2ec;
  }
  html[data-scene="train"],
  html[data-scene="train"] body {
    background: #000;
  }
  html[data-scene="hrtd"],
  html[data-scene="hrtd"] body {
    background: #100814;
  }
  body[data-page="ascii-sharks"] {
    --site-ink: #e7eef6;
    --site-muted: #9aa8b8;
    --site-line: rgba(255, 255, 255, 0.14);
    --site-bar-bg: color-mix(in srgb, #000 62%, transparent);
    --site-pill: rgba(255, 255, 255, 0.08);
    --site-accent: #8fdfff;
  }
  html[data-ocean="light"][data-scene="sharks"] body[data-page="ascii-sharks"] {
    --site-ink: #1c1c22;
    --site-muted: #5c6570;
    --site-line: rgba(28, 28, 34, 0.12);
    --site-bar-bg: color-mix(in srgb, #f4f2ec 78%, transparent);
    --site-pill: rgba(255, 255, 255, 0.72);
    --site-accent: #0e7490;
  }
  body[data-page="ascii-sharks"] > .site-header {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    height: calc(var(--site-header-h, 56px) + env(safe-area-inset-top, 0px));
  }
  body[data-page="ascii-sharks"] .site-header__panel {
    background: color-mix(in srgb, #05070c 94%, transparent);
  }
  html[data-ocean="light"][data-scene="sharks"] body[data-page="ascii-sharks"] .site-header__panel {
    background: color-mix(in srgb, #f4f2ec 94%, transparent);
  }
  #ocean {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html[data-ocean="light"][data-scene="sharks"] #ocean {
    background: #f4f2ec;
  }
  html:not([data-scene="sharks"]) #ocean { display: none; }
  #train {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
  }
  html:not([data-scene="train"]) #train { display: none; }
  #hrtd {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
    width: 100%;
    height: 100%;
    background: #100814;
  }
  html:not([data-scene="hrtd"]) #hrtd { display: none; }
  #train-pre {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    border: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    color: #e4e4e7;
    font-family: Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
    letter-spacing: 0;
    white-space: pre;
  }
  html[data-scene="train"] .theme-switch,
  html[data-scene="hrtd"] .theme-switch,
  .theme-switch[hidden] { display: none; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .dock {
    position: fixed;
    z-index: 40;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px 16px;
    padding:
      10px
      max(12px, env(safe-area-inset-right, 0px))
      max(10px, env(safe-area-inset-bottom, 0px))
      max(12px, env(safe-area-inset-left, 0px));
    pointer-events: none;
  }
  .dock-controls,
  .credit { pointer-events: auto; }
  .dock-controls {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  .credit {
    margin: 0;
    max-width: min(52vw, 520px);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.35;
    letter-spacing: 0.01em;
    color: rgba(176, 196, 214, 0.72);
    text-align: right;
  }
  .credit a {
    color: rgba(168, 224, 255, 0.9);
    text-decoration: none;
  }
  .credit a:hover { color: #fff; text-decoration: underline; }
  .credit a:focus-visible {
    outline: 2px solid #8fdfff;
    outline-offset: 2px;
    border-radius: 2px;
  }
  html[data-ocean="light"][data-scene="sharks"] .credit { color: rgba(40, 48, 58, 0.72); }
  html[data-ocean="light"][data-scene="sharks"] .credit a { color: #0e7490; }
  html[data-ocean="light"][data-scene="sharks"] .credit a:hover { color: #111; }
  html[data-ocean="light"][data-scene="sharks"] .credit a:focus-visible { outline-color: #0e7490; }

  .seg {
    display: flex;
    gap: 2px;
    margin: 0;
    padding: 3px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(0, 0, 0, 0.42);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .seg button {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: rgba(220, 230, 240, 0.82);
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: 0 14px;
    min-height: 44px;
    min-width: 44px;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] {
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
  }
  .seg button:focus-visible {
    outline: 2px solid #8fdfff;
    outline-offset: 2px;
  }
  html[data-ocean="light"][data-scene="sharks"] .seg {
    border-color: rgba(20, 24, 32, 0.14);
    background: rgba(255, 255, 255, 0.72);
  }
  html[data-ocean="light"][data-scene="sharks"] .seg button { color: #3a4250; }
  html[data-ocean="light"][data-scene="sharks"] .seg button[aria-pressed="true"] {
    background: #1c1c22;
    color: #f4f2ec;
  }
  html[data-ocean="light"][data-scene="sharks"] .seg button:focus-visible { outline-color: #0e7490; }
  @media (max-width: 640px) {
    .dock { flex-direction: column; align-items: flex-start; }
    .credit { max-width: min(100%, 420px); text-align: left; }
  }
  @media (max-width: 420px) {
    .scene-switch button { padding: 0 10px; }
  }
</style>
</head>
<body data-page="ascii-sharks">
<h1 class="sr-only" id="scene-heading" aria-live="polite">ASCII sharks</h1>
<canvas id="ocean" aria-hidden="true"></canvas>
<div id="train">
  <pre id="train-pre" aria-hidden="true"></pre>
</div>
<canvas id="hrtd" aria-hidden="true"></canvas>
<div class="dock">
  <div class="dock-controls">
    <div class="seg scene-switch" role="group" aria-label="Scene">
      <button type="button" data-scene="sharks">Sharks</button>
      <button type="button" data-scene="train">Train</button>
      <button type="button" data-scene="hrtd">HRTD</button>
    </div>
    <div class="seg theme-switch" role="group" aria-label="Ocean theme">
      <button type="button" data-theme="light">Light</button>
      <button type="button" data-theme="dark">Dark</button>
    </div>
  </div>
  <p class="credit">Sharks by <a href="https://github.com/stackedlol/ascii-sharks">stackedlol</a> · <a href="https://www.ascii-magic.com/ascii/viaduct-steam-train">Viaduct Steam Train</a> by ASCII Magic · made with 💕 by HRTD</p>
</div>
<script>
(function () {
  var scene = document.documentElement.getAttribute("data-scene");
  if (scene !== "sharks" && scene !== "train" && scene !== "hrtd") scene = "sharks";
  var theme = document.documentElement.getAttribute("data-ocean") === "light" ? "light" : "dark";
  var headings = { sharks: "ASCII sharks", train: "Viaduct steam train", hrtd: "made with love by HRTD" };
  var sceneButtons = document.querySelectorAll(".scene-switch button");
  var themeButtons = document.querySelectorAll(".theme-switch button");
  for (var i = 0; i < sceneButtons.length; i++) {
    sceneButtons[i].setAttribute("aria-pressed", sceneButtons[i].getAttribute("data-scene") === scene ? "true" : "false");
  }
  for (var j = 0; j < themeButtons.length; j++) {
    themeButtons[j].setAttribute("aria-pressed", themeButtons[j].getAttribute("data-theme") === theme ? "true" : "false");
  }
  document.getElementById("scene-heading").textContent = headings[scene];
  if (scene !== "sharks") document.querySelector(".theme-switch").hidden = true;
})();
</script>
<script src="vendor/ascii-sharks/ocean.js"></script>
<script type="module">
import { play } from "./vendor/ascii-magic/runtime/player.js";
import { CELL_W } from "./vendor/ascii-magic/runtime/canvas.js";
import * as trainPiece from "./vendor/ascii-magic/pieces/viaduct-steam-train.js";
import { startMade } from "./vendor/ascii-hrtd/made.js";

var SCENE_KEY = "ascii-scene";
var THEME_KEY = "ascii-sharks-theme";
var SCENES = ["sharks", "train", "hrtd"];
var TITLES = {
  sharks: "ASCII Sharks — ui-kit",
  train: "Viaduct Steam Train — ui-kit",
  hrtd: "Made with love by HRTD — ui-kit"
};
var HEADINGS = {
  sharks: "ASCII sharks",
  train: "Viaduct steam train",
  hrtd: "made with love by HRTD"
};
var params = new URLSearchParams(location.search);
var scene = document.documentElement.getAttribute("data-scene");
if (SCENES.indexOf(scene) < 0) scene = "sharks";
var themeName = document.documentElement.getAttribute("data-ocean") === "light" ? "light" : "dark";
var engine = null;
var trainStop = null;
var hrtdStop = null;
var sceneButtons = document.querySelectorAll(".scene-switch button");
var themeButtons = document.querySelectorAll(".theme-switch button");
var themeSwitch = document.querySelector(".theme-switch");
var heading = document.getElementById("scene-heading");
var ocean = document.getElementById("ocean");
var trainPre = document.getElementById("train-pre");
var hrtdCanvas = document.getElementById("hrtd");

function sharkSpecs() {
  var raw = params.get("sharks");
  if (!raw) return undefined;
  return raw.split(",").filter(Boolean).map(function (kind, i) {
    return { kind: kind, size: 1 - i * 0.1 };
  });
}

function paintPressed(buttons, attr, value) {
  for (var i = 0; i < buttons.length; i++) {
    var on = buttons[i].getAttribute(attr) === value;
    buttons[i].setAttribute("aria-pressed", on ? "true" : "false");
  }
}

function fitPiece(pre, meta) {
  var cols = meta.cols;
  var rows = meta.rows;
  var availW = document.documentElement.clientWidth;
  var availH = document.documentElement.clientHeight;
  var px = Math.min((availW - 2) / (cols * CELL_W), (availH - 2) / (rows * CELL_W));
  if (!isFinite(px) || px < 1) px = 8;
  pre.style.fontSize = px + "px";
}

function startSharks() {
  if (engine) return;
  ocean.hidden = false;
  engine = new AsciiSharks.OceanEngine(ocean, sharkSpecs(), AsciiSharks.THEMES[themeName]);
}

function stopSharks() {
  if (!engine) return;
  engine.destroy();
  engine = null;
  ocean.hidden = true;
}

function startTrain() {
  fitPiece(trainPre, trainPiece.meta);
  if (trainStop) return;
  // meta.look is "dots": halftone on black, the piece page default. Tone tuning
  // in meta.dots is applied by play() unless overridden.
  trainStop = play(trainPre, trainPiece, { look: { look: "dots" } });
}

function stopTrain() {
  if (!trainStop) return;
  trainStop();
  trainStop = null;
}

function startHrtd() {
  if (hrtdStop) return;
  hrtdStop = startMade(hrtdCanvas);
}

function stopHrtd() {
  if (!hrtdStop) return;
  hrtdStop();
  hrtdStop = null;
}

function applyScene(next, persist, focus) {
  if (SCENES.indexOf(next) < 0) return;
  scene = next;
  document.documentElement.setAttribute("data-scene", scene);
  document.title = TITLES[scene];
  heading.textContent = HEADINGS[scene];
  themeSwitch.hidden = scene !== "sharks";
  if (scene !== "sharks") stopSharks();
  if (scene !== "train") stopTrain();
  if (scene !== "hrtd") stopHrtd();
  if (scene === "sharks") startSharks();
  else if (scene === "train") startTrain();
  else startHrtd();
  paintPressed(sceneButtons, "data-scene", scene);
  if (focus) {
    for (var i = 0; i < sceneButtons.length; i++) {
      if (sceneButtons[i].getAttribute("data-scene") === scene) sceneButtons[i].focus();
    }
  }
  if (!persist) return;
  try { localStorage.setItem(SCENE_KEY, scene); } catch (e) {}
}

function selectTheme(next, persist) {
  if (next !== "light" && next !== "dark") return;
  themeName = next;
  document.documentElement.setAttribute("data-ocean", themeName);
  if (engine) engine.setTheme(AsciiSharks.THEMES[themeName]);
  paintPressed(themeButtons, "data-theme", themeName);
  if (!persist) return;
  try { localStorage.setItem(THEME_KEY, themeName); } catch (e) {}
}

for (var i = 0; i < sceneButtons.length; i++) {
  sceneButtons[i].addEventListener("click", function (event) {
    applyScene(event.currentTarget.getAttribute("data-scene"), true, false);
  });
}
document.querySelector(".scene-switch").addEventListener("keydown", function (event) {
  if (event.key !== "ArrowRight" && event.key !== "ArrowLeft" && event.key !== "Home" && event.key !== "End") return;
  event.preventDefault();
  var index = SCENES.indexOf(scene);
  var next = scene;
  if (event.key === "Home") next = SCENES[0];
  else if (event.key === "End") next = SCENES[SCENES.length - 1];
  else if (event.key === "ArrowRight") next = SCENES[(index + 1) % SCENES.length];
  else next = SCENES[(index - 1 + SCENES.length) % SCENES.length];
  applyScene(next, true, true);
});
for (var t = 0; t < themeButtons.length; t++) {
  themeButtons[t].addEventListener("click", function (event) {
    selectTheme(event.currentTarget.getAttribute("data-theme"), true);
  });
}
document.querySelector(".theme-switch").addEventListener("keydown", function (event) {
  if (event.key !== "ArrowRight" && event.key !== "ArrowLeft" && event.key !== "Home" && event.key !== "End") return;
  event.preventDefault();
  var next = themeName;
  if (event.key === "Home") next = "light";
  else if (event.key === "End") next = "dark";
  else next = themeName === "light" ? "dark" : "light";
  selectTheme(next, true);
  for (var k = 0; k < themeButtons.length; k++) {
    if (themeButtons[k].getAttribute("data-theme") === themeName) themeButtons[k].focus();
  }
});

window.addEventListener("resize", function () {
  if (scene === "train") fitPiece(trainPre, trainPiece.meta);
});

applyScene(scene, false, false);
</script>
<script src="shared/site-header.js?v=1" defer></script>
</body>
</html>
