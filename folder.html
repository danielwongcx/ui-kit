<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ui-kit · Folder</title>
  <link rel="stylesheet" href="shared/site-header.css?v=5" />
  <style>
    :root {
      --page: #ececf0;
      --card: #fbfbfc;
      --ink: #1c1c22;
      --muted: #6b6b76;
      --line: #e4e4ea;
      --accent: #5b5bf0;
      --shadow: 0 20px 44px rgba(15, 17, 21, 0.09), 0 2px 8px rgba(15, 17, 21, 0.04);
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      background: var(--page);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 64px;
      min-width: 0;
    }

    .intro { margin: 0 0 22px; max-width: 36rem; }
    .intro h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .intro p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .specimen {
      width: 100%;
      max-width: 320px;
      min-width: 0;
    }

    /* Sea is the default triple. Other tints override on the specimen. */
    .specimen {
      --glass-top: rgba(186, 214, 210, 0.55);
      --glass-mid: rgba(78, 118, 116, 0.58);
      --glass-bot: rgba(36, 58, 60, 0.72);
      --glass-tab-top: rgba(210, 232, 228, 0.78);
      --glass-tab-mid: rgba(110, 150, 146, 0.8);
      --glass-tab-bot: rgba(78, 118, 116, 0.82);
      --glass-shadow: rgba(18, 36, 38, 0.32);
      --glass-shadow-soft: rgba(18, 36, 38, 0.18);
      --glass-inset: rgba(10, 24, 26, 0.12);
    }

    .specimen:has(#glass-ice:checked) {
      --glass-top: rgba(255, 255, 255, 0.58);
      --glass-mid: rgba(186, 208, 222, 0.42);
      --glass-bot: rgba(118, 146, 168, 0.5);
      --glass-tab-top: rgba(255, 255, 255, 0.84);
      --glass-tab-mid: rgba(214, 228, 238, 0.7);
      --glass-tab-bot: rgba(168, 192, 208, 0.68);
      --glass-shadow: rgba(64, 86, 104, 0.22);
      --glass-shadow-soft: rgba(64, 86, 104, 0.12);
      --glass-inset: rgba(40, 62, 80, 0.1);
    }

    .specimen:has(#glass-smoke:checked) {
      --glass-top: rgba(214, 216, 222, 0.46);
      --glass-mid: rgba(108, 112, 120, 0.5);
      --glass-bot: rgba(42, 44, 50, 0.64);
      --glass-tab-top: rgba(232, 234, 238, 0.74);
      --glass-tab-mid: rgba(148, 152, 160, 0.68);
      --glass-tab-bot: rgba(96, 100, 108, 0.74);
      --glass-shadow: rgba(20, 22, 26, 0.32);
      --glass-shadow-soft: rgba(20, 22, 26, 0.16);
      --glass-inset: rgba(12, 12, 16, 0.14);
    }

    .specimen:has(#glass-amber:checked) {
      --glass-top: rgba(255, 226, 184, 0.55);
      --glass-mid: rgba(204, 136, 62, 0.48);
      --glass-bot: rgba(102, 56, 20, 0.62);
      --glass-tab-top: rgba(255, 238, 210, 0.82);
      --glass-tab-mid: rgba(224, 164, 86, 0.74);
      --glass-tab-bot: rgba(184, 116, 46, 0.76);
      --glass-shadow: rgba(74, 38, 10, 0.3);
      --glass-shadow-soft: rgba(74, 38, 10, 0.16);
      --glass-inset: rgba(62, 30, 6, 0.12);
    }

    .specimen:has(#glass-rose:checked) {
      --glass-top: rgba(255, 210, 220, 0.54);
      --glass-mid: rgba(200, 100, 124, 0.48);
      --glass-bot: rgba(100, 38, 54, 0.62);
      --glass-tab-top: rgba(255, 228, 234, 0.82);
      --glass-tab-mid: rgba(224, 138, 156, 0.74);
      --glass-tab-bot: rgba(184, 92, 114, 0.76);
      --glass-shadow: rgba(74, 26, 38, 0.3);
      --glass-shadow-soft: rgba(74, 26, 38, 0.16);
      --glass-inset: rgba(52, 14, 24, 0.12);
    }

    .specimen:has(#glass-indigo:checked) {
      --glass-top: rgba(208, 210, 244, 0.52);
      --glass-mid: rgba(96, 98, 184, 0.52);
      --glass-bot: rgba(38, 40, 98, 0.68);
      --glass-tab-top: rgba(228, 230, 252, 0.82);
      --glass-tab-mid: rgba(148, 150, 214, 0.74);
      --glass-tab-bot: rgba(96, 98, 184, 0.78);
      --glass-shadow: rgba(26, 24, 68, 0.32);
      --glass-shadow-soft: rgba(26, 24, 68, 0.18);
      --glass-inset: rgba(16, 14, 48, 0.14);
    }

    .color-choice {
      border: 0;
      margin: 0 0 16px;
      padding: 0;
      min-inline-size: 0;
      width: 100%;
    }

    .color-choice legend {
      display: block;
      width: 100%;
      margin: 0 0 8px;
      padding: 0;
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem;
      min-width: 0;
    }

    .swatch {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.28rem;
      min-height: 44px;
      min-width: 0;
      margin: 0;
      padding: 0.4rem 0.25rem 0.45rem;
      border-radius: 14px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
    }

    .swatch:hover {
      background: rgba(255, 255, 255, 0.72);
      border-color: var(--line);
    }

    .swatch:has(input:checked) {
      background: #fff;
      border-color: var(--ink);
      box-shadow: 0 0 0 1px var(--ink);
    }

    .swatch:has(input:focus-visible) {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .swatch input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .chip {
      width: 2.15rem;
      height: 1.45rem;
      border-radius: 5px 8px 8px 8px;
      border: 1px solid rgba(28, 28, 34, 0.16);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        0 1px 2px rgba(15, 17, 21, 0.12);
      background-image:
        linear-gradient(165deg, rgba(255, 255, 255, 0.5), transparent 48%),
        linear-gradient(152deg, var(--chip-top), var(--chip-mid) 42%, var(--chip-bot)),
        linear-gradient(180deg, #4a4e55, #232529);
      background-color: #232529;
    }

    .swatch[data-tint="sea"] {
      --chip-top: rgba(186, 214, 210, 0.55);
      --chip-mid: rgba(78, 118, 116, 0.58);
      --chip-bot: rgba(36, 58, 60, 0.72);
    }
    .swatch[data-tint="ice"] {
      --chip-top: rgba(255, 255, 255, 0.58);
      --chip-mid: rgba(186, 208, 222, 0.42);
      --chip-bot: rgba(118, 146, 168, 0.5);
    }
    .swatch[data-tint="smoke"] {
      --chip-top: rgba(214, 216, 222, 0.46);
      --chip-mid: rgba(108, 112, 120, 0.5);
      --chip-bot: rgba(42, 44, 50, 0.64);
    }
    .swatch[data-tint="amber"] {
      --chip-top: rgba(255, 226, 184, 0.55);
      --chip-mid: rgba(204, 136, 62, 0.48);
      --chip-bot: rgba(102, 56, 20, 0.62);
    }
    .swatch[data-tint="rose"] {
      --chip-top: rgba(255, 210, 220, 0.54);
      --chip-mid: rgba(200, 100, 124, 0.48);
      --chip-bot: rgba(100, 38, 54, 0.62);
    }
    .swatch[data-tint="indigo"] {
      --chip-top: rgba(208, 210, 244, 0.52);
      --chip-mid: rgba(96, 98, 184, 0.52);
      --chip-bot: rgba(38, 40, 98, 0.68);
    }

    .swatch-name {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.68rem;
      font-weight: 650;
      letter-spacing: -0.01em;
      color: var(--muted);
      line-height: 1.2;
    }

    .swatch:has(input:checked) .swatch-name {
      color: var(--ink);
    }

    .folders-card {
      background: var(--card);
      border-radius: 28px;
      padding: 26px 26px 30px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(15, 17, 21, 0.045);
      width: 100%;
      max-width: 320px;
      min-width: 0;
    }

    .folders-card > .label {
      margin: 0 0 18px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .folder-stage {
      position: relative;
      width: 100%;
      height: 172px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 20px;
    }

    .folder {
      position: relative;
      width: 176px;
      height: 138px;
      max-width: 100%;
    }

    .folder-back {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 14px;
      height: 72px;
      border-radius: 12px 12px 8px 8px;
      background: linear-gradient(180deg, #3f4248 0%, #232529 100%);
      box-shadow: 0 10px 20px rgba(15, 17, 21, 0.2);
      z-index: 1;
    }

    .paper {
      position: absolute;
      width: 96px;
      height: 112px;
      background: linear-gradient(180deg, #ffffff 0%, #f6f6f7 100%);
      border-radius: 5px 3px 7px 7px;
      box-shadow:
        0 8px 16px rgba(15, 17, 21, 0.14),
        1px 0 0 rgba(15, 17, 21, 0.04),
        inset 0 1px 0 #fff;
      z-index: 2;
      overflow: hidden;
    }

    .paper .ear {
      position: absolute;
      top: 0;
      right: 0;
      width: 24px;
      height: 24px;
      background: linear-gradient(225deg, #c8ccd2 0 49%, #eceef1 51%);
      clip-path: polygon(100% 0, 0 100%, 100% 100%);
    }
    .paper .ear::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(225deg, transparent 45%, rgba(0, 0, 0, 0.06) 100%);
    }

    .paper .lines {
      position: absolute;
      left: 14px;
      right: 30px;
      top: 30px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .paper .lines span {
      display: block;
      height: 2.5px;
      border-radius: 2px;
      background: #d2d5db;
    }
    .paper .lines span:nth-child(1) { width: 76%; }
    .paper .lines span:nth-child(2) { width: 94%; }
    .paper .lines span:nth-child(3) { width: 62%; }
    .paper .lines span:nth-child(4) { width: 88%; }
    .paper .lines span:nth-child(5) { width: 48%; }

    .paper-a {
      left: 26px;
      top: 0;
      transform: rotate(-8deg);
      z-index: 2;
    }
    .paper-b {
      left: 56px;
      top: 6px;
      width: 90px;
      height: 104px;
      transform: rotate(7deg);
      z-index: 3;
    }
    .paper-b .lines { top: 28px; gap: 8px; }

    .folder-front,
    .folder-front .tab {
      transition: background 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease;
    }

    .folder-front {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 88px;
      z-index: 4;
      border-radius: 4px 18px 18px 18px;
      background: linear-gradient(
        152deg,
        var(--glass-top) 0%,
        var(--glass-mid) 42%,
        var(--glass-bot) 100%
      );
      box-shadow:
        0 16px 30px var(--glass-shadow),
        0 4px 10px var(--glass-shadow-soft),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.45),
        inset 0 -10px 22px var(--glass-inset);
      -webkit-backdrop-filter: blur(12px) saturate(1.15);
      backdrop-filter: blur(12px) saturate(1.15);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-top-color: transparent;
    }

    .folder-front .tab {
      position: absolute;
      left: -1px;
      top: -22px;
      width: 76px;
      height: 34px;
      border-radius: 14px 18px 0 0;
      background: linear-gradient(
        168deg,
        var(--glass-tab-top) 0%,
        var(--glass-tab-mid) 45%,
        var(--glass-tab-bot) 100%
      );
      box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-bottom: none;
      z-index: 0;
    }

    .folder-front .tab::after {
      content: "";
      position: absolute;
      right: -10px;
      bottom: 0;
      width: 18px;
      height: 14px;
      background: inherit;
      border-radius: 0 0 10px 0;
      transform: skewX(-18deg);
      opacity: 0.95;
      z-index: -1;
    }

    .folder-front .sheen {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        radial-gradient(90% 70% at 20% 8%, rgba(255, 255, 255, 0.42), transparent 45%),
        linear-gradient(112deg, transparent 42%, rgba(255, 255, 255, 0.14) 50%, transparent 58%);
      pointer-events: none;
      z-index: 1;
    }

    .folder-ui {
      position: absolute;
      left: 14px;
      right: 12px;
      bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 5;
      gap: 8px;
    }

    .avatars {
      display: flex;
      align-items: center;
    }
    .avatars .av {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 2px 6px rgba(15, 17, 21, 0.22);
    }
    .avatars .av + .av { margin-left: -10px; }
    .av-m {
      background: linear-gradient(145deg, #a78bfa, #7c3aed);
      z-index: 2;
    }
    .av-a {
      background: linear-gradient(145deg, rgba(110, 231, 183, 0.95), rgba(16, 185, 129, 0.88));
      z-index: 1;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      height: 26px;
      padding: 0 11px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: rgba(255, 255, 255, 0.94);
      background: rgba(16, 22, 26, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.14);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      white-space: nowrap;
    }

    .meta { text-align: center; }
    .meta h3 {
      margin: 0 0 6px;
      font-size: 1.18rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .meta p {
      margin: 0;
      font-size: 0.88rem;
      color: var(--muted);
    }

    @media (max-width: 380px) {
      main { padding: 22px 16px 48px; }
      .folders-card { padding: 22px 16px 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .folder-front,
      .folder-front .tab {
        transition: none;
      }
    }
  </style>
</head>
<body data-page="folder">
  <main>
    <div class="intro">
      <h1>Glass folder card</h1>
      <p>Pure HTML &amp; CSS — layered back flap, dog-eared papers, frosted pocket, avatars + status pill.</p>
    </div>

    <div class="specimen">
      <fieldset class="color-choice">
        <legend>Glass color</legend>
        <div class="swatches">
          <label class="swatch" data-tint="sea">
            <input type="radio" name="glass-color" id="glass-sea" value="sea" checked />
            <span class="chip" aria-hidden="true"></span>
            <span class="swatch-name">Sea</span>
          </label>
          <label class="swatch" data-tint="ice">
            <input type="radio" name="glass-color" id="glass-ice" value="ice" />
            <span class="chip" aria-hidden="true"></span>
            <span class="swatch-name">Ice</span>
          </label>
          <label class="swatch" data-tint="smoke">
            <input type="radio" name="glass-color" id="glass-smoke" value="smoke" />
            <span class="chip" aria-hidden="true"></span>
            <span class="swatch-name">Smoke</span>
          </label>
          <label class="swatch" data-tint="amber">
            <input type="radio" name="glass-color" id="glass-amber" value="amber" />
            <span class="chip" aria-hidden="true"></span>
            <span class="swatch-name">Amber</span>
          </label>
          <label class="swatch" data-tint="rose">
            <input type="radio" name="glass-color" id="glass-rose" value="rose" />
            <span class="chip" aria-hidden="true"></span>
            <span class="swatch-name">Rose</span>
          </label>
          <label class="swatch" data-tint="indigo">
            <input type="radio" name="glass-color" id="glass-indigo" value="indigo" />
            <span class="chip" aria-hidden="true"></span>
            <span class="swatch-name">Indigo</span>
          </label>
        </div>
      </fieldset>

      <article class="folders-card" aria-label="Folders · Onboarding">
        <h2 class="label">Folders</h2>

        <div class="folder-stage">
          <div class="folder" role="img" aria-label="Onboarding folder with 15 files">
            <div class="folder-back" aria-hidden="true"></div>

            <div class="paper paper-a" aria-hidden="true">
              <span class="ear"></span>
              <div class="lines">
                <span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>
            <div class="paper paper-b" aria-hidden="true">
              <span class="ear"></span>
              <div class="lines">
                <span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>

            <div class="folder-front">
              <span class="tab" aria-hidden="true"></span>
              <span class="sheen" aria-hidden="true"></span>
              <div class="folder-ui">
                <div class="avatars" aria-hidden="true">
                  <span class="av av-m">M</span>
                  <span class="av av-a">A</span>
                </div>
                <span class="badge">Updated 2h</span>
              </div>
            </div>
          </div>
        </div>

        <div class="meta">
          <h3>Onboarding</h3>
          <p>15 files · 3 subfolders</p>
        </div>
      </article>
    </div>
  </main>
  <script src="shared/site-header.js?v=5" defer></script>
</body>
</html>
