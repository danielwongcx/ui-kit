<!doctype html>
<html lang="zh-Hant" data-composition-variables='[
  {"id":"kicker","type":"string","label":"眉题","default":"BEGINNER · 入門"},
  {"id":"title","type":"string","label":"标题","default":"Learn Piano 101"},
  {"id":"subtitle","type":"string","label":"副标题","default":"學鋼琴入門"},
  {"id":"labKeys","type":"string","label":"步骤1","default":"Keys · 琴鍵"},
  {"id":"labNotes","type":"string","label":"步骤2","default":"Notes · 音符"},
  {"id":"labChord","type":"string","label":"步骤3","default":"Chord · 和弦"},
  {"id":"labPhrase","type":"string","label":"步骤4","default":"A phrase · 一句旋律"},
  {"id":"endLine","type":"string","label":"结尾","default":"而家就可以開始"},
  {"id":"endLineEn","type":"string","label":"结尾 EN","default":"You can start today"},
  {"id":"ground","type":"color","label":"底色","default":"#F4F1EA","group":"色"},
  {"id":"ink","type":"color","label":"主文字","default":"#1A1A18","group":"色"},
  {"id":"muted","type":"color","label":"次级","default":"#5A6A78","group":"色"},
  {"id":"accent","type":"color","label":"强调色","default":"#0B6E4F","group":"色"},
  {"id":"keyLit","type":"color","label":"按键高亮","default":"#7CFFC4","group":"色"},
  {"id":"endHold","type":"number","label":"结尾停留","default":2.0,"min":0.5,"max":6,"step":0.1,"group":"节奏"}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn Piano 101</title>
<style id="om-fonts">
  /* standalone: system / common CJK stacks — no external font files */
</style>
<style>
  :root {
    --ground: #F4F1EA;
    --ink: #1A1A18;
    --muted: #5A6A78;
    --accent: #0B6E4F;
    --keyLit: #7CFFC4;
    --pad: clamp(16px, 4.5vmin, 56px);
    --title-size: clamp(36px, 8.5vmin, 96px);
    --sub-size: clamp(20px, 4.2vmin, 44px);
    --step-size: clamp(22px, 4.5vmin, 48px);
    --key-label: clamp(22px, 4.8vmin, 44px);
    --end-size: clamp(28px, 5.5vmin, 56px);
  }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--ground);
  }
  #film {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    background: var(--ground); color: var(--ink);
    font-family: "Noto Sans SC", "PingFang HK", "Hiragino Sans GB", "Microsoft JhengHei", Inter, system-ui, sans-serif;
    container-type: size;
    container-name: film;
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 1fr;
    gap: clamp(12px, 2.5vmin, 28px);
    padding: var(--pad);
    box-sizing: border-box;
  }
  .glow {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(90vmin 70vmin at 50% 40%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 65%),
      radial-gradient(80vmin 50vmin at 10% 0%, #ffffffaa, transparent 55%);
  }
  .header, .stage, .footer { position: relative; z-index: 1; }
  .header { display: flex; flex-direction: column; gap: 0.55em; min-width: 0; }
  .kicker {
    font-family: Inter, sans-serif; font-weight: 600;
    font-size: clamp(14px, 2.6vmin, 26px);
    letter-spacing: 0.14em; color: var(--muted); line-height: 1.3;
  }
  .title {
    margin: 0; font-weight: 900; font-size: var(--title-size);
    letter-spacing: -0.03em; line-height: 1.05; color: var(--ink);
  }
  .subtitle {
    margin: 0; font-weight: 700; font-size: var(--sub-size);
    color: var(--accent); letter-spacing: 0.02em;
  }
  .badge {
    align-self: flex-start; margin-top: 0.4em;
    font-size: clamp(12px, 2.2vmin, 20px); font-weight: 700;
    letter-spacing: 0.08em; color: var(--muted);
    border: 2.5px solid #C8D0D8; border-radius: 999px;
    padding: 0.45em 0.9em; background: #FFFFFFee;
  }
  .stage {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(16px, 3vmin, 36px); min-height: 0;
  }
  .step-tag {
    font-size: var(--step-size); font-weight: 900; color: var(--accent);
    letter-spacing: 0.04em; min-height: 1.2em; text-align: center;
  }
  .keyboard {
    display: flex; align-items: flex-end; justify-content: center;
    gap: clamp(6px, 1.4vmin, 14px);
    width: min(100%, 92vmin);
    height: min(42vmin, 420px);
    position: relative;
  }
  .key {
    flex: 1 1 0; max-width: 140px; height: 100%;
    background: #FFFEFA; border: 3px solid #C8D0D8; border-radius: 0 0 14px 14px;
    box-shadow: 0 10px 28px #1a1a1814, inset 0 1px 0 #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: clamp(12px, 2.5vmin, 28px); gap: 6px;
    position: relative; transform-origin: 50% 100%;
  }
  .key .note {
    font-family: Inter, sans-serif; font-weight: 800;
    font-size: var(--key-label); color: var(--ink); letter-spacing: 0.04em;
  }
  .key .zh {
    font-size: clamp(12px, 2.2vmin, 18px); font-weight: 700; color: var(--muted);
  }
  .key.is-lit {
    background: linear-gradient(#E8FFF6, var(--keyLit));
    border-color: var(--accent);
    box-shadow: 0 12px 32px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  .key.blackish { /* unused — keep white-key only for clarity */ }
  .chord-chip {
    display: flex; gap: 10px; align-items: center; justify-content: center;
    font-family: Inter, sans-serif; font-weight: 800;
    font-size: clamp(20px, 4vmin, 40px); color: var(--ink);
    opacity: 0;
  }
  .chord-chip span {
    background: #fff; border: 3px solid var(--accent); border-radius: 12px;
    padding: 0.25em 0.55em; min-width: 1.4em; text-align: center;
  }
  .footer {
    display: flex; flex-direction: column; gap: 0.25em; min-height: 2.5em;
  }
  .end-line {
    font-size: var(--end-size); font-weight: 900; color: var(--accent);
    letter-spacing: 0.02em; opacity: 0;
  }
  .end-line-en {
    font-family: Inter, sans-serif; font-size: clamp(16px, 3vmin, 28px);
    font-weight: 600; color: var(--muted); opacity: 0;
  }

  /* Landscape / wide film box: title left, keyboard right */
  @container film (min-aspect-ratio: 1 / 1) {
    #film {
      grid-template-rows: 1fr;
      grid-template-columns: minmax(280px, 0.9fr) 1.2fr;
      align-items: center;
    }
    .header { grid-column: 1; grid-row: 1; align-self: center; }
    .stage { grid-column: 2; grid-row: 1; align-self: center; }
    .footer {
      grid-column: 1 / -1; grid-row: 1;
      align-self: end; justify-self: start;
      max-width: 90%;
    }
    .keyboard { height: min(55vmin, 480px); width: min(100%, 70vmin); }
    .title { font-size: clamp(40px, 6.5vmin, 84px); }
  }

  /* Extra-narrow phones */
  @container film (max-width: 420px) {
    .keyboard { height: 38vmin; }
    .key { border-width: 2.5px; }
  }
</style>

    }
    body[data-page="learn-piano-101"] > #film-frame > #film > .header {
      min-width: 0;
    }
  }
  .film-start {
    position: fixed;
    z-index: 40;
    left: 0;
    right: 0;
    top: calc(var(--site-header-h, 56px) + env(safe-area-inset-top, 0px));
    bottom: 0;
    margin: 0;
    padding: 24px;
    border: 0;
    background: transparent;
    color: var(--ink, #1A1A18);
    cursor: pointer;

    border-radius: 999px;
    background: #FFFEFA;
    color: #1A1A18;
    border: 3px solid var(--accent, #0B6E4F);
    box-shadow: 0 12px 32px rgba(26, 26, 24, 0.14);
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.02em;
    line-height: 1;
  }
  .film-start__mark {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--accent, #0B6E4F);
    display: grid;
    place-items: center;
    flex: 0 0 auto;
  }
  .film-start__mark::before {
    content: "";
    display: block;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 7px 0 7px 12px;
    border-color: transparent transparent transparent #fff;
    margin-left: 3px;
  }
  .film-start:hover .film-start__chip,
  .film-start:focus-visible .film-start__chip {
    background: #E8FFF6;
  }
  .film-start:focus-visible {
    outline: none;
  }
  .film-start:focus-visible .film-start__chip {
    outline: 3px solid var(--accent, #0B6E4F);
    outline-offset: 4px;
  }
</style>

<body data-page="learn-piano-101">
<!--
  Portrait-first composition 1080×1920 for om tools.
  Same file reflows via @container when the film box is landscape (browser / phone 打橫).
-->
<div id="film-frame">
<div id="film" data-composition-id="film" data-width="1080" data-height="1920">
  <div class="glow" data-om-id="glow"></div>

  <header class="header" data-om-id="header">
    <div class="kicker" data-om-id="kicker" data-var-text="kicker">BEGINNER · 入門</div>
    <h1 class="title" data-om-id="title" data-var-text="title">Learn Piano 101</h1>
    <p class="subtitle" data-om-id="subtitle" data-var-text="subtitle">學鋼琴入門</p>
    <div class="badge" data-om-id="badge">示意 · 4 steps</div>
  </header>

  <main class="stage" data-om-id="stage">
    <div class="step-tag" data-om-id="step-tag"></div>
    <div class="keyboard" data-om-id="keyboard">
      <div class="key" data-om-id="key-c" id="key-c">
        <span class="note" data-om-id="note-c">C</span>
        <span class="zh">哆</span>
      </div>
      <div class="key" data-om-id="key-d" id="key-d">
        <span class="note" data-om-id="note-d">D</span>
        <span class="zh">唻</span>
      </div>
      <div class="key" data-om-id="key-e" id="key-e">
        <span class="note" data-om-id="note-e">E</span>
        <span class="zh">咪</span>
      </div>
      <div class="key" data-om-id="key-g" id="key-g">
        <span class="note" data-om-id="note-g">G</span>
        <span class="zh">嗦</span>
      </div>
    </div>
    <div class="chord-chip" data-om-id="chord-chip">
      <span>C</span><span>E</span><span>G</span>
    </div>
  </main>

  <footer class="footer" data-om-id="footer">
    <div class="end-line" data-om-id="end-line" data-var-text="endLine">而家就可以開始</div>
    <div class="end-line-en" data-om-id="end-line-en" data-var-text="endLineEn">You can start today</div>
  </footer>
</div>
</div>

<button type="button" id="film-start" class="film-start" aria-label="Play Learn Piano 101" aria-controls="film">
  <span class="film-start__chip">
    <span class="film-start__mark" aria-hidden="true"></span>
    <span id="film-start-label">Play · 開始</span>
  </span>
</button>



<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<script>
/* Studio hosts inject composition variables. On this static page, use the declared defaults. */
(function () {
  if (window.__omEngine || (window.__hyperframes && window.__hyperframes.getVariables)) return;
  var decl = [];
  try {
    decl = JSON.parse(document.documentElement.getAttribute("data-composition-variables") || "[]");
  } catch (e) {
    decl = [];
  }
  var vars = {};
  for (var i = 0; i < decl.length; i++) {
    var d = decl[i];
    if (d && d.id) vars[d.id] = d.default;
  }
  window.__hyperframes = window.__hyperframes || {};
  window.__hyperframes.getVariables = function () { return vars; };
})();
</script>

<script>
  const V = OM.vars();
  ['ground','ink','muted','accent','keyLit'].forEach((k) => {
    document.documentElement.style.setProperty('--' + k, V[k]);
  });

  OM.music({ bpm: 100 });
  const B = (n) => OM.beat(n); // 1 beat = 0.6s at 100 BPM

  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
  const keys = ['#key-c', '#key-d', '#key-e', '#key-g'];
  const step = document.querySelector('.step-tag');

  gsap.set('.kicker', { opacity: 0, y: -12 });
  gsap.set('.title', { opacity: 0, y: 24 });
  gsap.set('.subtitle', { opacity: 0, y: 16 });
  gsap.set('.badge', { opacity: 0, scale: 0.92 });
  gsap.set('.key', { yPercent: 40, opacity: 0 });
  gsap.set('.key .note, .key .zh', { opacity: 0 });
  gsap.set('.chord-chip', { opacity: 0, y: 12 });
  gsap.set('.end-line, .end-line-en', { opacity: 0, y: 14 });
  gsap.set('.step-tag', { opacity: 0 });

  function setStep(text, at) {
    tl.call(() => { step.textContent = text; }, null, at);
    tl.fromTo('.step-tag', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35 }, at);
  }
  function clearStep(at) {
    tl.to('.step-tag', { opacity: 0, duration: 0.25 }, at);
  }
  const lit = {
    background: 'linear-gradient(#E8FFF6, var(--keyLit))',
    borderColor: 'var(--accent)',
    boxShadow: '0 12px 32px color-mix(in srgb, var(--accent) 22%, transparent)',
  };
  const unlit = {
    background: '#FFFEFA',
    borderColor: '#C8D0D8',
    boxShadow: '0 10px 28px #1a1a1814, inset 0 1px 0 #fff',
  };
  function press(sel, at, note) {
    tl.to(sel, { yPercent: 6, duration: 0.12, ease: 'power2.in' }, OM.sfx('pop', at, { note, gain: 0.85 }));
    tl.to(sel, { ...lit, duration: 0.12 }, at);
    tl.to(sel, { yPercent: 0, duration: 0.28, ease: OM.spring(0.14) }, at + 0.12);
  }
  function unlitAll(at) {
    tl.to(keys.join(','), { ...unlit, duration: 0.25 }, at);
  }

  // ===== HOOK ~0–2.4s (4 beats) =====
  tl.addLabel('scene:hook', 0);
  tl.to('.kicker', { opacity: 1, y: 0, duration: 0.45 }, 0.1);
  tl.to('.title', { opacity: 1, y: 0, duration: 0.65, ease: 'expo.out' }, OM.sfx('whoosh', 0.2, { gain: 0.3 }));
  tl.to('.subtitle', { opacity: 1, y: 0, duration: 0.5 }, 0.45);
  tl.to('.badge', { opacity: 1, scale: 1, duration: 0.4 }, 0.7);

  // ===== KEYS ~2.4s =====
  tl.addLabel('scene:keys', B(4));
  setStep(V.labKeys, B(4));
  keys.forEach((sel, i) => {
    const t = B(4) + 0.15 + i * 0.18;
    tl.to(sel, { yPercent: 0, opacity: 1, duration: 0.5, ease: OM.spring(0.12) }, OM.sfx('thud', t, { gain: 0.45, pan: (i - 1.5) * 0.2 }));
  });

  // ===== NOTES ~4.8s =====
  tl.addLabel('scene:notes', B(8));
  clearStep(B(8) - 0.15);
  setStep(V.labNotes, B(8));
  keys.forEach((sel, i) => {
    const t = B(8) + i * 0.2;
    tl.to(`${sel} .note, ${sel} .zh`, { opacity: 1, duration: 0.35 }, OM.sfx('tick', t, { gain: 0.5 }));
  });

  // ===== CHORD ~7.2s =====
  tl.addLabel('scene:chord', B(12));
  clearStep(B(12) - 0.15);
  setStep(V.labChord, B(12));
  // light C E G together (skip D visually for triad — still show D dim)
  tl.to('#key-d', { opacity: 0.35, duration: 0.35 }, B(12));
  ['#key-c', '#key-e', '#key-g'].forEach((sel, i) => {
    press(sel, B(12) + 0.1 + i * 0.05, i + 1);
  });
  tl.to('.chord-chip', { opacity: 1, y: 0, duration: 0.45 }, OM.sfx('ding', B(12) + 0.35, { note: 5, gain: 0.7 }));

  // ===== PHRASE ~9.6–14.4s =====
  tl.addLabel('scene:phrase', B(16));
  clearStep(B(16) - 0.1);
  setStep(V.labPhrase, B(16));
  unlitAll(B(16));
  tl.to('#key-d', { opacity: 1, duration: 0.3 }, B(16));
  tl.to('.chord-chip', { opacity: 0, y: -8, duration: 0.3 }, B(16));
  // C D E G E D C
  const phrase = [
    ['#key-c', 0], ['#key-d', 1], ['#key-e', 2], ['#key-g', 3],
    ['#key-e', 4], ['#key-d', 5], ['#key-c', 6],
  ];
  phrase.forEach(([sel, i], idx) => {
    const t = B(16) + 0.25 + idx * 0.45;
    press(sel, t, (idx % 5) + 1);
    tl.to(sel, { ...unlit, duration: 0.2 }, t + 0.38);
  });

  // ===== END ~16.8s =====
  tl.addLabel('scene:end', B(24)); // 14.4s — 2 bars after phrase
  clearStep(B(24) - 0.1);
  unlitAll(B(24));
  tl.to(keys.join(','), { opacity: 1, duration: 0.3 }, B(24));
  tl.to('#key-c, #key-e, #key-g', { ...lit, duration: 0.35 }, B(24) + 0.15);
  tl.to('.end-line', { opacity: 1, y: 0, duration: 0.55 }, OM.sfx('chime', B(24) + 0.2, { gain: 0.75 }));
  tl.to('.end-line-en', { opacity: 1, y: 0, duration: 0.5 }, B(24) + 0.45);
  tl.to({}, { duration: V.endHold }, B(28));

  window.__timelines = window.__timelines || {};
  window.__timelines['film'] = tl;
</script>
<script>
/* One click starts the visual GSAP timeline. */
(function () {
  var btn = document.getElementById("film-start");
  var label = document.getElementById("film-start-label");
  var playing = false;

  function film() {
    return (window.__timelines && window.__timelines.film) || null;
  }

  function showReady(replay) {
    playing = false;
    if (!btn) return;
    if (label) label.textContent = replay ? "Replay · 再播" : "Play · 開始";
    btn.setAttribute("aria-label", replay ? "Replay Learn Piano 101" : "Play Learn Piano 101");
    btn.hidden = false;
  }

  function arm(tl) {
    tl.eventCallback("onComplete", function () { showReady(true); });
  }

  function start() {
    var tl = film();
    if (!tl || playing) return;
    playing = true;
    if (btn) btn.hidden = true;
    arm(tl);
    tl.pause(0);
    tl.play(0);
  }

  if (btn) btn.addEventListener("click", start);
  var tl0 = film();
  if (tl0) arm(tl0);
})();
</script>

<script src="shared/site-header.js" defer></script>
</body>
