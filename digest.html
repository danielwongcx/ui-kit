cat": "kits", "comment": "build/style/edit code in the browser"}, {"repo": "imskyleen/animate-ui", "why": "animated React/shadcn component distribution built on Motion", "stars": 4746, "license": "", "date": "2026-10-30", "cat": "motion", "comment": "Motion-powered animated UI kit that slots into shadcn workflows"}, {"repo": "cloudflare/kumo", "why": "Cloudflare’s modern component library", "stars": 4154, "license": "MIT", "date": "2026-10-30", "cat": "kits", "comment": "production DS primitives from the edge team"}, {"repo": "bergside/awesome-design-skills", "why": "curated list of 67 DESIGN.md / SKILL.md files for Claude Design, Stitch, Codex, Cursor", "stars": 3405, "license": "MIT", "date": "2026-10-30", "cat": "skills", "comment": "one list of design skills to feed agents instead of hunting repos"}, {"repo": "emilkowalski/skills", "why": "emilkowalski designer/engineer agent skills — sonner/vaul author, craft-first", "stars": 52286, "license": "MIT", "date": "2026-10-31", "cat": "skills", "comment": "emilkowalski designer/engineer agent skills — sonner/vaul author, craft-first"}, {"repo": "gkurt/tegaki", "why": "handwriting text animation for the web", "stars": 3283, "license": "MIT", "date": "2026-10-30", "cat": "motion", "comment": "any font/text, stroke-order craft for agents"}, {"repo": "glincker/thesvg", "why": "open SVG brand library (7600+ logos) with npm/CDN/MCP", "stars": 2924, "license": "MIT", "date": "2026-10-30", "cat": "brand", "comment": "brand logos as SVG via npm/CDN/MCP without scraping"}, {"repo": "southleft/figma-console-mcp", "why": "design system as an API — Figma MCP for extraction, creation, debugging", "stars": 2625, "license": "MIT", "date": "2026-10-30", "cat": "mcp", "comment": "Figma DS as an API for agents via MCP"}, {"repo": "kubai tip 005 — lively drag reorder", "url": "https://x.com/Kubai087/status/2115823717024735708", "why": "lively drag reorder pattern from the kubai tip series", "stars": 0, "license": "", "date": "2026-10-30", "cat": "tips", "comment": "lively drag reorder pattern from the kubai tip series","prompt":"Make drag-to-reorder in my product feel like this. Apply it to the lists,\nrows and docks I name, and reuse any drag helper the project already has.\n\n1. Cursor: a pointing hand over anything draggable, a grabbing hand while\n   dragging.\n2. Lift: the picked item follows the pointer, raised off the list so it\n   never hides where it will land: above a horizontal row, or pulled aside\n   and shrunk to about 90% in a vertical list. Its old slot closes up.\n3. Drop hint: a faint, thin line in the gap where it will land (vertical in\n   a row, horizontal in a list), about 15% of the text color. It grows from\n   its middle when it appears and glides to each new gap. No line over the\n   item's own slot.\n4. Ripple: items on both sides of the line lean away from it. Counting n\n   from the line (0 = the item touching it), item n moves\n   A x 0.7^n (A is about 10px for icons, 8px for cards)\n   and starts 24ms x n later, on a quick spring that barely overshoots and\n   settles in about 0.25s. Nearer items move sooner and further, so the\n   push spreads out like a ripple.\n5. Drop: the item takes the gap and every item springs into its new place.\n   Escape or dropping outside the list cancels, and everything springs back.\n6. Give each motion its own curve (hand-like for the pointer, a small pop\n   for the lift, springs for settling) instead of one ease-out everywhere.\n\nMove things with transforms, not layout. Let the keyboard reorder too, and\nwith reduced motion keep only the line.","promptUrl":"https://x.com/Kubai087/status/2115823717024735708"}, {"repo": "boardui.com", "url": "https://www.boardui.com/", "why": "Beautiful UI components for modern products — companion site to BoardUI/boardui already in kits.", "stars": 0, "license": "", "date": "2026-10-31", "cat": "web", "comment": "Beautiful UI components for modern products — companion site to BoardUI/boardui already in kits."}, {"repo": "ui.aceternity.com", "url": "https://ui.aceternity.com/", "why": "Animated React components — Aceternity UI gallery for product motion craft.", "stars": 0, "license": "", "date": "2026-10-31", "cat": "web", "comment": "Animated React components — Aceternity UI gallery for product motion craft."}, {"repo": "originkit.dev", "url": "https://www.originkit.dev/", "why": "Free animated components ready to drop into modern product UIs.", "stars": 0, "license": "", "date": "2026-10-31", "cat": "web", "comment": "Free animated components ready to drop into modern product UIs."},{"repo": "kubai tip 006 — book-flip card", "url": "https://x.com/Kubai087/status/2116198373040759107", "why": "hover opens the card like a tiny book — vibe-card antidote with copy-paste prompt", "stars": 0, "license": "", "date": "2026-10-30", "cat": "tips", "comment": "hover opens the card like a tiny book — vibe-card antidote with copy-paste prompt","prompt":"Make the cards in my product open a little, like a book, when hovered.\nAt rest a card must look exactly as it does today; only hover or focus\nreveals that it is a small book with pages inside.\n\n## 0. Start from what exists\n- Find the card component I name (or the one used in the grid or list I\n  point to) and retrofit it in place. Reuse its markup, design tokens,\n  radius, shadow and motion or spring utilities.\n- Keep the card's footprint, padding, content and layout unchanged.\n  Nothing around the card may move.\n- If I ask for new cards instead, build a fresh square card (about\n  280 x 280) in the style I choose below.\n- Any option I leave unset uses the default marked *.\n\n## 1. Choose a style\nDefault*: ordinary product cards, identical to normal ones until hovered.\n- Surface: plain white (or my card surface token), no texture.\n- Edge: a 1px hairline in my border colour.\n- Shadow: light, neutral cool grey, half strength.\n- Type: the product sans. Title 24/600, description 15 muted,\n  meta 14 muted.\n- Cover: the existing card UI: a 48px icon tile, a ↗ arrow top right,\n  title, description, and a meta footer below a hairline.\n- Wall: my normal page background.\n- Pages: white, a faint shade toward the spine, a small heading and\n  4-6 grey text lines.\n\nSkeuomorphic: hardcover books on a gallery wall.\n- Surface: fine bookcloth grain over a deep cover colour.\n- Edge: a lit bevel: bright top edge, darker foot.\n- Shadow: warm, near-neutral grey (never orange), full strength.\n- Type: one serif title, bottom left. Nothing else on the cover.\n- Cover: a full-bleed image or animated ASCII scene, with a soft gloss\n  at the top and shade at the foot.\n- Wall: warm plaster with a fine grain and a spotlight over each book.\n- Pages: cream paper with grain, an italic chapter heading, justified\n  lines, and thin page edges along the fore-edge.\n\nMinimal: documentation volumes.\n- Surface: flat off-white, light grey or graphite, one tone per card.\n- Edge: a faint bevel or hairline.\n- Shadow: cool neutral grey.\n- Type: a mono section number and version on top, over a hairline rule;\n  a two-line sans title and a small grey label at the foot.\n- Cover: one small grey line diagram with a single element in the ink\n  colour.\n- Wall: cool grey with a faint 24px dot grid and soft light from above.\n- Pages: cool white, a sans heading and grey lines.\n\nMatch my product: take surface, edge, shadow, type and wall from my\ntokens, and keep the cover exactly as the card is today.\n\n## 2. Options (defaults marked *)\n- Intensity: subtle (A = 24deg) | book* (A = 42deg) | dramatic\n  (A = 60deg).\n- Pages: 2 | 3 | 4* | 6.\n- Hinge: left* | right | top.\n- Trigger: hover* | press (open while pressed) | scroll into view (open\n  once when 60% visible, close after ~1.2s). Keyboard focus always\n  opens it too.\n- Pages show: blank paper | lines of text* | real preview content from\n  the card (its next fields, a short list, a chart thumbnail).\n- Cover: existing card UI* | image | animated ASCII scene | solid colour.\n- Shadow direction: from above* | from top-left.\n- Shadow strength: none | light | normal* | deep.\n- Corners: match my tokens* | continuous (superellipse).\n- Motion feel: snappy (k 320, damping 0.9) | default* (k 240,\n  damping 0.86) | soft (k 160, damping 0.8). All barely overshoot.\n- Reduced motion: tiny lift* | nothing.\n- Touch: press* | scroll into view | off.\n\n## 3. Layer stack\n- Inside the card's link, put the cover on a body element with\n  transform-style: preserve-3d. Behind it stack N pages and a back\n  board, all absolutely positioned on the same square.\n- Order, front to back: cover (n = 0), pages (n = 1..N), back board\n  (n = N + 1, never moves).\n- The cover keeps all of the card's existing content. Pages and the\n  back board are decorative: aria-hidden, no links, no tab stops.\n- Perspective on the static outer element: about 1100px, origin toward\n  the hinge (30% 50% for left, 70% 50% for right, 50% 30% for top).\n- transform-origin on the hinge edge of every layer: left 0 50%,\n  right 100% 50%, top 50% 0. backface-visibility: hidden.\n- Lift layer n by translateZ((N + 1 - n) x 0.6px) so layers never\n  fight in depth.\n- Pages sit 8px inside the cover (4px at the spine), like a book block,\n  with radius = cover radius - 8.\n- Back board: on flat cards (Default, Minimal) inset it ~6px from the\n  cover with radius = cover radius - 6, so it never peeks out past the\n  cover's foreshortened corners. On Skeuomorphic it is flush, the cover\n  colour darkened ~28%.\n\n## 4. Motion\n- Layer n turns toward the viewer by\n    angle(n) = A x 0.7^n\n  and starts\n    delay(n) = 28ms x n\n  later. The cover leads; pages fan out behind it.\n- Direction: rotateY(-angle) for a left hinge, rotateY(+angle) for\n  right, rotateX(+angle) for top.\n- Each layer runs on its own spring (see Motion feel), settling in\n  about 0.3s.\n- Close in reverse: the innermost page first, delay = 28ms x (N - n),\n  back to 0deg.\n- If the pointer leaves mid-way, retarget from the current angle and\n  velocity. Never jump.\n- No spring helper in the project? CSS transitions are fine: transition\n  transform over ~420ms with a slight overshoot, e.g.\n  cubic-bezier(0.3, 1.2, 0.5, 1), and set transition-delay to 28ms x n\n  in the open state and 28ms x (N - n) at rest (the target state's delay\n  applies, so closing runs in reverse).\n\n## 5. Light and shading\n- Light comes from above, so the shadow falls down the wall.\n- The shadow is two solid shapes behind the card, each blurred once.\n  At rest it hugs the card like any flat card's:\n  - contact: small and darker, at the foot. Lower half of the card,\n    ~4px in from each side, blur ~4px, ~2px down, ~22% opacity.\n  - ambient: faint. Blur ~14px, ~6px down, ~12% opacity.\n- Never a box-shadow: it is a hollow ring and shows as an outline once\n  the cover swings off it.\n- Tint: near-neutral grey nudged toward the wall (warm grey on a warm\n  wall, cool grey on a cool one). Never pure black, never saturated.\n- Strength scales both opacities: light 0.5 (Default style), normal 1,\n  deep 1.4.\n- Opening: crossfade to a second pre-blurred pair that is longer and\n  softer (contact blur ~12px, 12px down; ambient blur ~38px, 26px down),\n  and move it ~14px further down and ~4% wider with transform. Drive it\n  with one progress value o (0..1) on its own spring (k 200, damping\n  0.9): rest pair opacity 1 - o, open pair opacity o.\n- Leaf shading: every page has an overlay gradient from the spine\n  (32% dark -\u003e 8% at 55% -\u003e 0 at 85%). Its opacity is\n    clamp(gap / 6, 0, 1) x max(0, 1 - gap / 30)\n  where gap = the angle of the leaf in front minus this leaf's angle.\n  A page is shaded while the leaf in front is just lifting off it, then\n  lit once they part.\n- Covers (Skeuomorphic, Minimal): a soft gloss at the top edge and a\n  little shade at the foot.\n\n## 6. Corners and edges\n- Clip every layer (cover, pages, back board) to one shape path, and\n  draw its edge (hairline or bevel) along that exact path, e.g. an SVG\n  path stroked over the layer. Do not mix a CSS border or inset\n  box-shadow with the clip: they disagree at the corners and show a\n  second rim when the layers part.\n- Match my tokens: use the token radius; nested radius = outer - inset.\n- Continuous: superellipse corners |x|^n + |y|^n = 1 with n = 2^1.25\n  (the same curve as CSS corner-shape: superellipse(1.25)). Generate a\n  clip-path: path(...) per layer size, reuse it for the edge, and\n  regenerate on resize.\n\n## 7. Interaction and accessibility\n- Hit-test on the resting footprint: listen for hover on the static\n  outer element and give every moving layer pointer-events: none, so a\n  swinging cover never moves the target and the card never flickers\n  open and closed at its edges.\n- Cursor: a pointing hand over the whole card.\n- The whole card stays one \u003ca\u003e or \u003cbutton\u003e with its current accessible\n  name. Pages add nothing to the accessibility tree.\n- :focus-visible opens it exactly like hover. Keep the focus ring on the\n  outer element, along the resting shape.\n- Reduced motion: no fan and no rotation. The cover lifts ~2px and the\n  shadow crossfades to the open pair.\n- Touch: no hover. Use the Touch option; a tap must still activate the\n  card on the first try.\n\n## 8. Performance\n- Animate transform and opacity only. Never animate blur, box-shadow,\n  clip-path, width, height or top/left.\n- Never animate a blur radius: blur each shadow once and crossfade the\n  two pre-blurred versions.\n- One requestAnimationFrame loop for all cards. Skip cards whose springs\n  are at rest, and stop the loop when nothing moves.\n- Write a style only when its value changes (cache the last string per\n  element).\n- No layout reads per frame: measure once, and again on resize\n  (ResizeObserver).\n- Animated canvas ∂∂: draw at ~30fps at most, and pause when off\n  screen (IntersectionObserver) or when the tab is hidden.\n\n## 9. Animated ASCII cover (only if chosen)\n- Paint a small scene as one colour per character cell (~6 x 9px).\n- Pick each character by brightness from \" .:-=+*#%@\".\n- Draw a dimmed copy of the colours (~40%) underneath and the coloured\n  characters on top, so the gaps read like a halftone.\n- Stamp characters from a pre-rendered glyph atlas instead of laying out\n  text every frame. Keep the motion slow and seamlessly looping.\n\n## 10. When done\n- List every file you changed or added.\n- List the style and every option you used, marking which were\n  defaults.\n- Note anything that no longer looks identical at rest.","promptUrl":"https://x.com/Kubai087/status/2116198373040759107"},{"repo": "kubai tip 007 — typography CSS", "url": "https://x.com/Kubai087/status/2116555064227811412", "why": "CJK/Latin wrap, align, truncate CSS switches for i18n — Agent-ready polish prompt", "stars": 0, "license": "", "date": "2026-10-31", "cat": "tips", "comment": "CJK/Latin wrap, align, truncate CSS switches for i18n — Agent-ready polish prompt","prompt":"Polish the typography in my product with a set of CSS switches. Change only how text wraps, spaces, aligns and truncates. No copy, font, colour or layout changes beyond what each rule says.\n\n0. Start from what exists\n- Put the rules in the global text styles (base CSS, typography tokens, Tailwind config or shared text components) so every page inherits them. Add per-component rules only where a component overrides the base.\n- Every rule below is progressive enhancement: browsers that don't know a property ignore it. Add no polyfills.\n- Scope the Chinese rules with :lang(zh), and make sure the lang attribute is set on the html element or on the element itself, so English text keeps its own rules.\n\n1. Headings break into even lines\n- On h1 to h3, card titles and hero lines: text-wrap: balance;\n- Lines come out about the same length, so a heading never ends on one lonely word. Short text only: Chrome balances up to 6 lines.\n\n2. No lone word at the end of a paragraph\n- On paragraphs, descriptions and list items: text-wrap: pretty;\n- Also join pairs that must not split with a non-breaking space (U+00A0): an em dash and the name after it, a number and its unit.\n\n3. Numbers that change keep their width\n- On anything that updates in place or sits in a column (counters, prices, timers, stats, table cells): font-variant-numeric: tabular-nums;\n- The font must have tabular figures (the tnum feature); check that the width actually stops changing. Leave running text proportional.\n\n4. Button labels stay on one line\n- On buttons and other labels in flex rows: white-space: nowrap; (flex-shrink: 0 works too)\n- A crowded row must not squeeze a label onto two lines.\n\n5. Long text truncates instead of spilling out\n- A flex item won't shrink below its content, so text inside it can't truncate. On the flex item: min-width: 0;\n- On the text itself: overflow: hidden; white-space: nowrap; text-overflow: ellipsis;\n- When the text really is cut (scrollWidth \u003e clientWidth), show the full text in a tooltip on hover.\n\n6. Chinese body text: justified, on a whole number of characters\n- On Chinese paragraphs only: text-align: justify;\n- Set the measure to a whole number of characters (for example max-width: 26em at the paragraph's font size), so a justified line only stretches to absorb Latin words and squeezed punctuation.\n- Not for narrow columns (under about 15 characters), short text, captions, buttons or mostly-English text: the gaps get uneven.\n\n7. Space between Chinese and Latin text or numbers\n- On Chinese text: text-autospace: normal;\n- The browser adds a thin gap between Han characters and Latin letters or digits. Don't also hand-type spaces in copy or translation files. Skip code, inputs and monospaced text.\n\n8. No half-width gap before an opening bracket at a line start\n- On Chinese UI text without a first-line indent: text-spacing-trim: trim-start;\n- An opening 「 “ （ at the start of a line drops its blank half and lines up with the text above. Long-form text with a two-character indent should use space-first instead. Chrome only for now.\n\n9. Chinese headings break between words\n- Chinese has no spaces, so a heading can split a word across lines. Mark the break points between words with BudouX (its Simplified or Traditional Chinese model), inserting a wbr element at each one, at build time for static copy or at render time for dynamic copy. Then: word-break: keep-all; overflow-wrap: anywhere; text-wrap: balance;\n- Never use keep-all on Chinese without break points: the heading becomes one unbreakable word. Don't use Intl.Segmenter for this (it splits common words wrongly), and don't apply it to body text.\n\n10. Line-start and line-end rules (避头尾)\n- Browsers already keep punctuation off the start of a line and squeeze line-end punctuation. Don't rebuild this.\n- Find and remove any line-break: anywhere used to stop overflow: it turns these rules off. Use overflow-wrap: anywhere instead.\n- Text drawn on canvas or SVG, or wrapped by hand in JS, gets none of this: apply the rules there yourself.\n\n11. When done\n- List every file and selector you changed.\n- List every line-break: anywhere and word-break: break-all you removed or kept, and why.\n- Show before and after on my own pages: a wrapped heading, a paragraph ending, a changing number, a truncated label and a mixed Chinese-English paragraph.","promptUrl":"https://x.com/Kubai087/status/2116555520274493582"},{"repo": "kubai tip 008 — wiki layout", "url": "https://x.com/Kubai087/status/2116911391437443471", "why": "wiki frame that works on PC and mobile (chapter switch) — SEO docs without a clunky nav", "stars": 0, "license": "", "date": "2026-11-01", "cat": "tips", "comment": "wiki frame that works on PC and mobile (chapter switch) — SEO docs without a clunky nav","prompt":"Polish the layout of my docs or help center pages: the header, the page list, the outline and the end of each article. Keep the content, copy, colours and fonts. Change only how these parts sit, scroll and respond.\n\n0. Start from what exists\n- Find the shared docs layout, the site header, the page list (sidebar), the outline (table of contents) and the footer. Change those, so every page inherits the result.\n- Use CSS and a little plain JS. Add no scroll or animation libraries.\n\n1. Think of the page as three layers\n- The article and the footer scroll with the page.\n- The page list and the outline are position: sticky. They stop where they start, so they never jump when scrolling begins, and the end of the layout pushes them up at the bottom.\n- The header becomes position: fixed only after the page's opening (banner or hero) has left the screen. Before that it belongs to the page and scrolls away with it.\n\n2. Header: it scrolls away, then comes back floating\n- At the top it is clear, with no background.\n- Once the reader has scrolled and the banner's bottom edge is at or above the top of the screen (getBoundingClientRect().bottom \u003c= 0), show it as a floating bar: position: fixed; a translucent white background; backdrop-filter: blur(18px); a soft shadow.\n- It enters in 320ms ease-out, from translateY(-24px) with blur(8px) and opacity 0. It leaves in 120ms when the reader scrolls back up to the banner. If the reader scrolls down again during the exit, cancel it and keep the bar.\n- Give headings a scroll-margin-top so anchor links never land under the bar.\n\n3. Page list: it scrolls on its own, and shows where there is more\n- Hide its scrollbar and let it scroll by itself.\n- Fade an edge only while more of the list waits beyond it. Toggle data-more-above and data-more-below on scroll and resize, and drive a mask-image: linear-gradient(...) with them: about 40px at the top and 56px at the bottom, each with a short fully clear strip at the very edge, so a half-cut row never shows as a faint line.\n- Add a small round arrow on each edge that has more. A click scrolls the list by 60% of its visible height, smoothly. Arrows are for the mouse only (tabindex=\"-1\", aria-hidden=\"true\"); keyboard focus already scrolls the list.\n- On load, bring the current page into view. Keep the list's scroll position in sessionStorage, so moving to another page does not reset it.\n- If there is a search box, let \"/\" focus it.\n\n4. Outline: mark the section being read\n- The current section is the last heading above a line 20% down the viewport.\n- Mark its link with aria-current=\"location\" and style that: border-left-color and text in the accent colour.\n- Update it on scroll, at most once per animation frame.\n\n5. End of the article: help first, then the next page\n- If the reader is still stuck, a \"Still need help?\" card with one or two real channels (the issue tracker, the community, a contact).\n- Then previous and next links, with each page's title. The first page links back to the home page.\n- Then the footer.\n\n6. Narrow screens\n- Hide the outline on tablets and the page list on phones. Put both in one bar fixed at the bottom: the page list on its left half, the outline on its right half.\n- The right half shows the name of the section being read, updated by the same 20% line, and truncated with an ellipsis when it is long.\n- A tap on either half opens its list as a sheet from the bottom edge (a dialog opened with showModal()), sliding up 24px as it fades in, with no dimming behind it. Mark the current entry and scroll it into view (scrollIntoView({ block: \"center\" })).\n- A tap on an entry, the close button, outside the sheet or Esc closes it; a section link then scrolls to its heading.\n- Make the tap targets one size up from the desktop list.\n\n7. Motion\n- Under prefers-reduced-motion: reduce, turn off smooth scrolling and the header's enter and exit animations.\n\n8. When done\n- List every file and selector you changed.\n- Check four states on my own pages: the top of a page, the middle, the end, and a phone-width window.\n- Show a screenshot of each.","promptUrl":"https://x.com/Kubai087/status/2116917025348231369"},{"repo": "kubai tip 009 — floating UI kinds", "url": "https://x.com/Kubai087/status/2117314098165862612", "why": "tooltip vs cursor-tip vs popconfirm vs dialog vs drawer — decision tree + AI prompt", "stars": 0, "license": "", "date": "2026-11-03", "cat": "tips", "comment": "tooltip vs cursor-tip vs popconfirm vs dialog vs drawer — decision tree + AI prompt","prompt":"Review how my product uses floating UI (tooltips, tooltips that follow the pointer, popovers, popconfirms, drawers and dialogs) and decide which kind each case should be. Work inside my existing design system. This is about choosing the right kind, not about restyling: keep my components, colours, radii, shadows, fonts, motion and copy style.\n\n0. Start from what exists\n- Find every overlay in the product and the components behind it: tooltips, hover cards, popovers, confirm bubbles, menus that confirm, side panels, drawers, sheets, modals and dialogs.\n- For each use, note where it is, what opens it, what it holds and what happens when the user confirms.\n- Find the design system's own component for each kind. Reuse it. If two components do the same job, say so and suggest which one to keep.\n\n1. What each kind is for\n- Tooltip: adds text about what the pointer is on, such as long text that has been cut short, an icon-only button or a disabled control. Text only. If it needs actions, it becomes a popover opened by a click.\n- Tooltip that follows the pointer: keeps giving information across an area. It appears when the pointer enters, follows it, and goes when the pointer leaves. Common on charts and on other self-contained elements.\n- Popconfirm: the second check for an irreversible action on a single item, right where it was clicked. The path stays short and nothing else is interrupted.\n- Dialog: for something the user must stop and confirm or complete before going on: an action with a large impact, one that affects other people, a bulk action, or one that needs another decision first (such as who takes over the projects). Also for a short form that doesn't need anything else on the page for reference.\n- Drawer: for a long form, for work that needs the page in view to compare against, or to make better use of horizontal space. Never use a drawer to confirm something.\n- Full page: when the task is the user's main job there, or it needs a link that can be shared and survives a reload.\n\n2. Questions that settle a case\n- Can the action be undone? Then don't confirm: do it at once and offer Undo (a toast, or a way back such as a trash).\n- If it can't: is it one item of the user's own, with a button to anchor to? Popconfirm. Large impact, other people, a bulk selection, or a decision still to make? Dialog.\n- Is it a form? Short, and nothing on the page is needed for reference: dialog. Long, needs the page in view, or wants the width: drawer. The main task, or needs its own URL: a page.\n- Is the information about one element, or about wherever the pointer is inside an area? One element: tooltip. An area: tooltip that follows the pointer. Either way, does it need anything to click? Then it is a popover.\n- On touch screens there is no hover: anything shown on hover must also be reachable by a tap.\n\n3. What each kind should do\nFill in only what is missing, with the design system's existing parts.\n- Tooltip: shows on hover and on keyboard focus, after about 500ms for the first one, then at once when moving to a neighbour. Stays inside the viewport, lets the pointer through, one at a time, linked with aria-describedby.\n- Tooltip that follows the pointer: sits beside the pointer without covering it and flips near the edges of the viewport. On a chart, the guide line follows the pointer and the value snaps to the nearest data point. On touch, a tap shows the value.\n- Popconfirm: anchored to the button that opened it and grows from it. Escape or a click outside closes it, and focus goes back to that button. The confirm button names the action.\n- Dialog: the system's modal or a native dialog opened with showModal(). Keeps focus inside and Escape cancels. It says who or what is affected and what cannot be undone. Buttons name the action (\"Remove member\", not \"OK\").\n- Drawer: comes in from the edge it is attached to and leaves the page in view. Changes show up in the page behind it as they are made. Closes with Escape and a close button; focus moves into it and back out to what opened it.\n- Drawers, dialogs and pages with a form: closing with unsaved changes asks first.\n\n4. Keep the design as it is\n- Change only the kind where the current one is wrong, plus the missing behaviour from step 3.\n- Don't change colours, radii, shadows, fonts, spacing or animations, and don't add new visual patterns.\n- Keep copy as it is, except confirm buttons and the line that explains what cannot be undone.\n- If a case needs a component the system doesn't have (an undo toast, a popover), stop and ask me before adding one.\n\n5. Deliver the decisions first\n- Before changing any code, give me a table: each use, where it is, its current kind, the kind you recommend, and why in one line.\n- Mark the ones that are already right, and the ones that could fit two kinds, with what decides between them.\n- Wait for my go-ahead, then make only the changes I approve and list every file you touched.","promptUrl":"https://x.com/Kubai087/status/2117314198430757283"},{"repo":"kubai087/pro-threads","why":"MacBook PROLED XDR-style WebGL letter wallpaper + hero scenes; drop-in pro-threads web component","stars":35,"license":"MIT","date":"2026-11-02","cat":"motion","comment":"Kubai open-source WebGL thread-light heroes for dark landing pages -- live demo + embed."},{"repo": "heydamir/unslop", "why": "Claude/Codex skill that audits vibecode slop then redesigns pass-by-pass (direction → spacing/color/copy/motion); distinct remediator next to Nutlope/hallmark already in catalog.", "stars": 4894, "license": "CC-BY-4.0", "date": "2026-11-02", "cat": "skills", "comment": "Claude/Codex skill that audits vibecode slop then redesigns pass-by-pass (direction → spacing/color/copy/motion); distinct remediator next to Nutlope/hallmark already in catalog."},{"repo": "kgoedecke/doop", "why": "Open-source Paper.design alternative — multiplayer canvas where humans + agents co-design live, MCP built in.", "stars": 1467, "license": "AGPL-3.0", "date": "2026-11-02", "cat": "kits", "comment": "Open-source Paper.design alternative — multiplayer canvas where humans + agents co-design live, MCP built in."},{"repo": "GLips/Figma-Context-MCP", "why": "Framelink Figma MCP — catalog gap (other Figma MCPs present, this canonical Cursor Figma layout server was missing).", "stars": 16133, "license": "MIT", "date": "2026-11-02", "cat": "mcp", "comment": "Framelink Figma MCP — catalog gap (other Figma MCPs present, this canonical Cursor Figma layout server was missing)."},{"repo": "dickwu/apple-design-skill", "why": "Apple HIG UI/UX reviewer skill for Claude/Cursor/Codex across Flutter, Tauri, Electron, RN.", "stars": 2607, "license": "", "date": "2026-11-02", "cat": "skills", "comment": "Apple HIG UI/UX reviewer skill for Claude/Cursor/Codex across Flutter, Tauri, Electron, RN."},{"repo": "LottieFiles/motion-design-skill", "why": "LottieFiles motion principles skill — timing, easing, choreography, Disney → UI/agent films", "stars": 2783, "license": "MIT", "date": "2026-11-05", "cat": "opus", "comment": "LottieFiles motion principles skill — timing, easing, choreography, Disney → UI/agent films"},{"repo": "kzhrknt/awesome-design-md-jp", "why": "Japanese DESIGN.md pack for agents — Stitch-format brand systems with CJK typography (pair to VoltAgent/awesome-design-md).", "stars": 1000, "license": "MIT", "date": "2026-11-02", "cat": "brand", "comment": "Japanese DESIGN.md p te": "2026-11-04", "cat": "lint", "comment": "DS scanner + MCP: scores a repo 0–100 and writes fix prompts."},{"repo": "oil-oil/oil-motion", "why": "Companion to oil-ui already in catalog — ship the motion half.", "stars": 2786, "license": "MIT", "date": "2026-11-05", "cat": "motion", "comment": "Companion to oil-ui already in catalog — ship the motion half."},{"repo": "NiazMorshed2007/reanimate", "why": "Steal motion from references instead of guessing keyframes.", "stars": 1175, "license": "MIT", "date": "2026-11-05", "cat": "motion", "comment": "Steal motion from references instead of guessing keyframes."},{"repo": "bangtutorial/bang-motion", "why": "Video-feel explainers in the browser, Cursor/Claude/Codex ready.", "stars": 1074, "license": "MIT", "date": "2026-11-05", "cat": "motion", "comment": "Video-feel explainers in the browser, Cursor/Claude/Codex ready."},{"repo": "RayVelez27/instalanding.ai", "why": "Copy-paste landers with motion baked in — fast kit fuel.", "stars": 122, "license": "MIT", "date": "2026-11-05", "cat": "kits", "comment": "Copy-paste landers with motion baked in — fast kit fuel."},{"repo": "christophhdesign/open-design-system-bench", "why": "Scores DS agent-readiness — lint angle we barely cover.", "stars": 103, "license": "MIT", "date": "2026-11-05", "cat": "lint", "comment": "Scores DS agent-readiness — lint angle we barely cover."},{"repo": "pedrojaques99/visant-skills-public", "why": "Fresh anti-slop pack with motion/frontend, not another mega taste skill.", "stars": 83, "license": "MIT", "date": "2026-11-05", "cat": "skills", "comment": "Fresh anti-slop pack with motion/frontend, not another mega taste skill."},{"repo": "brendanciccone/storysync", "why": "Code-truth DS → Figma with pixel measurement, not vibes.", "stars": 75, "license": "MIT", "date": "2026-11-05", "cat": "kits", "comment": "Code-truth DS → Figma with pixel measurement, not vibes."},{"repo": "Moddingflow/better-design", "why": "DESIGN.md-first art direction — matches how you lock UI in-repo.", "stars": 46, "license": "MIT", "date": "2026-11-05", "cat": "skills", "comment": "DESIGN.md-first art direction — matches how you lock UI in-repo."}, {"repo": "kubai tip 010 — liquid glass", "url": "https://x.com/Kubai087/status/2117782193108082923", "why": "Liquid glass material tokens + rim lens — Lumno-grade surface prompt", "stars": 0, "license": "", "date": "2026-11-04", "cat": "tips", "comment": "Liquid glass material tokens + rim lens — Lumno-grade surface prompt","prompt":"Give the cards and panels in my product a liquid glass material: clear glass that takes its color from the scene behind it, reads as a thick slab at the rim, adapts to what is behind it, and keeps its text readable in light and dark mode. Work inside my existing design system. This is a change of surface, not of layout: keep my markup, spacing, radii, fonts, icons and copy.\n\n0. Start from what exists\n- Find every surface that sits over an image, a wallpaper, video or a busy background: cards, players, search bars, toolbars, menus, popovers, toasts. List them with their component and where they are.\n- Find how the product switches between light and dark mode, and where its color tokens live. The glass goes into those tokens, not into each component.\n- Leave surfaces over a plain background alone; glass over a flat color only looks gray.\n\n1. The material as tokens\nBuild it as one set of variables per state, so a surface opts in by using them. The numbers are a starting point, for a UI at its normal size.\n- Light glass, dark text (the default): tint white at 6–22% (by density, step 4); backdrop filter blur(2px) saturate(180%) brightness(1.06), so the color comes from behind and stays vivid instead of milky.\n  Edge: inset 1.5px 1.5px 1px -1px white 95%, inset -1.5px -1.5px 1px -1px white 55%, inset 0 0 0 0.5px white 30%, 0 0 0 0.5px black 6%, 0 6px 24px black 8%.\n  Inner light, on a layer inside the surface: a radial highlight from the top left (white 30% fading out by 55%), and soft inset glows just inside the rim, brighter at the top and left, a little shade at the bottom.\n- Light mode over a dark area, light text: tint rgb(16 18 22) at 10–30%; filter blur(2px) saturate(170%), then brightness(0.85); edge: a faint inset white line on top and a 0.5px dark outline.\n- Dark mode: tint rgb(20 20 24) at 16–38%; filter blur(2px) saturate(160%) brightness(0.8), which dims like a multiply with black instead of going muddy; the same edge and inner light at about a third of their strength, with a darker outline and shadow.\n- Ink, one color in fixed steps, used for everything drawn on the glass:\n  on light glass black 86% (titles, icons, times, progress), rgb(60 60 67) at 70% (secondary); mix-blend-mode multiply;\n  on dark glass white 94%, rgb(235 235 245) at 64%; mix-blend-mode plus-lighter.\n  Draw icons in the opaque color and fade the whole icon with opacity: a translucent color darkens where a shape's strokes and fills overlap.\n- A highlighted row on light glass is a lighter layer of the glass: white 42% on hover, 76% when selected, with a white stroke. Never a gray wash.\n- Register the numeric and color tokens with @property so a surface glides between states instead of jumping.\n\n2. Apply it in four declarations\nEach surface changes only these, and its markup stays as it is:\n- background: the tint.\n- backdrop-filter: the material's filter, then the rim lens (step 3) last, so the color steps fold into one pass and the bend stays crisp.\n- box-shadow: the edge.\n- color: the ink, with the blend mode on everything drawn inside.\nHover brightens the tint by about 14% instead of lifting a shadow.\n\n3. The rim lens\n- Build a displacement map for each surface: red is the sideways bend, green the vertical one, 128 is none. Only a rim bends; the middle stays flat.\n- The rim is about 44px wide on a card (min(44px, the short side / 3.5), never under 4px). For a thick slab, a point d from the edge looks inward by 1.1 × rim × (1 - d / rim)^2.6: hard at the edge, where the scene folds back on itself, easing to nothing at the rim's inner edge.\n- Draw the map for the same corner the CSS draws. If the surface uses corner-shape: superellipse(), follow that curve, not a circle, or the bend and the rim light miss each other at the corners.\n- Put it in an SVG filter with feImage (the map) and feDisplacementMap (scale = 2 × the largest offset), and add url(#id) at the end of backdrop-filter.\n- Split it into colors: three passes, red 15% further and blue 15% less, each kept to its channel with feColorMatrix and added back with screen blends. Check the corners of wide rims over busy backgrounds; lower the split where it turns into a haze.\n- Only Chromium draws url() in backdrop-filter. Check CSS.supports('backdrop-filter', 'url(#a)') and skip Firefox, which parses it and draws nothing. Everywhere else the CSS-only glass stays.\n- Wait for the map image to decode before pointing a surface at the filter, or it draws without its blur. Give every filter a unique id and its own \u003csvg\u003e. Build maps once per radius and rim width and reuse them; on resize, move the map, don't rebuild it.\n- Skip the lens on surfaces under 32px, and on surfaces with will-change or their own compositing layer (menus, animated panels), where Chrome can draw the map instead of the bent backdrop.\n\n4. Adapt to what is behind\n- For each surface, sample the background under it at a 5 × 3 grid, drop the two darkest and two brightest points, and average. Luminance is (0.299 R + 0.587 G + 0.114 B) / 255; texture is the brightest point minus the darkest.\n- Ink: in light mode, light text when the luminance is under 0.5. Keep the current ink within ±0.05 of the line so a surface never flickers at it. Dark mode is always light text. Neighbouring surfaces in one row share one decision.\n- Density (0 thin, 1 dense) = 0.55 × how close the background is to the ink's own brightness + 0.7 × texture + 0.3 × chroma. It moves the tint between its thin and dense alpha.\n- Saturation kept = 1 - 0.75 × chroma, at least 0.45, so a vivid background doesn't stain the glass.\n- Sample again when the background, the theme or a surface's position changes, and remember the last ink so the next load opens in it.\n- If the background is not an image you can read (live video, cross-origin content), pick the ink from the theme and use the dense tint.\n\n5. Let people set the tint\n- Add one setting for light mode and one for dark that scale the tint, from 0 to 1.5 (1 is the material as designed). Below 1 the brightness lift in the filter thins with it, so at 0 only the blur, the rim and the shadow are left.\n- Each theme keeps its own value; switching themes glides to that theme's value.\n\n6. Keep it accessible\n- Check text contrast on the busiest and the darkest background the product allows, at the default tint; raise density, not the ink's opacity, until it passes.\n- Respect prefers-reduced-transparency and forced colors: fall back to a solid surface in the same tint at full opacity.\n- Keep focus rings, disabled states and error colors as they are; failures keep their red.\n\n7. Deliver\n- First list the surfaces you will change, which get the lens and the color split, and which you leave solid and why.\n- Then add the tokens, the lens helper and the two settings, switch the surfaces over, and list every file you touched.\n- Don't change layout, fonts, radii or copy. If a surface would need a new component to work as glass, stop and ask me first.","promptUrl":"https://x.com/Kubai087/status/2117782337698324846"}, {"repo": "kubai tip 011 — easing curves", "url": "https://x.com/Kubai087/status/2118143759984803898", "why": "Ease tokens by role (out / in / spring / overshoot) — motion timing prompt", "stars": 0, "license": "", "date": "2026-11-05", "cat": "tips", "comment": "Ease tokens by role (out / in / spring / overshoot) — motion timing prompt","prompt":"Give the motion in my product the right easing curves, so things arrive, leave and move the way they should feel. Work inside my existing code and design system: keep what each animation does, how far it goes and what triggers it. Change how it moves over time, and its duration where that is off.\n\n0. Start from what exists\n- Find every transition and animation: CSS transitions and keyframes, animation libraries (Framer Motion, GSAP, the Web Animations API) and hand-written requestAnimationFrame loops. List each with its component, its trigger, its duration and its curve.\n- Flag the ones left on the CSS default `ease`, `linear` on something that moves, and `ease-in` on something that appears.\n\n1. The curves as tokens\nDefine them once, next to the other motion tokens, and use only these:\n- --ease-out: cubic-bezier(0, 0, .58, 1). Anything that enters: toasts, menus, popovers, dialogs, drawers.\n- --ease-out-strong: cubic-bezier(.22, 1, .36, 1). Small parts settling in right after a click: an icon, a label, a selected pill. It feels the most responsive.\n- --ease-in: cubic-bezier(.42, 0, 1, 1). Anything that leaves, and only that: a toast timing out, a dialog or drawer closing, a menu collapsing, a list item swiped away. It starts slow and leaves at full speed, so on an entrance it feels late and then stops with a bump.\n- --ease-in-out: cubic-bezier(.42, 0, .58, 1). Something that stays on screen and only changes place or size: the indicator under tabs or a segmented control, a carousel turning a page, items making room during a reorder, a sidebar resizing, smooth-scrolling to an anchor. Not for coming in: its slow start reads as lag.\n- --ease-overshoot: cubic-bezier(.34, 1.56, .64, 1). Runs about 10% past its place and comes back. Small, playful confirmations: a checkbox tick, a like, a badge count popping in, a switch knob settling. Never on a dialog, a drawer or anything larger than about 64px, and not on actions people repeat all day.\n- --ease-spring: linear(0, .32, .78, 1.04, 1.09, 1.06, 1.02, 1, .99, .99, 1). Things let go after a drag or a swipe, so they settle like an object: a bottom sheet snapping open or back, a card returning after a half swipe, pull-to-refresh springing back, a reordered item dropping into place. Prefer the animation library's own spring fed with the release velocity; use this token only where there is none, and fall back to --ease-out-strong where linear() is not supported.\n- linear: only for things that run rather than move: spinners, progress bars, marquees.\n- The CSS default `ease` is not a choice. Replace it wherever a curve was left unset.\n\n2. Durations\n- Small UI (toasts, tooltips, menus, checks): 150-250ms in, 120-200ms out. Exits are shorter than entrances.\n- Medium (dialogs, popovers with content, drawers): 250-350ms.\n- Large or full-screen (sheets, page transitions): 350-500ms. Longer feels slow.\n- Springs and overshoots: about 1.5x the plain duration, since the settle takes time.\n- Keep the durations as tokens beside the curves (--duration-sm, -md, -lg).\n\n3. Apply them by role\n- Entrances: ease-out, coming from where the thing belongs (a toast from the top edge, a menu from its trigger), over a short distance (8-24px), growing from 96% and fading in a little sooner than it moves. A light blur (about 8px) that clears as it lands is a nice touch on toasts.\n- Exits: ease-in, the same path reversed, and shorter.\n- Moves on screen: ease-in-out.\n- Parts inside something that has just appeared (its icon, its text, a count) may follow 100-200ms later on the strong ease-out, so it lands in steps rather than all at once.\n- Gestures: while the pointer or finger moves, follow it 1:1 with no easing. On release, finish on the spring, from the release velocity if the library allows.\n- Hover and press: 100-150ms ease-out. Never animate layout on hover.\n- Animate transform and opacity (filter sparingly), not top, left, width or height, which lay out and repaint every frame.\n\n4. Keep it consistent and accessible\n- One curve per role across the product. Don't tune each component by hand.\n- Respect prefers-reduced-motion: keep the opacity changes, drop movement and scale, and turn springs and overshoots into a plain 150ms fade.\n- Never make a user wait on an animation: nothing blocks input, and a new action interrupts the old animation from where it is.\n\n5. Deliver\n- First list every animation you found, its current curve and duration, and the role and curve you will give it.\n- Then add the tokens, switch each animation over, and list every file you touched.\n- Don't change what animates, how far it goes or what triggers it. If an animation has no clear role, ask me first.","promptUrl":"https://x.com/Kubai087/status/2118143923571048817"}, {"repo": "kubai tip 012 — message bubble materials", "url": "https://x.com/Kubai087/status/2118508433704169726", "why": "Six chat-bubble materials (Cirrus, pixel, Aqua, gradient, skeuomorphic, solid) with matching send, typing, and delete motion", "stars": 0, "license": "", "date": "2026-11-06", "cat": "tips", "comment": "Six chat-bubble materials (Cirrus, pixel, Aqua, gradient, skeuomorphic, solid) with matching send, typing, and delete motion","prompt":"Message bubbles with a material, and motion that follows the material: sending, a long reply coming in, and deleting one from the middle, in an AI chat. Six materials are specified below with exact values. Use them either way:\n- Rebuild: make a standalone demo of a chat thread that plays the three motions in one material, with tabs to switch between materials.\n- Retrofit: give the bubbles in my existing chat a material and this motion, inside my code and design system, keeping the message data, the components and how messages load.\nAsk me which one, and which material(s), before you start.\n\nRetrofit scope: by default, change only the bubbles: their material (sections 1 and 2) and their motion (sections 3, 4, the reply opening and words in 5, and the bubble's long press and exit in 6). Leave every icon as it is. The cursor is for the rebuild demo only. Ask me separately, one at a time, before touching each of these, and change it only if I say yes:\n- the composer: the input field and the send button;\n- the message menu: its look, its items and how it opens and closes;\n- the typing indicator: replacing it with the dot matrix in section 5.\n\n0. Start from what exists (retrofit)\n- Find the thread, the bubble component and wherever messages are added, edited or removed, and note the composer, the message menu and the typing indicator. List how the thread is laid out and scrolls, and every animation it has now.\n- Flag a thread that jumps when a message arrives or leaves, a bubble whose lines rewrap while it animates, and anything that animates top, height or margin.\n\n1. The bubble box (the same in every material)\n- Text 28px on a 38px line, letter-spacing -0.01em, padding 17px 26px, a 2px border (transparent unless the material gives it a color), radius 38px: a capsule for one line, a rounded rectangle when it wraps. Plain circular arcs only, no superellipse or corner-shape. The send button is a circle.\n- Mine on the right, theirs (the AI) on the left, 48px from the sides. Long messages wrap inside a fixed width (680px here); lay the text out at that width from the start.\n- Messages in a row from one sender form a group: 4px apart inside a group, 16px between groups. Mark each bubble single, first, middle or last, and reshape the group with a 200ms border-radius transition when a message joins or leaves:\n  - Aqua, skeuomorphic, cirrus: where two bubbles of a group meet, the corners on the sender's side close to 10px.\n  - Solid, gradient: every bubble stays round; only the last of a group gets a tail, two pseudo-elements at the bottom corner on the sender's side (shown here for mine; mirror them for theirs):\n    .bubble::before { bottom: -2px; right: -14px; width: 64px; height: 38px; background: \u003cbubble color\u003e;\n      border-bottom-left-radius: 18px 14px; border-bottom-right-radius: 3px; }\n    .bubble::after { bottom: -2px; right: -34px; width: 32px; height: 42px; background: \u003cpage background\u003e;\n      border-bottom-left-radius: 20px 24px; }\n    The blob sticks out 12px; the scoop beside it cuts it into a curl. Fade them in over 160ms when a bubble becomes the last of its group.\n\n2. The six materials\nEach one sets the paint, the type and the background (and, in the rebuild demo, the composer, the menu and the cursor). Keep them as tokens. In a retrofit, use the bubble values; take the background only if the material needs it to read (cirrus needs its sky, gradient a dark background) and ask me first. The CSS below is exact: copy it to match the look. \".me\" is my bubble, \".them\" the AI's; the base font is Inter.\n\nCirrus (light, clean): thin frosted panes with no edge and no shadow, over a blue sky.\n  .bubble { border-color: transparent; background: none; box-shadow: none;\n    backdrop-filter: blur(26px) saturate(130%); }\n  .bubble::before { content: ''; position: absolute; inset: -2px; border-radius: inherit;\n    background: var(--grain), var(--tint); }   /* text sits above it */\n  .bubble.me { --tint: rgb(46 128 232 / 0.34); color: rgb(255 255 255); }\n  .bubble.them { --tint: rgb(104 134 168 / 0.34); color: rgb(255 255 255); }\n  --grain: a 160px SVG tile, feTurbulence type=\"fractalNoise\" baseFrequency=\"0.9\" numOctaves=\"2\" stitchTiles=\"stitch\", then feColorMatrix \"0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.09 0\" (mid gray at 9%).\n  The sky: render it once, at twice the page size, and use the image. For each pixel, a ray from an eye at height 1.25, looking ahead along z with a focal length of 1.25 and slightly down (uv.y - 0.02), marches through a cloud layer: density = clamp(2.8 * fbm(p * 0.95) - 1.05 - 0.75 * p.y, 0, 1), fbm being 6 octaves of value noise (each octave x2.03, half the weight). Step 0.03 or 2.5% of the distance, up to 160 steps or until opaque. At each step with cloud, light = clamp((d - density(p + 0.25 * sun)) / 0.4, 0, 1) with the sun at normalize(-0.35, 0.75, 0.55); color = mix(rgb(0.5, 0.6, 0.74), white, 0.2 + 0.8 * light), mixed 25% toward rgb(0.9, 0.93, 0.97) by density; alpha = 0.6 * density; fade it into the sky by 1 - exp(-0.0016 * t * t). The sky behind: mix(rgb(0.66, 0.82, 0.97) at the horizon, rgb(0.15, 0.45, 0.9) overhead) by clamp(rd.y * 1.6 + 0.35, 0, 1)^0.85, plus a faint warm glow toward the sun. The result is deep blue overhead and a sea of white cumulus in the lower half. Let the image drift sideways slowly (100px each way, one sway per loop).\n  Menu: background var(--grain), rgb(70 98 134 / 0.52); backdrop-filter: blur(36px) saturate(130%); white text; Delete rgb(255 138 126).\n\nPixel (retro game): drawn in a canvas on a fixed grid of 4px cells, not with the DOM.\n  Every frame, for each cell, test the cell's center against the bubble's current shape: its position, scale, size, corners of radius 16px (4px where a group joins), and on the last of a group a stepped tail: in the bubble's own frame, with the origin at its bottom corner on the sender's side and x pointing outward, the triangle -10 \u003c= x \u003c= 14, -16 \u003c= y \u003c= 0, y \u003e= -16 + (x + 10) * 16 / 24. Cells inside are filled; cells inside with a neighbor outside are the one-cell outline.\n  Outline rgb(14 15 34); fill mine rgb(93 112 232), theirs rgb(244 243 236). Dimming mixes the fill toward the background.\n  Each cell keeps a trace = max(trace * exp(-dt / 0.06s), coverage now) and is drawn when the trace is above the 4x4 Bayer threshold for its position ((value + 0.5) / 16 for 0 8 2 10 / 12 4 14 6 / 3 11 1 9 / 15 7 13 5), so moving bubbles leave a dithered trail. A trace below 1 is drawn in its color mixed toward the background by 0.25 + 0.75 * trace, so the trail keeps its size but stays light. Scale the canvas up with image-rendering: pixelated.\n  Background: rgb(27 30 52) with 1px lines of white at 3.5% every 4px both ways.\n  Text stays in the DOM: font-family 'Pixelify Sans'; letter-spacing: 0.02em; mine color rgb(255 255 255) with text-shadow 0 4px 0 rgb(14 15 34 / 0.35); theirs color rgb(14 15 34); its position snapped to the 4px grid. Composer, menu and tabs: square corners, background rgb(244 243 236), and a stepped outline box-shadow: 0 -4px 0 rgb(14 15 34), 0 4px 0 rgb(14 15 34), -4px 0 0 rgb(14 15 34), 4px 0 0 rgb(14 15 34); the send button rgb(93 112 232).\n\nAqua (playful, nostalgic):\n  .bubble { border-color: var(--edge); background: var(--face);\n    box-shadow: inset 0 -14px 18px -8px var(--glow), inset 0 2px 2px rgb(255 255 255 / 0.5), 0 4px 8px -2px rgb(0 30 80 / 0.32);\n    font-family: 'Lucida Grande'; letter-spacing: -0.01em; }\n  .bubble.me { --face: linear-gradient(180deg, rgb(116 188 255) 0%, rgb(58 146 242) 48%, rgb(28 111 220) 54%, rgb(43 132 236) 78%, rgb(138 210 255) 100%);\n    --edge: rgb(21 80 160); --glow: rgb(160 228 255 / 0.95); color: rgb(255 255 255); text-shadow: 0 -1px 1px rgb(0 40 110 / 0.45); }\n  .bubble.them { --face: linear-gradient(180deg, rgb(253 253 254) 0%, rgb(236 238 241) 48%, rgb(220 223 228) 54%, rgb(228 231 235) 78%, rgb(251 252 253) 100%);\n    --edge: rgb(141 148 159); --glow: rgb(255 255 255 / 0.95); color: rgb(29 29 31); text-shadow: 0 1px 0 rgb(255 255 255 / 0.7); }\n  .bubble::before { content: ''; position: absolute; top: 3px; left: 16px; right: 16px; height: min(46%, 36px);\n    border-radius: 30px 30px 18px 18px; background: linear-gradient(180deg, rgb(255 255 255 / 0.92), rgb(255 255 255 / 0.12)); }\n  Background: repeating-linear-gradient(180deg, rgb(246 246 246) 0 3px, rgb(233 233 233) 3px 6px).\n\nGradient (brand):\n  .bubble.me { --grad: linear-gradient(180deg, rgb(11 127 134) 0%, rgb(13 148 136) 28%, rgb(16 163 127) 60%, rgb(31 191 143) 100%);\n    background: var(--grad) 0 calc(-1 * var(--top)) / 100% var(--thread-height); color: rgb(255 255 255); }\n  .bubble.them { background: rgb(38 38 42); color: rgb(244 244 245); }\n  .bubble { font-weight: 500; letter-spacing: -0.015em; }\n  --top is the bubble's current offset in the thread, set every frame as it moves, so each bubble shows the slice at its height and changes color as it moves up; the tail of mine shows the slice at the bubble's foot. Background rgb(0 0 0). The send button: linear-gradient(160deg, rgb(31 191 143), rgb(13 148 136) 60%, rgb(11 127 134)) border-box.\n\nSkeuomorphic (warm, tactile):\n  .bubble { font-family: 'Avenir Next'; font-weight: 500; }\n  .bubble.me { border-color: rgb(18 22 31); background: linear-gradient(180deg, rgb(72 81 100) 0%, rgb(39 48 66) 100%);\n    box-shadow: inset 0 2px 0 rgb(255 255 255 / 0.18), inset 0 2px 6px rgb(255 255 255 / 0.08), inset 0 -2px 0 rgb(0 0 0 / 0.22),\n      0 2px 4px rgb(15 23 42 / 0.18), 0 10px 22px -8px rgb(15 23 42 / 0.36);\n    color: rgb(255 255 255); text-shadow: 0 -2px 0 rgb(0 0 0 / 0.28); }\n  .bubble.them { border-color: rgb(15 23 42 / 0.14); background: linear-gradient(180deg, rgb(255 255 255) 0%, rgb(242 243 245) 100%);\n    box-shadow: inset 0 2px 0 rgb(255 255 255), inset 0 -2px 0 rgb(15 23 42 / 0.06), 0 2px 4px rgb(15 23 42 / 0.06), 0 8px 18px -8px rgb(15 23 42 / 0.18);\n    color: rgb(31 41 55); text-shadow: 0 1px 0 rgb(255 255 255); }\n  Background rgb(245 242 233).\n\nSolid (the default):\n  .bubble.me { background: rgb(10 132 255); color: rgb(255 255 255); }\n  .bubble.them { background: rgb(233 233 235); color: rgb(0 0 0); }\n  No shadow; white background.\n\n3. The thread moves as one\n- Lay the thread out from the bottom up, above the composer, and place each bubble with transform: translateY. When a message is added, removed or resized, compute every bubble's new place and let each one follow it on its own spring, from where it is now. No other bubble needs an animation of its own. If the list must stay in normal flow, do the same with FLIP.\n- Springs (response, damping): cirrus 0.5s 0.88, pixel 0.42s 0.8, aqua 0.46s 0.74, gradient 0.52s 0.92, skeuomorphic 0.34s 0.84, solid 0.42s 0.86.\n- Never animate top, height or margin, and never let two bubbles overlap.\n\n4. Send\nThe bubble rises from about 40px below its place and comes in the material's way:\n- Cirrus: clear glass that frosts over: backdrop blur and tint from 0 to full over 560ms ease-out, scale 0.94 to 1 over 420ms, fade in over 200ms.\n- Pixel: scale 0.3 to 1 over 380ms on cubic-bezier(.22, 1, .36, 1), stepping on the grid; it fades in through the dither over 200ms; text appears once it is nearly full size.\n- Aqua: jelly: scale 0.5 to 1 on a spring (response 0.5s, damping 0.5) while width and height wobble against each other, 12% apart at first and dying out in about 0.2s; never let it grow taller than 1.04 of its size, so it can't reach the message above.\n- Gradient: out of focus: blur 16px to 0 and scale 0.96 to 1 over 440ms on cubic-bezier(.22, 1, .36, 1), fade in over 300ms.\n- Skeuomorphic: like a key: scale 1.1 to 1 on a spring (response 0.36s, damping 0.55) that dips under 1 first.\n- Solid: scale 0.9 to 1 over 380ms on cubic-bezier(.22, 1, .36, 1), fade in over 120ms.\n\n5. Long reply\n- While the AI is typing, show a small dot matrix on its own, with no bubble around it: about 48px square, where the reply will start. Each material runs a small piece of physics on it, on a loop:\n  - Cirrus 6x6: warmth let out along a slow circle (one turn in 2.2s) spreading like heat: the sum of Gaussians left behind over the last second, each wider and fainter with age.\n  - Pixel 6x6: a pendulum hung from the top middle, angle 0.9 cos(2πt / 1.1s), the bob bright and the rod faint, shown as square dots in four levels.\n  - Aqua 5x5: drops on water every 0.9s, rings travelling out and dying away (an exponentially decaying cosine in radius minus time).\n  - Gradient 6x6: two equal lights orbiting their center, one turn in 1.3s, colored mint to teal across the grid.\n  - Skeuomorphic 4x4: a ball bouncing: a parabola in time between bounces (0.62s apart) and a steady drift across, turned back by the walls.\n  - Solid 5x5: a plucked string, the fundamental plus a quieter second mode at twice the frequency.\n  Write each as a smooth function of time so brightness changes continuously, never on or off. Give the moving ones motion blur by averaging each frame over a short shutter (1/30 to 1/20s). Keep the dots flat, one color per material that stands out on its background, faint at rest and fuller as they light; no gloss or bevel.\n- When the reply lands, the bubble appears where the matrix was and opens from that corner to the message's size while the matrix fades out: cirrus on a soft spring over 640ms, aqua on a spring a little past its size over 760ms, skeuomorphic on a short spring over 520ms, the others over 520 to 600ms on cubic-bezier(.22, 1, .36, 1). Clip the text, already laid out, so lines never rewrap. Hold the thread above to the opening bubble instead of the spring, so nothing overlaps.\n- The words come in one after another, starting 160ms in: rising 10px as they fade in (cirrus, 18ms apart, 360ms each), typed in at once (pixel, 26ms apart), popping up from 0.4 on cubic-bezier(.34, 1.56, .64, 1) (aqua, 16ms, 300ms), sharpening out of an 8px blur while rising 6px (gradient, 14ms, 320ms), stamped in from 1.14 (skeuomorphic, 22ms, 160ms), fading in (solid, 14ms, 240ms).\n\n6. Delete from the middle\n- A long press presses the bubble to 0.94 to 0.97, then lifts it to 1.02 to 1.04, while the others dim to 35 to 50% (gradient also blurs them 4px). The menu opens under it, on the bubble's side, with Copy, Regenerate, Read aloud and Delete (Delete in red), coming in the material's way: frosting over (cirrus), a stepped wipe from the top in five steps (pixel), a pop from 0.7 (aqua), a focus pull from a 12px blur (gradient), a short drop from 14px above on a spring (skeuomorphic), a scale from 0.88 (solid).\n- On Delete the menu leaves in 160 to 200ms ease-in and the bubble goes in the material's way: melts back to clear glass, then fades (cirrus, 420ms); breaks up into cells that vanish at once in a scattered order, with no trail (pixel, 360ms); swells to 1.14 and pops (aqua, 320ms); dissolves into a 24px blur while growing to 1.12 (gradient, 380ms); is pressed to 0.94, then drops 36px and fades, with no blur (skeuomorphic, 320ms); shrinks to 0.7 with an 8px blur (solid, 260ms).\n- Take it out of the layout as it starts to leave. The messages above settle into the gap while the ones below stay put, the one nearest the gap first, about 60ms in, and each one above it 50 to 80ms after the one below. Let each land on the message below it: when it reaches its place still moving down, flip its velocity and keep 20 to 45% of it (aqua most, gradient least), so it bounces up a little and never sinks into the one below. If the messages either side of the gap are from the same sender, they join into one group.\n\n7. Keep it right\n- Animate transform, opacity and filter only (backdrop-filter for the glass).\n- A new action interrupts the running one from where it is; nothing waits for an animation. Switching material mid-motion fades the thread out and back in the new material from wherever it is.\n- Respect prefers-reduced-motion: keep the fades, drop movement, scale and blur, hold the typing matrix on one still frame, and place the thread at once.\n- Keep the thread pinned to the bottom while messages arrive, unless the user has scrolled up.\n\n8. Deliver\n- First list what you found (retrofit) or what you will build (rebuild), and the material(s) you will use.\n- Then build it, and list every file you touched.\n- Retrofit: don't change the message data, the components' props, the way messages load or any icon, and leave the composer, the menu and the typing indicator alone unless I said yes to them. If something does not fit this plan, ask me first.","promptUrl":"https://x.com/Kubai087/status/2118508837796037053"}, {"repo": "kubai tip — shockwave halo", "url": "https://x.com/Kubai087/status/2119359092334743735", "why": "Page-lens shockwave halo with bend, chromatic split, and edge refraction — copy-paste prompt", "stars": 0, "license": "", "date": "2026-11-08", "cat": "tips", "comment": "Page-lens shockwave halo with bend, chromatic split, and edge refraction — copy-paste prompt","prompt":"Add a shockwave halo to my product: when something triggers it (by default, clicking or focusing the AI input), a faint halo of light sweeps across the page from one place and fades out, bending the page a few pixels as it passes, with a slight color split, in my dark and light modes. Build it inside my code and design system; do not change what the page does or how it looks at rest. Every value below is a default to start from, not a requirement.\n\nFirst look at my app (section 0). Then ask me these one at a time, offering the default each time, and wait for each answer:\n1. Trigger: what starts the halo (clicking or focusing the AI input, a keyboard shortcut, sending a message, the AI starting to answer, something else), and what happens if it is triggered again while one is running (restart, or ignore).\n2. Origin: where it spreads from (the AI input, a button, the bottom edge of the page, the point that was clicked, the middle of a panel), and over which area (the page's content area, one panel, the whole window). Toolbars always stay clear.\n3. Layers: the color rings (section 3) are always on; ask yes or no for each of the others: the bend (section 4), the color split, the refraction at the edges, the glints on lines and borders. The bend, the split and the refraction need the page as an image (section 6), so say what each costs on my platform.\n4. Colors: one of the four palettes in section 3, or my brand colors (then derive four rings, and a dark and a light version, from them), and which modes my app has.\n5. The input: leave my AI input as it is (the default), or turn it into the pill that springs open with a metal edge (section 1).\nThen propose how you will build it on my platform (section 6 is a starting point, not a prescription), with the cost and any fallback, and wait for my go-ahead.\n\n0. Start from what exists\n- Find the AI input, what opens or focuses it, the page container it sits in, its corner radius, any toolbars over it, and whether the app has a dark mode.\n- List what the page draws with (DOM, a canvas, a native view tree, a GPU renderer) and the platform version range: this decides how the bend can be done (section 6).\n\n1. The input (only if I chose the pill)\n- At rest: a pill 300 x 44 px, radius 22, white (dark: rgb(30 30 33)), a 1px hairline, a sparkle icon, the placeholder \"Ask AI about this project\" in 14px and a shortcut hint on the right. It sits centered on the page's content, 48px above the page's bottom.\n- On click: the pill dips to 97% for 90ms, then springs open into a card 460 x 100, radius 16, growing from its center and keeping its bottom edge where it was. Spring: progress = 1 - exp(-8t) * cos(6t) over 580ms (barely past the end, settles by the end). The card's content is laid out at its final size from the start and is revealed as it grows; it fades in from 30% of the way. Height and radius follow the same progress.\n- The open card: one line of text at 15px on a 22px line, 16px from the left, the caret first and the placeholder right after it; a hairline; then a toolbar 52px tall: a round add button, a short divider, two pickers (model, mode), and on the right a voice button and the send button, all 32px.\n- Shadow: wide, soft and far, not heavy: 0 0 0 1px rgb(15 23 42 / 0.09), 0 2px 4px rgb(15 23 42 / 0.04), 0 28px 64px -16px rgb(15 23 42 / 0.22). No focus ring; focus shows only as the caret.\n- The metal edge: a 1px border painted with a light silver gradient, linear-gradient(120deg, rgb(238 240 243), rgb(196 202 210) 28%, rgb(241 243 245) 50%, rgb(188 195 204) 74%, rgb(233 236 239)) (dark: rgb(74 79 87) to rgb(51 55 61)), with a highlight on top: conic-gradient(from \u003cangle\u003e, transparent 0 280deg, rgb(255 255 255 / 0.8) 325deg, transparent 360deg). Turn the angle from -60deg to 300deg over 900ms (ease-out) as the card opens, and fade the whole edge in and out over that time (opacity sin(pi * t), at most 0.75). Mask the gradient to the border only (mask with content-box exclude).\n- Closing: back to the pill in 320ms, ease-in-out.\n\n2. The halo's shape and timing\n- The halo is a circle that grows from the origin I chose. The defaults assume the origin is the AI input at the bottom of the page: the circle's center sits below the page, horizontally at the input's center and 650px below the page's bottom edge, so what shows is a wide arc rising from the bottom.\n- It starts with its middle at the page's bottom (radius 650) and grows by 800px over 1000ms, so it ends just past the page's top: radius = 650 + 800 * (1 - 2^(-9t)) / (1 - 2^(-9)). That is very fast at first and slow near the far edge.\n- For another origin, keep the same timing and set the start and the growth so the halo starts at the origin and ends just past the farthest edge of the area: from a point inside the area, center the circle on the point and start at a radius of 0 to 40px; from an edge, put the center beyond that edge, about two thirds of the area's width away.\n- Strength over the same time: min(1, t / 0.03) * (1 - t^2.2), so it is gone by the end and fades over its slow last stretch.\n- It starts on the trigger (40ms after the input starts opening, if it opens).\n- It stays in the area I chose: clip it to that area, with a straight edge under any toolbar and the area's own corner radius elsewhere (12px in the demo). It must never draw over a browser or app toolbar.\n\n3. The rings and the palettes\n- Across the halo's width sit four broad rings, one color each, inside to outside. With w = 110px and x = (distance from the center - radius) / w, ring i is centered at x = i - 1.5 with weight exp(-((x - c) / 0.8)^2); the color is the weighted average of the four, so neighbors blend softly. One fade covers all four: alpha = strength * exp(-1.1 * (x / 2)^2).\n- Light mode tints the page: color = mix(page, ring, alpha * 0.24) + ring * alpha * 0.24 * 0.2.\n- Dark mode adds light (screen): color = 1 - (1 - page) * (1 - ring * alpha * 0.3 * 1.5).\n- Palettes, rings inside to outside. Each is tuned twice: brighter and more saturated on dark, softer on light.\n  Aurora (blue through violet and pink to peach)\n    dark: rgb(80 140 255), rgb(160 110 255), rgb(255 110 180), rgb(255 190 140)\n    light: rgb(110 150 255), rgb(180 130 255), rgb(255 130 190), rgb(255 180 120)\n  Halo (orange through amber to gold, like low sun through a lens)\n    dark: rgb(255 150 60), rgb(255 190 70), rgb(255 225 120), rgb(255 245 210)\n    light: rgb(255 140 50), rgb(255 175 60), rgb(245 200 80), rgb(255 225 150)\n  Frost (mint and aqua with a touch of lime)\n    dark: rgb(80 220 175), rgb(70 195 225), rgb(180 240 150), rgb(235 255 245)\n    light: rgb(40 190 150), rgb(50 170 210), rgb(140 210 90), rgb(180 235 215)\n  Spark (violet into gold)\n    dark: rgb(140 100 255), rgb(200 130 255), rgb(255 200 110), rgb(255 235 170)\n    light: rgb(130 95 240), rgb(185 125 245), rgb(245 185 80), rgb(250 215 120)\n\n4. The bend\n- The whole halo bends the page as one lens, never ring by ring (ring by ring reads as water ripples). With z = x * 0.75: push = 7px * 2.33 * z * exp(-z^2), along the direction away from the circle's center; read the page at position - push. Outside the halo's middle the page stretches, inside it squeezes, over about the width of the rings and no wider.\n- Color split: at most a trace. Read red at 1.08 times the offset and blue at 0.92 times; text must stay clean.\n- The frame holds the page: fade the lens to nothing over the last 56px before the page's edge, so the edge stays straight.\n- The page's lines catch the light: where the halo passes, its rules, borders and the outlines of chips, cards and nodes brighten toward the ring color (mixed 20% toward white), at the halo's strength times exp(-1.4 * (x / 2)^2) times 0.3 on light and 0.14 on dark (a faint glint, not a redrawn border), read at their bent position so the glint follows them. Text and icons never light up. To find the lines, use a second capture of the page with every rule and border drawn white at its own width on black, and nothing else (no text, icons, pictures, fills or shadows); light the page where that capture is white, so a 1px border glints as 1px. Without a capture (a retrofit in the DOM), give each bordered element and divider a CSS variable from 0 to 1 by its distance to the halo's front each frame, and mix its border color toward the ring color by it.\n- The edge as a glass bevel: at the sides and the bottom (not under a toolbar), where the halo reaches the edge, read the last 60px of the page from up to 22px further in (22 * (1 - d/60)^2 * the halo's strength there), so content beside the edge stretches toward it. Where the halo meets the edge, add a thin line of light (exp(-d / 7)) in the ring color mixed 45% toward white.\n\n5. Rhythm\n- On the trigger: if the input opens, it dips to 97% for 90ms, springs open (580ms) and its edge highlight turns (900ms); the halo leaves 40ms after the opening starts and runs 1000ms. Without the input, the halo runs on the trigger.\n- Switching between dark and light cross-fades the halo's colors with the page; never cut.\n- Reduced motion: no bend, no split and no glints; the halo fades in and out in place at half strength over 600ms.\n- Draw only while the halo runs; nothing at rest.\n\n6. How to build it, by platform\nThese are suggestions from what worked in the demo and what each platform offers; check them against my stack and its versions, and choose what fits. The halo itself (the rings, and the glints on lines and edges) is only an overlay and works anywhere. The bend needs the page as an image to sample from.\n- Web, as in the demo: a WebGL2 canvas over the page draws everything in one fragment pass from a snapshot of the page. Cap the pixel ratio at 2; the canvas ignores pointer events and is removed or hidden at rest.\n- Web, getting the snapshot:\n  - HTML-in-Canvas (WICG): a canvas with the page as its child, drawn with drawElementImage() or uploaded as a WebGL texture, live and with real browser rendering. Behind the canvas-draw-element flag in recent Chromium and reported on by default from Chrome 157; no Firefox or Safari yet. Use it where present.\n  - SVG foreignObject libraries (html-to-image, modern-screenshot): the browser renders the clone, so it is faithful, but images and fonts must be inlined or same-origin, the root needs a background color, and backdrop-filter is unreliable. Take it once on click (tens to a few hundred ms), then animate.\n  - html2canvas (or html2canvas-pro): it re-implements CSS on a canvas, so modern effects (backdrop-filter, some gradients, oklch) may come out wrong. A last resort.\n  - Fallback without a snapshot: draw only the halo in a transparent canvas over the page (light mode: normal alpha; dark mode: mix-blend-mode: screen or plus-lighter), and skip the bend. In Chromium only, a bend is possible with backdrop-filter pointing at an SVG filter with feDisplacementMap, at a cost.\n- iOS (SwiftUI, iOS 17+): put the halo in a Metal [[stitchable]] function and apply .layerEffect(shader, maxSampleOffset: CGSize(width: 30, height: 30)) to the page view: it can sample the view at bent positions and add the color, live. Drive radius and strength from a TimelineView or an animatable value. Below iOS 17: an overlay with an AngularGradient and blur, without the bend.\n- Android (API 33+): write the shader in AGSL as a RuntimeShader with a uniform shader named for the content, and set view.setRenderEffect(RenderEffect.createRuntimeShaderEffect(shader, \"content\")) on the page's root (in Compose: Modifier.graphicsLayer { renderEffect = ...asComposeRenderEffect() }). Update its uniforms every frame. Below 33: an overlay only.\n- Flutter (Impeller): a FragmentProgram with ImageFilter.shader inside a BackdropFilter clipped to the page; the engine passes the content as sampler 0 and its size as the first vec2. Use FlutterFragCoord(), flip y on GLES, and check ImageFilter.isShaderFilterSupported, with an overlay-only fallback.\n- Rust: render the UI into an offscreen texture, then draw one fullscreen pass with the same shader ported to WGSL that samples it.\n  - wgpu by hand: render target texture with TEXTURE_BINDING usage, a fullscreen triangle, uniforms in one buffer.\n  - Bevy: a custom post-processing node; call post_process_write() on the ViewTarget to get the source and destination textures, as in Bevy's custom post-processing example.\n  - egui or iced on wgpu: render the frame into a texture through the renderer's wgpu callback and composite with the shader; their widgets cannot sample what is under them by themselves.\n- Electron and Tauri: the web route; Electron can also take a snapshot with webContents.capturePage().\n\n7. Check\n- Dark and light, in the colors I chose: the text under the halo stays readable and unsplit; the halo never shows on a toolbar; the area's corners stay clean; the bend is no wider than the rings.\n- The trigger and the origin are the ones I chose, and the page works exactly as before.\n- It runs only while the halo is visible and costs nothing at rest.","promptUrl":"https://x.com/Kubai087/status/2119359328725635162"}, {"repo": "Vincentwei1021/video-shotcraft", "why": "Remotion AI video skill — 124 shot recipes, motion previews, beat sync, CapCut/JianYing export for product promos.", "stars": 17132, "license": "Apache-2.0", "date": "2026-11-05", "cat": "opus", "comment": "Remotion AI video skill — 124 shot recipes, motion previews, beat sync, CapCut/JianYing export for product promos."}, {"repo": "chunkithwang/design-playful-app-icons", "why": "Agent skill for bold playful app ico function currentStyle() {
  return document.documentElement.getAttribute("data-style") === "award" ? "award" : "classic";
}

function syncStyleControls(style) {
  document.querySelectorAll(".digest-style").forEach((group) => {
    group.querySelectorAll("[data-style-value]").forEach((btn) => {
      const on = btn.getAttribute("data-style-value") === style;
      btn.setAttribute("aria-checked", on ? "true" : "false");
      btn.tabIndex = on ? 0 : -1;
    });
  });
}

function applyStyle(style, persist) {
  const next = style === "award" ? "award" : "classic";
  document.documentElement.setAttribute("data-style", next);
  syncStyleControls(next);
  if (persist) {
    try { localStorage.setItem(STYLE_KEY, next); } catch (_) {}
    if (next === "award") {
      document.querySelectorAll(".cat").forEach((el) => {
        el.style.animation = "none";
        void el.offsetWidth;
        el.style.animation = "";
      });
    }
  }
}

applyStyle(currentStyle(), false);

(function restoreSort() {
  try {

function openCat(id) {

  searchEl.value = "";

  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
  document.body.classList.add("modal-open");
  closeBtn.focus({ preventScroll: true });
}

  modal.classList.remove("open");
