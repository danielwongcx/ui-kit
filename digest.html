  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {

    color: var(--ink);
    background:

      radial-gradient(ellipse 60% 40% at 90% 10%, rgba(255,255,255,0.5), transparent 50%),

    background-attachment: fixed;
    padding: 40px 20px 80px;

  .wrap {

    margin: 0 auto;
  }
  header {

    margin-bottom: 36px;
  }
  header h1 {
    font-size: 1.55rem;
    font-weight: 650;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px 22px;
    margin: 0 auto 8px;
    max-width: 640px;
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 22px 16px; }
  }
  .cat {
    appearance: none;
    border: none;
    background: transparent;
    padding: 0;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    font: inherit;
    color: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .tile {
    width: 112px;
    height: 112px;
    border-radius: var(--radius);
    background: linear-gradient(145deg, #fffefb, var(--tile));
    box-shadow:
      10px 12px 24px var(--shadow-dark),
      -8px -8px 20px var(--shadow-light),
      inset 0 1px 0 rgba(255,255,255,0.95);
    display: grid;
    place-items: center;
    transition:
      transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1),
      box-shadow 0.28s ease,
      background 0.28s ease;
    position: relative;
  }
  .cat:hover .tile {
    transform: translateY(-4px) scale(1.03);
    box-shadow:
      12px 16px 28px var(--shadow-dark),
      -10px -10px 22px var(--shadow-light),
      inset 0 1px 0 rgba(255,255,255,0.95);
  }
  .cat:active .tile,
  .cat.is-active .tile {
    transform: translateY(2px) scale(0.97);
    background: linear-gradient(145deg, #ebe4d8, #f4efe6);
    box-shadow:

      inset -5px -5px 12px var(--shadow-light),
      0 1px 2px rgba(255,255,255,0.5);
  }
  .cat.is-active .tile::after {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: calc(var(--radius) + 3px);
    border: 2px solid color-mix(in srgb, var(--hue) 55%, transparent);
    pointer-events: none;
    animation: ringIn 0.35s ease;
  }
  @keyframes ringIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }
  .icon {
    width: 56px;
    height: 56px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.12));
    transition: transform 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  .cat:hover .icon { transform: scale(1.08) rotate(-3deg); }
  .cat.is-active .icon { transform: scale(0.95); }
  .cat-label {
    font-size: 0.92rem;
    font-weight: 560;
    text-align: center;
    line-height: 1.2;
  }
  .cat-meta {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: -8px;

  .panel {
    margin-top: 40px;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transform: translateY(12px);
    transition:
      max-height 0.55s cubic-bezier(0.22, 1, 0.36, 1),
      opacity 0.4s ease,
      transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .panel.open {
    max-height: 20000px;
    opacity: 1;
    transform: translateY(0);
  }
  .panel-inner {
    background: linear-gradient(160deg, #fffefb, #f5f0e8);

    padding: 22px 20px 12px;

      -8px -8px 22px var(--shadow-light),

  .panel-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    padding: 0 4px;

  .panel-head h2 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 650;
  }
  .panel-head .hint {
    color: var(--muted);
    font-size: 0.85rem;
  }
  .search {
    width: 100%;
    margin-bottom: 14px;
    padding: 12px 16px;
    border: none;
    border-radius: 14px;
    background: #efe9df;
    box-shadow:
      inset 4px 4px 10px rgba(160,140,110,0.35),
      inset -3px -3px 8px rgba(255,255,255,0.8);
    font: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    outline: none;
  }
  .search::placeholder { color: #9a9288; }
  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    display: block;
    padding: 14px 16px;
    border-radius: 16px;
    background: #faf7f2;
    box-shadow:
      4px 5px 12px rgba(160,140,110,0.22),
      -3px -3px 8px rgba(255,255,255,0.85);
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.25s ease;
    animation: cardIn 0.4s ease both;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow:
      6px 8px 16px rgba(160,140,110,0.28),
      -4px -4px 10px rgba(255,255,255,0.9);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card .name {
    font-weight: 600;
    font-size: 0.98rem;
    color: #1a5fb4;
    word-break: break-all;
  }
  .card .why {
    margin: 6px 0 8px;
    font-size: 0.9rem;
    line-height: 1.4;
    color: #3a3632;
  }
  .card .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 28px 12px;
    font-size: 0.95rem;
  }
  .back-hint {
    text-align: center;
    margin-top: 18px;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>

const grid = document.getElementById("grid");
const panel = document.getElementById("panel");
const listEl = document.getElementById("list");
const emptyEl = document.getElementById("empty");
const searchEl = document.getElementById("search");
const titleEl = document.getElementById("panel-title");
const countEl = document.getElementById("panel-count");

let active = null;

CATS.forEach((c) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "cat";
  btn.dataset.id = c.id;
  btn.style.setProperty("--hue", c.hue);
  btn.setAttribute("role", "option");
  btn.innerHTML = `<span class="tile">${ICONS[c.id]}</span>
    <span class="cat-label">${c.label}</span>
    <span class="cat-meta">${COUNTS[c.id]} repos</span>`;
  btn.addEventListener("click", () => toggle(c.id));
  grid.appendChild(btn);
});

function toggle(id) {
  if (active === id) {
    active = null;
    panel.classList.remove("open");
    document.querySelectorAll(".cat").forEach(b => b.classList.remove("is-active"));
    return;
  }
  active = id;
  document.querySelectorAll(".cat").forEach(b => b.classList.toggle("is-active", b.dataset.id === id));
  const cat = CATS.find(c => c.id === id);
  titleEl.textContent = cat.label;
  searchEl.value = "";
  renderList();
  panel.classList.add("open");
  requestAnimationFrame(() => {
    panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
}

function renderList() {
  const q = (searchEl.value || "").trim().toLowerCase();
  const items = REPOS
    .filter(r => r.cat === active)
    .filter(r => !q || (r.repo + " " + r.why + " " + (r.license||"")).toLowerCase().includes(q))
    .sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.stars||0) - (a.stars||0));

  countEl.textContent = items.length + " shown · " + COUNTS[active] + " total";
  listEl.innerHTML = "";
  emptyEl.hidden = items.length > 0;

  items.forEach((r, i) => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.className = "card";
    a.href = "https://github.com/" + r.repo;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.style.animationDelay = (Math.min(i, 24) * 0.03) + "s";
    const stars = r.stars != null ? r.stars + "★" : "—";
    const lic = r.license ? r.license : "no license noted";
    a.innerHTML = `<div class="name">${escapeHtml(r.repo)}</div>
      <div class="why">${escapeHtml(r.why)}</div>
      <div class="meta"><span>${escapeHtml(String(stars))}</span><span>${escapeHtml(r.date||"")}</span><span>${escapeHtml(lic)}</span></div>`;
    li.appendChild(a);
    listEl.appendChild(li);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

searchEl.addEventListener("input", () => { if (active) renderList(); });
