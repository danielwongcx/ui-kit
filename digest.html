<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Repo Scout — Digest Catalog</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem("repo-scout-digest-style");
    document.documentElement.setAttribute("data-style", saved === "award" ? "award" : "classic");
  } catch (e) {
    document.documentElement.setAttribute("data-style", "classic");
  }
})();
</script>
<style>
  :root {
    --bg: #efe9df;
    --bg2: #e8e1d5;
    --tile: #f7f3ec;
    --ink: #2a2a2a;
    --muted: #6b6560;
    --shadow-dark: rgba(160, 140, 110, 0.45);
    --shadow-light: rgba(255, 255, 255, 0.9);
    --radius: 28px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html { background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--ink);
    background: transparent;
    padding: 0;
  }
  /* Fixed wash lives on a pseudo, not background-attachment on body.
     That property is an ancestor of the sticky bar and stops it pinning.
     Page padding is on .wrap so the in-flow header starts at the scrollport top. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 80% 50% at 10% 90%, rgba(90,120,70,0.08), transparent 55%),
      radial-gradient(ellipse 60% 40% at 90% 10%, rgba(255,255,255,0.5), transparent 50%),
      linear-gradient(160deg, #f3eee6 0%, var(--bg) 45%, var(--bg2) 100%);
  }
  body.modal-open { overflow: hidden; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 40px 20px 80px; }
  .wrap > header { text-align: center; margin-bottom: 10px; }
  .wrap > header h1 {
    font-size: 1.55rem; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 8px;
  }
  .wrap > header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 28px 22px; margin: 0 auto 8px; max-width: 640px;
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 22px 16px; }
  }
  .cat {
    appearance: none; border: none; background: transparent; padding: 0;
    cursor: pointer; display: flex; flex-direction: column; align-items: center;
    gap: 12px; font: inherit; color: inherit; -webkit-tap-highlight-color: transparent;
  }
  .tile {
    width: 112px; height: 112px; border-radius: var(--radius);
    background: linear-gradient(145deg, #fffefb, var(--tile));
    box-shadow:
      10px 12px 24px var(--shadow-dark),
      -8px -8px 20px var(--shadow-light),
      inset 0 1px 0 rgba(255,255,255,0.95);
    display: grid; place-items: center;
    transition: transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1), box-shadow 0.28s ease, background 0.28s ease;
    position: relative;
  }
  .cat:hover .tile {
    transform: translateY(-4px) scale(1.03);
    box-shadow:
      12px 16px 28px var(--shadow-dark),
      -10px -10px 22px var(--shadow-light),
      inset 0 1px 0 rgba(255,255,255,0.95);
  }
  .cat:active .tile,
  .cat.is-active .tile {
    transform: translateY(2px) scale(0.97);
    background: linear-gradient(145deg, #ebe4d8, #f4efe6);
    box-shadow:
      inset 6px 6px 14px var(--shadow-dark),
      inset -5px -5px 12px var(--shadow-light),
      0 1px 2px rgba(255,255,255,0.5);
  }
  .cat.is-active .tile::after {
    content: ""; position: absolute; inset: -3px;
    border-radius: calc(var(--radius) + 3px);
    border: 2px solid color-mix(in srgb, var(--hue) 55%, transparent);
    pointer-events: none; animation: ringIn 0.35s ease;
  }
  @keyframes ringIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }
  .icon {
    width: 56px; height: 56px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.12));
    transition: transform 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  .cat:hover .icon { transform: scale(1.08) rotate(-3deg); }
  .cat.is-active .icon { transform: scale(0.95); }
  .cat-label { font-size: 0.92rem; font-weight: 560; text-align: center; line-height: 1.2; }
  .cat-meta { font-size: 0.75rem; color: var(--muted); margin-top: -8px; }

  .modal {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    visibility: hidden; pointer-events: none;
  }
  .modal.open { visibility: visible; pointer-events: auto; }
  .backdrop {
    position: absolute; inset: 0;
    background: rgba(42, 36, 28, 0.42);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    transition: opacity 0.28s ease;
  }
  .modal.open .backdrop { opacity: 1; }
  .sheet {
    position: relative; z-index: 1;
    width: min(640px, 100%);
    max-height: min(86vh, 820px);
    display: flex; flex-direction: column;
    background: linear-gradient(160deg, #fffefb, #f5f0e8);
    border-radius: 24px;
    box-shadow:
      16px 24px 48px rgba(80, 60, 40, 0.35),
      -6px -6px 20px rgba(255,255,255,0.5),
      inset 0 1px 0 rgba(255,255,255,0.9);
    transform: translateY(28px) scale(0.96);
    opacity: 0;
    transition:
      transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
      opacity 0.3s ease;
    overflow: hidden;
  }
  .modal.open .sheet {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  .sheet-head {
    display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap;
    gap: 12px; padding: 20px 20px 12px; flex-shrink: 0;
  }
  .sheet-head h2 { margin: 0; font-size: 1.2rem; font-weight: 650; }
  .sheet-head .sub { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; }
  .close {
    appearance: none; border: none; cursor: pointer;
    width: 40px; height: 40px; border-radius: 14px; flex-shrink: 0;
    background: #efe9df;
    box-shadow:
      4px 5px 10px rgba(160,140,110,0.3),
      -3px -3px 8px rgba(255,255,255,0.85);
    font-size: 1.25rem; line-height: 1; color: var(--ink);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .close:hover { transform: scale(1.05); }
  .close:active {
    transform: scale(0.95);
    box-shadow: inset 3px 3px 8px rgba(160,140,110,0.35), inset -2px -2px 6px rgba(255,255,255,0.8);
  }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px;
    padding: 0 20px 14px; flex-shrink: 0;
  }
  .search {
    flex: 1 1 160px; min-width: 140px;
    padding: 11px 14px; border: none; border-radius: 14px;
    background: #efe9df;
    box-shadow:
      inset 4px 4px 10px rgba(160,140,110,0.35),
      inset -3px -3px 8px rgba(255,255,255,0.8);
    font: inherit; font-size: 0.92rem; color: var(--ink); outline: none;
  }
  .search::placeholder { color: #9a9288; }
  .sort {
    flex: 0 0 auto;
    padding: 11px 14px; border: none; border-radius: 14px;
    background: #efe9df;
    box-shadow:
      4px 5px 10px rgba(160,140,110,0.28),
      -3px -3px 8px rgba(255,255,255,0.85);
    font: inherit; font-size: 0.88rem; color: var(--ink);
    cursor: pointer; outline: none;
  }
  .sheet-body {
    overflow-y: auto; padding: 0 16px 20px;
    -webkit-overflow-scrolling: touch;
  }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .card {
    display: block; padding: 14px 16px; border-radius: 16px;
    background: #faf7f2;
    box-shadow:
      4px 5px 12px rgba(160,140,110,0.22),
      -3px -3px 8px rgba(255,255,255,0.85);
    text-decoration: none; color: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    animation: cardIn 0.4s ease both;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow:
      6px 8px 16px rgba(160,140,110,0.28),
      -4px -4px 10px rgba(255,255,255,0.9);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card .name {
    font-weight: 600; font-size: 0.98rem; color: #1a5fb4; word-break: break-all;
  }
  .card .comment {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    background: #efe9df;
    box-shadow:
      inset 2px 2px 6px rgba(160,140,110,0.22),
      inset -2px -2px 5px rgba(255,255,255,0.7);
  }
  .card .comment-body {
    margin: 0;
    font-size: 0.92rem;
    line-height: 1.45;
    color: #3a3632;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .meta {
    display: flex; flex-wrap: wrap; gap: 8px 14px;
    margin-top: 10px; font-size: 0.78rem; color: var(--muted);
  }
  .card a.name {
    display: block;
    text-decoration: none;
  }
  .prompt-peek {
    margin: 8px 0 0;
    font-size: 0.75rem;
    line-height: 1.4;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .copy-prompt {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 10px;
    min-width: 7.6rem;
    min-height: 32px;
    padding: 6px 12px;
    border: none;
    border-radius: 12px;
    background: var(--tile);
    color: var(--muted);
    font: inherit;
    font-size: 0.75rem;
    font-weight: 650;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow:
      3px 3px 7px rgba(160,140,110,0.28),
      -2px -2px 5px var(--shadow-light);
    transition: box-shadow 0.15s ease, color 0.15s ease;
  }
  .copy-prompt:hover {
    color: var(--ink);
    box-shadow:
      4px 4px 9px rgba(160,140,110,0.32),
      -2px -2px 6px rgba(255,255,255,0.95);
  }
  .copy-prompt:active {
    color: var(--ink);
    box-shadow:
      inset 2px 2px 5px rgba(160,140,110,0.32),
      inset -1px -1px 3px rgba(255,255,255,0.8);
  }
  .copy-prompt.is-copied { color: #1e6851; }
  .card a.name:focus-visible,
  .copy-prompt:focus-visible {
    outline: 2px solid #1a5fb4;
    outline-offset: 3px;
  }
  .empty {
    text-align: center; color: var(--muted); padding: 36px 12px; font-size: 0.95rem;
  }

  html:not([data-style="award"]) .kicker,
  html:not([data-style="award"]) .folio,
  html:not([data-style="award"]) .cat-sub,
  html:not([data-style="award"]) .leader,
  html:not([data-style="award"]) .award-br { display: none; }
  .style-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px 12px;
    position: sticky;
    top: var(--site-header-h, 56px);
    z-index: 40;
    padding: 2px 0 14px;
    background: color-mix(in srgb, #efe9df 92%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .digest-style {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: stretch;
    flex: 0 0 auto;
    padding: 2px;
    border-radius: 999px;
    background: #efe9df;
    box-shadow:
      inset 3px 3px 7px rgba(160,140,110,0.32),
      inset -2px -2px 6px rgba(255,255,255,0.85);
  }
  .digest-style::before {
    content: "";
    position: absolute;
    z-index: 0;
    top: 2px;
    bottom: 2px;
    left: 2px;
    width: calc(50% - 2px);
    border-radius: 999px;
    background: linear-gradient(145deg, #fffefb, #f7f3ec);
    box-shadow:
      2px 2px 5px rgba(160,140,110,0.28),
      -1px -1px 4px rgba(255,255,255,0.9);
    transition: left 0.4s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s ease, box-shadow 0.3s ease;
  }
  .style-opt {
    position: relative;
    z-index: 1;
    appearance: none;
    border: 0;
    background: transparent;
    color: #6b6560;
    font: inherit;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.01em;
    line-height: 1.2;
    min-height: 26px;
    min-width: 0;
    padding: 3px 10px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    touch-action: manipulation;
  }
  .home-find {
    position: relative;
    flex: 1 1 220px;
    max-width: 440px;
    min-width: 0;
  }
  .global-search { width: 100%; }
  body.is-searching .global-search { padding-right: 36px; }
  .global-search::-webkit-search-cancel-button,
  .global-search::-webkit-search-decoration {
    -webkit-appearance: none;
    appearance: none;
    display: none;
  }
  .global-search:focus-visible {
    outline: 2px solid #1e6851;
    outline-offset: 2px;
  }
  .clear-q {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    appearance: none;
    border: none;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
  }
  .clear-q:hover { color: var(--ink); }
  .clear-q:focus-visible {
    outline: 2px solid #1e6851;
    outline-offset: 1px;
  }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .home-results {
    display: none;
    max-width: 720px;
    margin: 2px auto 0;
  }
  body.is-searching .grid { display: none; }
  body.is-searching .home-results { display: block; }
  body.is-searching .lede-hint { display: none; }
  .results-meta {
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .home-results .list { gap: 10px; }
  .hit {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
      "cat meta"
      "name name"
      "why why";
    gap: 3px 12px;
    padding: 12px 14px;
    border-radius: 16px;
    background: #faf7f2;
    box-shadow:
      4px 5px 12px rgba(160,140,110,0.22),
      -3px -3px 8px rgba(255,255,255,0.85);
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .hit:hover {
    transform: translateY(-2px);
    box-shadow:
      6px 8px 16px rgba(160,140,110,0.28),
      -4px -4px 10px rgba(255,255,255,0.9);
  }
  .hit:focus-visible {
    outline: 2px solid #1e6851;
    outline-offset: 2px;
  }
  .hit-cat {
    grid-area: cat;
    align-self: center;
    min-width: 0;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--hue, var(--muted)) 72%, #2a2a2a);
  }
  .hit-meta {
    grid-area: meta;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0 10px;
    font-size: 0.75rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .hit-name {
    grid-area: name;
    font-weight: 600;
    font-size: 0.95rem;
    color: #1a5fb4;
    word-break: break-word;
  }
  .hit-why {
    grid-area: why;
    font-size: 0.86rem;
    line-height: 1.4;
    color: #3a3632;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .style-opt[aria-checked="true"] { color: #2a2a2a; }
  .style-opt:focus-visible {
    outline: 2px solid #1e6851;
    outline-offset: 2px;
  }
  .sheet-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    margin-left: auto;
  }
  .cat:focus-visible {
    outline: 2px solid #1e6851;
    outline-offset: 4px;
    border-radius: 18px;
  }


  /* Award — editorial index. Classic rules above stay the default. */
  html[data-style="award"] {
    --bg: #e7e1d4;
    --ink: #1c1914;
    --muted: #5c564c;
    --paper: #f7f3ea;
    --line: rgba(28, 25, 20, 0.14);
    --signal: #8c3014;
    --serif: "Iowan Old Style", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, "Times New Roman", "Liberation Serif", "DejaVu Serif", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Liberation Sans", sans-serif;
    --site-ink: #1c1914;
    --site-muted: #5c564c;
    --site-line: rgba(28, 25, 20, 0.12);
    --site-bar-bg: color-mix(in srgb, #e7e1d4 88%, transparent);
    --site-pill: #f7f3ea;
    --site-accent: #8c3014;
    background: var(--bg);
    color-scheme: light;
  }
  html[data-style="award"] body {
    font-family: var(--sans);
    color: var(--ink);
    background: transparent;
  }
  html[data-style="award"] body::before {
    background:
      radial-gradient(ellipse 50% 42% at 100% 0%, rgba(140, 48, 20, 0.09), transparent 60%),
      radial-gradient(ellipse 42% 36% at 0% 100%, rgba(31, 92, 72, 0.07), transparent 62%),
      linear-gradient(180deg, #ebe6da 0%, #e7e1d4 38%, #ddd4c4 100%);
  }
  html[data-style="award"] ::selection {
    background: #1c1914;
    color: #f7f3ea;
  }
  html[data-style="award"] .wrap {
    display: flex;
    flex-direction: column;
    max-width: 1120px;
    padding: 0 clamp(18px, 4vw, 56px) 108px;
  }
  html[data-style="award"] .style-bar { order: 0; }
  html[data-style="award"] .mast { order: 1; }
  html[data-style="award"] .grid { order: 2; }

  html[data-style="award"] .style-bar {
    justify-content: space-between;
    align-items: center;
    margin: 0 calc(-1 * clamp(18px, 4vw, 56px));
    padding: 8px clamp(18px, 4vw, 56px);
    background: rgba(235, 230, 218, 0.94);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  html[data-style="award"] .digest-style {
    background: transparent;
    border: 1px solid rgba(28, 25, 20, 0.22);
    box-shadow: none;
  }
  html[data-style="award"] .digest-style::before {
    left: 50%;
    background: #1c1914;
    box-shadow: none;
  }
  html[data-style="award"] .style-opt {
    font-size: 10px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: #5c564c;
    padding: 3px 9px;
  }
  html[data-style="award"] .style-opt[aria-checked="true"] { color: #f7f3ea; }
  html[data-style="award"] .style-opt:focus-visible {
    outline-color: var(--signal);
  }

  html[data-style="award"] .mast {
    position: relative;
    text-align: left;
    margin: 0 0 28px;
    padding: 36px 0 18px;
    min-height: clamp(240px, 34vw, 380px);
  }
  html[data-style="award"] .kicker {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin: 0 0 28px;
    font-family: var(--sans);
    font-size: 0.72rem;
    font-weight: 650;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    position: relative;
    z-index: 1;
  }
  html[data-style="award"] .mast h1 {
    position: relative;
    z-index: 1;
    margin: 0;
    max-width: 8ch;
    font-family: var(--serif);
    font-weight: 500;
    font-style: italic;
    font-size: clamp(4.4rem, 11vw, 8.6rem);
    letter-spacing: -0.045em;
    line-height: 0.84;
    color: var(--ink);
  }
  html[data-style="award"] .h-scout,
  html[data-style="award"] .h-sep { display: none; }
  html[data-style="award"] .lede {
    position: relative;
    z-index: 1;
    margin: 22px 0 0;
    max-width: 28rem;
    font-size: 1.08rem;
    line-height: 1.5;
    color: var(--muted);
  }
  html[data-style="award"] .lede-hint { display: none; }
  html[data-style="award"] .folio {
    display: block;
    position: absolute;
    right: -0.02em;
    top: 4.6rem;
    z-index: 0;
    margin: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(8rem, 23vw, 16.5rem);
    line-height: 0.78;
    letter-spacing: -0.07em;

s production engineering skill pack — lifecycle slash commands + quality gates for Cursor/Claude/Codex.", "stars": 111007, "license": "MIT", "date": "2026-10-27", "cat": "code", "comment": "25 production engineering skills + /spec→/ship lifecycle commands for Cursor/Claude/Codex."}, {"repo": "vibrant.design", "url": "https://vibrant.design/", "why": "Curated website, section, launch-video and UI inspiration from the best of the internet.", "stars": 0, "license": "", "date": "2026-10-27", "cat": "web", "comment": "Curated website, section, launch-video and UI inspiration from the best of the internet."}, {"repo": "detail.design", "url": "https://detail.design/", "why": "Curated interface craft examples — micro-interactions, type, motion, a11y, copy — where craft lives.", "stars": 0, "license": "", "date": "2026-10-28", "cat": "web", "comment": "Curated interface craft examples — micro-interactions, type, motion, a11y, copy — where craft lives."}, {"repo": "detaildotdesign/skill", "why": "Official detail.design agent skill: micro-interactions + polish rules from 120+ real examples for Cursor/Claude/Codex.", "stars": 68, "license": "MIT", "date": "2026-10-28", "cat": "skills", "comment": "Official detail.design agent skill: micro-interactions + polish rules from 120+ real examples for Cursor/Claude/Codex."}, {"repo": "kubai tip 001 — tactile buttons", "url": "https://x.com/Kubai087/status/2114378773655326873", "why": "Copy-paste prompt for skeuomorphic buttons (5 variants, material layers, press feel) from Kubai’s 999 vibe-tips series.", "stars": 0, "license": "", "date": "2026-10-25", "cat": "tips", "comment": "Copy-paste prompt for skeuomorphic buttons (5 variants, material layers, press feel) from Kubai’s 999 vibe-tips series.","prompt":"Define a tactile, skeuomorphic Button component with five variants, from\nstrongest to weakest: primary, secondary, tertiary, ghost, text.\nIf the project already has a component library or design system, do not\nadd a new component: restyle its existing Button through its own variant\nand token system, and keep its API, props and accessibility as they are.\nOtherwise create one reusable Button with `variant` and `size` props.\n\nStyle: calm and precise, like the Lumno browser extension and the Cloudflare\ndashboard. Neutral grays only, no brand hues. Lit from straight above.\nNo glossy Web 2.0 shine, no glow, no large blur.\n\nVariants:\n1. primary   - near-black slate face (#404859 -\u003e #273042), white label\n2. secondary - raised white key (#FFFFFF -\u003e #F4F5F7), dark gray label\n3. tertiary  - soft gray key (#F3F4F6 -\u003e #E7E9EC), dark gray label\n4. ghost     - no face at rest; faint gray fill on hover; a recessed well\n               when pressed\n5. text      - gray label with a thin underline and an arrow that nudges\n               right on hover\n\nEvery filled variant is the same five material layers; only the values\nchange, so define them once as tokens and let each variant set its own:\n1. Face: 180deg linear gradient, top 6-8% lighter than bottom.\n2. Edge: 1px solid border one step darker than the bottom of the face\n   (primary #12161F, secondary rgba(15,23,42,.14), tertiary rgba(15,23,42,.1)).\n3. Top highlight: inset 0 1px 0 white (18% on slate, 85-100% on light\n   faces). Put every inset layer in the button's own box-shadow, before the\n   drop layers, never on a pseudo-element overlay: inset shadows on the\n   element follow the inner radius (outer radius minus border), so the\n   corners line up in every state.\n4. Bottom shade: inset 0 -1px 0 black (22% on slate, 6% on light faces).\n5. Drop shadow in two layers: a tight contact shadow 0 1px 2px plus a soft\n   lift 0 4px 10px -3px (18% and 28% on slate, about a third of that on\n   light faces).\n\nStates (hover, pressed/active, focus-visible, disabled):\n- Hover: face one step lighter; the lift grows to 0 8px 16px -5px.\n- Pressed: translateY(1px); flip the gradient (darker on top); the outer\n  shadow collapses to 0 1px 1px; the top highlight becomes an inner shadow,\n  inset 0 1px 2px black (40% on slate, 12-16% on light faces). Light faces\n  keep a 1px white line below, 0 1px 0 rgba(255,255,255,.9), like a key\n  pressed into paper.\n- Give rest and pressed the same number of inset layers (pad with\n  inset 0 0 0 transparent) so the shadow animates instead of jumping.\n- Focus-visible and disabled follow the library's existing conventions.\n- Timing: 120ms for transform, 140ms for shadows, 160ms for colors.\n\nSizes: all values above are for the 14px label size: height 40px,\npadding 0 18px, radius 10px, label weight 600, optional 16px leading icon.\nOn the slate face add a label text-shadow 0 -1px 0 rgba(0,0,0,.28).\nScale the material with the type, never keep it at fixed pixels: express\nevery length (height, padding, radius, border, icon, the 1px press offset,\nand every shadow offset, blur and spread) as a multiple of a size unit\nu = label size / 14. Provide two sizes: md (14px label, u = 1px) and\nlg (16px label, u = 16/14 px, so height 45.7px, radius 11.4px, lift shadow\n0 4.6px 11.4px -3.4px).","promptUrl":"https://x.com/Kubai087/status/2114378773655326873"}, {"repo": "kubai tip 002 — cascade safe zone", "url": "https://x.com/Kubai087/status/2114729985143677258", "why": "Nested-menu prompt with triangle safe-zone + open/close delays so submenus don’t vanish on diagonal moves.", "stars": 0, "license": "", "date": "2026-10-26", "cat": "tips", "comment": "Nested-menu prompt with triangle safe-zone + open/close delays so submenus don’t vanish on diagonal moves.","prompt":"Define a cascading (nested) menu component that keeps its submenus steady: a safe zone plus three delays, so submenus open on purpose, survive diagonal moves toward them, and do not vanish on a brief slip out of the menu. If the project already has a menu or dropdown component, build this into its existing submenu logic and keep its API, keyboard support and accessibility as they are. Otherwise create one reusable CascadeMenu:\n\nProps: an anchor (the trigger button that opens it on click) and a tree of items, each { label, icon?, href?, children? }. An item with children is a folder row; one without is a plain row that navigates on click.\nEach level shows its folder's name as a small title above its rows.\nKeyboard: arrow keys move through rows, Right/Enter opens a folder, Left goes back a level, Escape closes everything and returns focus to the anchor. Use menu / menuitem roles and aria-expanded on folder rows.\nBehavior, with the values to use:\n\nOpen delay: hovering a row schedules it to take effect after 220ms: a folder row opens its submenu, a plain row closes any deeper submenu. Leaving the row before then cancels it. Touch input acts at once.\nSafe zone: while a submenu is open, build a triangle from the pointer's previous position to the two corners of the submenu's near edge (the left edge's top and bottom for a submenu on the right). Track the last two pointermove positions and use the older one as the apex, so the triangle never collapses onto the current point. If the pointer is inside that triangle and within the parent's last min(90px, max(56px, 43% of the parent width)) toward the submenu, it is on its way there: rows it crosses must not highlight or open their own submenus.\nSafe window: a row hovered inside the safe zone does not switch the submenu right away. Recheck every 80ms; switch once the pointer leaves the zone, or when 1200ms have passed since the hover began, so a pointer that simply stops there still gets its new submenu.\nClose delay: when the pointer leaves the anchor, every open level and the safe zone, close the whole menu after 360ms. Coming back in time cancels the close. Clicking outside closes at once.\nDragging an item over a folder row opens it after 420ms instead of 220ms.\nThe pointer inside an open submenu ends all protection. Drive row highlight from component state (hovered, active, skipped), not from CSS :hover, or rows crossed inside the safe zone will still light up.\nGeometry and motion:\n\nSubmenus open to the right, overlap their parent by 8px and align their first row with the parent row. Flip to the left when there is no room; the safe zone then uses the submenu's right edge.\nLevels: 210-260px wide, sized to content, max height min(420px, 100vh - 24px) with their own scroll, 6px padding, 12px radius, 1px border, backdrop-filter blur(18px) saturate(135%).\nRows: 32px tall, 8px radius, 4px apart, 0 8px padding, 8px gap; 18px icon, 14px weight-500 label, a 16px chevron on folder rows. Level title: 11px, weight 600, quiet ink, padding 4px 8px 2px.\nA submenu opens from its parent's edge: from translateX(-8px) scale(0.88, 0.98) and opacity 0, with opacity over 170ms and transform over 360ms on cubic-bezier(0.2, 1.45, 0.35, 1).\nThe root level opens the same way from its anchor: from translateY(-6px) scale(0.96, 0.86), top-left origin. Keep the overshoot curve: the slight spring is part of the feel.\nA folder row's icon turns from a closed folder into an open one while its submenu is open, and back when it closes, over 460ms on cubic-bezier(0.22, 1, 0.36, 1). Morph the paths if the two glyphs share their structure; otherwise cross-fade them with a slight lift of the front panel.\nLight and dark themes come from tokens, not separate components:\n\nLight: surface rgba(255,255,255,.96), border rgba(0,0,0,.14), row ink #263140, row hover rgba(15,23,42,.07), quiet ink #7A8491, chevron #94A3B8, shadow 0 18px 34px rgba(15,23,42,.12), 0 2px 4px rgba(15,23,42,.05), inset 0 1px 0 rgba(255,255,255,.74).\nDark, neutral grays with no blue cast: surface rgba(34,34,34,.96), border rgba(255,255,255,.12), row ink #E4E4E4, row hover rgba(255,255,255,.08), quiet ink #9A9A9A, chevron #8A8A8A, shadow 0 18px 34px rgba(0,0,0,.42), 0 2px 4px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.06).\nMonochrome brand icons invert in dark. Switching themes cross-fades colors, borders and shadows over about 500ms.\nKeep every timing value as a named constant in one place, and keep the safe-zone math in a pure, unit-tested helper (point-in-triangle by the sign of the three edge cross products). Add an optional debug overlay that draws the zone (blue fill at 16%, dashed blue outline) and the running timer, off by default.","promptUrl":"https://x.com/Kubai087/status/2114729985143677258"}, {"repo": "kubai tip 003 — dither & ASCII", "url": "https://x.com/Kubai087/status/2115091203465290087", "why": "EffectLayer + EffectPanel prompt for live ASCII/Bayer dither on login cards, with mask/palette/strength controls.", "stars": 0, "license": "", "date": "2026-10-27", "cat": "tips", "comment": "EffectLayer + EffectPanel prompt for live ASCII/Bayer dither on login cards, with mask/palette/strength controls.","prompt":"Add an ASCII / ordered-dither effect to one specific image or video in this project, with a live control panel next to it. Use the asset and the place I name (an , a , or a file path or URL, and the page or section it sits in); ask me if I have not named them. Apply the effect to that asset only, in place: keep its size, position, rounded corners and anything layered on top of it. If the project already has an image or canvas effect pipeline, or slider, segmented-control and panel components, build on them; otherwise create a reusable EffectLayer and EffectPanel.\n\nSettings, one object shared by the layer and the panel: { filter: 'ascii' | 'dither', mask, palette, inkTone, strength, size, spacing } Keep separate values per filter, so switching filters brings back that filter's own settings.\nWhat each control does in each filter, its range, and the recommended value (ASCII / Dither):\n\nMask effect, 0-100 (90 / 88): a vertical veil over the picture so the effect reads as texture rather than noise. Same in both filters.\n\nColor, Original or one of five palettes (Original): gradient-maps the asset's luminance into one color family before filtering.\nSample tones, Shadows | Highlights (Shadows; ASCII only, hidden for Dither): which end of the tonal range becomes dense characters.\nSampling strength, 0-100 (100 / 100). ASCII: contrast of the tone curve and how bright and opaque the characters are. Dither: how few levels each color channel keeps (8 at 0, 2 at 100) and how fully the quantized color replaces the original.\nSize, 0-100 (37 / 15). ASCII: font size, 7-24px. Dither: pixel block, 2-9px.\nSpacing, 0-100 (0 / 0). ASCII: grid step, 8-24px across and 9-26px down, never tighter than the glyphs. Dither: scale of the Bayer pattern, 1-4 blocks per matrix cell.\nHelpers used throughout:\nrange(v, a, b) = a + (b - a) * v / 100\nluminance L = (0.299 R + 0.587 G + 0.114 B) / 255\n\ns = strength / 100\n\"The box\" is the asset's rendered size on the page.\nSampling:\nCover-fit the asset into the box and draw it into a small sampling canvas (about 480px on the long side), then read it with getImageData. A sample is the pixel under a point in the box, composited over white.\nWith a palette, recolor that canvas first: map each pixel's L through a 256-entry lookup built from the palette's four stops.\n\nPer image or video frame, take about 12,000 evenly spaced samples: low = 8th percentile of L, high = 92nd percentile.\nShadows means dark ink, Highlights light ink.\nASCII:\nCharacters, from empty to full: \" .,:;-=+xX08S#&@\" (starts with two spaces).\nFont: round(range(size, 7, 24))px monospace (22 instead of 24 when the box is under 720px wide), centered in each cell.\n\nGrid: x step = max(range(spacing, 8, 24), widest glyph * 1.08); line height = max(range(spacing, 9, 26), height of \"@\" * 1.12, font * 1.04). The first cell sits half a step in from the edge.\nTone of a cell: raw = dark ink ? 1 - L : L; normalized = dark ink ? (high - L) / (high - low) : (L - low) / (high - low), clamped 0-1 (use raw alone when high - low \u003c 0.025); mix = 0.72 + 0.14 s; t = raw (1 - mix) + normalized mix. Then a tone curve: black = 0.22 s, white = 1 - 0.08 s, lev = clamp((t - black) / (white - black), 0, 1), tone = lev (1 - s) + smoothstep(lev) s.\nSkip cells with tone \u003c= 0.02. Character = chars[round(tone * 16)]; skip spaces.\nInk: the sampled color lifted in HSV: value += (1 - value) * (0.24 + 0.18 s + 0.24 tone); saturation *= 1 + 0.16 + 0.2 s (clamped). Alpha = clamp((0.12 + 0.7 tone) (0.72 + 0.28 s), 0.06, 0.94).\nDither (ordered, Bayer 4x4):\npixel size = max(2, round(range(size, 2, 9))) (7 instead of 9 under 720px); pattern scale = max(1, round(range(spacing, 1, 4))); levels = max(2, round(range(strength, 8, 2))) per channel; blend = range(strength, 0.32, 1).\nMatrix [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]]; threshold = (m + 0.5) / 16, indexed by floor(x / pattern scale), floor(y / pattern scale).\n\nFor each block sample its center, push saturation away from luma by 1 + 0.06 + 0.18 s, then per channel: scaled = c / 255 * (levels - 1); q = floor(scaled) + (fraction \u003e threshold ? 1 : 0); out = c + (q / (levels - 1) * 255 - c) * blend.\nWrite the blocks into a canvas of box / pixel size and draw it scaled up with image smoothing off.\nMask and layering:\nThe mask is a vertical gradient with stops at the top, 42% and the bottom. Base opacities: on a light page white 54/20/38%, on a dark page black 44/20/50%. For a mask value v: stop = v \u003c= 50 ? base * (v / 50)^1.08 : base + (100 - base) * ((v - 50) / 50)^1.08.\nASCII: draw the (recolored) picture, the mask, then the characters. Dither: draw the dithered picture, then the mask on top.\n\nChanging filter or palette cross-fades from the last frame over 150ms.\nPalettes (four stops at 0, 0.4, 0.74, 1):\nmeadow: #2B361F, #677D45, #AEBA78, #E5E1BD\nblue: #192A4D, #326AC5, #A2C2F1, #EDF3FC\namber: #3C200F, #A74C15, #EF9A46, #F7E7CA\nlavender: #292144, #6552AB, #B3A5E4, #F0ECFB\n\nmono: #151515, #575757, #A6A6A6, #ECECEC\nRendering:\nDraw into a canvas laid over the asset with the same size and corner radius, at devicePixelRatio capped at 1.6x and about 2048 x 2048.\nImage: redraw when a setting changes (debounced 72ms).\nVideo: redraw on every new frame (requestVideoFrameCallback, falling back to requestAnimationFrame) while it plays and is on screen; keep the video element underneath as the source.\nControl panel:\n\nPlace it next to the asset, below it when there is room, otherwise beside it, never covering it. About 420px wide, centered on the asset.\nRows, in order: Mask effect, Filter (two tabs: ASCII | Dither), Color (round swatches), Sample tones (ASCII only), Sampling strength, Size, Spacing (shown with %).\nEach row 46px tall: a 136px label column, then the control. Slider: a 22px track with 8px radius and a filled part, a 9x30 rounded-rectangle thumb (3px radius), a number box with the value centered, and a snap mark at 50. Swatches: 22px circles, each filled with its palette's two middle stops at 135deg (Original: a tiny crop of the asset); the selected one gets a ring with a small gap.\nEvery change applies live while dragging. Add a \"Reset to recommended\" action that restores the values above for the current filter.\n\nFollow the page's light or dark theme and the project's tokens.","promptUrl":"https://x.com/Kubai087/status/2115091203465290087"}, {"repo": "kubai tip 004 — progressive radii + superellipse", "url": "https://x.com/Kubai087/status/2115469767650021796", "why": "Copy-paste prompt: nested radii via r=R-p, then progressive-enhance with corner-shape: superellipse(1.25).", "stars": 0, "license": "", "date": "2026-10-28", "cat": "tips", "comment": "Copy-paste prompt: nested radii via r=R-p, then progressive-enhance with corner-shape: superellipse(1.25).","prompt":"Make the corner radii in this UI consistent, then switch them to continuous corners. Work on the screen or components I name; ask me if I have not named them. If the project has radius tokens, change those instead of hard-coding values.\n\nInner radius = outer radius - padding (r = R - p)\nGo from the outside in: dialog or card -\u003e panels, inputs, buttons -\u003e chips and tags. A box p inside a container with radius R gets R - p, so both corners share one center. Example: dialog 32, padding 16 -\u003e panels and buttons 16; a chip 8 inside a 16 panel -\u003e 8.\nBoxes on the same level share one radius. Never go below 4.\n\nPills and circles stay fully round.\nKeep every padding, gap and radius on a 4px grid.\nContinuous corners\nKeep border-radius and add the curve as progressive enhancement: @ supports (corner-shape: superellipse(1.25)) { :where(*) { corner-shape: superellipse(1.25); } } Set corner-shape: round on pills and circles.\n\nChrome and Edge 139+ render it; Safari and Firefox skip the block and show the plain border-radius.\nWhen done, list every radius you changed as \"element: old -\u003e new\".","promptUrl":"https://x.com/Kubai087/status/2115469767650021796"}, {"repo": "kubai tip — dynamic bento feature tiles", "url": "https://x.com/Kubai087/status/2115393082472681875", "why": "Full prompt for animated product-site bento tiles (action→result scenes, Lumno material or brand tokens, reduced-motion).", "stars": 0, "license": "", "date": "2026-10-28", "cat": "tips", "comment": "Full prompt for animated product-site bento tiles (action→result scenes, Lumno material or brand tokens, reduced-motion).","prompt":"# Small animations for a product site's feature tiles\n\nGive every tile in my site's feature grid a small animation: a tiny scene that shows what the feature does.\n\n## 0. Before you build\n- Read the project: find out the tech stack (plain HTML/CSS, React, Vue, Svelte, Astro, Tailwind, Framer Motion…) and build it the way the project already does. Don't add an animation library unless the project already uses one.\n- Ask me which look to use:\n  A. The Lumno material below, as written.\n  B. My product's own style: take the colors, radii, borders and shadows from my existing design tokens and components, and keep only the structure and motion rules from this prompt.\n  C. A mix: the Lumno material in my brand's accent color and radii.\n- Picking features: if I named features, animate those. If not, read the product's site, docs or code, list 3–5 features that a short scene can explain, and let me pick.\n\n## 1. Lumno material (option A)\nOverall: quiet, neutral, precise. Hairlines instead of borders, soft shadows tinted warm, no gradients or color washes, one accent color.\n\n- Grid: one card with an outer radius of 28px. Cells are separated by 1px hairlines (a 1px grid gap over a hairline color). Cells are white. The card has a faint hairline ring and a soft shadow.\n- Art panel: inset 8px from the cell edge, with a radius of the card radius minus the inset (20px), so corners stay concentric.\n  - Fill #fafafa, plus an inner 1px ring: box-shadow: inset 0 0 0 1px rgba(32,38,46,.07).\n  - Texture: background: repeating-linear-gradient(-45deg, rgba(32,38,46,.06) 0 1px, transparent 1px 7px).\n  - The scene sits centred on the panel, about 126×118px.\n- Text bars: body bars 4px tall with a 2px radius in #e5e9ef; heading bars 5px tall in #cdd4de. Vary the widths (34–92px).\n- Mini windows and cards: white with a 9px radius.\n  - Shadow: 0 0 0 1px rgba(47,42,34,.06), 0 8px 20px -10px rgba(47,42,34,.25).\n  - Tab strip: 20px tall, #eef1f5. Tabs: 16px tall with 6px top corners; the active tab is white.\n  - Favicons: 10px.\n- Inner surfaces such as charts or fields: #f4f6fa. Secondary data: #b9c9e0. Accent: #3462ad, used only on the result.\n- Icon chip (top-left of each tile): 32px, 10px radius, 1px border rgba(32,38,46,.1), white, shadow 0 1px 2px rgba(32,38,46,.05), a line-style glyph in #4b5563.\n- Text color: a warm near-black, #2f2a22.\n- Hover: the cell darkens to about 2.5% grey; the panel goes to #f4f5f6 with its ring at .09; the icon chip grows 32→36px from its top-left corner, its glyph turns to the text color, and its shadow deepens slightly.\n- Dark mode (suggested values; keep the same relationships):\n  - Cells #17181a, panel #1d1f22, inner ring rgba(255,255,255,.06), texture rgba(255,255,255,.04).\n  - Body bars #2c2f34, heading bars #3a3e45.\n  - Windows #24272b with a 1px rgba(255,255,255,.06) outline and a shadow of 0 8px 20px -10px rgba(0,0,0,.6).\n  - Tab strip #1a1c1f, accent #6f9bea, text #ecebe8.\n\n## 2. Scene\n- One idea per tile: 2–4 moves that show \"action → result\", such as \"click → a small window opens\" or \"change here → the other side syncs\".\n- Abstract wireframes only: no screenshots and no real text. Use at most one small icon where something needs to be recognisable.\n- Motion: ease-out for movement, cubic-bezier(.22,1,.36,1); a slight spring for appearing, cubic-bezier(.34,1.4,.64,1). Each move takes 250–600ms; the whole scene is done in about 3s.\n- Icon chip: when the tile plays, its glyph redraws stroke by stroke (draw, pop or slide per part), then hands back to the solid icon.\n\n## 3. Playback\n- Resting styles are the final frame. Animations only describe where things come from (fill-mode: both or equivalent), so reduced motion shows the result and an interrupted play never jumps.\n- The art panel fades in (opacity, plus translateY 6px and scale .97 to none) as its tile first plays.\n- Play once in view: when about 70% of the tile is visible, wait ~200ms, then play. Tiles that enter together go ~250ms apart, in reading order. Stop on the final frame.\n- One \"played\" state (a class or data attribute) drives every animation in the tile. To replay: remove it, force a reflow, add it back (or re-key in a framework).\n- On mouse hover (mouse only) or keyboard focus, replay: blur the final frame out over ~160ms (blur 6px, opacity 0), restart under the blur, then clear it. Don't restart a play that hasn't finished.\n- Optional loop on hover: while the pointer stays on the tile, replay again ~600ms after each play ends. When the pointer leaves, finish the current play and rest on the final frame.\n- Touch: a tap follows the tile's link; nothing depends on hover.\n- prefers-reduced-motion: reduce: no animation; show the final frame.\n\n## 4. Colors and dark mode\n- Every color is a variable on the art panel (panel, ring, texture, bars, windows, tab strip, accent, shadow); no hard-coded colors in the rules.\n- Follow prefers-color-scheme, and the project's manual theme switch too (a class or data-theme), if it has one.\n- Check it in both light and dark.\n\n## 5. Delivery\n- Mark the art as decorative (aria-hidden) and keep translatable text out of it.\n- Check it in a real browser: first play, hover replay, keyboard focus, reduced motion, dark mode and a phone-width layout.","promptUrl":"https://x.com/Kubai087/status/2115393082472681875"}, {"repo": "lumno.kubai.design", "url": "https://lumno.kubai.design/", "why": "Kubai’s Lumno — open-source browser command bar + minimal new tab; the craft reference behind the tip series.", "stars": 0, "license": "", "date": "2026-10-28", "cat": "tips", "comment": "Kubai’s Lumno — open-source browser command bar + minimal new tab; the craft reference behind the tip series."}, {"repo": "kubai087/lumno-extension", "why": "Open-source Chrome/Firefox command palette + new tab (Spotlight-style); pairs with the tip series craft bar.", "stars": 318, "license": "GPL-3.0", "date": "2026-10-28", "cat": "kits", "comment": "Open-source Chrome/Firefox command palette + new tab (Spotlight-style); pairs with the tip series craft bar."}, {"repo": "jakubkrehel/skills", "why": "interface skill pack — a11y, type, color, layout, writing reviews for agents", "stars": 8812, "license": "MIT", "date": "2026-10-28", "cat": "skills", "comment": "interface skill pack — a11y, type, color, layout, writing reviews for agents"}, {"repo": "storytold/figcraft", "why": "open-source collaborative design/prototyping app in pure Rust", "stars": 3640, "license": "Apache-2.0", "date": "2026-10-28", "cat": "kits", "comment": "open-source collaborative design/prototyping app in pure Rust"}, {"repo": "enes {"repo": "gkurt/tegaki", "why": "handwriting text animation for the web", "stars": 3283, "license": "MIT", "date": "2026-10-30", "cat": "motion", "comment": "any font/text, stroke-order craft for agents"}, {"repo": "glincker/thesvg", "why": "open SVG brand library (7600+ logos) with npm/CDN/MCP", "stars": 2924, "license": "MIT", "date": "2026-10-30", "cat": "brand", "comment": "brand logos as SVG via npm/CDN/MCP without scraping"}, {"repo": "southleft/figma-console-mcp", "why": "design system as an API — Figma MCP for extraction, creation, debugging", "stars": 2625, "license": "MIT", "date": "2026-10-30", "cat": "mcp", "comment": "Figma DS as an API for agents via MCP"}, {"repo": "kubai tip 005 — lively drag reorder", "url": "https://x.com/Kubai087/status/2115823717024735708", "why": "lively drag reorder pattern from the kubai tip series", "stars": 0, "license": "", "date": "2026-10-30", "cat": "tips", "comment": "lively drag reorder pattern from the kubai tip series","prompt":"Make drag-to-reorder in my product feel like this. Apply it to the lists,\nrows and docks I name, and reuse any drag helper the project already has.\n\n1. Cursor: a pointing hand over anything draggable, a grabbing hand while\n   dragging.\n2. Lift: the picked item follows the pointer, raised off the list so it\n   never hides where it will land: above a horizontal row, or pulled aside\n   and shrunk to about 90% in a vertical list. Its old slot closes up.\n3. Drop hint: a faint, thin line in the gap where it will land (vertical in\n   a row, horizontal in a list), about 15% of the text color. It grows from\n   its middle when it appears and glides to each new gap. No line over the\n   item's own slot.\n4. Ripple: items on both sides of the line lean away from it. Counting n\n   from the line (0 = the item touching it), item n moves\n   A x 0.7^n (A is about 10px for icons, 8px for cards)\n   and starts 24ms x n later, on a quick spring that barely overshoots and\n   settles in about 0.25s. Nearer items move sooner and further, so the\n   push spreads out like a ripple.\n5. Drop: the item takes the gap and every item springs into its new place.\n   Escape or dropping outside the list cancels, and everything springs back.\n6. Give each motion its own curve (hand-like for the pointer, a small pop\n   for the lift, springs for settling) instead of one ease-out everywhere.\n\nMove things with transforms, not layout. Let the keyboard reorder too, and\nwith reduced motion keep only the line.","promptUrl":"https://x.com/Kubai087/status/2115823717024735708"}, {"repo": "boardui.com", "url": "https://www.boardui.com/", "why": "Beautiful UI components for modern products — companion site to BoardUI/boardui already in kits.", "stars": 0, "license": "", "date": "2026-10-31", "cat": "web", "comment": "Beautiful UI components for modern products — companion site to BoardUI/boardui already in kits."}, {"repo": "ui.aceternity.com", "url": "https://ui.aceternity.com/", "why": "Animated React components — Aceternity UI gallery for product motion craft.", "stars": 0, "license": "", "date": "2026-10-31", "cat": "web", "comment": "Animated React components — Aceternity UI gallery for product motion craft."}, {"repo": "originkit.dev", "url": "https://www.originkit.dev/", "why": "Free animated components ready to drop into modern product UIs.", "stars": 0, "license": "", "date": "2026-10-31", "cat": "web", "comment": "Free animated components ready to drop into modern product UIs."},{"repo": "kubai tip 006 — book-flip card", "url": "https://x.com/Kubai087/status/2116198373040759107", "why": "hover opens the card like a tiny book — vibe-card antidote with copy-paste prompt", "stars": 0, "license": "", "date": "2026-10-30", "cat": "tips", "comment": "hover opens the card like a tiny book — vibe-card antidote with copy-paste prompt","prompt":"Make the cards in my product open a little, like a book, when hovered.\nAt rest a card must look exactly as it does today; only hover or focus\nreveals that it is a small book with pages inside.\n\n## 0. Start from what exists\n- Find the card component I name (or the one used in the grid or list I\n  point to) and retrofit it in place. Reuse its markup, design tokens,\n  radius, shadow and motion or spring utilities.\n- Keep the card's footprint, padding, content and layout unchanged.\n  Nothing around the card may move.\n- If I ask for new cards instead, build a fresh square card (about\n  280 x 280) in the style I choose below.\n- Any option I leave unset uses the default marked *.\n\n## 1. Choose a style\nDefault*: ordinary product cards, identical to normal ones until hovered.\n- Surface: plain white (or my card surface token), no texture.\n- Edge: a 1px hairline in my border colour.\n- Shadow: light, neutral cool grey, half strength.\n- Type: the product sans. Title 24/600, description 15 muted,\n  meta 14 muted.\n- Cover: the existing card UI: a 48px icon tile, a ↗ arrow top right,\n  title, description, and a meta footer below a hairline.\n- Wall: my normal page background.\n- Pages: white, a faint shade toward the spine, a small heading and\n  4-6 grey text lines.\n\nSkeuomorphic: hardcover books on a gallery wall.\n- Surface: fine bookcloth grain over a deep cover colour.\n- Edge: a lit bevel: bright top edge, darker foot.\n- Shadow: warm, near-neutral grey (never orange), full strength.\n- Type: one serif title, bottom left. Nothing else on the cover.\n- Cover: a full-bleed image or animated ASCII scene, with a soft gloss\n  at the top and shade at the foot.\n- Wall: warm plaster with a fine grain and a spotlight over each book.\n- Pages: cream paper with grain, an italic chapter heading, justified\n  lines, and thin page edges along the fore-edge.\n\nMinimal: documentation volumes.\n- Surface: flat off-white, light grey or graphite, one tone per card.\n- Edge: a faint bevel or hairline.\n- Shadow: cool neutral grey.\n- Type: a mono section number and version on top, over a hairline rule;\n  a two-line sans title and a small grey label at the foot.\n- Cover: one small grey line diagram with a single element in the ink\n  colour.\n- Wall: cool grey with a faint 24px dot grid and soft light from above.\n- Pages: cool white, a sans heading and grey lines.\n\nMatch my product: take surface, edge, shadow, type and wall from my\ntokens, and keep the cover exactly as the card is today.\n\n## 2. Options (defaults marked *)\n- Intensity: subtle (A = 24deg) | book* (A = 42deg) | dramatic\n  (A = 60deg).\n- Pages: 2 | 3 | 4* | 6.\n- Hinge: left* | right | top.\n- Trigger: hover* | press (open while pressed) | scroll into view (open\n  once when 60% visible, close after ~1.2s). Keyboard focus always\n  opens it too.\n- Pages show: blank paper | lines of text* | real preview content from\n  the card (its next fields, a short list, a chart thumbnail).\n- Cover: existing card UI* | image | animated ASCII scene | solid colour.\n- Shadow direction: from above* | from top-left.\n- Shadow strength: none | light | normal* | deep.\n- Corners: match my tokens* | continuous (superellipse).\n- Motion feel: snappy (k 320, damping 0.9) | default* (k 240,\n  damping 0.86) | soft (k 160, damping 0.8). All barely overshoot.\n- Reduced motion: tiny lift* | nothing.\n- Touch: press* | scroll into view | off.\n\n## 3. Layer stack\n- Inside the card's link, put the cover on a body element with\n  transform-style: preserve-3d. Behind it stack N pages and a back\n  board, all absolutely positioned on the same square.\n- Order, front to back: cover (n = 0), pages (n = 1..N), back board\n  (n = N + 1, never moves).\n- The cover keeps all of the card's existing content. Pages and the\n  back board are decorative: aria-hidden, no links, no tab stops.\n- Perspective on the static outer element: about 1100px, origin toward\n  the hinge (30% 50% for left, 70% 50% for right, 50% 30% for top).\n- transform-origin on the hinge edge of every layer: left 0 50%,\n  right 100% 50%, top 50% 0. backface-visibility: hidden.\n- Lift layer n by translateZ((N + 1 - n) x 0.6px) so layers never\n  fight in depth.\n- Pages sit 8px inside the cover (4px at the spine), like a book block,\n  with radius = cover radius - 8.\n- Back board: on flat cards (Default, Minimal) inset it ~6px from the\n  cover with radius = cover radius - 6, so it never peeks out past the\n  cover's foreshortened corners. On Skeuomorphic it is flush, the cover\n  colour darkened ~28%.\n\n## 4. Motion\n- Layer n turns toward the viewer by\n    angle(n) = A x 0.7^n\n  and starts\n    delay(n) = 28ms x n\n  later. The cover leads; pages fan out behind it.\n- Direction: rotateY(-angle) for a left hinge, rotateY(+angle) for\n  right, rotateX(+angle) for top.\n- Each layer runs on its own spring (see Motion feel), settling in\n  about 0.3s.\n- Close in reverse: the innermost page first, delay = 28ms x (N - n),\n  back to 0deg.\n- If the pointer leaves mid-way, retarget from the current angle and\n  velocity. Never jump.\n- No spring helper in the project? CSS transitions are fine: transition\n  transform over ~420ms with a slight overshoot, e.g.\n  cubic-bezier(0.3, 1.2, 0.5, 1), and set transition-delay to 28ms x n\n  in the open state and 28ms x (N - n) at rest (the target state's delay\n  applies, so closing runs in reverse).\n\n## 5. Light and shading\n- Light comes from above, so the shadow falls down the wall.\n- The shadow is two solid shapes behind the card, each blurred once.\n  At rest it hugs the card like any flat card's:\n  - contact: small and darker, at the foot. Lower half of the card,\n    ~4px in from each side, blur ~4px, ~2px down, ~22% opacity.\n  - ambient: faint. Blur ~14px, ~6px down, ~12% opacity.\n- Never a box-shadow: it is a hollow ring and shows as an outline once\n  the cover swings off it.\n- Tint: near-neutral grey nudged toward the wall (warm grey on a warm\n  wall, cool grey on a cool one). Never pure black, never saturated.\n- Strength scales both opacities: light 0.5 (Default style), normal 1,\n  deep 1.4.\n- Opening: crossfade to a second pre-blurred pair that is longer and\n  softer (contact blur ~12px, 12px down; ambient blur ~38px, 26px down),\n  and move it ~14px further down and ~4% wider with transform. Drive it\n  with one progress value o (0..1) on its own spring (k 200, damping\n  0.9): rest pair opacity 1 - o, open pair opacity o.\n- Leaf shading: every page has an overlay gradient from the spine\n  (32% dark -\u003e 8% at 55% -\u003e 0 at 85%). Its opacity is\n    clamp(gap / 6, 0, 1) x max(0, 1 - gap / 30)\n  where gap = the angle of the leaf in front minus this leaf's angle.\n  A page is shaded while the leaf in front is just lifting off it, then\n  lit once they part.\n- Covers (Skeuomorphic, Minimal): a soft gloss at the top edge and a\n  little shade at the foot.\n\n## 6. Corners and edges\n- Clip every layer (cover, pages, back board) to one shape path, and\n  draw its edge (hairline or bevel) along that exact path, e.g. an SVG\n  path stroked over the layer. Do not mix a CSS border or inset\n  box-shadow with the clip: they disagree at the corners and show a\n  second rim when the layers part.\n- Match my tokens: use the token radius; nested radius = outer - inset.\n- Continuous: superellipse corners |x|^n + |y|^n = 1 with n = 2^1.25\n  (the same curve as CSS corner-shape: superellipse(1.25)). Generate a\n  clip-path: path(...) per layer size, reuse it for the edge, and\n  regenerate on resize.\n\n## 7. Interaction and accessibility\n- Hit-test on the resting footprint: listen for hover on the static\n  outer element and give every moving layer pointer-events: none, so a\n  swinging cover never moves the target and the card never flickers\n  open and closed at its edges.\n- Cursor: a pointing hand over the whole card.\n- The whole card stays one \u003ca\u003e or \u003cbutton\u003e with its current accessible\n  name. Pages add nothing to the accessibility tree.\n- :focus-visible opens it exactly like hover. Keep the focus ring on the\n  outer element, along the resting shape.\n- Reduced motion: no fan and no rotation. The cover lifts ~2px and the\n  shadow crossfades to the open pair.\n- Touch: no hover. Use the Touch option; a tap must still activate the\n  card on the first try.\n\n## 8. Performance\n- Animate transform and opacity only. Never animate blur, box-shadow,\n  clip-path, width, height or top/left.\n- Never animate a blur radius: blur each shadow once and crossfade the\n  two pre-blurred versions.\n- One requestAnimationFrame loop for all cards. Skip cards whose springs\n  are at rest, and stop the loop when nothing moves.\n- Write a style only when its value changes (cache the last string per\n  element).\n- No layout reads per frame: measure once, and again on resize\n  (ResizeObserver).\n- Animated canvas ∂∂: draw at ~30fps at most, and pause when off\n  screen (IntersectionObserver) or when the tab is hidden.\n\n## 9. Animated ASCII cover (only if chosen)\n- Paint a small scene as one colour per character cell (~6 x 9px).\n- Pick each character by brightness from \" .:-=+*#%@\".\n- Draw a dimmed copy of the colours (~40%) underneath and the coloured\n  characters on top, so the gaps read like a halftone.\n- Stamp characters from a pre-rendered glyph atlas instead of laying out\n  text every frame. Keep the motion slow and seamlessly looping.\n\n## 10. When done\n- List every file you changed or added.\n- List the style and every option you used, marking which were\n  defaults.\n- Note anything that no longer looks identical at rest.","promptUrl":"https://x.com/Kubai087/status/2116198373040759107"},{"repo": "kubai tip 007 — typography CSS", "url": "https://x.com/Kubai087/status/2116555064227811412", "why": "CJK/Latin wrap, align, truncate CSS switches for i18n — Agent-ready polish prompt", "stars": 0, "license": "", "date": "2026-10-31", "cat": "tips", "comment": "CJK/Latin wrap, align, truncate CSS switches for i18n — Agent-ready polish prompt","prompt":"Polish the typography in my product with a set of CSS switches. Change only how text wraps, spaces, aligns and truncates. No copy, font, colour or layout changes beyond what each rule says.\n\n0. Start from what exists\n- Put the rules in the global text styles (base CSS, typography tokens, Tailwind config or shared text components) so every page inherits them. Add per-component rules only where a component overrides the base.\n- Every rule below is progressive enhancement: browsers that don't know a property ignore it. Add no polyfills.\n- Scope the Chinese rules with :lang(zh), and make sure the lang attribute is set on the html element or on the element itself, so English text keeps its own rules.\n\n1. Headings break into even lines\n- On h1 to h3, card titles and hero lines: text-wrap: balance;\n- Lines come out about the same length, so a heading never ends on one lonely word. Short text only: Chrome balances up to 6 lines.\n\n2. No lone word at the end of a paragraph\n- On paragraphs, descriptions and list items: text-wrap: pretty;\n- Also join pairs that must not split with a non-breaking space (U+00A0): an em dash and the name after it, a number and its unit.\n\n3. Numbers that change keep their width\n- On anything that updates in place or sits in a column (counters, prices, timers, stats, table cells): font-variant-numeric: tabular-nums;\n- The font must have tabular figures (the tnum feature); check that the width actually stops changing. Leave running text proportional.\n\n4. Button labels stay on one line\n- On buttons and other labels in flex rows: white-space: nowrap; (flex-shrink: 0 works too)\n- A crowded row must not squeeze a label onto two lines.\n\n5. Long text truncates instead of spilling out\n- A flex item won't shrink below its content, so text inside it can't truncate. On the flex item: min-width: 0;\n- On the text itself: overflow: hidden; white-space: nowrap; text-overflow: ellipsis;\n- When the text really is cut (scrollWidth \u003e clientWidth), show the full text in a tooltip on hover.\n\n6. Chinese body text: justified, on a whole number of characters\n- On Chinese paragraphs only: text-align: justify;\n- Set the measure to a whole number of characters (for example max-width: 26em at the paragraph's font size), so a justified line only stretches to absorb Latin words and squeezed punctuation.\n- Not for narrow columns (under about 15 characters), short text, captions, buttons or mostly-English text: the gaps get uneven.\n\n7. Space between Chinese and Latin text or numbers\n- On Chinese text: text-autospace: normal;\n- The browser adds a thin gap between Han characters and Latin letters or digits. Don't also hand-type spaces in copy or translation files. Skip code, inputs and monospaced text.\n\n8. No half-width gap before an opening bracket at a line start\n- On Chinese UI text without a first-line indent: text-spacing-trim: trim-start;\n- An opening 「 “ （ at the start of a line drops its blank half and lines up with the text above. Long-form text with a two-character indent should use space-first instead. Chrome only for now.\n\n9. Chinese headings break between words\n- Chinese has no spaces, so a heading can split a word across lines. Mark the break points between words with BudouX (its Simplified or Traditional Chinese model), inserting a wbr element at each one, at build time for static copy or at render time for dynamic copy. Then: word-break: keep-all; overflow-wrap: anywhere; text-wrap: balance;\n- Never use keep-all on Chinese without break points: the heading becomes one unbreakable word. Don't use Intl.Segmenter for this (it splits common words wrongly), and don't apply it to body text.\n\n10. Line-start and line-end rules (避头尾)\n- Browsers already keep punctuation off the start of a line and squeeze line-end punctuation. Don't rebuild this.\n- Find and remove any line-break: anywhere used to stop overflow: it turns these rules off. Use overflow-wrap: anywhere instead.\n- Text drawn on canvas or SVG, or wrapped by hand in JS, gets none of this: apply the rules there yourself.\n\n11. When done\n- List every file and selector you changed.\n- List every line-break: anywhere and word-break: break-all you removed or kept, and why.\n- Show before and after on my own pages: a wrapped heading, a paragraph ending, a changing number, a truncated label and a mixed Chinese-English paragraph.","promptUrl":"https://x.com/Kubai087/status/2116555520274493582"},{"repo": "kubai tip 008 — wiki layout", "url": "https://x.com/Kubai087/status/2116911391437443471", "why": "wiki frame that works on PC and mobile (chapter switch) — SEO docs without a clunky nav", "stars": 0, "license": "", "date": "2026-11-01", "cat": "tips", "comment": "wiki frame that works on PC and mobile (chapter switch) — SEO docs without a clunky nav","prompt":"Polish the layout of my docs or help center pages: the header, the page list, the outline and the end of each article. Keep the content, copy, colours and fonts. Change only how these parts sit, scroll and respond.\n\n0. Start from what exists\n- Find the shared docs layout, the site header, the page list (sidebar), the outline (table of contents) and the footer. Change those, so every page inherits the result.\n- Use CSS and a little plain JS. Add no scroll or animation libraries.\n\n1. Think of the page as three layers\n- The article and the footer scroll with the page.\n- The page list and the outline are position: sticky. They stop where they start, so they never jump when scrolling begins, and the end of the layout pushes them up at the bottom.\n- The header becomes position: fixed only after the page's opening (banner or hero) has left the screen. Before that it belongs to the page and scrolls away with it.\n\n2. Header: it scrolls away, then comes back floating\n- At the top it is clear, with no background.\n- Once the reader has scrolled and the banner's bottom edge is at or above the top of the screen (getBoundingClientRect().bottom \u003c= 0), show it as a floating bar: position: fixed; a translucent white background; backdrop-filter: blur(18px); a soft shadow.\n- It enters in 320ms ease-out, from translateY(-24px) with blur(8px) and opacity 0. It leaves in 120ms when the reader scrolls back up to the banner. If the reader scrolls down again during the exit, cancel it and keep the bar.\n- Give headings a scroll-margin-top so anchor links never land under the bar.\n\n3. Page list: it scrolls on its own, and shows where there is more\n- Hide its scrollbar and let it scroll by itself.\n- Fade an edge only while more of the list waits beyond it. Toggle data-more-above and data-more-below on scroll and resize, and drive a mask-image: linear-gradient(...) with them: about 40px at the top and 56px at the bottom, each with a short fully clear strip at the very edge, so a half-cut row never shows as a faint line.\n- Add a small round arrow on each edge that has more. A click scrolls the list by 60% of its visible height, smoothly. Arrows are for the mouse only (tabindex=\"-1\", aria-hidden=\"true\"); keyboard focus already scrolls the list.\n- On load, bring the current page into view. Keep the list's scroll position in sessionStorage, so moving to another page does not reset it.\n- If there is a search box, let \"/\" focus it.\n\n4. Outline: mark the section being read\n- The current section is the last heading above a line 20% down the viewport.\n- Mark its link with aria-current=\"location\" and style that: border-left-color and text in the accent colour.\n- Update it on scroll, at most once per animation frame.\n\n5. End of the article: help first, then the next page\n- If the reader is still stuck, a \"Still need help?\" card with one or two real channels (the issue tracker, the community, a contact).\n- Then previous and next links, with each page's title. The first page links back to the home page.\n- Then the footer.\n\n6. Narrow screens\n- Hide the outline on tablets and the page list on phones. Put both in one bar fixed at the bottom: the page list on its left half, the outline on its right half.\n- The right half shows the name of the section being read, updated by the same 20% line, and truncated with an ellipsis when it is long.\n- A tap on either half opens its list as a sheet from the bottom edge (a dialog opened with showModal()), sliding up 24px as it fades in, with no dimming behind it. Mark the current entry and scroll it into view (scrollIntoView({ block: \"center\" })).\n- A tap on an entry, the close button, outside the sheet or Esc closes it; a section link then scrolls to its heading.\n- Make the tap targets one size up from the desktop list.\n\n7. Motion\n- Under prefers-reduced-motion: reduce, turn off smooth scrolling and the header's enter and exit animations.\n\n8. When done\n- List every file and selector you changed.\n- Check four states on my own pages: the top of a page, the middle, the end, and a phone-width window.\n- Show a screenshot of each.","promptUrl":"https://x.com/Kubai087/status/2116917025348231369"},{"repo": "kubai tip 009 — floating UI kinds", "url": "https://x.com/Kubai087/status/2117314098165862612", "why": "tooltip vs cursor-tip vs popconfirm vs dialog vs drawer — decision tree + AI prompt", "stars": 0, "license": "", "date": "2026-11-03", "cat": "tips", "comment": "tooltip vs cursor-tip vs popconfirm vs dialog vs drawer — decision tree + AI prompt","prompt":"Review how my product uses floating UI (tooltips, tooltips that follow the pointer, popovers, popconfirms, drawers and dialogs) and decide which kind each case should be. Work inside my existing design system. This is about choosing the right kind, not about restyling: keep my components, colours, radii, shadows, fonts, motion and copy style.\n\n0. Start from what exists\n- Find every overlay in the product and the components behind it: tooltips, hover cards, popovers, confirm bubbles, menus that confirm, side panels, drawers, sheets, modals and dialogs.\n- For each use, note where it is, what opens it, what it holds and what happens when the user confirms.\n- Find the design system's own component for each kind. Reuse it. If two components do the same job, say so and suggest which one to keep.\n\n1. What each kind is for\n- Tooltip: adds text about what the pointer is on, such as long text that has been cut short, an icon-only button or a disabled control. Text only. If it needs actions, it becomes a popover opened by a click.\n- Tooltip that follows the pointer: keeps giving information across an area. It appears when the pointer enters, follows it, and goes when the pointer leaves. Common on charts and on other self-contained elements.\n- Popconfirm: the second check for an irreversible action on a single item, right where it was clicked. The path stays short and nothing else is interrupted.\n- Dialog: for something the user must stop and confirm or complete before going on: an action with a large impact, one that affects other people, a bulk action, or one that needs another decision first (such as who takes over the projects). Also for a short form that doesn't need anything else on the page for reference.\n- Drawer: for a long form, for work that needs the page in view to compare against, or to make better use of horizontal space. Never use a drawer to confirm something.\n- Full page: when the task is the user's main job there, or it needs a link that can be shared and survives a reload.\n\n2. Questions that settle a case\n- Can the action be undone? Then don't confirm: do it at once and offer Undo (a toast, or a way back such as a trash).\n- If it can't: is it one item of the user's own, with a button to anchor to? Popconfirm. Large impact, other people, a bulk selection, or a decision still to make? Dialog.\n- Is it a form? Short, and nothing on the page is needed for reference: dialog. Long, needs the page in view, or wants the width: drawer. The main task, or needs its own URL: a page.\n- Is the information about one element, or about wherever the pointer is inside an area? One element: tooltip. An area: tooltip that follows the pointer. Either way, does it need anything to click? Then it is a popover.\n- On touch screens there is no hover: anything shown on hover must also be reachable by a tap.\n\n3. What each kind should do\nFill in only what is missing, with the design system's existing parts.\n- Tooltip: shows on hover and on keyboard focus, after about 500ms for the first one, then at once when moving to a neighbour. Stays inside the viewport, lets the pointer through, one at a time, linked with aria-describedby.\n- Tooltip that follows the pointer: sits beside the pointer without covering it and flips near the edges of the viewport. On a chart, the guide line follows the pointer and the value snaps to the nearest data point. On touch, a tap shows the value.\n- Popconfirm: anchored to the button that opened it and grows from it. Escape or a click outside closes it, and focus goes back to that button. The confirm button names the action.\n- Dialog: the system's modal or a native dialog opened with showModal(). Keeps focus inside and Escape cancels. It says who or what is affected and what cannot be undone. Buttons name the action (\"Remove member\", not \"OK\").\n- Drawer: comes in from the edge it is attached to and leaves the page in view. Changes show up in the page behind it as they are made. Closes with Escape and a close button; focus moves into it and back out to what opened it.\n- Drawers, dialogs and pages with a form: closing with unsaved changes asks first.\n\n4. Keep the design as it is\n- Change only the kind where the current one is wrong, plus the missing behaviour from step 3.\n- Don't change colours, radii, shadows, fonts, spacing or animations, and don't add new visual patterns.\n- Keep copy as it is, except confirm buttons and the line that explains what cannot be undone.\n- If a case needs a component the system doesn't have (an undo toast, a popover), stop and ask me before adding one.\n\n5. Deliver the decisions first\n- Before changing any code, give me a table: each use, where it is, its current kind, the kind you recommend, and why in one line.\n- Mark the ones that are already right, and the ones that could fit two kinds, with what decides between them.\n- Wait for my go-ahead, then make only the changes I approve and list every file you touched.","promptUrl":"https://x.com/Kubai087/status/2117314198430757283"},{"repo":"kubai087/pro-threads","why":"MacBook PROLED XDR-style WebGL letter wallpaper + hero scenes; drop-in pro-threads web component","stars":35,"license":"MIT","date":"2026-11-02","cat":"motion","comment":"Kubai open-source WebGL thread-light heroes for dark landing pages -- live demo + embed."},{"repo": "heydamir/unslop", "why": "Claude/Codex skill that audits vibecode slop then redesigns pass-by-pass (direction → spacing/color/copy/motion); distinct remediator next to Nutlope/hallmark already in catalog.", "stars": 4894, "license": "CC-BY-4.0", "date": "2026-11-02", "cat": "skills", "comment": "Claude/Codex skill that audits vibecode slop then redesigns pass-by-pass (direction → spacing/color/copy/motion); distinct remediator next to Nutlope/hallmark already in catalog."},{"repo": "kgoedecke/doop", "why": "Open-source Paper.design alternative — multiplayer canvas where humans + agents co-design live, MCP built in.", "stars": 1467, "license": "AGPL-3.0", "date": "2026-11-02", "cat": "kits", "comment": "Open-source Paper.design alternative — multiplayer canvas where humans + agents co-design live, MCP built in."},{"repo": "GLips/Figma-Context-MCP", "why": "Framelink Figma MCP — catalog gap (other Figma MCPs present, this canonical Cursor Figma layout server was missing).", "stars": 16133, "license": "MIT", "date": "2026-11-02", "cat": "mcp", "comment": "Framelink Figma MCP — catalog gap (other Figma MCPs present, this canonical Cursor Figma layout server was missing)."},{"repo": "dickwu/
