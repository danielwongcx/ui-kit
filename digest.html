g random tables and misusing drawers, tokens, and badges"}, {"repo": "9und30/glassy-liquid", "why": "Apple-style liquid glass for the web with real refraction — Web Components plus React, Vue, and Svelte bindings", "stars": 20, "license": "MIT", "date": "2026-11-10", "cat": "kits", "comment": "Apple-style liquid glass for the web with real refraction — Web Components plus React, Vue, and Svelte bindings"}, {"repo": "kubai tip 014 — card delete exits", "url": "https://x.com/Kubai087/status/2119831380276523207", "why": "Four card-delete exits (Burn, Plume, Blocks, Peel) plus neighbor heat and gap reflow — copy-paste prompt", "stars": 0, "license": "", "date": "2026-11-09", "cat": "tips", "comment": "Four card-delete exits (Burn, Plume, Blocks, Peel) plus neighbor heat and gap reflow — copy-paste prompt","prompt":"Add a delete effect to the cards or list items in my existing product: when one is deleted it leaves in one of four ways (Burn, Plume, Blocks, Peel), the items around it answer, and the gap closes.\n\nThis is a change to my product, not a demo. Build it inside my code, on my stack, with my components, tokens and list. Do not change what deleting does or how the list looks at rest. Do not copy any demo scene: no phone frame, backdrop, sample cards or fonts. Do not rewrite the list or add a dependency or renderer without asking. Every value below is a default to start from, not a requirement. The numbers assume an item about 432 x 130 px; section 1 says how to fit them to mine.\n\nFirst look at my app (section 0) and tell me in a few lines what you found. Then ask me these one at a time, offering the default each time, and wait for each answer:\n1. Where: which delete actions get the effect (the default: the item's own delete button), what happens for swipe-to-delete and bulk delete (the default: the current behavior, or the fade in section 8), and whether undo exists. Delete the data at once as today; the effect is only the picture of it leaving, and must never block input or wait to commit.\n2. Which effect: one per product is usually right. Burn suits a final, dramatic delete; Plume a gentle or positive one (done, archived); Blocks a playful one; Peel anything sticker-like. Say which one fits my item's shape and size best.\n3. Neighbors: should the items around it react (section 7)? The default is yes. Should heat bend them? Say what that costs on my platform.\n4. Colors and modes: the sticker back from the item's own category color or my brand; Plume's flame colors as given or from my palette; which modes my app has (section 1).\nThen propose how you will build it on my platform: which files change, how it hooks into my list, how the item is captured, what draws the effect, the cost and the fallback (section 9 is a starting point, not a prescription). Wait for my go-ahead.\n\n0. Start from what exists\n- Find the list, the item component, where items are removed, how the list reflows now, and any existing exit animation or list-animation library. Reuse that for the gap if it can do the spring in section 2.\n- Read the item's real styles: size, corner radius and corner curve, background, border, shadow, and whether it has images, video or nested scrolling.\n- Find the scroll container, anything that clips or transforms the list, what sits above it (headers, tab bars, floating buttons), and whether the list is virtualized or recycled.\n- Note what the items draw with, what graphics the product already ships (WebGL, three.js, Pixi, Skia, Metal, Vulkan, wgpu), and the platform's version range. This decides the snapshot and the renderer (section 9).\n- Note my motion tokens, color tokens, dark mode, reduced-motion handling and how tests or screenshots run, and keep them working.\n\n1. Fit it to my UI\n- Size: k = clamp(sqrt(w * h / (432 * 130)), 0.6, 1.4). Multiply pixel distances and flame heights by k. Burn's field is already relative to the item. Mesh cells stay 5 or 6px.\n- Items much smaller than about 200 x 60 px: use Blocks with 9 and 18px chunks, or the fade. Full-width table rows: Burn, Blocks or Peel; Plume needs height to read, so give it a shorter flame and let it cross the row above.\n- Shape: use my radius and corner curve everywhere an edge is computed (the snapshot, the die-cut edge, the flame clip). For continuous corners use |x|^n + |y|^n = 1, the same curve as my CSS or platform API. Square rows use radius 0.\n- Paper color: the effects read the item's own picture, so a tinted item keeps its tint until it scorches. If my item has a translucent or blurred background, flatten it onto its real backdrop in the snapshot.\n- Dark mode (starting points, to check by eye): Burn's char disappears on a dark surface, so lift it to rgb(58 50 46) and keep the ash line. Firelight on neighbors is at about half strength and normal blending, since multiply does nothing on dark. Plume's halo at 20%. Peel's shadow at 50% and black, the adhesive at 12%.\n- Origin: Burn and Blocks start at the actual delete control, wherever it is. Peel starts from the corner nearest it and travels toward the item's far side, choosing the direction so the flap stays on screen. Mirror the direction if the control is on the left.\n- Where it lives: mount the surface at the level of the scroll container, outside the list, so removing the item cannot unmount it and it is clipped like the list. If the list scrolls during an effect, move the surface with it.\n\n2. What every effect shares\n- In the delete handler, before the state changes: read the item's rectangle, take its picture (section 9), then hide the real item. With a virtualized or recycled list the item is gone on the next update, so this must happen first.\n- Draw the effect on one surface over the list that ignores input. Keep headings and navigation above that surface, so a flame passes behind them; it may cover neighboring items for a moment and is clipped only by the scroll area or screen.\n- The first frame must match the real item exactly, including its corner curve; if it does not, the snapshot is wrong. Upload it at 2x or device scale with premultiplied alpha, and un-premultiply before recoloring it.\n- Close the gap with a spring on transforms only, progress = 1 - exp(-7t) * cos(6t) over 520ms, never by animating height or margin. It starts while the effect is still running: 900ms into Burn, 720ms into Plume, 240ms into Blocks, 640ms into Peel. A new item, if the list brings one, comes from 60px lower and fades in over the first 40%. Never bring back the text just deleted.\n- Draw only while an effect runs; free its buffers and textures when it ends. Each delete owns its own effect; allow up to 3 at once and use the fade beyond that. On undo, stop that effect at once and let the item return the way my product brings items back.\n- The field used below: f(p) = length((p - click) * (1, 1.15)) / maxD + (fbm(p * 0.018) - 0.5) * 0.42 + (fbm(p * 0.085) - 0.5) * 0.05 - pocket, with click the delete button's center, maxD its distance to the farthest corner, fbm five octaves of smooth value noise (each 2.03 times the frequency plus an offset of 17.1, half the weight), and pocket = smoothstep(0.6, 0.78, fbm(p * 0.03 + 40)) * 0.12. The coarse field is the same without the last two terms.\n\n3. Burn (2s in all; the front takes 1.15s)\n- level = t / 1.15 * 1.4 - 0.1, and d = f(p) - level: positive is not yet reached. Draw in order: the light behind, the paper, the flames, the particles.\n- The light behind: on the page around the front, rgb(255 158 56) at exp(-abs(d) / 0.07) * near * 30%, where near is 1 on the item and exp(-distance / 26) off it, fading as level goes from 1.1 to 1.3.\n- The paper, in order: mix toward rgb(247 194 102) by 55% over d = 0.17 to 0.05; toward rgb(107 51 18) over d = 0.06 to 0.008; toward rgb(13 9 8) over d = 0.012 to -0.006. Keep the char clean, since this is where it turns dirty: one band 5% of the field wide (about 20px), warm black to rgb(43 31 26), with an edge that wanders only on slow noise, charD = d + (noise(p * 0.05) - 0.5) * 0.014, finished by a fine line of pale ash in rgb(189 179 168) at 85% where abs(charD + 0.05) is under 0.0035. Past that line the paper is gone, with a crisp edge. No gray mottling, no smoky soft edge.\n- Heat sits on the unburnt side so the char stays dark. Each band is exp(-(d / w)^2), with w ahead and behind of the line: orange rgb(255 112 13) w 0.05 and 0.012 at 92%; gold rgb(255 204 66) w 0.024 and 0.006 at 95%; the line rgb(255 250 214) w 0.008. Multiply them all by 0.72 + 0.28 * noise(p * 0.02, moving at 1.5/s).\n- Stray points catch ahead of the front: smoothstep(0.78, 0.84, noise(p * 0.17)), only where d is about 0.02 to 0.15, in rgb(255 184 64), flickering 0.6 + 0.4 * sin(18t + noise(p * 0.05) * 30).\n- Flames rise from the front. n1 = noise(x * 0.045 + 0.6t, y * 0.02 + 6t), n2 = noise(x * 0.11 + 5, y * 0.05 + 9t), tall = 16 + 72 * smoothstep(0.32, 0.8, n1). At each point take 5 samples s from 0 to tall going down the page, and add exp(-(coarse front / 0.042)^2) * (1 - smoothstep(0, tall, s)) * 0.5, counting only samples that land on the item (smoothstep(2, -6, distance to its edge)). Cap at 1, then multiply by smoothstep(0.2, 0.62, n1 * 0.7 + n2 * 0.3) so they stand in separate tongues. Ramp rgb(255 107 18), rgb(255 194 51) over 0.2 to 0.55, rgb(255 250 214) over 0.55 to 0.9. Alpha smoothstep(0.03, 0.62, flame) * 95%.\n- The paper is a mesh (6px cells). lift = clamp(1 - (f - level) / 0.1, 0, 1)^2: it pulls back 9px * lift away from the click and rises 12px * lift^2, shading to rgb(209 194 173).\n- 64 particles, each leaving as the front reaches it, living 0.5 to 1.2s. 80% are sparks of 2.5 to 4.5px, rgb(255 158 41) to a pale core. The rest are pale gray flakes of 3 to 8px at 60%, with irregular outlines. They rise 60 to 240px (sparks 1.2 times, flakes 0.8), drifting sideways by sin(6 age) * 12 * age and up to 20px, fading from 45% of their life.\n\n4. Plume (1.4s): one soft flame takes the item from the bottom up\n- The paper goes from the bottom up: the line reaches the top at 0.84s, ease-in-out from 0.04s, with a wandering edge of about 17px, the middle leading the sides by up to 80px at mid-flight. Within 90px of the line the paper warms to rgb(255 212 173), shifts up as much as 20px, is drawn in toward the middle by 20% and wobbles, so it looks pulled into the root of the flame. Fade it over the last 10px.\n- One plume, in one shader over the item, starting at the middle of its bottom edge: a narrow root, half-width 36 to 62px, plus 0.75 * up above the base, so the flame opens as it climbs. Never make it widest at the bottom, or it reads as a block. Height from 90 to 300px, growing in over 0.16s and pulsing about 10%. It sways more the higher it goes: sin(3.6t + up * 0.012) * up * 0.08 + sin(6.1t + up * 0.03) * up * 0.03. fan = (x - middle - sway) / (half-width + up * 0.75).\n- The shape: m = 1 - length(fan, rel) - (v.x - 0.35) * 0.3, drawn where m \u003e 0. The crown has pointed tongues that run along it: rel = (up / height) / (0.86 + 0.5 * c1^2 + 0.18 * c2^2), with c1 = 1 - abs(sin(fan * 3.4 + 2.6t + sin(1.7t))) and c2 = 1 - abs(sin(fan * 7.1 - 4t + 1.3)).\n- The lobes: Voronoi at q = (fan * 2.4, (up + 20)^0.8 * 0.02 - 2.6t), warped by up to 0.58 of noise, its points circling at 3.2 rad/s; v.x is the distance to the nearest point and v.y to the second. Fanning this way makes the borders long curves rising from the base. The bottom edge is scalloped: smoothstep(0, 1, (rise + 14 - v.x * 46) / 12).\n- Color: pink rgb(250 153 168) and orange rgb(255 168 87) in soft noise patches, lighter inside each lobe toward rgb(255 204 163); veins where v.y - v.x is under 0.04 to 0.075, in rgb(255 240 158); a near-white rgb(255 247 214) heart over the lower half; a soft halo rgb(255 184 143) around it at 30%.\n- Six pieces break off from 0.25s, one every 0.13s, each an oval 26 down to 6px, floating up 120 to 240px over 0.55 to 0.85s. 44 pale dots rgb(255 237 189) of 4 to 12px rise from it between 0.15 and 0.85s.\n- From 0.72s it burns out quickly rather than flying away as a block: with gone = smoothstep(0.72, 1.16, t), height times 1 + 1.3 * gone^2, half-width times 1 - 0.6 * gone, the spread above going from 0.75 to 0.32, sway up to 2.2 times, and it breaks up from the root (subtract gone * (1.25 - 0.55 * rel) * (0.55 + 0.45 * noise) from m), so the tips go last. The root rises only 150px * gone^2.\n\n5. Blocks (1.5s)\n- A 70ms hit first: the item swells 4% and flashes up to 55% white, sin(pi * t / 0.07).\n- Then chunks in three sizes on a 36px grid: 35% stay whole, 45% split to 18px, 20% to 9px. Each shows its own slice of the item, with a 1px outline at 20%, a bottom and right edge up to 36% darker over 5px, and its own shade of 92 to 100%, so it looks solid.\n- All burst at once from the middle, with up to 30ms of stagger. Direction: normalize((from - center - (0, 14)) * (1, 2.2) + up to 20px of random). Speed (200 + rand * 400 + 220 * nearness) * (1.25 - size / 72), plus 430 upward; gravity 2300 px/s^2; spin up to 6 rad/s.\n- They land on the bottom of the visible list, within 26px of it, bounce once at 42% speed with 60% of their sideways speed and 40% of their spin, and shrink to 20% and fade after 0.95 to 1.25s.\n- The gap: if my list can bring an item in from above, the item above falls in with a bounce and a new one drops in on top 90ms later, over 700ms: a fall (t / 0.5)^2 landing halfway, then bounces of 10% (t 0.5 to 0.76) and 3% (t 0.76 to 1). Otherwise use the spring in section 2.\n\n6. Peel (1.2s; the pull takes 0.62s)\n- The item is a mesh (5px cells) bent over a cylinder of radius 20 whose line moves across it from the corner, in the direction (-0.55, 1) normalized for a control at the top right, reaching the far corner at 0.62s. Position of the line: reach * p^2 * (1.6 - 0.6p). It starts slowly and speeds up as the last of the adhesive gives way, so the sheet never stops before it comes free.\n- For a point past the bend by e along that direction: up to the bend angle (1.3 growing to 1.8 rad) follow the cylinder: along = line - r * sin(e / r), z = r * (1 - cos(e / r)). Beyond it follow a wide arc of radius 420, continuing from the cylinder's end with the same tangent. Both keep arc length, so nothing stretches and the pulled corner moves at (1 - cos(bend)) times the speed of the line. Perspective with a focal length of 1400, centered on the screen, not on the item.\n- Draw in order: the adhesive left behind (white at 34%, speckled on a 2px grid, gone 0.3s after release), the part still stuck, the shadow, then the flap. Paint the flap's cells from the stuck end to the free end, so the higher layer of the fold is on top without a depth buffer.\n- The shadow lies on the screen: offset (0.14, 0.22) * z with no perspective, edge softness 8 + 0.24 * z, opacity 34% / (1 + z / 170), rising from nothing over the first 14px of height. It falls on the part still stuck too. Darken that part another 16% in the crease, fading over 16px from the bend.\n- One light from (-0.35, -0.55, 0.76), with the normal (dir * sin(bend), cos(bend)) flipped on the back. Diffuse 0.74 + 0.26 * max(dot(n, L), 0) / L.z. Add a Blinn-Phong highlight (exponent 24, 14%, fading in over the first 0.5 rad) and a rim at the ridge, where the sheet is seen edge-on: (1 - abs(n.z))^5 * 50%.\n- The back is printed in the item's color made livelier (saturation times 1.5, 12% toward white, brightness times 1.06), inside a white die-cut edge 6px wide that follows the item's own corner curve. This is what makes it read.\n- With a click or tap the corner lifts by itself. Only if delete is a drag or swipe in my product, tie the line to the finger and keep the corner under it.\n- At 0.62s the sticker comes free. Measure the velocity of its center of mass, in the plane and in height, over the last few milliseconds and keep it: it moves by v * g where g = (1 - exp(-5t)) / 5 for air drag, falls by (1500 / 5) * (t - g), turns 2.4 * g rad about its center of mass, and fades over 0.3 to 0.55s.\n\n7. The neighbors\nEach item knows its distance d in the list; the effect falls off as 1 / |d|. Apply these to my real items with transforms and paint only. They must not change layout or block input.\n- Burn and Plume: light on the edge facing the fire, a radial gradient 230px wide, transparent at 72%, painted as part of the item's own fill (a separate layer with the same rounded shape leaves a pale rim at the corners). 42% for the nearest and 10% for the next, flickering 0.8 + 0.2 * sin(31t) * sin(13t). For Burn it follows the front; for Plume it stays at the middle. Burn uses rgb(255 176 96), Plume rgb(255 178 150). They also lean away 3px (Plume 7px) and shrink 0.6%. All of it ramps in over 150ms and out over the last 350ms of 1.4s (Plume 1.25s).\n- Burn and Plume also send up heat: noise that drifts upward at 170px/s moves the pixels of the neighbors and the heading, up to 4px for Burn and 5px for Plume sideways and about a third of that vertically, outlines included. Items below get 60%, the heading 50% for Burn and 70% for Plume. Keep its vertical noise period around 80px and one octave: whole lines should bend smoothly; shorter periods tear individual letters apart. Heat is only on while there is fire. It should be noticeable and never hurt reading.\n- Blocks: the impact pushes them away and they ring back: 18px * exp(-6.5t) * sin(24t), with a tilt of 1.1 degrees * exp(-6.5t) * sin(20t) and a squeeze of 1.8% * exp(-9t), from 70ms.\n- Peel: they are tugged 6px toward the sticker over the pull, then ring on release: exp(-7t) * cos(26t).\n\n8. Check\n- In my real list, with real data: long text, short text, images, first item, last item, one item only, and the list scrolled.\n- The first frame matches the real item; nothing jumps when it is swapped for the picture.\n- Text around the effect stays readable; the list works during it, and rapid deletes do not leak or stack up. Undo works in the middle of an effect.\n- Reduced motion: no effect and no reactions, a 220ms fade and 4% shrink, then the gap closes. The same when the renderer is unavailable or its context is lost, and for anything past 3 at once.\n- Focus moves to the next item, and a screen reader hears that it was deleted. At rest my list is pixel-identical to before, and nothing runs when nothing is being deleted. Light and dark both checked. Existing tests still pass.\n\n9. How to build it, by platform\nThese are suggestions; check them against my stack and its versions, and prefer what the product already uses. Every route is the same four parts: a picture of the item, a per-pixel shader (Burn, Plume), a real mesh (Peel, because a fold shows two layers at one point and a per-pixel distortion cannot do that), and many small quads (Blocks and particles).\n- Web: WebGL2 on one canvas over the list, instanced quads for Blocks and particles; if the product already has three.js, Pixi or a similar layer, draw there. Hook the list where it removes items: React and Vue read the rectangle and draw the picture in the click handler before the state update, then close the gap with Motion layout, a FLIP in useLayoutEffect, or TransitionGroup; Svelte with animate:flip; Virtuoso, TanStack Virtual and similar need the surface outside the virtual list.\n  - Heat, best first: where HTML-in-Canvas exists, draw the list through WebGL and warp it per pixel in one field around the fire: strongest within the fire's box, falling off as a Gaussian of 170px, reaching about twice as far above as below (progressive enhancement: feature-detect it, keep the DOM layout; the WebGL upload call has changed between Chrome versions, so drawing with drawElementImage to a 2D canvas and uploading that is the steadier path). Otherwise an SVG filter on each neighbor: feTurbulence with baseFrequency 0.008 0.013 and one octave, the red channel's contrast doubled so the movement is even, an feOffset that moves it up, feDisplacementMap with a scale of about 2.5 times the wanted pixels. It does not smooth what it moves, so rebuild the outline: dilate the result by 1px under itself and cut it to its own alpha blurred by 0.8px with the slope doubled. Apply it only during the effect, and test it in Safari. If neither works, leave heat out.\n  - The snapshot: when the item is simple, redraw it to a 2D canvas (synchronous and exact, including text positions read from Range rects, reading font, color and letter-spacing from computed style). HTML-in-Canvas gives the live page in recent Chromium behind a flag, with no Firefox or Safari yet. html-to-image or modern-screenshot work once at delete but cost tens to hundreds of ms and need same-origin fonts and images. html2canvas is a last resort.\n  - Without WebGL2: Blocks can run in Canvas 2D with drawImage slices up to a few hundred chunks; the rest fall back to the fade.\n  - Cost: Burn's flames are the heaviest shader; on low-end devices sample the front 3 times instead of 5, or draw that layer at half resolution.\n- iOS: snapshot with ImageRenderer or drawHierarchy. In UIKit run it from the data source's delete with the cell's rect; in SwiftUI from the delete action, with an overlay above the List. Burn and Plume fit a SwiftUI .layerEffect (iOS 17+), and heat a .distortionEffect on each neighbor. Peel needs a mesh: Metal, or a SceneKit plane. Blocks fit SwiftUI Canvas in a TimelineView. Below iOS 17: Blocks and the fade.\n- Android: snapshot with View.drawToBitmap or Compose GraphicsLayer.toImageBitmap(). Hook a RecyclerView ItemAnimator, or use Modifier.animateItem() in Compose, with the effect in an overlay. Burn, Plume and heat fit RenderEffect with an AGSL RuntimeShader (API 33+). Peel: Canvas.drawBitmapMesh for each layer in order, or OpenGL ES for true perspective. Blocks: Canvas.drawVertices or drawBitmap with rects.\n- Flutter: snapshot with RenderRepaintBoundary.toImage (async, so capture on tap down or keep one ready). AnimatedList.removeItem for the gap, the effect in an Overlay. Burn and Plume: a FragmentProgram on Impeller. Blocks: Canvas.drawAtlas, cheap for many quads. Peel: Canvas.drawVertices with a textured mesh.\n- Rust: render the item to a texture, then wgpu: instanced quads, and one mesh pipeline for Peel, with the shaders ported to WGSL. In Bevy use Mesh2d with a custom Material2d. In egui or iced, draw through the renderer's wgpu callback; widgets cannot do this themselves. In GPUI, render into a custom element or fall back to the fade.\n- Electron and Tauri: the web route. Electron can ship the Chromium features it needs; Tauri uses the system WebView, so on macOS and Linux test WebGL2 and the heat filter in WebKit.\n- Anything else (Qt, a game engine, a custom renderer): the same four parts in its own shader and mesh tools.","promptUrl":"https://x.com/Kubai087/status/2119831540301692975"}, {"repo": "icons.kubai.design", "url": "https://icons.kubai.design", "why": "Official Kubai Icons playground — 2.8k MIT animated icons with hover motion, React/Vue/SVG, 16 languages", "stars": 0, "license": "", "date": "2026-11-09", "cat": "web", "comment": "Official Kubai Icons playground — 2.8k MIT animated icons with hover motion, React/Vue/SVG, 16 languages"}, {"repo": "lovisdotio/motion2code", "why": "Rebuild a motion clip as looping SVG + one GSAP timeline with seek(t); frame-diff QA against the source, and screen recordings become real ScrollTrigger sites.", "stars": 343, "license": "MIT", "date": "2026-11-09", "cat": "motion", "comment": "Rebuild a motion clip as looping SVG + one GSAP timeline with seek(t); frame-diff QA against the source, and screen recordings become real ScrollTrigger sites."}, {"repo": "Moh4696/open-3d-skills", "why": "Eight agent skills for 3D and animated sites: code-built three.js scenes, scroll films, exploded views, cursor rigs, plus browser checks and 60fps capture.", "stars": 307, "license": "MIT", "date": "2026-11-09", "cat": "skills", "comment": "Eight agent skills for 3D nostic skill that runs a grilling design interview in a local browser page instead of the terminal."}, {"repo": "dgesteves/onsystem", "why": "Design-system guardrails that catch palette/native-element drift at edit and PR time, with MCP hooks.", "stars": 73, "license": "MIT", "date": "2026-10-27", "cat": "lint", "comment": "Design-system guardrails that catch palette/native-element drift at edit and PR time, with MCP hooks."}, {"repo": "academa-labs/manimgx", "why": "Fast Manim-compatible animation engine for agents — math/3D video on a Rust GPU core.", "stars": 2156, "license": "MIT", "date": "2026-10-27", "cat": "motion", "comment": "Fast Manim-compatible animation engine for agents — math/3D video on a Rust GPU core."}, {"repo": "Glass-HQ/liquid-glass", "why": "Liquid Glass materials for web and Electron (vgpu), a cleaner kit than prior glass near-misses.", "stars": 484, "license": "MIT", "date": "2026-10-27", "cat": "kits", "comment": "Liquid Glass materials for web and Electron (vgpu), a cleaner kit than prior glass near-misses."}, {"repo": "addyosmani/agent-skills", "why": "Addy's production engineering skill pack — lifecycle slash commands + quality gates for Cursor/Claude/Codex.", "stars": 111007, "license": "MIT", "date": "2026-10-27", "cat": "code", "comment": "25 production engineering skills + /spec→/ship lifecycle commands for Cursor/Claude/Codex."}, {"repo": "vibrant.design", "url": "https://vibrant.design/", "why": "Curated website, section, launch-video and UI inspiration from the best of the internet.", "stars": 0, "license": "", "date": "2026-10-27", "cat": "web", "comment": "Curated website, section, launch-video and UI inspiration from the best of the internet."}, {"repo": "detail.design", "url": "https://detail.design/", "why": "Curated interface craft examples — micro-interactions, type, motion, a11y, copy — where craft lives.", "stars": 0, "license": "", "date": "2026-10-28", "cat": "web", "comment": "Curated interface craft examples — micro-interactions, type, motion, a11y, copy — where craft lives."}, {"repo": "detaildotdesign/skill", "why": "Official detail.design agent skill: micro-interactions + polish rules from 120+ real examples for Cursor/Claude/Codex.", "stars": 68, "license": "MIT", "date": "2026-10-28", "cat": "skills", "comment": "Official detail.design agent skill: micro-interactions + polish rules from 120+ real examples for Cursor/Claude/Codex."}, {"repo": "kubai tip 001 — tactile buttons", "url": "https://x.com/Kubai087/status/2114378773655326873", "why": "Copy-paste prompt for skeuomorphic buttons (5 variants, material layers, press feel) from Kubai’s 999 vibe-tips series.", "stars": 0, "license": "", "date": "2026-10-25", "cat": "tips", "comment": "Copy-paste prompt for skeuomorphic buttons (5 variants, material layers, press feel) from Kubai’s 999 vibe-tips series.","prompt":"Define a tactile, skeuomorphic Button component with five variants, from\nstrongest to weakest: primary, secondary, tertiary, ghost, text.\nIf the project already has a component library or design system, do not\nadd a new component: restyle its existing Button through its own variant\nand token system, and keep its API, props and accessibility as they are.\nOtherwise create one reusable Button with `variant` and `size` props.\n\nStyle: calm and precise, like the Lumno browser extension and the Cloudflare\ndashboard. Neutral grays only, no brand hues. Lit from straight above.\nNo glossy Web 2.0 shine, no glow, no large blur.\n\nVariants:\n1. primary   - near-black slate face (#404859 -\u003e #273042), white label\n2. secondary - raised white key (#FFFFFF -\u003e #F4F5F7), dark gray label\n3. tertiary  - soft gray key (#F3F4F6 -\u003e #E7E9EC), dark gray label\n4. ghost     - no face at rest; faint gray fill on hover; a recessed well\n               when pressed\n5. text      - gray label with a thin underline and an arrow that nudges\n               right on hover\n\nEvery filled variant is the same five material layers; only the values\nchange, so define them once as tokens and let each variant set its own:\n1. Face: 180deg linear gradient, top 6-8% lighter than bottom.\n2. Edge: 1px solid border one step darker than the bottom of the face\n   (primary #12161F, secondary rgba(15,23,42,.14), tertiary rgba(15,23,42,.1)).\n3. Top highlight: inset 0 1px 0 white (18% on slate, 85-100% on light\n   faces). Put every inset layer in the button's own box-shadow, before the\n   drop layers, never on a pseudo-element overlay: inset shadows on the\n   element follow the inner radius (outer radius minus border), so the\n   corners line up in every state.\n4. Bottom shade: inset 0 -1px 0 black (22% on slate, 6% on light faces).\n5. Drop shadow in two layers: a tight contact shadow 0 1px 2px plus a soft\n   lift 0 4px 10px -3px (18% and 28% on slate, about a third of that on\n   light faces).\n\nStates (hover, pressed/active, focus-visible, disabled):\n- Hover: face one step lighter; the lift grows to 0 8px 16px -5px.\n- Pressed: translateY(1px); flip the gradient (darker on top); the outer\n  shadow collapses to 0 1px 1px; the top highlight becomes an inner shadow,\n  inset 0 1px 2px black (40% on slate, 12-16% on light faces). Light faces\n  keep a 1px white line below, 0 1px 0 rgba(255,255,255,.9), like a key\n  pressed into paper.\n- Give rest and pressed the same number of inset layers (pad with\n  inset 0 0 0 transparent) so the shadow animates instead of jumping.\n- Focus-visible and disabled follow the library's existing conventions.\n- Timing: 120ms for transform, 140ms for shadows, 160ms for colors.\n\nSizes: all values above are for the 14px label size: height 40px,\npadding 0 18px, radius 10px, label weight 600, optional 16px leading icon.\nOn the slate face add a label text-shadow 0 -1px 0 rgba(0,0,0,.28).\nScale the material with the type, never keep it at fixed pixels: express\nevery length (height, padding, radius, border, icon, the 1px press offset,\nand every shadow offset, blur and spread) as a multiple of a size unit\nu = label size / 14. Provide two sizes: md (14px label, u = 1px) and\nlg (16px label, u = 16/14 px, so height 45.7px, radius 11.4px, lift shadow\n0 4.6px 11.4px -3.4px).","promptUrl":"https://x.com/Kubai087/status/2114378773655326873"}, {"repo": "kubai tip 002 — cascade safe zone", "url": "https://x.com/Kubai087/status/2114729985143677258", "why": "Nested-menu prompt with triangle safe-zone + open/close delays so submenus don’t vanish on diagonal moves.", "stars": 0, "license": "", "date": "2026-10-26", "cat": "tips", "comment": "Nested-menu prompt with triangle safe-zone + open/close delays so submenus don’t vanish on diagonal moves.","prompt":"Define a cascading (nested) menu component that keeps its submenus steady: a safe zone plus three delays, so submenus open on purpose, survive diagonal moves toward them, and do not vanish on a brief slip out of the menu. If the project already has a menu or dropdown component, build this into its existing submenu logic and keep its API, keyboard support and accessibility as they are. Otherwise create one reusable CascadeMenu:\n\nProps: an anchor (the trigger button that opens it on click) and a tree of items, each { label, icon?, href?, children? }. An item with children is a folder row; one without is a plain row that navigates on click.\nEach level shows its folder's name as a small title above its rows.\nKeyboard: arrow keys move through rows, Right/Enter opens a folder, Left goes back a level, Escape closes everything and returns focus to the anchor. Use menu / menuitem roles and aria-expanded on folder rows.\nBehavior, with the values to use:\n\nOpen delay: hovering a row schedules it to take effect after 220ms: a folder row opens its submenu, a plain row closes any deeper submenu. Leaving the row before then cancels it. Touch input acts at once.\nSafe zone: while a submenu is open, build a triangle from the pointer's previous position to the two corners of the submenu's near edge (the left edge's top and bottom for a submenu on the right). Track the last two pointermove positions and use the older one as the apex, so the triangle never collapses onto the current point. If the pointer is inside that triangle and within the parent's last min(90px, max(56px, 43% of the parent width)) toward the submenu, it is on its way there: rows it crosses must not highlight or open their own submenus.\nSafe window: a row hovered inside the safe zone does not switch the submenu right away. Recheck every 80ms; switch once the pointer leaves the zone, or when 1200ms have passed since the hover began, so a pointer that simply stops there still gets its new submenu.\nClose delay: when the pointer leaves the anchor, every open level and the safe zone, close the whole menu after 360ms. Coming back in time cancels the close. Clicking outside closes at once.\nDragging an item over a folder row opens it after 420ms instead of 220ms.\nThe pointer inside an open submenu ends all protection. Drive row highlight from component state (hovered, active, skipped), not from CSS :hover, or rows crossed inside the safe zone will still light up.\nGeometry and motion:\n\nSubmenus open to the right, overlap their parent by 8px and align their first row with the parent row. Flip to the left when there is no room; the safe zone then uses the submenu's right edge.\nLevels: 210-260px wide, sized to content, max height min(420px, 100vh - 24px) with their own scroll, 6px padding, 12px radius, 1px border, backdrop-filter blur(18px) saturate(135%).\nRows: 32px tall, 8px radius, 4px apart, 0 8px padding, 8px gap; 18px icon, 14px weight-500 label, a 16px chevron on folder rows. Level title: 11px, weight 600, quiet ink, padding 4px 8px 2px.\nA submenu opens from its parent's edge: from translateX(-8px) scale(0.88, 0.98) and opacity 0, with opacity over 170ms and transform over 360ms on cubic-bezier(0.2, 1.45, 0.35, 1).\nThe root level opens the same way from its anchor: from translateY(-6px) scale(0.96, 0.86), top-left origin. Keep the overshoot curve: the slight spring is part of the feel.\nA folder row's icon turns from a closed folder into an open one while its submenu is open, and back when it closes, over 460ms on cubic-bezier(0.22, 1, 0.36, 1). Morph the paths if the two glyphs share their structure; otherwise cross-fade them with a slight lift of the front panel.\nLight and dark themes come from tokens, not separate components:\n\nLight: surface rgba(255,255,255,.96), border rgba(0,0,0,.14), row ink #263140, row hover rgba(15,23,42,.07), quiet ink #7A8491, chevron #94A3B8, shadow 0 18px 34px rgba(15,23,42,.12), 0 2px 4px rgba(15,23,42,.05), inset 0 1px 0 rgba(255,255,255,.74).\nDark, neutral grays with no blue cast: surface rgba(34,34,34,.96), border rgba(255,255,255,.12), row ink #E4E4E4, row hover rgba(255,255,255,.08), quiet ink #9A9A9A, chevron #8A8A8A, shadow 0 18px 34px rgba(0,0,0,.42), 0 2px 4px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.06).\nMonochrome brand icons invert in dark. Switching themes cross-fades colors, borders and shadows over about 500ms.\nKeep every timing value as a named constant in one place, and keep the safe-zone math in a pure, unit-tested helper (point-in-triangle by the sign of the three edge cross products). Add an optional debug overlay that draws the zone (blue fill at 16%, dashed blue outline) and the running timer, off by default.","promptUrl":"https://x.com/Kubai087/status/2114729985143677258"}, {"repo": "kubai tip 003 — dither & ASCII", "url": "https://x.com/Kubai087/status/2115091203465290087", "why": "EffectLayer + EffectPanel prompt for live ASCII/Bayer dither on login cards, with mask/palette/strength controls.", "stars": 0, "license": "", "date": "2026-10-27", "cat": "tips", "comment": "EffectLayer + EffectPanel prompt for live ASCII/Bayer dither on login cards, with mask/palette/strength controls.","prompt":"Add an ASCII / ordered-dither effect to one specific image or video in this project, with a live control panel next to it. Use the asset and the place I name (an , a , or a file path or URL, and the page or section it sits in); ask me if I have not named them. Apply the effect to that asset only, in place: keep its size, position, rounded corners and anything layered on top of it. If the project already has an image or canvas effect pipeline, or slider, segmented-control and panel components, build on them; otherwise create a reusable EffectLayer and EffectPanel.\n\nSettings, one object shared by the layer and the panel: { filter: 'ascii' | 'dither', mask, palette, inkTone, strength, size, spacing } Keep separate values per filter, so switching filters brings back that filter's own settings.\nWhat each control does in each filter, its range, and the recommended value (ASCII / Dither):\n\nMask effect, 0-100 (90 / 88): a vertical veil over the picture so the effect reads as texture rather than noise. Same in both filters.\n\nColor, Original or one of five palettes (Original): gradient-maps the asset's luminance into one color family before filtering.\nSample tones, Shadows | Highlights (Shadows; ASCII only, hidden for Dither): which end of the tonal range becomes dense characters.\nSampling strength, 0-100 (100 / 100). ASCII: contrast of the tone curve and how bright and opaque the characters are. Dither: how few levels each color channel keeps (8 at 0, 2 at 100) and how fully the quantized color replaces the original.\nSize, 0-100 (37 / 15). ASCII: font size, 7-24px. Dither: pixel block, 2-9px.\nSpacing, 0-100 (0 / 0). ASCII: grid step, 8-24px across and 9-26px down, never tighter than the glyphs. Dither: scale of the Bayer pattern, 1-4 blocks per matrix cell.\nHelpers used throughout:\nrange(v, a, b) = a + (b - a) * v / 100\nluminance L = (0.299 R + 0.587 G + 0.114 B) / 255\n\ns = strength / 100\n\"The box\" is the asset's rendered size on the page.\nSampling:\nCover-fit the asset into the box and draw it into a small sampling canvas (about 480px on the long side), then read it with getImageData. A sample is the pixel under a point in the box, composited over white.\nWith a palette, recolor that canvas first: map each pixel's L through a 256-entry lookup built from the palette's four stops.\n\nPer image or video frame, take about 12,000 evenly spaced samples: low = 8th percentile of L, high = 92nd percentile.\nShadows means dark ink, Highlights light ink.\nASCII:\nCharacters, from empty to full: \" .,:;-=+xX08S#&@\" (starts with two spaces).\nFont: round(range(size, 7, 24))px monospace (22 instead of 24 when the box is under 720px wide), centered in each cell.\n\nGrid: x step = max(range(spacing, 8, 24), widest glyph * 1.08); line height = max(range(spacing, 9, 26), height of \"@\" * 1.12, font * 1.04). The first cell sits half a step in from the edge.\nTone of a cell: raw = dark ink ? 1 - L : L; normalized = dark ink ? (high - L) / (high - low) : (L - low) / (high - low), clamped 0-1 (use raw alone when high - low \u003c 0.025); mix = 0.72 + 0.14 s; t = raw (1 - mix) + normalized mix. Then a tone curve: black = 0.22 s, white = 1 - 0.08 s, lev = clamp((t - black) / (white - black), 0, 1), tone = lev (1 - s) + smoothstep(lev) s.\nSkip cells with tone \u003c= 0.02. Character = chars[round(tone * 16)]; skip spaces.\nInk: the sampled color lifted in HSV: value += (1 - value) * (0.24 + 0.18 s + 0.24 tone); saturation *= 1 + 0.16 + 0.2 s (clamped). Alpha = clamp((0.12 + 0.7 tone) (0.72 + 0.28 s), 0.06, 0.94).\nDither (ordered, Bayer 4x4):\npixel size = max(2, round(range(size, 2, 9))) (7 instead of 9 under 720px); pattern scale = max(1, round(range(spacing, 1, 4))); levels = max(2, round(range(strength, 8, 2))) per channel; blend = range(strength, 0.32, 1).\nMatrix [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]]; threshold = (m + 0.5) / 16, indexed by floor(x / pattern scale), floor(y / pattern scale).\n\nFor each block sample its center, push saturation away from luma by 1 + 0.06 + 0.18 s, then per channel: scaled = c / 255 * (levels - 1); q = floor(scaled) + (fraction \u003e threshold ? 1 : 0); out = c + (q / (levels - 1) * 255 - c) * blend.\nWrite the blocks into a canvas of box / pixel size and draw it scaled up with image smoothing off.\nMask and layering:\nThe mask is a vertical gradient with stops at the top, 42% and the bottom. Base opacities: on a light page white 54/20/38%, on a dark page black 44/20/50%. For a mask value v: stop = v \u003c= 50 ? base * (v / 50)^1.08 : base + (100 - base) * ((v - 50) / 50)^1.08.\nASCII: draw the (recolored) picture, the mask, then the characters. Dither: draw the dithered picture, then the mask on top.\n\nChanging filter or palette cross-fades from the last frame over 150ms.\nPalettes (four stops at 0, 0.4, 0.74, 1):\nmeadow: #2B361F, #677D45, #AEBA78, #E5E1BD\nblue: #192A4D, #326AC5, #A2C2F1, #EDF3FC\namber: #3C200F, #A74C15, #EF9A46, #F7E7CA\nlavender: #292144, #6552AB, #B3A5E4, #F0ECFB\n\nmono: #151515, #575757, #A6A6A6, #ECECEC\nRendering:\nDraw into a canvas laid over the asset with the same size and corner radius, at devicePixelRatio capped at 1.6x and about 2048 x 2048.\nImage: redraw when a setting changes (debounced 72ms).\nVideo: redraw on every new frame (requestVideoFrameCallback, falling back to requestAnimationFrame) while it plays and is on screen; keep the video element underneath as the source.\nControl panel:\n\nPlace it next to the asset, below it when there is room, otherwise beside it, never covering it. About 420px wide, centered on the asset.\nRows, in order: Mask effect, Filter (two tabs: ASCII | Dither), Color (round swatches), Sample tones (ASCII only), Sampling strength, Size, Spacing (shown with %).\nEach row 46px tall: a 136px label column, then the control. Slider: a 22px track with 8px radius and a filled part, a 9x30 rounded-rectangle thumb (3px radius), a number box with the value centered, and a snap mark at 50. Swatches: 22px circles, each filled with its palette's two middle stops at 135deg (Original: a tiny crop of the asset); the selected one gets a ring with a small gap.\nEvery change applies live while dragging. Add a \"Reset to recommended\" action that restores the values above for the current filter.\n\nFollow the page's light or dark theme and the project's tokens.","promptUrl":"https://x.com/Kubai087/status/2115091203465290087"}, {"repo": "kubai tip 004 — progressive radii + superellipse", "url": "https://x.com/Kubai087/status/2115469767650021796", "why": "Copy-paste prompt: nested radii via r=R-p, then progressive-enhance with corner-shape: superellipse(1.25).", "stars": 0, "license": "", "date": "2026-10-28", "cat": "tips", "comment": "Copy-paste prompt: nested radii via r=R-p, then progressive-enhance with corner-shape: superellipse(1.25).","prompt":"Make the corner radii in this UI consistent, then switch them to continuous corners. Work on the screen or components I name; ask me if I have not named them. If the project has radius tokens, change those instead of hard-coding values.\n\nInner radius = outer radius - padding (r = R - p)\nGo from the outside in: dialog or card -\u003e panels, inputs, buttons -\u003e chips and tags. A box p inside a container with radius R gets R - p, so both corners share one center. Example: dialog 32, padding 16 -\u003e panels and buttons 16; a chip 8 inside a 16 panel -\u003e 8.\nBoxes on the same level share one radius. Never go below 4.\n\nPills and circles stay fully round.\nKeep every padding, gap and radius on a 4px grid.\nContinuous corners\nKeep border-radius and add the curve as progressive enhancement: @ supports (corner-shape: superellipse(1.25)) { :where(*) { corner-shape: superellipse(1.25); } } Set corner-shape: round on pills and circles.\n\nChrome and Edge 139+ render it; Safari and Firefox skip the block and show the plain border-radius.\nWhen done, list every radius you changed as \"element: old -\u003e new\".","promptUrl":"https://x.com/Kubai087/status/2115469767650021796"}, {"repo": "kubai tip — dynamic bento feature tiles", "url": "https://x.com/Kubai087/status/2115393082472681875", "why": "Full prompt for animated product-site bento tiles (action→result scenes, Lumno material or brand tokens, reduced-motion).", "stars": 0, "license": "", "date": "2026-10-28", "cat": "tips", "comment": "Full prompt for animated product-site bento tiles (action→result scenes, Lumno material or brand tokens, reduced-motion).","prompt":"# Small animations for a product site's feature tiles\n\nGive every tile in my site's feature grid a small animation: a tiny scene that shows what the feature does.\n\n## 0. Before you build\n- Read the project: find out the tech stack (plain HTML/CSS, React, Vue, Svelte, Astro, Tailwind, Framer Motion…) and build it the way the project already does. Don't add an animation library unless the project already uses one.\n- Ask me which look to use:\n  A. The Lumno material below, as written.\n  B. My product's own style: take the colors, radii, borders and shadows from my existing design tokens and components, and keep only the structure and motion rules from this prompt.\n  C. A mix: the Lumno material in my brand's accent color and radii.\n- Picking features: if I named features, animate those. If not, read the product's site, docs or code, list 3–5 features that a short scene can explain, and let me pick.\n\n## 1. Lumno material (option A)\nOverall: quiet, neutral, precise. Hairlines instead of borders, soft shadows tinted warm, no gradients or color washes, one accent color.\n\n- Grid: one card with an outer radius of 28px. Cells are separated by 1px hairlines (a 1px grid gap over a hairline color). Cells are white. The card has a faint hairline ring and a soft shadow.\n- Art panel: inset 8px from the cell edge, with a radius of the card radius minus the inset (20px), so corners stay concentric.\n  - Fill #fafafa, plus an inner 1px ring: box-shadow: inset 0 0 0 1px rgba(32,38,46,.07).\n  - Texture: background: repeating-linear-gradient(-45deg, rgba(32,38,46,.06) 0 1px, transparent 1px 7px).\n  - The scene sits centred on the panel, about 126×118px.\n- Text bars: body bars 4px tall with a 2px radius in #e5e9ef; heading bars 5px tall in #cdd4de. Vary the widths (34–92px).\n- Mini windows and cards: white with a 9px radius.\n  - Shadow: 0 0 0 1px rgba(47,42,34,.06), 0 8px 20px -10px rgba(47,42,34,.25).\n  - Tab strip: 20px tall, #eef1f5. Tabs: 16px tall with 6px top corners; the active tab is white.\n  - Favicons: 10px.\n- Inner surfaces such as charts or fields: #f4f6fa. Secondary data: #b9c9e0. Accent: #3462ad, used only on the result.\n- Icon chip (top-left of each tile): 32px, 10px radius, 1px border rgba(32,38,46,.1), white, shadow 0 1px 2px rgba(32,38,46,.05), a line-style glyph in #4b5563.\n- Text color: a warm near-black, #2f2a22.\n- Hover: the cell darkens to about 2.5% grey; the panel goes to #f4f5f6 with its ring at .09; the icon chip grows 32→36px from its top-left corner, its glyph turns to the text color, and its shadow deepens slightly.\n- Dark mode (suggested values; keep the same relationships):\n  - Cells #17181a, panel #1d1f22, inner ring rgba(255,255,255,.06), texture rgba(255,255,255,.04).\n  - Body bars #2c2f34, heading bars #3a3e45.\n  - Windows #24272b with a 1px rgba(255,255,255,.06) outline and a shadow of 0 8px 20px -10px rgba(0,0,0,.6).\n  - Tab strip #1a1c1f, accent #6f9bea, text #ecebe8.\n\n## 2. Scene\n- One idea per tile: 2–4 moves that show \"action → result\", such as \"click → a small window opens\" or \"change here → the other side syncs\".\n- Abstract wireframes only: no screenshots and no real text. Use at most one small icon where something needs to be recognisable.\n- Motion: ease-out for movement, cubic-bezier(.22,1,.36,1); a slight spring for appearing, cubic-bezier(.34,1.4,.64,1). Each move takes 250–600ms; the whole scene is done in about 3s.\n- Icon chip: when the tile plays, its glyph redraws stroke by stroke (draw, pop or slide per part), then hands back to the solid icon.\n\n## 3. Playback\n- Resting styles are the final frame. Animations only describe where things come from (fill-mode: both or equivalent), so reduced motion shows the result and an interrupted play never jumps.\n- The art panel fades in (opacity, plus translateY 6px and scale .97 to none) as its tile first plays.\n- Play once in view: when about 70% of the tile is visible, wait ~200ms, then play. Tiles that enter together go ~250ms apart, in reading order. Stop on the final frame.\n- One \"played\" state (a class or data attribute) drives every animation in the tile. To replay: remove it, force a reflow, add it back (or re-key in a framework).\n- On mouse hover (mouse only) or keyboard focus, replay: blur the final frame out over ~160ms (blur 6px, opacity 0), restart under the blur, then clear it. Don't restart a play that hasn't finished.\n- Optional loop on hover: while the pointer stays on the tile, replay again ~600ms after each play ends. When the pointer leaves, finish the current play and rest on the final frame.\n- Touch: a tap follows the tile's link; nothing depends on hover.\n- prefers-reduced-motion: reduce: no animation; show the final frame.\n\n## 4. Colors and dark mode\n- Every color is a variable on the art panel (panel, ring, texture, bars, windows, tab strip, accent, shadow); no hard-coded colors in the rules.\n- Follow prefers-color-scheme, and the project's manual theme switch too (a class or data-theme), if it has one.\n- Check it in both light and dark.\n\n## 5. Delivery\n- Mark the art as decorative (aria-hidden) and keep translatable text out of it.\n- Check it in a real browser: first play, hover replay, keyboard focus, reduced motion, dark mode and a phone-width layout.","promptUrl":"https://x.com/Kubai087/status/2115393082472681875"}, {"repo": "lumno.kubai.design", "url": "https://lumno.kubai.design/", "why": "Kubai’s Lumno — open-source browser command bar + minimal new tab; the craft reference behind the tip series.", "stars": 0, "license": "", "date": "2026-10-28", "cat": "tips", "comment": "Kubai’s Lumno — open-source browser command bar + minimal new tab; the craft reference behind the tip series."}, {"repo": "kubai087/lumno-extension", "why": "Open-source Chrome/Firefox command palette + new tab (Spotlight-style); pairs with the tip series craft bar.", "stars": 318, "license": "GPL-3.0", "date": "2026-10-28", "cat": "kits", "comment": "Open-source Chrome/Firefox command palette + new tab (Spotlight-style); pairs with the tip series craft bar."}, {"repo": "jakubkrehel/skills", "why": "interface skill pack — a11y, type, color, layout, writing reviews for agents", "stars": 8812, "license": "MIT", "date": "2026-10-28", "cat": "skills", "comment": "interface skill pack — a11y, type, color, layout, writing reviews for agents"}, {"repo": "storytold/figcraft", "why": "open-source collaborative design/prototyping app in pure Rust", "stars": 3640, "license": "Apache-2.0", "date": "2026-10-28", "cat": "kits", "comment": "open-source collaborative design/prototyping app in pure Rust"}, {"repo": "enesozturk/dimensional-drawing", "why": "agent skill for Apple-style dimensional drawings of UI components", "stars": 1254, "license": "MIT", "date": "2026-10-28", "cat": "skills", "comment": "agent skill for Apple-style dimensional drawings of UI components"}, {"repo": "Tejashmakwana/motionmaxxing", "why": "agent skill that turns AI motion-graphics slop into designer-looking films", "stars": 1085, "license": "Apache-2.0", "date": "2026-10-28", "cat": "motion", "comment": "agent skill that turns AI motion-graphics slop into designer-looking films"}, {"repo": "vercel-labs/design-systems-to-agent-skills", "why": "Vercel Labs pipeline that turns a design system into agent skills", "stars": 46, "license": "MIT", "date": "2026-10-28", "cat": "skills", "comment": "Vercel Labs pipeline that turns a design system into agent skills"}, {"repo": "bilune/jev-design", "why": "demo console whose whole d
