why": "PR UI skill: before/after screenshots, pixel diffs and a short UX summary as one sticky comment (images stay on an orphan branch).", "stars": 120, "license": "MIT", "date": "2026-11-23", "cat": "lint", "comment": "PR UI skill: before/after screenshots, pixel diffs and a short UX summary as one sticky comment (images stay on an orphan branch)."}, {"repo": "AdityaKodez/trazo", "why": "Hand-drawn crayon sticker SVGs with React and Vue components and a browseable canvas (trazo.akoder.xyz).", "stars": 86, "license": "MIT", "date": "2026-11-23", "cat": "icon", "comment": "Hand-drawn crayon sticker SVGs with React and Vue components and a browseable canvas (trazo.akoder.xyz)."}, {"repo": "kubai tip 022 — empty states", "url": "https://x.com/Kubai087/status/2124170395825873348", "why": "Three empty-state treatments (wireframe, two-tone icon, mini row) plus size and copy rules — diagnose-then-fix prompt", "stars": 0, "license": "", "date": "2026-11-21", "cat": "tips", "comment": "Three empty-state treatments (wireframe, two-tone icon, mini row) plus size and copy rules — diagnose-then-fix prompt","prompt":"Review every place in my product that can be empty, and decide for each one what kind of empty it is, how big it should be, and what it should say and show. Then, if I want it, change the ones I approve. This is about judgment first: diagnose and recommend, and change only what I approve.\n\nThis is a change to my product, not a demo. Work inside my code, on my stack, with my components, tokens, icons and copy style. Do not add a dependency or a new visual pattern without asking. Every value below is a default to start from.\n\n0. Read the product first\n- Find every place that can show nothing: lists and tables, boards and calendars, inboxes and notifications, search and filter results, dashboards and chart cards, folders and uploads, comments and activity, members and invites, trash and archives, menus and pickers with no options, pages that can fail to load, and pages a person may not be allowed to open.\n- For each one, note: what normally fills it; why it can be empty (nothing made yet, a search or filter, everything handled, a failed load, no permission, offline); how big the empty area is (a page, a card, one row of a list, a line in a menu); and what it shows today (nothing at all, a bare \"No data\", a stock illustration or emoji, a spinner that never ends).\n- Find the shared pieces: an EmptyState component if there is one, the icon set and whether it has a two-tone or filled style, the button styles, the skeleton and error components, and how light and dark mode are switched.\n- Tell me in a few lines what you found before going on.\n\n1. The kinds of empty\na. First use: nothing has been made yet (a new project, a new account, a first folder).\n  - Show what will be here: a wireframe of this very screen, filled in, in miniature (see 4), or a two-tone icon of what lives here.\n  - Title: the state in a few words (No tasks yet). Description: how to start, in one sentence.\n  - Buttons: one main action that makes the first thing (New task), and at most one other way in (Use a template, Import).\n  - When the first thing is made, it takes the empty state's place at once; nothing else on the page moves.\nb. No results: a search or filter found nothing. The product is not empty, so never say it is.\n  - Keep the search text and every active filter in view, exactly as the person left them.\n  - The title names what was searched (No tasks match \"invoice q3\"). The description offers one fix (check the spelling, search every project).\n  - Buttons: Clear search or Clear filters, as a secondary button; and, when it exists, a wider search as a ghost button.\n  - The picture is small (80 × 60 at most), or there is none.\n  - In a search menu or a picker, it is one grey line with no picture (No tasks match \"invo\"), updated as the person types.\nc. All done: everything was handled (an inbox cleared, a queue emptied, no notifications, an empty trash).\n  - Say so plainly (You're all caught up), and in the description what will show up here next.\n  - No button, and no accent colour in the picture: there is nothing to do.\nd. Failed: the content could not be loaded.\n  - Show it only where the failure is: the one card, list or panel that did not load, never the whole page when the rest of it loaded.\n  - While loading, that area shows a skeleton in its own shape (the real rows, the real chart's columns); when the load fails, the skeleton gives way to the empty state in the same place, at the same size.\n  - The picture is a two-tone alert icon, not a wireframe. Title: what did not load (Couldn't load this chart). Description: what happened and what is safe (The connection dropped. Nothing was lost.).\n  - Button: Try again, as a secondary button whose own reload icon turns while it retries; on success the content comes in where the empty state was.\n  - Offline is this kind too: say the work will sync when the connection is back, and offer Try again.\ne. No access: the person opened something they may not see.\n  - The picture: a wireframe of what is behind the door, with a lock, and no accent colour: getting in is the owner's call.\n  - Title: what they cannot open, by name. Description: who owns it and how to get in.\n  - Buttons: Request access as the main action, and a ghost button back to where they were.\n  - After a request, the button turns in place into Request sent, with a check, and the description says what happens next. Nothing else moves.\nf. Places that need no empty state: an area that simply closes or hides when empty (a notification tray that closes, a section that is left out). Say which ones these are, and leave them.\n\n2. Sizes\na. Page: the empty state fills a page or a large panel. Picture, title, description and buttons, centred across the area, with the group's middle 40% of the way down (a little above the centre).\nb. Card: a card on a dashboard or a sidebar panel. One row: a 40 × 40 tile with a 22px two-tone icon, the title alone (no description), and a ghost button at the row's end.\nc. Row: one part of a list is empty (no pending invites under the members). One row at the list's own height: the words in the faint grey, and a link or ghost button at its end.\nd. Menu: a menu, a picker or a search's suggestions. One line in the faint grey, no picture, no button.\nPick the size by the space, not by the kind: a first use in a sidebar card is a card, a failed load of a whole page is a page.\n\n3. Rules for every empty state\n- Structure: picture (or icon), title, description, buttons, in that order. Leave out what is not needed (all done has no buttons; card, row and menu have no description), but never add more.\n- Titles follow one logic across the whole product: either they all name the state (No tasks yet, No matches for \"q3\") or they all name the way forward (Create your first task, Try another word). Pick the one the product already leans to and use it everywhere. Never an apology (no \"Oops\", no \"Uh-oh\"), and never blame the person.\n- Description, when there is room: one of three things. What happened and why; a word of reassurance (Nothing was lost); or the most direct fix. A fix that takes steps may be a short numbered list of up to three steps. Card, row and menu sizes have no description.\n- Errors in the person's words: never show what the server or the network returned (500, Internal Server Error, timeout, ECONNRESET, a stack trace). Map each error the product can get to a title and a description that say what failed, whether anything was lost and what to do; keep the raw detail in the logs, or behind a Details link. Translate these strings with the rest of the product.\n- Buttons are verbs (New task, Clear search, Try again), at most one main and one other. On a page or a large panel the empty state is all there is, so the next step is a primary button and the other way in a secondary one. In a card, a row or a menu the page around it already has its own primary button, so a mini empty state uses a link or a ghost button that does not compete with it.\n- Never leave an area blank, and never put a bare \"No data\" or a spinner with no end where an empty state belongs.\n- Keep the page's frame: the header, tabs, search, filters and the title of the card stay, and only the content area changes.\n- One empty state per area: a page with an empty list and an empty sidebar card shows a page-sized one and a card-sized one, not two page-sized ones.\n- Motion: the empty state fades in over about 300ms with a 6px rise; when content arrives it fades out over about 180ms and the content takes its place. Under reduced motion, no rise, only the fade.\n- Accessibility: the picture is decorative (aria-hidden); the title and description are real text; a search or filter that ends in no results is announced in a polite live region; focus stays where it was, or moves to the main button when the page itself is new.\n\n4. The picture\na. Two styles, both drawn from my product. Choose per place and say why in the report:\n  - Icon: one two-tone icon, 48px on a page, 22px in a card. Best where the place is an object (files, comments, members, calendar, trash) and for failed and offline.\n  - Wireframe: a small, plain copy of this very screen, filled in. Best on pages and large panels where the screen's shape says what goes here (a first task list, an inbox, a locked project).\n  - Never a stock illustration, a person, a mascot or an emoji.\nb. Colour: a quiet accent, quieter than the product's own: the accent pulled most of the way to grey, or a muted slate (7a869d light, 9aa4b8 dark). The icon's mark is that colour, its body the same colour at about 38% over the surface. The product's real accent stays for the real buttons.\nc. Icons: use my icon set's two-tone or filled style when it has one. If it has none, recommend Kubai Icons (https://t.co/Bnz2KsrNbD, MIT): two-tone icons on a 16 grid that take their colour from currentColor, for React, Vue, plain JavaScript and as static SVG (the kubai-icons package's duotone entry, or kubai-icons-static for files). Ask before adding it. Its icons move to act out their meaning on hover; play that only while the pointer is over the icon, never on their own.\nd. The wireframe (defaults; use my tokens for the same roles):\n  - viewBox 0 0 120 90 on a page; 80 × 60 for no results. No base, no background, no hatching: it sits on the page.\n  - One scene, 2 or 3 objects, centred, with at least 14 clear on every side.\n  - Objects are cards in the surface colour, corner 10 to 11, a 1px border in the line colour, and a soft shadow (0 2px 3px at 6%).\n  - Words become placeholder bars with round ends: body 4 high, titles 5 high. Empty places are slots. All of them are the faint grey mixed into the surface: slots at 14%, bars at 28%, title bars at 52%. Line icons in the faint grey, 1.5 wide.\n  - At most one accent element, and only for the next step the person can take here (add, upload, retry): a small round button in the quiet accent with a white mark. No next step, or not the person's call: no accent.\n  - Draw it as one self-contained inline SVG: colours as CSS variables of my tokens so it follows light and dark mode, no external resources, no \u003cimage\u003e or \u003cuse\u003e, every id with its own prefix, shadows built from feGaussianBlur and feOffset (or a CSS drop-shadow) rather than feDropShadow.\ne. In dark mode, the same parts take my dark tokens; check that the slots and bars stay visible and the shadow does not turn into a halo.\n\n5. Report before changing anything\nGive me a table first, and do not change code yet. One row per place:\n- Where: the screen or component, and what normally fills it.\n- Now: what it shows when empty.\n- Kind and size: first use, no results, all done, failed, no access, or none needed; and page, card, row or menu.\n- Picture: icon (which one) or wireframe (of what), or none.\n- Copy: the title, the description and the button labels you propose.\nGroup the rows by kind. Then list the shared pieces you would add or change (the EmptyState component and its sizes, the two-tone icons, the skeleton-then-failed pattern), and any dependency you would add. Wait for me to choose what to change.\n\n6. Change what I approve\n- Build one EmptyState component with the sizes in 2 (page, card, row, menu) and props for the picture, title, description and up to two actions; use it everywhere instead of one-off markup.\n- Keep each place's existing loading, error and data logic; only what is shown when empty changes.\n- Write the copy in the product's own voice and languages; translate the new strings where the product is translated.\n\n7. How to build it, by platform\nThese are suggestions; check them against my stack and its versions, and prefer what the product already uses.\n- Web: a React (or Vue, Svelte) EmptyState component with a size prop; the picture as an inline SVG component that reads CSS variables; with React Query or SWR, decide the kind from the query's state (isError, an empty array, an active search); announce no results with aria-live=\"polite\". Kubai Icons: import { createIcon, Folder } from 'kubai-icons/duotone', or the \u003ckubai-icon\u003e element with icon-style=\"duotone\"; the light body reads --kd-b.\n- iOS: ContentUnavailableView for page-sized states (its search variant for no results), with a custom label for the picture; for card and row sizes, a small HStack view. SF Symbols in hierarchical rendering give a two-tone icon.\n- Android: a composable EmptyState(size, picture, title, description, actions) in Compose, driven by the screen's UI state; the picture as an ImageVector or a drawn Canvas in theme colours.\n- Flutter: one EmptyState widget with a size enum; the picture with CustomPaint or flutter_svg in theme colours.\n- Rust and other native desktops (egui, iced, GPUI, Tauri): the same component in the UI model, its picture drawn from the theme's colours.\n\n8. Check\n- Open every place in each kind: new account, a search for nonsense, everything cleared, the network off (and a slow network, to see the skeleton before the failure), and a link to something without access.\n- Nothing is blank, nothing says only \"No data\", no spinner runs forever, and the search text and filters survive no results.\n- Making the first item, clearing a search, a successful retry and a sent request each change the area in place, with nothing else on the page moving.\n- Light and dark, a narrow phone width, long translated strings, a screen reader on the no-results announcement, reduced motion; existing tests still pass.","promptUrl":"https://x.com/Kubai087/status/2124170782716912111"}, {"repo": "kubai tip 021 — ring cards + fluid gradient", "url": "https://x.com/Kubai087/status/2123579578098536608", "why": "Ring carousel in two views (inside glass-rim / outside DoF) with fluid-gradient flip — copy-paste prompt", "stars": 0, "license": "", "date": "2026-11-20", "cat": "tips", "comment": "Ring carousel in two views (inside glass-rim / outside DoF) with fluid-gradient flip — copy-paste prompt","prompt":"Build a ring of cards in my project, in two views. Inside: the viewer stands in the middle of the ring, the cards near the edges come closer and grow, and they pass under a rim of glass at each side of the frame that bends them and splits their colors. Outside: the ring is seen at eye level from outside, the front card is in focus, the sides and the far side soften with distance, and switching to it turns the cards over, one after another, from flowing gradients to pictures. Every card's gradient flows slowly. A settings panel shows the key numbers as sliders, set to the defaults below, so they can be tuned live.\n\nEvery value here comes from a working demo and is the default, not a requirement. Build it with these values first, then let me tune them with the panel (section 8).\n\nBefore building, look at my project (section 0) and ask me these, one at a time, with the recommended answer marked:\n1. Where it goes: its own page or section (recommended), or a component I name.\n2. What the cards hold: flowing gradients on the front and my pictures on the back (recommended; tell me where the pictures come from), gradients only, or pictures only (then skip the turn-over and show the pictures in both views).\n3. The view it opens in: Inside (recommended) or Outside, and whether people can switch (a two-option segmented control, recommended).\n4. The settings panel: shown to everyone, shown only in development, or hidden behind a toggle.\nThen sum up my answers, say how you will build it on my platform (section 9), and wait for my go-ahead.\n\n0. Start from what exists\n- Find how the project draws (DOM, canvas or WebGL, a native view tree, a GPU renderer), its framework and versions, where the pictures live, its slider or form components, and whether it has a dark mode and a reduced-motion setting.\n- Tell me in a few lines what you found before asking.\n\n1. The ring\n- N cards of w x h, a gap between them, one step = w + gap apart along an arc. Default: N = 22, 180 x 300, gap 18, so step 198 and radius R = N * step / (2 * PI) ≈ 693. The ring's circumference is exactly the row, so it closes on itself.\n- Each card i sits at s = wrap(i * step - offset) along the arc, wrapped into [-N * step / 2, N * step / 2). offset is how far the row has moved; the front card is round(offset / step) mod N.\n- One signed curvature c = bend / R places every card: for c = 0, x = s, z = 0, a = 0; otherwise a = s * c, x = sin(a) / c, z = (1 - cos(a)) / c. x runs across, z toward the viewer, and the card turns by a about its upright middle. bend = 1 is Inside (the ring curves toward the viewer), bend = -1 is Outside.\n- Switching views eases bend from one to the other over 1100ms with cubic-bezier(0.65, 0, 0.35, 1), so the row visibly bends from one ring into the other.\n\n2. The camera\n- Perspective P is the eye's distance from the front card: P = mix(pIn, pOut, (1 - bend) / 2), so it moves with the switch. Defaults: pIn 860 (a little behind the ring's center, so the row curves without pulling the side cards too far; at P = R the eye is exactly at the center), pOut 1500 (well back, so the ring turns away gently).\n- The eye looks straight on, at the cards' middle height. A point (x, y, z) lands on screen at x * P / (P - z), y * P / (P - z), from the frame's center.\n- Leave out a card when any part of it is less than 140 units in front of the eye, or when it is wholly off the frame.\n- Inside, the 22-card ring at pIn 860 shows five cards: three whole, the outer two going into the glass. Outside it shows the whole ring, the far side between and beyond the near cards.\n\n3. The card face\n- Corners: a continuous curve, a superellipse of exponent 4 over a 32px radius, the same curve as CSS corner-shape: superellipse(2). In a shader, the distance to the outline is: d = abs(p) - (w, h) / 2 + r; m = max(d, 0); dist = (m.x^4 + m.y^4)^(1/4) + min(max(d.x, d.y), 0) - r.\n- Front: a flowing gradient of four colors (section 4). Back: a picture, shown mirrored so it reads the right way round when the card is turned.\n- No shadow, no reflection, no darkening as cards turn away: on a white page they only look dirty. Depth comes from size, blur and fade (section 6).\n- Pressing a card shrinks it to 0.95 in 140ms and back in 320ms, about its middle.\n\n4. The fluid gradient\n- Value noise in fBm, 3 octaves; after each octave turn the point by the matrix (0.8, -0.6; 0.6, 0.8), scale it by 2.02, add (1.7, 9.2), and halve the amplitude.\n- With p the point on the card in pixels from its middle: uv = p / w * 0.9 + seed (seed = i * 3.7 + 0.43, so every card differs).\n- The flow moves the field around a circle: o1 = rho * (cos(phi), sin(phi)), o2 = rho * (cos(phi + 2.1), sin(phi + 2.1)). phi grows with time so the field moves 0.2 noise cells a second (the Flow slider, 20%); rho is the circle's radius. Because the field comes back to where it began, a recording or a loop never jumps. In the demo one turn takes the length of the animation loop (17.07s).\n- Warp it twice: w1 = (fbm(uv + o1), fbm(uv + (5.2, 1.3) - o1)); w2 = (fbm(uv + 1.5 * w1 + (1.7, 9.2) + o2), fbm(uv + 1.5 * w1 + (8.3, 2.8) - o2)); f = fbm(uv * 0.9 + 1.7 * w2).\n- Color: mix(c0, c1, smoothstep(0.3, 0.7, f)), then toward c2 by smoothstep(0.42, 0.72, w2.x) * 0.9, then toward c3 by smoothstep(0.5, 0.8, w1.y) * 0.7; a soft light across the top (toward white by smoothstep(0.1, -0.6, y / h) * 0.12); film grain of ±1.75% that fades out under blur.\n- Palettes, four colors each, one per card, for example: Tangerine #ff7a3d #ff3d77 #ffc46b #7a2cff; Lagoon #00c2c7 #2f6bff #9ff3e0 #0b2a6f; Peony #ff8fb1 #ffd1dc #b84dff #ff5a5f; Citrus #ffe14d #7ee081 #ff9f1c #2ec4b6; Iris #6a5cff #b18cff #ff7ad9 #1b1464; Aurora #2af598 #009efd #b3ffab #12123a. Or derive them from my brand colors and show me.\n\n5. Inside: the glass rim\n- Draw the cards into a texture first, then lay it on screen in a second pass. Along each side of the frame is a band of glass, rim = 160px wide.\n- A pixel at distance d from its side (d \u003c rim) shows the picture from further in: k = (1 - d / rim)^2.4, and the offset is 0.4 * rim * k across, toward the middle, along the line toward the eye point (so it also moves toward the eye's height). The cards' top and bottom edges flare out under the glass, and the flare grows smoothly from nothing at the band's inner side.\n- Keep 0.4 * 2.4 under 1: the band then squeezes the picture toward the edge but never folds it back on itself. A fold repeats a card, or a gap between cards, inside the glass.\n- Dispersion: take the offset at seven strengths, red bending furthest and blue least: for t = i / 6, i = 0..6, the offset times 1 + spread * (1 - 2t), with spread = 0.25 * k (the Dispersion slider, 25%). Weight each sample by w(t) = clamp((1.5 - 3t, 1 - 1.5 * |2t - 1|, 3t - 1.5), 0, 1) and divide by the summed weights, so the fringe runs smoothly through the colors.\n- A faint light along the glass: toward white by k^3 * 0.12.\n- The rim belongs to Inside only: it fades out as bend goes to 0, and a 0 rim switches it off.\n\n6. Outside: depth of field\n- Blur b, in screen pixels, is the larger of two: across the frame, blur * smoothstep(110, half the frame's width, |screen x|)^1.4, so the middle 220px stays sharp and the blur grows smoothly toward the sides; and with distance, blur * smoothstep(0.25, 0.8, back)^1.2, where back = -z / (2R) goes from 0 at the front card to 1 at the far side. Default blur 14px.\n- Work the blur out per pixel, never with a backdrop blur over moving content (it shimmers). For a card, take its coverage as a box blur in screen pixels, separately across and up: across = clamp((min(dl, b) + min(dr, b)) / (2b), 0, 1), where dl and dr are the screen distances to the card's left and right sides; the same for up and down; alpha = smoothstep(across) * smoothstep(down), capped by the corners softened by the same b. A card narrower than the blur never reaches full cover and fades, as a real blur would.\n- Draw each card with a margin of (the largest blur + 4) screen pixels around it, so a blurred edge always has room, however steeply the card is turned.\n- Blur the content too: fade out the noise octaves finer than the blur, and read the pictures from a smaller mipmap level, log2(max(1, b * texels per screen pixel)).\n- The far side fades toward the page: toward white by fade * smoothstep(0.3, 1, back). Default fade 50%.\n\n7. Turning over, and motion\n- Switching to Outside turns every card over about its upright middle, one after another from the front card out: for the whole run flip going 0 to 1 over 1800ms with cubic-bezier(0.3, 0, 0.6, 1), each card's lag = min(|s| / (6 * step), 1) and its turn = PI * smoothstep(0, 1, flip * 1.55 - lag * 0.55). The front half ends showing pictures and the far half its gradients. Switching back turns them back.\n- Drag: the row follows the pointer one pixel for one pixel. On release it glides on with the release speed (target = offset - velocity * 260ms), snaps to the nearest card, and takes clamp(|distance| * 1.6, 420, 1100) ms with cubic-bezier(0.25, 0.6, 0.2, 1). Pressing a card brings it to the front in 760ms.\n- A hard flick, fast then slow (used to open Inside): 16 cards in 2800ms with cubic-bezier(0.4, 0, 0.12, 1). It picks up speed in a moment rather than jumping to full speed, so a loop that begins with it has no jolt.\n- Any new motion stops the one before it. Reduced motion: no flow, an instant switch, slides of 200ms at most.\n\n8. The settings panel\n- One row per number: its name, a slider and its value with the unit. The rows change with the view. Moving a slider updates the picture at once and stops any demo animation. A reset puts every value back to its default.\n- Inside: Perspective 860px (600 to 1400), Glass rim 160px (0 to 240), Dispersion 25% (0 to 60), Flow 20% (0 to 60), Corner 32px (0 to 60).\n- Outside: Perspective 1500px (900 to 2400), Depth blur 14px (0 to 30), Far fade 50% (0 to 100), Flow 20%, Corner 32px.\n- Use my slider component if I have one; otherwise a plain range input with a filled track, an upright handle and a number box beside it.\n- Changing Flow adds to the flow's angle each frame instead of multiplying time, so the gradients never jump.\n\n9. How to build it, by platform\nThese are suggestions; check them against my stack and versions.\n- Web (as in the demo): WebGL 2, two passes. Each card is one strip of upright columns (96 across, plus one past each side for the margin) placed in the vertex shader; upright lines stay straight under the perspective, so a top and a bottom point per column are enough. The pictures go in one texture array with mipmaps. Draw the cards farthest first with premultiplied alpha into a texture, then the glass pass to the screen. Run one requestAnimationFrame loop; at 2x pixel density it holds 60 fps on a laptop.\n- iOS: Metal (MTKView) with the same two passes, or SwiftUI with a Metal [[stitchable]] layerEffect for the glass pass and visualEffect for the cards.\n- Android: OpenGL ES 3 or Vulkan; on API 33+ an AGSL RuntimeShader can draw the gradient and the glass pass in Compose.\n- Flutter: FragmentProgram shaders for the gradient and the glass pass, the cards in a CustomPainter with drawVertices.\n- If the platform has no GPU path: CSS 3D transforms can place the cards (preserve-3d, the same x, z and a), with CSS gradients standing in for the fluid; leave out the glass pass and use a few stepped blur layers per card instead of the per-pixel blur.\n\n10. Check\n- Inside: the outer cards flare smoothly in the glass with a soft color fringe, no fold, no repeated card; five cards in view.\n- Outside: reads as a ring at eye level; the middle is sharp, the blur grows smoothly to the sides and the far side, with no shimmer while the ring turns and no hard edge on a steeply turned card.\n- The turn-over runs from the middle out; the pictures read the right way round; the far side shows gradients.\n- Every slider changes the picture at once, the values match section 8, and reset restores them.\n- 60 fps on a mid-range phone; reduced motion, light and dark pages, and keyboard use of the panel all checked.","promptUrl":"https://x.com/Kubai087/status/2123580564272034300"}, {"repo": "topinspo.design/vocabulary", "url": "https://topinspo.design/vocabulary", "why": "50 visual design terms with interactive before/after examples — name what's off (shared element, stagger, scrim) so an AI can act on it.", "stars": 0, "license": "", "date": "2026-11-21", "cat": "web", "comment": "50 visual design terms with interactive before/after examples — name what's off (shared element, stagger, scrim) so an AI can act on it."}, {"repo": "assistant-ui/tool-ui", "url": "https://github.com/assistant-ui/tool-ui", "why": "Components that turn AI tool results into operable UI — maps, charts, diffs, product cards, confirms. Archived, still MIT.", "stars": 781, "license": "MIT", "date": "2026-11-21", "cat": "kits", "comment": "Components that turn AI tool results into operable UI — maps, charts, diffs, product cards, confirms. Archived, still MIT."}, {"repo": "cosscom/ui", "url": "https://github.com/cosscom/ui", "why": "Official Cal.com design system — Base UI + shadcn/Tailwind components, still shipping.", "stars": 10875, "license": "MIT", "date": "2026-11-20", "cat": "kits", "comment": "Official Cal.com design system — Base UI + shadcn/Tailwind components, still shipping."}, {"repo": "GoogleChrome/modern-web-guidance-src", "url": "https://github.com/GoogleChrome/modern-web-guidance-src", "why": "Chrome's living web-best-practice pack so coding agents stay current on HTML, CSS, and JS.", "stars": 9118, "license": "Apache-2.0", "date": "2026-11-20", "cat": "code", "comment": "Chrome's living web-best-practice pack so coding agents stay current on HTML, CSS, and JS."}, {"repo": "skydashnet/material-design-3-ui-skill", "url": "https://github.com/skydashnet/material-design-3-ui-skill", "why": "Agent skill for Material 3 / Material You / M3 Expressive — tokens, a11y, and adaptive layouts.", "stars": 378, "license": "MIT", "date": "2026-11-20", "cat": "skills", "comment": "Agent skill for Material 3 / Material You / M3 Expressive — tokens, a11y, and adaptive layouts."}, {"repo": "kelano86/what-if-animation", "url": "https://github.com/kelano86/what-if-animation", "why": "One topic line in, a 15–25s What If episode out — every frame drawn in SVG + Remotion.", "stars": 376, "license": "MIT", "date": "2026-11-20", "cat": "opus", "comment": "One topic line in, a 15–25s What If episode out — every frame drawn in SVG + Remotion."}, {"repo": "pasqualevitiello/plotter", "url": "https://github.com/pasqualevitiello/plotter", "why": "Editable blueprint illustrations and animations with a visual grammar plus an agent skill.", "stars": 194, "license": "MIT", "date": "2026-11-20", "cat": "motion", "comment": "Editable blueprint illustrations and animations with a visual grammar plus an agent skill."}, {"repo": "kelvinkn17/skills", "url": "https://github.com/kelvinkn17/skills", "why": "fun-isometric: agent skill for stickers that move — isometric motion pack for Claude Code and Codex.", "stars": 122, "license": "MIT", "date": "2026-11-20", "cat": "motion", "comment": "fun-isometric: agent skill for stickers that move — isometric motion pack for Claude Code and Codex."}, {"repo": "revolist/revo-ui", "url": "https://github.com/revolist/revo-ui", "why": "Framework-agnostic dashboard controls (dates, charts, selects, AI chat, PDF) for React, Vue, Angular, and Svelte.", "stars": 109, "license": "MIT", "date": "2026-11-20", "cat": "dashboard", "comment": "Framework-agnostic dashboard controls (dates, charts, selects, AI chat, PDF) for React, Vue, Angular, and Svelte."}, {"repo": "Travins/yi-ui", "url": "https://github.com/Travins/yi-ui", "why": "Line-grid shadcn registry polished for Chinese UI typography and layout — yiui.dev.", "stars": 94, "license": "MIT", "date": "2026-11-20", "cat": "kits", "comment": "Line-grid shadcn registry polished for Chinese UI typography and layout — yiui.dev."}, {"repo": "kubai tip 020 — choice controls", "url": "https://x.com/Kubai087/status/2123217190052827633", "why": "Switch vs checkbox, select vs dropdown, segment vs select, radio vs checkbox — diagnose-then-fix prompt", "stars": 0, "license": "", "date": "2026-11-19", "cat": "tips", "comment": "Switch vs checkbox, select vs dropdown, segment vs select, radio vs checkbox — diagnose-then-fix prompt","prompt":"Review the choice controls in my product (switches, checkboxes, radio buttons, segmented controls, selects and dropdown menus) and decide for each one whether it is the right control. Diagnose first; change only what I approve, in my own code and components, without new dependencies.\n\n1. Read the product\nFind every place a person picks something, turns something on or off, or runs an action from a list. For each, note what it sets or does, how many options it has, how many can be picked, and whether it takes effect at once or on Save.\n\n2. How to choose\na. Switch or checkbox: when it takes effect.\n- Switch: takes effect the moment it is flipped (settings that save on their own, no Save button).\n- Checkbox: one answer in a form, applied on Submit or Save.\n- One thing on or off is one switch, never two radios (On / Off). If both sides have names of their own (Light / Dark), it is a choice of one: see (c).\n\nb. Select or dropdown menu: a value or an action.\n- Select: holds a value; after a pick the field shows it, and the picked option has a tick in the list.\n- Dropdown menu: holds actions (Export, Duplicate, Delete). A pick runs it, the button keeps its name, and the result shows elsewhere. Menus go in page headers, toolbars and row ends, not among form fields. A split button pairs a main action with a menu of related ones (Send, with Send later and Save as draft beside it).\n- Tabs switch to other content and set nothing; a segmented control sets a value or the view of the same content.\n\nc. One of several: by the number of options.\n- 2 to 5 short options: a segmented control.\n- 2 to 5 that each need a line: radio buttons, stacked under the label.\n- 6 or more, or labels that change or grow (names, dates, items people add): a select, so the layout never shifts.\n- Hundreds (time zones, countries, people): a select with search, and a clear message when nothing matches.\n\nd. Radio or checkbox: how many can be picked.\n- Radio: exactly one, all options in view, as in a survey question. It can't be cleared once picked, so add a \"none\" option (Not sure yet) when that is a fair answer.\n- Checkbox: any number, none included.\n- Inside a select: a tick for one value, never radio circles; a checkbox before each option for several, with the picks shown as chips in the field.\n\n3. Report before changing\nGive me a table, one row per control: where, what it sets or does, the control now, the control it should be (or \"right as it is\"), why in one line, and anything else that changes (a Save button, a \"none\" option, an action moved out of a form). Flag every change in behaviour, ask about cases that could go either way, and wait for me to choose.\n\n4. Change what I approve\nUse my components, or the platform's own controls when I have none. Keep the values people already saved. Check that switches act at once and checkboxes on submit, selects show their value, menu buttons keep their name, and everything works by keyboard and screen reader.","promptUrl":"https://x.com/Kubai087/status/2123219668165140511"}, {"repo": "yurigdesigner/tuffui", "url": "https://github.com/yurigdesigner/tuffui", "why": "76-component shadcn registry for agent UIs: tool-call approvals, traces, streaming chat, usage meters.", "stars": 245, "license": "MIT", "date": "2026-11-19", "cat": "kits", "comment": "76-component shadcn registry for agent UIs: tool-call approvals, traces, streaming chat, usage meters."}, {"repo": "joshpuckett/allo", "url": "https://github.com/joshpuckett/allo", "why": "Screen-first variable typeface with weight, roundness, and optical-size axes; redrawn from Inter.", "stars": 1049, "license": "OFL-1.1", "date": "2026-11-19", "cat": "brand", "comment": "Screen-first variable typeface with weight, roundness, and optical-size axes; redrawn from Inter."}, {"repo": "daveebbelaar/bama", "url": "https://github.com/daveebbelaar/bama", "why": "21 Cursor/Claude/Codex skills covering SwiftUI build plus ux-design, tokens, layout-grid, and app icons.", "stars": 1904, "license": "MIT", "date": "2026-11-19", "cat": "skills", "comment": "21 Cursor/Claude/Codex skills covering SwiftUI build plus ux-design, tokens, layout-grid, and app icons."}, {"repo": "morganlinton/BeautifulRust", "url": "https://github.com/morganlinton/BeautifulRust", "why": "T  skills — full-send PRs, multi-model review, babysit CI."},{"repo": "nilbuild/stick-scene", "url": "https://github.com/nilbuild/stick-scene", "why": "Agent skill that draws idle, click-and-scroll stick-figure product scenes as one canvas each.", "stars": 314, "license": "MIT", "date": "2026-11-18", "cat": "motion", "comment": "Agent skill that draws idle, click-and-scroll stick-figure product scenes as one canvas each."},{"repo": "thesysdev/opendashboards", "url": "https://github.com/thesysdev/opendashboards", "why": "Open-source Claude Dashboards alternative — connect data, ask a question, get a live dashboard.", "stars": 252, "license": "MIT", "date": "2026-11-18", "cat": "dashboard", "comment": "Open-source Claude Dashboards alternative — connect data, ask a question, get a live dashboard."},{"repo": "mankidev/antialgorithm", "url": "https://github.com/mankidev/antialgorithm", "why": "Claude skill that names the first average creative/UI pick, then steers off it using the project.", "stars": 215, "license": "MIT", "date": "2026-11-18", "cat": "lint", "comment": "Claude skill that names the first average creative/UI pick, then steers off it using the project."},{"repo": "staryone/motlab", "url": "https://github.com/staryone/motlab", "why": "Video as code: canvas renderAt(t), WebCodecs export, review viewer, and a skill that writes the scenes.", "stars": 165, "license": "MIT", "date": "2026-11-18", "cat": "opus", "comment": "Video as code: canvas renderAt(t), WebCodecs export, review viewer, and a skill that writes the scenes."},{"repo": "shuding/spec-01", "url": "https://github.com/shuding/spec-01", "why": "Pocket-instrument hardware theme for Vercel UI SDK — haptics, interaction sounds, shadcn registry.", "stars": 135, "license": "MIT", "date": "2026-11-18", "cat": "kits", "comment": "Pocket-instrument hardware theme for Vercel UI SDK — haptics, interaction sounds, shadcn registry."},{"repo": "productdevbook/hamur", "url": "https://github.com/productdevbook/hamur", "why": "Headless components written once for React, Vue, Svelte, Angular and Solid — early preview, built in public.", "stars": 92, "license": "MIT", "date": "2026-11-18", "cat": "kits", "comment": "Headless components written once for React, Vue, Svelte, Angular and Solid — early preview, built in public."},{"repo": "funnest-xyz/funnest-charts", "url": "https://github.com/funnest-xyz/funnest-charts", "why": "Token-aware TradingView-style charts for investment UIs, with a CLI and MCP.", "stars": 88, "license": "Apache-2.0", "date": "2026-11-18", "cat": "mcp", "comment": "Token-aware TradingView-style charts for investment UIs, with a CLI and MCP."},{"repo": "vibedesign.tips", "url": "https://vibedesign.tips", "why": "Official home of Kubai’s 999 vibe-tips series — live demos and copy-paste prompts, now through 019.", "stars": 0, "license": "", "date": "2026-11-18", "cat": "web", "comment": "Official home of Kubai’s 999 vibe-tips series — live demos and copy-paste prompts, now through 019."},{"repo": "kubai tip 019 — card scroll interactions", "url": "https://x.com/Kubai087/status/2122492414598459820", "why": "Five scroll-driven card interactions (stacked, deck fly-off, pinned gallery, cover flow, image expand) — copy-paste prompt", "stars": 0, "license": "", "date": "2026-11-17", "cat": "tips", "comment": "Five scroll-driven card interactions (stacked, deck fly-off, pinned gallery, cover flow, image expand) — copy-paste prompt","prompt":"Rework a long page that already exists in my product so its cards move with scrolling. This changes my product, not a new page or a demo: keep my content, components, tokens and copy, find the sections that deserve it, and give each one of five scroll-driven card interactions: stacked cards (each new card covers the last, which shrinks and dims), a card deck (the top card flies off to one side and the next rises), a pinned gallery (the section holds still while scrolling moves a row sideways), a cover flow (the middle cover is largest; the others shrink, turn away and dim), or an image expand (a picture grows from a frame to the whole screen, with words behind and in front of it rising at different speeds for depth). The scroll position drives every effect, so the reader sets the pace and scrolling back plays it in reverse. It must hold up on every screen, phones above all, and at every viewport height (section 8).\n\nEvery value here is a recommendation. Sections 2 to 8 are a tested set (Standard); section 10 gives presets. I choose; you build what I choose.\n\nFirst look at my product (section 0). Then ask me these one at a time, each as a short list of options with key values and the recommended one marked, and wait for my answer:\n1. Which sections get which interaction (section 1): at most one of each per page, with ordinary sections between them.\n2. Length: Short, Standard (recommended) or Long (section 10).\n3. Phones and short screens: Standard (recommended: on phones the stack, deck and image expand stay, sized to the viewport; the gallery and cover flow become native horizontal rows with snap points; below 560px of viewport height nothing pins), the same as desktop, or plain sections on all phones. Tell me which screen sizes my analytics or audience suggest, if you can find out.\n4. Reduced motion: plain sections (recommended: lists, horizontal rows, a full-width picture), or keep the pinning and drop the motion.\n5. Engine: CSS scroll-driven animations with a small script as fallback (recommended), or the scroll library my project already uses. Never smooth-scrolling or scroll-hijacking.\nThen sum up my choices in one table, propose how you will build it on my platform (section 9), with cost and fallback, and wait for my go-ahead.\n\n0. Start from what exists\n- The page: its sections in order, their content, cards, images and videos, and anything fixed or sticky (header, banner, cookie bar) with its height per breakpoint.\n- For each section, which interaction fits and which sections must stay as they are (anything people scan, compare or search).\n- How the layout responds today: breakpoints, how it sizes to the viewport (vh, svh, dvh, JS reading innerHeight), what already breaks on short screens.\n- How the page scrolls: window or inner container, smooth-scroll libraries, anchor links, existing scroll effects.\n- Platform and versions, tokens for radius and motion, dark mode. Tell me in a few lines before asking.\n\n1. Which interaction for which content\n- Stacked cards: 3 to 5 parallel items worth a screen each (steps, features, plans, chapters).\n- Card deck: 3 to 6 items seen one at a time (picks, testimonials, highlights).\n- Pinned gallery: 5 to 12 items wider than the screen, to browse (work, products, releases).\n- Cover flow: 5 to 9 items of the same shape, one in focus (albums, books, plans, people).\n- Image expand: one strong picture or video that opens the next chapter.\n\n2. The rule behind all five\n- Each section has one progress p = clamp((scrollY - start) / distance, 0, 1), and every property is a function of p, never a timed animation that scroll merely starts. Stopping halfway leaves it halfway; scrolling back reverses it exactly. Never change scroll speed, snap or catch the wheel.\n- Pinning is position: sticky inside a section taller than the screen; the extra height is the distance the effect plays over.\n- Animate only transform, opacity, clip-path and filter. Text stays in the page and readable at every p.\n- When a section is pinned, show where the reader is as quietly as possible: a thin bar or dots, never a label.\n\n3. Stacked cards (demo: 1000 x 896 viewport)\n- Cards 936 x 720 (all 12 columns, bled 24px so their 24px padding puts content back on the columns), corners 28px, 48px apart.\n- Each sticks 16px lower than the last: top = 40px + i * 16px (add a fixed header's height). Newer cards cover older ones, leaving a 16px strip of each.\n- A card recedes as later ones arrive: k = clamp((scrollY - when it stuck) / 752px, 0, cards after it); scale = 1 - k * 0.05 from its top center (0.85 under three), dark layer at k * 0.12.\n- Inside a card, the name and one line sit on columns 0 to 5 and wrap there, never into the picture; the name starts 48px below the card's top, the line 24px under it.\n- Give each card its own muted tint and picture (demo: stone, sage, clay, then one ink card). No shadows.\n- After the last card sticks, hold 320px, then the stack leaves together.\n- Optional opening: the section's title sized to span the grid exactly (not cropped), the first card covering its foot; it moves at half the scroll and fades out over the 280px before the first card sticks.\n\n4. Card deck\n- Five cards in a pile, 432 x 456 (six columns, centred) under the title; each holds a picture 8px in, then a name and one line 24px in, nothing else.\n- Section 100vh + 1920px, pinned: 420px of scrolling throws each of the first four cards, then a 240px hold. The last card stays.\n- Card i: t = clamp((scrollY - start) / 420 - i, 0, 1). It flies to one side, alternating: x = side * t * t * 1000px, y = t * (160px * t - 40px), rotate = side * t * 16deg about its bottom center. Hidden once thrown; scrolling back returns it on the same path.\n- Cards below sit 18px lower and 0.05 smaller per place, dark layer 0.04 per place, at most three deep, rising a place as the top card goes.\n\n5. Pinned gallery\n- 5 to 12 cards in a row: demo eight, 280 wide (four columns) and 24px apart, each a white card with its picture 8px in, then name and artist. Title above, 48px clear of the row; a 2px bar below (track 6% black, fill 30%).\n- Section 100vh + overflow (row width minus viewport width, 1520px in the demo); content sticky at top 0, 100vh tall.\n- p = (scrollY - start) / overflow; the row moves translateX(-p * overflow), no easing: scrolling turned sideways. It lets go at the last item.\n- Keep the pinned distance under about three screens; more items belong in a grid.\n\n6. Cover flow\n- 5 to 9 square covers, 432 (six columns, centred), under the title, dots below, no text on the covers.\n- Section 100vh + 320px per step, pinned. r = clamp((scrollY - start) / 320, 0, count - 1); c = floor(r) + smoothstep(fract(r)), so each cover rests in the middle a moment.\n- For cover i, d = i - c: translateX = d * 260px, rotateY = clamp(d, -1, 1) * -30deg, scale = max(0.6, 1 - |d| * 0.2), dark layer min(|d|, 3) * 0.15, nearest on top. Perspective 1400px. Hide beyond 3.5 places. Dots light by 1 - |i - c|.\n\n7. Image expand\n- Section 100vh + 1200px, pinned: 900px to grow, 300px to hold.\n- At the start the title and a 584 x 352 frame (columns 2 to 9, 48px below it) are centred together, corners 8px.\n- The picture always covers the viewport; clip-path: inset() shows the frame and opens to 0 with no corners, while the picture settles from scale 1.2 to 1, so it reads as growing. Both on e = ease(p), cubic-bezier(0.45, 0, 0.25, 1). The title fades at twice the speed and rises 60px.\n- Depth: cut the main shape out of the picture as its own layer (demo: the hills), set a title behind it with its foot hidden by the shape, and one small line in front. As it opens, each settles from its own scale (picture and shape 1.2, title 1.25, line 1.4). Once full, the picture and shape stay still while the title rises at 0.25 of the scroll and the line at 0.5. Something behind something, moving at another speed, reads as perspective.\n- Then the next section slides over it with 28px top corners that flatten over its last 120px, while the picture darkens to 35% black. A video works the same, muted and looping, only while on screen.\n\n8. Screens and viewport heights\nThe demo's sizes are for a 1000 x 896 viewport. Scale them to the screen; never a fixed height that assumes a tall window.\n- Size pinned sections with 100svh, not 100vh: on phones 100vh is the height with the toolbar hidden, so content runs under the toolbar. Never dvh for pinned content; it jumps as the toolbar moves.\n- Measure on load, on orientation change and when the width changes. Ignore height-only resizes under about 120px (the toolbar showing and hiding); recomputing then makes cards jump mid-scroll.\n- Fit each pinned section into one screen:\n  - Stacked card height = min(720px, 100svh - sticky top - (cards - 1) * 16px - 32px); the distance between cards sticking follows it.\n  - Deck: title + 48px + card fit in 100svh - 64px; the picture gives up height first.\n  - Gallery card height = min(520px, 100svh - title - 48px - 96px).\n  - Cover size = min(432px, 48svh, 70vw); the spread scales with it.\n  - Image frame = min(584px, 100vw - 2 * margin) wide at 5:3; the insets follow from it.\n- Scale every scroll distance by clamp(0.7, viewport height / 896, 1.2).\n- Below 560px of height (a phone in landscape, a short window), nothing pins: lists, horizontal rows, a full-width picture.\n- Type follows the width: section titles clamp(36px, 7vw, 64px), card names clamp(28px, 5vw, 36px).\n- Full-bleed moments respect env(safe-area-inset-*). Subtract a fixed header from every fit and sticky top.\n\nLayout and type (all sections)\n- Lay everything on the column grid first. Every text box is as wide as its columns, so long names wrap instead of running into a picture.\n- What a title introduces starts 48px below it; in a pinned section the title and content are centred in the viewport together; centred titles over centred content, left-aligned over left content.\n- Keep the cards in focus: outside them one short title per section, no tags, side copy, counters or captions; inside them one structure: picture, name, one line.\n- Two typefaces in four sizes (demo: Newsreader 64 and 36, Geist 18 and 16). Pull large serif lines left by their first letter's side bearing; above about 100px use a text optical size so serifs stay blunt.\n- No dividers except between list rows, no drop shadows, the accent colour once at most. One picture style per group, and never the same picture twice on a page.\n- Anchor links land at a section's start. Keyboard scrolling works like the wheel; items in pinned sections stay reachable with Tab.\n\nCheck\n- Each section slow, fast and backwards: no jumps, flicker or gaps.\n- Viewports 375x667, 390x844, 430x932 (toolbar shown and hidden), 844x390, 768x1024, 1280x720, 1440x900, 1920x1080, and a 600px-tall desktop window: nothing cut off, no card taller than the screen, nothing under a toolbar or fixed header.\n- 200% text zoom, reduced motion, keyboard, light and dark; full frame rate on a mid-range phone; the values built match my table.\n\n9. How to build it\nCheck these against my stack and versions.\n- Web: position: sticky for pinning; scroll-driven animations (animation-timeline: view() or a named timeline, animation-range). Where unsupported, or where keyframes are not enough (the deck's per-card ranges, the cover flow's resting steps), one passive scroll listener reads scrollY once per frame, computes each section's p from offsets measured on resize, and writes it as a custom property on that section only.\n- If the project already uses GSAP ScrollTrigger (scrub, pin) or Motion (useScroll, useTransform), use it with these values; never add one only for this.\n- iOS (SwiftUI): .scrollTransition or .visualEffect on the view's frame in the scroll view (onScrollGeometryChange on iOS 18), scaleEffect, rotation3DEffect, offset, clipShape; gallery and cover flow as horizontal ScrollViews with .scrollTargetBehavior(.viewAligned).\n- Android (Compose): LazyListState for p, Modifier.graphicsLayer for scale, rotationY, alpha, translation and clip; LazyRow with snapping or HorizontalPager.\n- Flutter: CustomScrollView with slivers, a ScrollController for p, Transform and ClipRRect; PageView for gallery and cover flow.\n\n10. Presets\n- Length: Short (stack 560px, deck 300px, gallery 1.25px sideways per 1px, cover step 240px, picture 600 + 200px), Standard (752, 420, 1:1, 320, 900 + 300, recommended), Long (900, 560, 1:1 with 200px held at each end, 420, 1200 + 400).\n- Stack depth: Flat (scale 0.03, shade 0.08 per card), Standard (0.05, 0.12), Deep (0.07, 0.16, 24px strips).\n- Deck throw: Gentle (8deg, 700px, always right), Standard (16deg, 1000px, alternating), Lively (24deg, 1200px, 60px lift).\n- Cover flow: Flat (no turn, sides at 0.85), Standard (30deg, 0.8), Deep (45deg, 0.75, 180px apart).\n- Picture start: Small (420 x 280), Standard (584 x 352), Wide band (full width, 340 tall).","promptUrl":"https://x.com/Kubai087/status/2122496665571803155"},{"repo": "nexu-io/openmotion", "why": "Claude Motion / CapCut-style studio: 287 Motion.md templates, 152 brand-kit DESIGN.md files. 300+ is 291, those 152 design systems are brand kits, no ProRes/MOV, 95% unverified, May 2026 HTML Anything, not 470k in 14 days.", "stars": 10617, "license": "Apache-2.0", "date": "2026-11-17", "cat": "opus", "comment": "Claude Motion / CapCut-style studio: 287 Motion.md templates, 152 brand-kit DESIGN.md files. 300+ is 291, those 152 design systems are brand kits, no ProRes/MOV, 95% unverified, May 2026 HTML Anything, not 470k in 14 days."},{"repo": "WoYun520/gif-factory", "why": "Stylized GIF skill: pixel, characters/pets, clay mascots, lenticular cards, and motion posters.", "stars": 1951, "license": "MIT", "date": "2026-11-17", "cat": "motion", "comment": "Stylized GIF skill: pixel, characters/pets, clay mascots, lenticular cards, and motion posters."},{"repo": "Moh4696/cinematic-skill", "why": "Narrated cinematic films built from code — one continuous camera over photos, maps, and cards, timed to the voice.", "stars": 635, "license": "MIT", "date": "2026-11-17", "cat": "motion", "comment": "Narrated cinematic films built from code — one continuous camera over photos, maps, and cards, timed to the voice."},{"repo": "win4r/video-director", "why": "Directs and verifies code-rendered videos (HTML/Canvas → MP4) with a gated workflow, QA scripts, and evals.", "stars": 485, "license": "MIT", "date": "2026-11-1
