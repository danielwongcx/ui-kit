<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Repo Scout — Digest Catalog</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem("repo-scout-digest-style");
    document.documentElement.setAttribute("data-style", saved === "award" ? "award" : "classic");
  } catch (e) {
    document.documentElement.setAttribute("data-style", "classic");
  }
})();
</script>
<style>
  :root {
    --bg: #efe9df;
    --bg2: #e8e1d5;
    --tile: #f7f3ec;
    --ink: #2a2a2a;
    --muted: #6b6560;
    --shadow-dark: rgba(160, 140, 110, 0.45);
    --shadow-light: rgba(255, 255, 255, 0.9);
    --radius: 28px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html { background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--ink);
    background: transparent;
    padding: 0;
  }
  /* Fixed wash lives on a pseudo, not background-attachment on body.
     That property is an ancestor of the sticky bar and stops it pinning.
     Page padding is on .wrap so the in-flow header starts at the scrollport top. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 80% 50% at 10% 90%, rgba(90,120,70,0.08), transparent 55%),
      radial-gradient(ellipse 60% 40% at 90% 10%, rgba(255,255,255,0.5), transparent 50%),
      linear-gradient(160deg, #f3eee6 0%, var(--bg) 45%, var(--bg2) 100%);
  }
  body.modal-open { overflow: hidden; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 40px 20px 80px; }
  .wrap > header { text-align: center; margin-bottom: 10px; }
  .wrap > header h1 {
    font-size: 1.55rem; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 8px;
  }
  .wrap > header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 28px 22px; margin: 0 auto 8px; max-width: 640px;
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 22px 16px; }
  }
  .cat {
    appearance: none; border: none; background: transparent; padding: 0;
    cursor: pointer; display: flex; flex-direction: column; align-items: center;
    gap: 12px; font: inherit; color: inherit; -webkit-tap-highlight-color: transparent;
  }
  .tile {
    width: 112px; height: 112px; border-radius: var(--radius);
    background: linear-gradient(145deg, #fffefb, var(--tile));
    box-shadow:
      10px 12px 24px var(--shadow-dark),
      -8px -8px 20px var(--shadow-light),
      inset 0 1px 0 rgba(255,255,255,0.95);
    display: grid; place-items: center;
    transition: transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1), box-shadow 0.28s ease, background 0.28s ease;
    position: relative;
  }
  .cat:hover .tile {
    transform: translateY(-4px) scale(1.03);
    box-shadow:
      12px 16px 28px var(--shadow-dark),
      -10px -10px 22px var(--shadow-light),
      inset 0 1px 0 rgba(255,255,255,0.95);
  }
  .cat:active .tile,
  .cat.is-active .tile {
    transform: translateY(2px) scale(0.97);
    background: linear-gradient(145deg, #ebe4d8, #f4efe6);
    box-shadow:
      inset 6px 6px 14px var(--shadow-dark),
      inset -5px -5px 12px var(--shadow-light),
      0 1px 2px rgba(255,255,255,0.5);
  }
  .cat.is-active .tile::after {
    content: ""; position: absolute; inset: -3px;
    border-radius: calc(var(--radius) + 3px);
    border: 2px solid color-mix(in srgb, var(--hue) 55%, transparent);
    pointer-events: none; animation: ringIn 0.35s ease;
  }
  @keyframes ringIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }
  .icon {
    width: 56px; height: 56px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.12));
    transition: transform 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  .cat:hover .icon { transform: scale(1.08) rotate(-3deg); }
  .cat.is-active .icon { transform: scale(0.95); }
  .cat-label { font-size: 0.92rem; font-weight: 560; text-align: center; line-height: 1.2; }
  .cat-meta { font-size: 0.75rem; color: var(--muted); margin-top: -8px; }

  .modal {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    visibility: hidden; pointer-events: none;
  }
  .modal.open { visibility: visible; pointer-events: auto; }
  .backdrop {
    position: absolute; inset: 0;
    background: rgba(42, 36, 28, 0.42);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    transition: opacity 0.28s ease;
  }
  .modal.open .backdrop { opacity: 1; }
  .sheet {
    position: relative; z-index: 1;
    width: min(640px, 100%);
    max-height: min(86vh, 820px);
    display: flex; flex-direction: column;
    background: linear-gradient(160deg, #fffefb, #f5f0e8);
    border-radius: 24px;
    box-shadow:
      16px 24px 48px rgba(80, 60, 40, 0.35),
      -6px -6px 20px rgba(255,255,255,0.5),
      inset 0 1px 0 rgba(255,255,255,0.9);
    transform: translateY(28px) scale(0.96);
    opacity: 0;
    transition:
      transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
      opacity 0.3s ease;
    overflow: hidden;
  }
  .modal.open .sheet {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  .sheet-head {
    display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap;
    gap: 12px; padding: 20px 20px 12px; flex-shrink: 0;
  }
  .sheet-head h2 { margin: 0; font-size: 1.2rem; font-weight: 650; }
  .sheet-head .sub { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; }
  .close {
    appearance: none; border: none; cursor: pointer;
    width: 40px; height: 40px; border-radius: 14px; flex-shrink: 0;
    background: #efe9df;
    box-shadow:
      4px 5px 10px rgba(160,140,110,0.3),
      -3px -3px 8px rgba(255,255,255,0.85);
    font-size: 1.25rem; line-height: 1; color: var(--ink);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .close:hover { transform: scale(1.05); }
  .close:active {
    transform: scale(0.95);
    box-shadow: inset 3px 3px 8px rgba(160,140,110,0.35), inset -2px -2px 6px rgba(255,255,255,0.8);
  }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px;
    padding: 0 20px 14px; flex-shrink: 0;
  }
  .search {
    flex: 1 1 160px; min-width: 140px;
    padding: 11px 14px; border: none; border-radius: 14px;
    background: #efe9df;
    box-shadow:
      inset 4px 4px 10px rgba(160,140,110,0.35),
      inset -3px -3px 8px rgba(255,255,255,0.8);
    font: inherit; font-size: 0.92rem; color: var(--ink); outline: none;
  }
  .search::placeholder { color: #9a9288; }
  .sort {
    flex: 0 0 auto;
    padding: 11px 14px; border: none; border-radius: 14px;
    background: #efe9df;
    box-shadow:
      4px 5px 10px rgba(160,140,110,0.28),
      -3px -3px 8px rgba(255,255,255,0.85);
    font: inherit; font-size: 0.88rem; color: var(--ink);
    cursor: pointer; outline: none;
  }
  .sheet-body {
    overflow-y: auto; padding: 0 16px 20px;
    -webkit-overflow-scrolling: touch;
  }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .card {
    display: block; padding: 14px 16px; border-radius: 16px;
    background: #faf7f2;
    box-shadow:
      4px 5px 12px rgba(160,140,110,0.22),
      -3px -3px 8px rgba(255,255,255,0.85);
    text-decoration: none; color: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    animation: cardIn 0.4s ease both;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow:
      6px 8px 16px rgba(160,140,110,0.28),
      -4px -4px 10px rgba(255,255,255,0.9);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card .name {
    font-weight: 600; font-size: 0.98rem; color: #1a5fb4; word-break: break-all;
  }
  .card .comment {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    background: #efe9df;
    box-shadow:
      inset 2px 2px 6px rgba(160,140,110,0.22),
      inset -2px -2px 5px rgba(255,255,255,0.7);
  }
  .card .comment-body {
    margin: 0;
    font-size: 0.92rem;
    line-height: 1.45;
    color: #3a3632;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .meta {
    display: flex; flex-wrap: wrap; gap: 8px 14px;
    margin-top: 10px; font-size: 0.78rem; color: var(--muted);
  }
  .card a.name {
    display: block;
    text-decoration: none;
  }
  .prompt-peek {
    margin: 8px 0 0;
    font-size: 0.75rem;
    line-height: 1.4;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .copy-prompt {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 10px;
    min-width: 7.6rem;
    min-height: 32px;
    padding: 6px 12px;
    border: none;
    border-radius: 12px;
    background: var(--tile);
    color: var(--muted);
    font: inherit;
    font-size: 0.75rem;
    font-weight: 650;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow:
      3px 3px 7px rgba(160,140,110,0.28),
      -2px -2px 5px var(--shadow-light);
    transition: box-shadow 0.15s ease, color 0.15s ease;
  }
  .copy-prompt:hover {
    color: var(--ink);
    box-shadow:
      4px 4px 9px rgba(160,140,110,0.32),
      -2px -2px 6px rgba(255,255,255,0.95);
  }
  .copy-prompt:active {
    color: var(--ink);
    box-shadow:
      inset 2px 2px 5px rgba(160,140,110,0.32),
      inset -1px -1px 3px rgba(255,255,255,0.8);
  }
  .copy-prompt.is-copied { color: #1e6851; }
  .card a.name:focus-visible,
  .copy-prompt:focus-visible {
    outline: 2px solid #1a5fb4;
    outline-offset: 3px;
  }
  .empty {
    text-align: center; color: var(--muted); padding: 36px 12px; font-size: 0.95rem;
  }

  html:not([data-style="award"]) .kicker,
  html:not([data-style="award"]) .folio,
  html:not([data-style="award"]) .cat-sub,
  html:not([data-style="award"]) .leader,
  html:not([data-style="award"]) .award-br { display: none; }
  .style-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px 12px;
    position: sticky;
    top: var(--site-header-h, 56px);
    z-index: 40;
    padding: 2px 0 14px;
    background: color-mix(in srgb, #efe9df 92%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .digest-style {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: stretch;
    flex: 0 0 auto;
    padding: 2px;
    border-radius: 999px;
    background: #efe9df;
    box-shadow:
      inset 3px 3px 7px rgba(160,140,110,0.32),
      inset -2px -2px 6px rgba(255,255,255,0.85);
  }
  .digest-style::before {
    content: "";
    position: absolute;
    z-index: 0;
    top: 2px;
    bottom: 2px;
    left: 2px;
    width: calc(50% - 2px);
    border-radius: 999px;
    background: linear-gradient(145deg, #fffefb, #f7f3ec);
    box-shadow:
      2px 2px 5px rgba(160,140,110,0.28),
      -1px -1px 4px rgba(255,255,255,0.9);
    transition: left 0.4s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s ease, box-shadow 0.3s ease;
  }
  .style-opt {
    position: relative;
    z-index: 1;
    appearance: none;
    border: 0;
    background: transparent;
    color: #6b6560;
    font: inherit;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.01em;
    line-height: 1.2;
    min-height: 26px;
    min-width: 0;
    padding: 3px 10px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    touch-action: manipulation;
  }
  .home-find {
    position: relative;
    flex: 1 1 220px;
    max-width: 440px;
    min-width: 0;
  }
  .global-search { width: 100%; }
  body.is-searching .global-search { padding-right: 36px; }
  .global-search::-webkit-search-cancel-button,
  .global-search::-webkit-search-decoration {
    -webkit-appearance: none;
    appearance: none;
    display: none;
  }
  .global-search:focus-visible {
    outline: 2px solid #1e6851;
    outline-offset: 2px;
  }
  .clear-q {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    appearance: none;
    border: none;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
  }
  .clear-q:hover { color: var(--ink); }
  .clear-q:focus-visible {
    outline: 2px solid #1e6851;
    outline-offset: 1px;
  }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .home-results {
    display: none;
    max-width: 720px;
    margin: 2px auto 0;
  }
  body.is-searching .grid { display: none; }
  body.is-searching .home-results { display: block; }
  body.is-searching .lede-hint { display: none; }
  .results-meta {
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .home-results .list { gap: 10px; }
  .hit {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
      "cat meta"
      "name name"
      "why why";
    gap: 3px 12px;
    padding: 12px 14px;
    border-radius: 16px;
    background: #faf7f2;
    box-shadow:
      4px 5px 12px rgba(160,140,110,0.22),
      -3px -3px 8px rgba(255,255,255,0.85);
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .hit:hover {
    transform: translateY(-2px);
    box-shadow:
      6px 8px 16px rgba(160,140,110,0.28),
      -4px -4px 10px rgba(255,255,255,0.9);
  }
  .hit:focus-visible {
    outline: 2px solid #1e6851;
    outline-offset: 2px;
  }
  .hit-cat {
    grid-area: cat;
    align-self: center;
    min-width: 0;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--hue, var(--muted)) 72%, #2a2a2a);
  }
  .hit-meta {
    grid-area: meta;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0 10px;
    font-size: 0.75rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .hit-name {
    grid-area: name;
    font-weight: 600;
    font-size: 0.95rem;
    color: #1a5fb4;
    word-break: break-word;
  }
  .hit-why {
    grid-area: why;
    font-size: 0.86rem;
    line-height: 1.4;
    color: #3a3632;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .style-opt[aria-checked="true"] { color: #2a2a2a; }
  .style-opt:focus-visible {
    outline: 2px solid #1e6851;
    outline-offset: 2px;
  }
  .sheet-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    margin-left: auto;
  }
  .cat:focus-visible {
    outline: 2px solid #1e6851;
    outline-offset: 4px;
    border-radius: 18px;
  }


  /* Award — editorial index. Classic rules above stay the default. */
  html[data-style="award"] {
    --bg: #e7e1d4;
    --ink: #1c1914;
    --muted: #5c564c;
    --paper: #f7f3ea;
    --line: rgba(28, 25, 20, 0.14);
    --signal: #8c3014;
    --serif: "Iowan Old Style", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, "Times New Roman", "Liberation Serif", "DejaVu Serif", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Liberation Sans", sans-serif;
    --site-ink: #1c1914;
    --site-muted: #5c564c;
    --site-line: rgba(28, 25, 20, 0.12);
    --site-bar-bg: color-mix(in srgb, #e7e1d4 88%, transparent);
    --site-pill: #f7f3ea;
    --site-accent: #8c3014;
    background: var(--bg);
    color-scheme: light;
  }
  html[data-style="award"] body {
    font-family: var(--sans);
    color: var(--ink);
    background: transparent;
  }
  html[data-style="award"] body::before {
    background:
      radial-gradient(ellipse 50% 42% at 100% 0%, rgba(140, 48, 20, 0.09), transparent 60%),
      radial-gradient(ellipse 42% 36% at 0% 100%, rgba(31, 92, 72, 0.07), transparent 62%),
      linear-gradient(180deg, #ebe6da 0%, #e7e1d4 38%, #ddd4c4 100%);
  }
  html[data-style="award"] ::selection {
    background: #1c1914;
    color: #f7f3ea;
  }
  html[data-style="award"] .wrap {
    display: flex;
    flex-direction: column;
    max-width: 1120px;
    padding: 0 clamp(18px, 4vw, 56px) 108px;
  }
  html[data-style="award"] .style-bar { order: 0; }
  html[data-style="award"] .mast { order: 1; }
  html[data-style="award"] .grid { order: 2; }

  html[data-style="award"] .style-bar {
    justify-content: space-between;
    align-items: center;
    margin: 0 calc(-1 * clamp(18px, 4vw, 56px));
    padding: 8px clamp(18px, 4vw, 56px);
    background: rgba(235, 230, 218, 0.94);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  html[data-style="award"] .digest-style {
    background: transparent;
    border: 1px solid rgba(28, 25, 20, 0.22);
    box-shadow: none;
  }
  html[data-style="award"] .digest-style::before {
    left: 50%;
    background: #1c1914;
    box-shadow: none;
  }
  html[data-style="award"] .style-opt {
    font-size: 10px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: #5c564c;
    padding: 3px 9px;
  }
  html[data-style="award"] .style-opt[aria-checked="true"] { color: #f7f3ea; }
  html[data-style="award"] .style-opt:focus-visible {
    outline-color: var(--signal);
  }

  html[data-style="award"] .mast {
    position: relative;
    text-align: left;
    margin: 0 0 28px;
    padding: 36px 0 18px;
    min-height: clamp(240px, 34vw, 380px);
  }
  html[data-style="award"] .kicker {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin: 0 0 28px;
    font-family: var(--sans);
    font-size: 0.72rem;
    font-weight: 650;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    position: relative;
    z-index: 1;
  }
  html[data-style="award"] .mast h1 {
    position: relative;
    z-index: 1;
    margin: 0;
    max-width: 8ch;
    font-family: var(--serif);
    font-weight: 500;
    font-style: italic;
    font-size: clamp(4.4rem, 11vw, 8.6rem);
    letter-spacing: -0.045em;
    line-height: 0.84;
    color: var(--ink);
  }
  html[data-style="award"] .h-scout,
  html[data-style="award"] .h-sep { display: none; }
  html[data-style="award"] .lede {
    position: relative;
    z-index: 1;
    margin: 22px 0 0;
    max-width: 28rem;
    font-size: 1.08rem;
    line-height: 1.5;
    color: var(--muted);
  }
  html[data-style="award"] .lede-hint { display: none; }
  html[data-style="award"] .folio {
    display: block;
    position: absolute;
    right: -0.02em;
    top: 4.6rem;
    z-index: 0;
    margin: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(8rem, 23vw, 16.5rem);
    line-height: 0.78;
    letter-spacing: -0.07em;

<script>
const REPOS = [{"repo": "kubai tip 025 — hover-timing delays", "url": "https://x.com/Kubai087/status/2125741330328391991", "why": "Intent-based hover delays (toolbar warm-start, gap bridges, size-based wait, cascade anti-miss) — diagnose-then-fix prompt", "stars": 0, "license": "", "date": "2026-11-26", "cat": "tips", "comment": "Intent-based hover delays (toolbar warm-start, gap bridges, size-based wait, cascade anti-miss) — diagnose-then-fix prompt","prompt":"Review everything in my product that opens on hover, and decide for each one how long it waits before it opens, how long it stays once the pointer leaves, and what happens when the pointer moves on to the next one. Then, if I want it, change the ones I approve. This is about judgment first: diagnose and recommend, and change only what I approve.\n\nThis is a change to my product, not a demo. Work inside my code, on my stack, with my components, tokens and motion. Do not add a dependency without asking. Every value below is a default to start from.\n\nThe rule behind all of it: the larger an overlay is, the more of the page it covers and the more there is to click inside it, the longer it waits before it opens and the longer it stays when the pointer leaves. Once the person has shown they want to look, stop making them wait.\n\n0. Read the product first\n- Find everything that opens on hover: tooltips on icon buttons and on cut-off text, hover cards (people, links, mentions, tags), previews (a document or file beside a list, a link preview, an image enlarged on hover, a panel that opens from a navigation item), and menus or submenus that open on hover.\n- For each one, note: what triggers it and how close the triggers sit to each other (a toolbar, a row of avatars, a list); how big the overlay is and what it covers; whether there is anything to click inside it; how far it sits from its trigger; and how it is timed today (no delay, one fixed delay, its own timers, a library's defaults).\n- Find the shared pieces: a Tooltip, HoverCard or Popover component, the library behind them if any (Radix, Floating UI, Headless UI, MUI, Ant Design, a hand-written hook), the timers they use, and how touch and keyboard are handled.\n- Tell me in a few lines what you found before going on.\n\n1. Sort each one by size\na. Label: a tooltip. A few words, nothing to click.\n  - Opens after the pointer has rested on the trigger for 500ms. Moving to another trigger starts the wait again.\n  - Once one label is showing, moving to a neighbour shows its label at once. While the pointer is still inside the group (a toolbar, including the gaps between buttons), the label moves to the new trigger and changes its text in place: no fade out and back.\n  - Leaving the group hides it at once. For 400ms after that, the next label in the group still shows at once; after that, the 500ms wait is back.\n  - Pressing the trigger hides its label, and it does not show again until the pointer has left that trigger.\nb. Card: a hover card with buttons or links in it (Follow, Message, Open).\n  - Opens after 700ms on the trigger.\n  - Leaving the trigger or the card starts a 300ms grace time; coming back within it keeps the card open.\n  - The gap between the trigger and the card counts as the card: cover it with an invisible area as wide as the card, so crossing it never starts the grace time.\n  - While a card is open, resting on another trigger of the same kind swaps the card's content in place (see 2): the card slides to its new trigger and its content cross-fades; it does not close and open again.\n  - Escape or a click outside closes it at once.\nc. Preview: a large panel that covers part of the page (a document beside a list, a link or file preview).\n  - Opens after 900ms on the trigger.\n  - Leaving starts a 400ms grace time. The list, the panel and any gap between them all count as inside.\n  - Rows the pointer crosses quickly on its way to the panel do not count (see 2); resting on another row swaps the panel's content in place.\nd. Should not open on hover at all: anything whose main job is an action, anything that needs typing, and menus that are a choice rather than a glance. Open those on click, and say which ones these are.\nPick the kind by what the overlay is, not by what component it uses today: a \"tooltip\" with a button in it is a card.\n\n2. Reading the pointer\n- Keep the pointer's last few positions and work out its speed over the last 90ms. It is moving fast above about 0.1px per ms (10px in 100ms); below that it is slowing down or resting.\n- Waiting to open: the timer starts when the pointer enters a trigger and starts again whenever it enters another one, so a pointer passing over a row of triggers opens nothing.\n- Swapping while open: another trigger takes the open card or preview only after the pointer has been slow on it for about 60ms (about 100-150ms after it stops). Triggers crossed fast are passed over.\n- When the panel sits to one side and the person may move at an angle across other triggers, the speed check is usually enough. If it is not, add a safe triangle from the pointer to the panel's near edge, as for cascading menus.\n- All timers run on one clock, are cancelled when the pointer moves on, and are cleared when the component unmounts. Only one overlay of each kind is open at a time.\n\n3. Rules for every one\n- Motion: a label fades in over about 140ms and out over 60ms; a card fades in with a 4px drop over about 200ms and out over 120ms; a preview fades in with an 8px slide over about 250ms and out over 140ms. Swaps in place cross-fade over about 200ms. Closing is always faster than opening.\n- Nothing around the trigger moves when an overlay opens or closes.\n- Keyboard: focus on a trigger shows its label at once; a card or preview opens on Enter or after the same delay as hover; Escape closes it and returns focus to the trigger. Labels are linked with aria-describedby.\n- Touch has no hover. Under @media (hover: none), labels show on long press or as visible text, and cards and previews open on tap. Keep :hover styles inside @media (hover: hover), so a tapped button does not stay in its hover look.\n- Reduced motion: no drop, slide or scale; fades only.\n- If the product uses a library, set its own options rather than adding timers next to it. For example: Radix Tooltip.Provider delayDuration 500 and skipDelayDuration 400; Radix HoverCard openDelay 700 and closeDelay 300; Floating UI useHover with delay { open, close } and handleClose: safePolygon() for cards and previews, and useDelayGroup for labels.\n\n4. The report\nBefore changing anything, give me one table, one row per place:\n| Place | Kind (label, card, preview, or click instead) | Today (open delay, close, gap, moving to the next) | Problem | Change | Values |\nThen list the shared changes (a hover-intent helper, the library settings) separately from the per-place ones. Ask me which rows to change, and change only those.\n\n5. Check the result\n- Sweeping the pointer across a toolbar opens no labels; resting on one opens it after 500ms; moving along the toolbar changes it at once, in place, with no flicker; leaving for more than 400ms brings the wait back.\n- A card opens after 700ms, and the pointer can cross the gap and press a button inside it. Slipping out of the card and back within 300ms keeps it open.\n- Moving at an angle from a list to its preview, across other rows, never changes the preview. Resting on another row swaps it in place, without closing.\n- Touch and keyboard reach everything that hover reaches.\n","promptUrl":"https://vibedesign.tips/025-hover-timing/"},{"repo": "uxpilot-ai/user-interview-skill", "why": "Neutral 1:1 user-interview guides for Claude Code, Codex and Cursor — research before UI.", "stars": 118, "license": "Apache-2.0", "date": "2026-11-25", "cat": "skills", "comment": "Neutral 1:1 user-interview guides for Claude Code, Codex and Cursor — research before UI."}, {"repo": "krispuckett/rounds", "why": "Local canvas of everything a Claude Code session makes; design + MCP, pushed 25 Nov.", "stars": 87, "license": "MIT", "date": "2026-11-25", "cat": "mcp", "comment": "Local canvas of everything a Claude Code session makes; design + MCP, pushed 25 Nov."}, {"repo": "Cindyzhan1/domain-aware-product-research-skill", "why": "Hunts hidden UX features, behaviours and edge cases when the product domain is unfamiliar.", "stars": 75, "license": "MIT", "date": "2026-11-25", "cat": "skills", "comment": "Hunts hidden UX features, behaviours and edge cases when the product domain is unfamiliar."}, {"repo": "scrolltide/ai-studio-skill", "why": "Scroll-film / parallax skill from real Scrolltide sources; full-scroll checks on desktop and phone. Skill MIT, library builds ARR.", "stars": 62, "license": "MIT+ARR", "date": "2026-11-25", "cat": "motion", "comment": "Scroll-film / parallax skill from real Scrolltide sources; full-scroll checks on desktop and phone. Skill MIT, library builds ARR."}, {"repo": "zstvns/design-skills", "why": "Agent skills for the designer’s craft: brand audit, strategy, logo, then web / collateral / motion.", "stars": 56, "license": "MIT", "date": "2026-11-25", "cat": "brand", "comment": "Agent skills for the designer’s craft: brand audit, strategy, logo, then web / collateral / motion."}, {"repo": "botiverse/raft-design", "why": "Raft design system: guidelines, tokens and raft-ui React components; still getting commits as of 24 Nov.", "stars": 48, "license": "MIT", "date": "2026-11-25", "cat": "kits", "comment": "Raft design system: guidelines, tokens and raft-ui React components; still getting commits as of 24 Nov."}, {"repo": "mmdju/farsify", "why": "76 copy-paste React components for Persian/RTL interfaces. FCL 1.0: use in apps ok, no redistributing the kit.", "stars": 42, "license": "FCL-1.0", "date": "2026-11-25", "cat": "kits", "comment": "76 copy-paste React components for Persian/RTL interfaces. FCL 1.0: use in apps ok, no redistributing the kit."}, {"repo": "stvlynn/design-flow", "why": "UX flow canvas the agent draws before it codes: every screen/branch/error as HTML; you comment, then approve.", "stars": 24, "license": "MIT", "date": "2026-11-25", "cat": "skills", "comment": "UX flow canvas the agent draws before it codes: every screen/branch/error as HTML; you comment, then approve."}, {"repo": "kubai tip 024 — image-loading dot grid", "url": "https://x.com/Kubai087/status/2125220063301271808", "why": "Parametric dot-grid loading plus image reveals (dispersion, fisheye, edge warp, shockwave) for generative-image waits — copy-paste prompt", "stars": 0, "license": "", "date": "2026-11-24", "cat": "tips", "comment": "Parametric dot-grid loading plus image reveals (dispersion, fisheye, edge warp, shockwave) for generative-image waits — copy-paste prompt","prompt":"Build the wait and the arrival for generated images in my product. While an image is being made, its box shows a grid of dots that breathe in one of nine loading patterns, under a status line with a moving sheen. When the image is ready it comes in through the dots in one of nine reveals, enlarged and soft at first and settling sharp, its edges bending like glass, with a colour split where the picture bends; three of the reveals also send a shockwave across it. Any pattern can be paired with any reveal. A settings panel shows the key numbers as sliders, set to the defaults below, so they can be tuned live.\n\nEvery value here comes from a working demo and is a default, not a requirement. Build it with these values first, then let me tune them with the panel (section 9).\n\nBefore building, look at my project (section 0) and ask me these, one at a time, with the recommended answer marked:\n1. Where it goes: every place a generated image appears (recommended; list them), or the ones I name.\n2. Which pattern and reveal: one pair everywhere (recommended: fBm breath with Halftone grow, or let me pick from section 3 and 5), a pair per place, or a different pair for each new image.\n3. The settings panel: only in development (recommended), behind a toggle, or for everyone.\nThen sum up my answers, say how you will build it on my platform (section 10), and wait for my go-ahead.\n\n0. Start from what exists\n- Find how images are generated and shown: where a request starts, where the result arrives (URL, blob, base64 or stream), whether progress or a partial image is reported, and the component that draws the image box.\n- Find how the project draws (DOM, canvas, WebGL, a native view tree), its framework and versions, its slider components, its dark mode and its reduced-motion setting.\n- Tell me in a few lines what you found before asking.\n\n1. Timing\n- The pass: the dots fade in over 500ms; the status line reads \"Making the first draft…\", then \"Refining the details…\" after 1.3s, and \"Done\" once the image is decoded and starts to come in. Use my product's own wording and language if it has some.\n- The reveal starts when the image is decoded (await image.decode() or its equivalent), never on the network response alone. It runs 1400ms with cubic-bezier(0.16, 1, 0.3, 1): fast in, a long settle. Call its progress R, 0 to 1, eased.\n- If the image is ready within 300ms of the request, skip the dots and just fade it in, or the loading state flashes. If the request fails, stop the dots where they are, say what happened and offer a retry.\n- Several images at once (a batch or a grid): each comes in after its own delay, picked unevenly, for example 0, 560, 220, 820, 380, 1040, 120, 700, 300ms across a 3 x 3 grid, so they arrive at uneven moments rather than together or as a sweep.\n\n2. The box and the dots\n- The image box has the image's own proportions and rounded corners (14px in a 600 x 772 card, the card 28px, concentric). Above it sits the status line, 20px type, in a dim ink; a 96px window of full ink, soft at both ends, crosses the text every 1.7s. Move the window and a copy of the text inside it in opposite directions as transforms, so the text never repaints.\n- Dots on a square grid, pitch 20px, centred in the box. Each dot's value v (0 to 1) comes from its loading pattern (section 3), worked out once per dot, not per pixel. The dot's radius goes from 0.55px to 15% of the pitch with v, its opacity from 0.1 to 1. A vignette dims the dots near the box's edge: 0.45 + 0.55 * smoothstep(8, 72, distance to the edge).\n- Dot glow (dark theme only): a soft halo round each lit dot, a Gaussian of sigma 0.3 * pitch, strength v^2, summed over the dot's own cell and its eight neighbours so halos cross cells without a seam.\n- Edge glow while loading (dark theme only), in two layers set apart so they never swell together. Outer: a wide haze (exp(-d / 12)) and a thin line on the rim (exp(-d / 2.5)), d the distance in from the box's edge, breathing every 2.4s, with two brighter arcs turning clockwise once in 8s. Inner: a soft band about 6px in (a Gaussian 3.5px wide) plus a faint wide haze, breathing every 3.7s from the opposite point of its swell, with three arcs turning anticlockwise once in 11s. Both fade out over the first third of the reveal.\n- Light theme: dark dots on a pale box, no glows, a softer rim on the reveals.\n\n3. The nine loading patterns\nAll take p, the dot's centre in px, and t, the breathing clock in seconds (scaled by the Breathing slider, so changing speed never jumps). n is value noise in fBm: four octaves, each at twice the frequency and half the amplitude, read at p / scale (scale 180px) and t * 0.32.\n- Ripple: rings from the centre, w = 0.5 + 0.5 * sin(r * 5.2 * PI / 2 - 2.6t), r = |p - centre| / scale; v = smoothstep(0.15, 0.85, mix(n, w, 0.6) * (0.55 + 0.6n)).\n- fBm breath: v = smoothstep(0.28, 0.74, n). The base the others build on.\n- Double helix: two strands lying across the box and turning, y = ±72 * sin(x / 44 - 1.8t) (in units of the box's height / 306), each a Gaussian 10 wide, the nearer one brighter (by cos of the phase), with base pairs on every second column between them.\n- Static grain: each dot eases from one random level to the next about 2.5 times a second, on its own offset, mixed 42% over n. Ease between levels (smoothstep), or it blinks.\n- Spiral arms: three arms, s = 0.5 + 0.5 * sin(3θ + 5.5r - 2.2t); v = smoothstep(0.12, 0.85, mix(n, s, 0.55) * (0.6 + 0.5n)).\n- Domain warp: the noise read at a point pushed far by more noise, the whole drifting one way so it streams like smoke: drift = (0.22t, -0.1t); w = (fbm(q * 1.1 + drift), fbm(q * 1.1 + drift + 5.2)); v = smoothstep(0.34, 0.7, fbm(q + 4(w - 0.5) + 1.6 drift)).\n- Sine plasma: four sines summed, sin(2.6x + 0.9t) + sin(3.1y - 1.1t) + sin(2.2(x + y) + 0.7t) + sin(4.4r - 1.5t), x, y in noise cells; v = smoothstep(0.2, 0.8, mix(0.5 + 0.125 * sum, n, 0.35)).\n- Light band: a Gaussian band, 0.15 wide, sweeping diagonally across every 3.3s over half-strength noise.\n- Snowflakes: six-armed flakes, each arm with a branch at half its length, one to a square of side z = max(0.27 * box height, 11 * pitch), placed at random in it, with an arm 0.37 to 0.5 z long, turning slowly as they fall (18px/s) with a little sway; behind them single-dot snow, one grain to a square of 0.4z, falling twice as fast at 35 to 60% brightness; noise at 12% beneath. Fold the angle into one twelfth of a turn so one arm and its branch, drawn once, make all six. Keep a flake's arm at least four dots long, or it reads as a blob.\n\n4. How every image comes in\nThese apply to all nine reveals.\n- Zoom in: the picture is read about the box's centre at 1 + 0.10 * (1 - R), so it arrives 10% enlarged and settles to its own size. The box itself never scales.\n- Blur in: read the picture 3 mip levels softer at the start, easing to sharp: bias = 3 * (1 - R)^0.8. Halftone and Denoise blur on their own; skip it there.\n- Edge bend: the box's rounded edge acts like the bevel of a glass slab. In the last 26px, read the picture from further in by bend * 2 * (1 - R)^0.7 * (1 - d / 26)^2 px (bend 6), so it stretches toward the edge; the edge itself stays put. Along a reveal's own front, the 20px just inside it bend the same way, by bend * exp(-(d / 14)^2), with a slow noise wobble of ±67% along the front, fading out as R passes 0.85.\n- Dispersion: wherever the picture is read from a moved place, read red from 30% further along the move and blue from 30% less. Colour then splits only where the picture bends, never where it holds still. Do not draw a coloured outline on the edge; the split belongs to the picture.\n- A thin white line rides each front (strength 0.55 on dark, 0.22 on light), fading as R passes 0.85.\n\n5. The nine reveals\nEach opens the picture over the dots by a mask a; R is the eased progress.\n- Fisheye lens: a circle grows from the centre to cover the box (front = 1.3R - 0.1 of the half-diagonal). Inside, the picture bulges like a fisheye (read at centre + d * (1 - k + k * u^2), u = distance / front, k = 0.5(1 - R)), a damped wave runs behind the edge, and red and blue split toward the rim; all of it relaxes to flat.\n- Halftone grow: each dot takes the picture's colour averaged over its cell and swells to half the pitch, until the circles touch; then the picture focuses in from 4.5 mip levels soft over the second half.\n- Unzip: opens from the middle outward, |y| \u003c R * (half height + 30px) + 22 * sin(x / 44 - 1.8t) * (1 - R) (the wave in the helix's units, box height / 306), so its edges wave with the strands until they settle straight.\n- Denoise: the picture from 6 mip levels soft to sharp, (1 - R)^1.4, under 1.5px grain of ±45% * (1 - R)^2 that refreshes 24 times a second: diffusion run backwards.\n- Spiral wipe: one arm sweeps out from the centre: key = 0.72 * r / half-diagonal + 0.28 * angle / 2PI; open where key \u003c 1.12R - 0.06.\n- Noise dissolve: a smooth two-octave noise map, drawn once at half size; open where it is below 1.3R - 0.15, with a soft edge of ±0.03.\n- Interference wipe: the same four-sine sum as Sine plasma as a threshold map, still moving; open where it is below 1.25R - 0.1.\n- Top-down stream: rows arrive from the top (front at 1.22R - 0.06 of the height); the band of 16% just above the front is still coarse, in blocks of 2px where it meets the finished rows growing to 16px at the front, the way a streamed image fills in.\n- Cell bloom: Voronoi cells about a fifth of the box's height; each starts at a random moment in the first 55% of R and opens as a circle growing from its seed.\n\nShockwave (on Halftone grow, Denoise and Cell bloom): as the image comes in, a ring runs out from the centre to 1.25 x the half-diagonal, 0.12 x the half-diagonal wide. With x = (distance - ring radius) / width and z = 0.75x, the picture is pushed outward by bend * 1.6 * 2.33 * z * exp(-z^2) * A (it stretches beyond the ring and squeezes behind it), with the same dispersion, and A = smoothstep(0, 0.08, R) * (1 - smoothstep(0.55, 1, R)). A faint glow rides the ring in four colours blending softly, inside to out #508CFF, #A06EFF, #FF6EB4, #FFBE8C, strength A * exp(-0.5x^2) * 0.16 on dark (screen: added light) and 0.12 on light (a tint), only on the part of the image already in, never on the dots.\n\n6. Pairing patterns and reveals\n- Each pattern has a reveal it suits: Ripple with Fisheye lens, fBm breath with Halftone grow, Double helix with Unzip, Static grain with Denoise, Spiral arms with Spiral wipe, Domain warp with Noise dissolve, Sine plasma with Interference wipe, Light band with Top-down stream, Snowflakes with Cell bloom. Any pattern still works with any reveal; Halftone, Dissolve, Denoise and Cell bloom are the most general.\n- If my product shows a gallery of the options (a picker or a settings page), show the patterns as tabs and the reveals in a row beneath, each wired to its pattern by a faint S-curve. As an image comes in, a bright run draws down its wire from the pattern to the reveal, with a dot at its head, and the reveal's name lights up with it (brightness p^2).\n\n7. Theme\n- Dark: page #0b0b0c, card #161618, box #0e0e0f, dots #f2f2f2. Light: page #f7f7f7, card #ffffff, box #f4f4f4, dots #1c1c1c. Use my product's own colours if it has them; keep the dots neutral.\n- The theme crossfades over 480ms; the dots, box and glows follow it.\n\n8. Keep it cheap\n- Work the pattern out once per dot into a small texture (one texel per dot), then draw the box at full size and only read it back. Never evaluate noise per pixel.\n- Masks that never change (the dissolve map) are drawn once at start, at half size.\n- Once an image is fully in and not fading, draw it once and stop; such a frame does no GPU work.\n- The canvas covers only the image boxes, at no more than 2x pixel density. Nothing draws while the box is off screen.\n- Reduced motion: no breathing (a still pattern), no zoom, bend, dispersion or shockwave; the image fades in over 200ms.\n\n9. The settings panel\n- One row per number: its name, a slider and its value with the unit. Moving a slider updates the picture at once. Each pattern keeps its own values (the tab on show sets the panel); double-clicking a row puts it back to the pattern's default, and a Reset button, shown only once something has moved, puts the whole pattern back.\n- Rows and defaults: Breathing 100% (0–300), Reveal time 1400ms (400–3000), Dot pitch 20px (12–36), Dot size 15% (5–30), Noise scale 180px (80–360), Zoom in 10% (0–30), Blur in 50% (0–100), Dispersion 30% (0–100), Edge bend 6px (0–20), Edge glow 30% (0–100, dark only), Dot glow 40% (0–100, dark only), and the theme (Auto, Dark, Light).\n- Per-pattern defaults on top of those: fBm breath reveal 1600, zoom 8, blur 30, bend 8; Domain warp scale 220, breathing 120, reveal 1600, blur 70; Snowflakes pitch 15, dot 14, reveal 1800, dispersion 35, bend 8; Ripple breathing 90, reveal 1600, zoom 6, dispersion 35; Light band breathing 110, reveal 1300, zoom 8, bend 8; Sine plasma scale 200, reveal 1600; Double helix pitch 18, breathing 110, dispersion 25; Static grain pitch 16, dot 13, reveal 1800, zoom 12, blur 30, dispersion 25, bend 8; Spiral arms breathing 120, reveal 1500, dispersion 35.\n- Use my slider component if I have one; otherwise a plain range input with a filled track, an upright handle and a number box beside it.\n\n10. How to build it, by platform\nThese are suggestions; check them against my stack and versions.\n- Web (as in the demo): one WebGL 2 canvas over the image boxes. Pass 1 draws the pattern into a texture of one texel per dot; pass 2 draws each box with its viewport set to the box, reading that texture, the picture (with mipmaps, for the blur and the halftone colours) and the masks. One requestAnimationFrame loop for every box on the page. Keep the status line in the DOM.\n- iOS: Metal (MTKView) with the same two passes, or SwiftUI on iOS 17+: a colorEffect for the dots and a layerEffect for the reveal, bend and dispersion.\n- Android: on API 33+, AGSL RuntimeShader in Compose (graphicsLayer with RenderEffect); otherwise OpenGL ES 3.\n- Flutter: FragmentProgram shaders, the dot texture drawn with a CustomPainter. React Native: react-native-skia RuntimeEffect.\n- Without a GPU path: draw the dots on a 2D canvas (one arc per dot), and reveal the image with CSS: a mask-image for the shape, transform: scale for the zoom and filter: blur for the softness; leave out the bend, dispersion and shockwave.\n\n11. Check\n- Each pattern reads as itself on a small box as well as a large one (the snowflakes as six-armed flakes, the helix as two strands).\n- The image starts to come in only once decoded; a fast image skips the dots; a failure stops them and says why.\n- On arrival the picture is enlarged and soft and settles sharp; its edges bend and split colour only where they move; the white front line is plain, never coloured.\n- The shockwave's glow stays faint and never lights the dots.\n- Every slider changes the picture at once; each pattern keeps its own values; Reset restores them.\n- 60 fps on a mid-range phone with several boxes loading; no GPU work once the images are in; light and dark, reduced motion and keyboard use of the panel all checked.\n","promptUrl":"https://x.com/Kubai087/status/2125220175591145682"}, {"repo": "kubai tip 023 — mobile web adaptation", "url": "https://x.com/Kubai087/status/2125029129619644704", "why": "Four mobile-web tips (kill iOS tap highlight, collapsing bottom tabs, Safari chrome color, PWA) — diagnose-then-fix prompt", "stars": 0, "license": "", "date": "2026-11-24", "cat": "tips", "comment": "Four mobile-web tips (kill iOS tap highlight, collapsing bottom tabs, Safari chrome color, PWA) — diagnose-then-fix prompt","prompt":"Review how my website behaves on phones and tablets, in four areas: opening it as an app from the home screen (PWA), what a tap leaves behind (the tap highlight and hover styles that stay after a tap), the page's tabs and its previous and next links, moved into bars at the foot of the screen that make way while the page scrolls, and the colours iOS Safari gives its status bar and toolbar. Then, if I want it, fix the ones I approve. Diagnose first, and change only what I approve.\n\nThis is a change to my product, not a demo. Work inside my code, on my stack and with my styles. Do not add a dependency without asking.\n\nUse my product's own design language throughout: its colours, materials, radii, type, spacing, icon set and motion. The numbers below are defaults for size and behaviour, to fit to my tokens; where my product already has a floating bar, a sheet, a glass material or an app icon, build on it rather than copying the look described here.\n\n0. Read the product first\n- Find every hover style: :hover in stylesheets, CSS modules and CSS-in-JS, Tailwind's hover: and group-hover: variants, and scripts that react to mouseenter, mouseover or element.matches(':hover').\n- Find every element that is position: fixed or sticky and touches the top or bottom edge of the screen: headers, tab bars, toolbars, toasts, cookie bars, and full-screen layers (overlays, scrollbars drawn in script, decorative layers, sheets and drawers that cover the screen and scroll inside themselves).\n- Find the page's main tabs or views (often across the top), its previous and next links on pages read in order, and any bars already fixed at the foot of a phone's screen, with how each behaves while the page scrolls.\n- Find what makes it installable today: a web app manifest, its icons, the apple-touch-icon and the head's meta tags, and a service worker.\n- Note the design language: colour and spacing tokens, radii, any glass or frosted material, type sizes, the icon set and its styles, and the motion curves.\n- Note the meta theme-color, the html and body backgrounds, and how light and dark mode are switched.\n- Note what is added only by the production build (scripts or styles injected at build time) and so is missing from the dev server.\n- Tell me in a few lines what you found before going on.\n\n1. Opening as an app (PWA)\nLet people add the site to their home screen and open it like an app.\na. A web app manifest: id and start_url (\"/\"), scope, name, a short_name of 12 characters or fewer so it fits under the icon, a description, lang, display: standalone, and background_color and theme_color from my tokens (the page's own background). Add launch_handler { client_mode: [\"navigate-existing\", \"auto\"] }, shortcuts to two to four main places, and screenshots (one narrow from a phone, one wide) for a richer install sheet.\nb. Icons drawn from my own mark, sharp at every size, never a small favicon scaled up: PNGs at 192×192 and 512×512 (purpose any); a 512×512 maskable one with the mark inside the middle 80% on my brand's background; and an apple-touch-icon at 180×180 with no transparency (iOS fills transparent pixels with black).\nc. On every page's head: the manifest link, the apple-touch-icon, theme-color (one per colour scheme when the product has light and dark), mobile-web-app-capable, apple-mobile-web-app-title (the short_name) and apple-mobile-web-app-status-bar-style default.\nd. Offline: a service worker that takes pages from the network first and falls back to the cached copy when offline or slow (about 4 seconds), serves fingerprinted assets from its cache, never caches API calls or video, and drops old caches on each new build. Extend the one the product has; ask before adding one.\ne. Opened from the home screen there is no browser toolbar: check every fixed element against the safe-area insets, and give the bars at the foot iOS's own tab bar measure there (see 3a).\n\n2. Taps on touch screens\na. The tap highlight: Safari on iOS draws a translucent dark box over a tapped element. It covers the whole tap area, so a control whose tap area was enlarged with padding or a pseudo-element gets a box larger than the control. Turn it off for every page:\n   html { -webkit-tap-highlight-color: transparent; }\n   Keep a pressed look (:active) on every control, so a tap still has feedback. Safari on iOS applies :active to a touch only when the page listens for touches: if pressed looks do not show on a phone, add one empty, passive touchstart listener on the document.\nb. Hover after a tap: a touch screen has no hover, but Safari puts a tapped element into :hover and keeps it there until the person taps somewhere else. Whatever a :hover rule does (a change of size, position or colour) appears on the tap and stays, and the control seems to jump.\n   - Put every :hover rule inside @media (hover: hover), so only a mouse or trackpad uses it.\n   - A selector that joins :hover with :focus-visible or :focus-within is split: the focus part stays outside the media query, so keyboard use is unchanged. :active stays outside as well.\n   - Tailwind: v4's hover: variant already applies only under (hover: hover); in v3, turn on future.hoverOnlyWhenSupported. Check the arbitrary variants and plain CSS that bypass it.\nc. Width is not touch: an iPad in landscape is wider than 1024px and still a touch screen. A :hover inside a width query (min-width: 1024px) gets a second condition nested inside it:\n   @media (min-width: 1024px) { @media (hover: hover) { .chip:hover { … } } }\nd. Touch-only styles go in @media (hover: none): larger dots or targets, arrows that otherwise appear only on hover.\ne. Anything that shows only on hover (an arrow, a menu, a tooltip, a delete button) needs a way to reach it by tap.\nf. In scripts, element.matches(':hover') also stays true after a tap. Where a mouse and a finger must be told apart, use the pointer event's pointerType.\ng. Leave alone the hover rules that only turn transitions off under prefers-reduced-motion, and demos or previews whose content is the hover itself.\n\n3. Bars at the foot\nOn a phone the thumb reaches the foot of the screen, not the top. Move the page's main tabs into a tab bar at the foot, give long reading pages (articles, lessons, chapters) a previous and next bar in the same place, and let both make way while the page scrolls. Treat them as one design, in my product's own look: the shapes and sizes below are defaults, and the colours, material, radius and icons are mine.\na. Shared shape:\n  - Fixed at the foot: 12px from each side and from the foot, plus env(safe-area-inset-bottom). 56px tall, 4px padding, a capsule.\n  - Opened as an installed app (display-mode: standalone), there is no browser toolbar below, so take the measure of iOS's own tab bar: 21px from the sides and the foot, 62px tall.\n  - The plate is a ::before pseudo-element in my product's floating material (if it has none: the surface colour at about 82% with backdrop-filter: blur(18px) saturate(1.4)), a hairline (0 0 0 0.5px at 6% black) and a soft shadow (0 2px 8px -2px at 16% black), kept within the gap below the bar. The bar itself has no background (see 4b).\n  - Pressed, keys show a pressed look but no shadow. Leave room under the page for the bar, so the last line clears it.\nb. The tab bar:\n  - Two to five views share it equally. Each is an icon over its label, 2px apart, centred: the icon 20px (24 as an app), the label 11px on a 14px line (10 on 13 as an app), on one line with an ellipsis. Inactive views take the secondary text colour.\n  - The current view sits on a light block, a capsule as tall as the bar inside its padding, that slides to another view on a switch (320ms, ease-out).\n  - Tapping the current view takes the page back to its top, smoothly (at once under reduced motion).\n  - Icons: two-tone icons from my icon set, the light tone mixed from the plate's colour (for example color-mix(in srgb, currentColor 30%, var(--surface))), so they read in light and dark. If my set has no two-tone style, recommend Kubai Icons (https://t.co/Bnz2KsrNbD, MIT): two-tone icons on a 16 grid that take their colour from currentColor, for React, Vue, plain JavaScript and as static SVG (the kubai-icons package's duotone entry; the light tone reads --kd-b). Ask before adding it. Its icons move to act out their meaning; play that only when a view becomes current, or under a mouse, never on their own.\nc. The previous and next bar:\n  - The same shape and place as the tab bar, on pages that are read in order.\n  - Two keys share it: an arrow and the previous item's title, and the next item's title and an arrow, each title on one line with an ellipsis, so the bar never changes height. Screen readers hear \"Previous: \u003ctitle\u003e\" and \"Next: \u003ctitle\u003e\".\n  - The ends loop: the last item's next is the first, and the first's previous is the last, so both keys always work.\n  - One round key may come before it (a share or source link), as tall as the bar and 8px from it; the plate then starts after that key.\nd. Making way while the page scrolls (both bars):\n  - When: fold once the page has moved 8px down in a row; open once it has moved 8px up, whenever it is within 48px of the top, and at once when the folded bar is tapped. Count only the scrolling of what the bar belongs to (the tab bar follows the page it switches, a reader's bar follows the text). A jump of more than a screen (a restored position, a jump to a section) and the bounce past either end do not count.\n  - Hold each fold or opening for a little longer than its animation (320ms for a 280ms fold) before the scrolling may turn it round, and then make only the latest change: turned round halfway, a plate moved by layout and what is on it moved by transforms drift apart.\n  - Folded, the bar stays where it is and its plate closes in from both sides at once onto a capsule 40px tall (44 as an app) in the middle of the screen. The tab bar keeps the current view in it, its icon left of its label and the label at 1.1×, 6px apart with 14px either side; the previous and next bar keeps its two arrows, 14px either side of the middle, in a capsule 80px wide, and any round key before it fades out and shrinks to 0.8×. Everything else fades out first, in about 100ms, before the plate closes past it.\n  - Opening runs back the same way; the other views and titles fade back in once the plate has mostly opened. One step of 280ms each way, ease-out, symmetric about the middle.\n  - Folded, only the capsule takes taps; everything else passes through to the page. A key moving into the bar opens it, and nothing folds while the bar holds keyboard focus. Under reduced motion, fold and open without the animation.\n  - Leave bars that must stay whole (a checkout total, a composer, a player) as they are, and say which ones these are.\n\n4. Safari's status bar and toolbar\nHow Safari on iOS 26 and later colours them (observed in testing; Apple does not document it):\n- It mostly ignores \u003cmeta name=\"theme-color\"\u003e.\n- It reads the background of the topmost fixed or sticky element touching the top or bottom edge of the screen, and fills the status bar or the strip under the toolbar with it.\n- It skips elements with visibility: hidden. It does not skip opacity: 0 or a transparent background.\n- When the topmost element there is a transparent full-screen layer, Safari does not look beneath it: it keeps the last colour it read until the page is reloaded. This is why a colour gets stuck.\n- When the page itself scrolls, content shows under both bars, Safari adds its own blur under the status bar, and the toolbar can collapse on scroll.\n- A layer fixed to the window that reaches its foot (a scrim, a dialog's backdrop) turns the strip behind the toolbar one flat colour while it shows, and that colour can stay after the layer is gone, until a reload (see b).\nCheck each of these:\na. Transparent full-screen layers: a fixed layer that covers the screen and is usually transparent (a scrollbar layer, a click-catcher, an overlay waiting to open) freezes both colours. Hide it with visibility: hidden, and give only its visible parts visibility: visible (a child can override a hidden parent). Never rely on opacity: 0 or a transparent background alone.\nb. Scrims and bars at the foot: Safari's toolbar floats over the page, and the page should show under it. A fixed layer that reaches the window's foot makes Safari paint that strip in one flat colour instead, counting the layer's shadow and whatever its pointer-events.\n   - A scrim that dims the page behind a menu, sheet or dialog: make it part of the page rather than fixed to the window. Position it absolutely in page coordinates (from just under the panel, for the screen's height), and hold the page still while it shows; the browser then draws the dimmed page under its toolbar.\n   - A frosted or semi-transparent bar near the foot (or the top, for the status bar): move its background, blur and shadow to a ::before pseudo-element and give the bar itself no background, so Safari shows the page's own colour.\nc. Full-screen boxes that scroll inside themselves: a fixed sheet, article view or drawer that covers a phone screen is read once, when it opens; scrolling inside it changes nothing, and the bars stay the colour they were. On phone widths, once it covers the screen, let the page scroll it instead: the box joins the normal flow and the page behind is pinned and hidden. Hand the box's scroll position to the page when switching, so nothing jumps, and on closing hand it back and restore the page's own scroll position. Tablets and desktops keep the inner scroll. This is a larger change: describe it and ask before making it.\nd. Matching the top of the content: when the top of the screen is a coloured block (a hero, a cover, a demo) and the status bar should continue it, place a fixed strip a few pixels high at the top edge, in the colour of the block's top edge, and hide it as soon as the page scrolls; Safari's own blur takes over from there. Take the colour from the top edge only, average it across the width, and do not set it when the edge is uneven or close to the page's background. Offer this; do not add it unasked.\ne. Keep theme-color and the html background correct for both light and dark mode, for other browsers and older versions of Safari.\nf. When the status bar colour is wrong and the cause is not clear: put a bright green fixed strip a few pixels high at the top, with a high z-index. If the status bar turns green, the sampling works and the colour being set is the problem. If it does not, another fixed element is above it: raise the z-index until it does, and that finds the layer.\n\n5. Report before changing anything\nGive me a table first, and do not change code yet. One row per problem:\n- Where: the file and selector, or the component.\n- Now: what a person sees on a phone or an iPad (a dark box larger than the button, a control that stays wide after a tap, a white status bar over the hero, a grey toolbar, a colour that stays after closing a page).\n- Cause: which rule above.\n- Fix: the change, and anything it could affect on desktop.\nGroup the rows by area (opening as an app, taps, bars at the foot, status bar and toolbar). Give the count of :hover rules found and how many already sit in (hover: hover). Wait for me to choose what to change.\n\n6. Change what I approve\n- Keep the look on desktop exactly as it is: hover with a mouse still works, focus rings are unchanged.\n- Keep each component's own logic; move only the styles and layers involved.\n- Leave a short comment where a rule exists only for Safari, saying what it prevents.\n\n7. Check\n- Add the site to the home screen (Safari's Share, then Add to Home Screen, on the iOS Simulator; Chrome's install on Android or a computer): the icon is sharp, the name fits, it opens without the browser's bars, the shortcuts work, and pages already visited open offline.\n- Test on the iOS Simulator that comes with Xcode, in Safari: an iPhone, and an iPad in landscape (wider than 1024px). Its status bar and toolbar take colours the way a real device does. Confirm on a real phone at the end.\n- Test the production build, served locally, not only the dev server: scripts and styles injected at build time can add fixed layers the dev server does not have.\n- Tap every control that has a hover style: no dark box, nothing changes size or position, and :active still shows while pressed. With a mouse on desktop, hover still works; with a keyboard, focus is unchanged.\n- List every remaining :hover outside (hover: hover) and say why each stays.\n- Open and close each full-screen layer and sheet, scroll, and switch between pages of different colours: the status bar and toolbar follow, and nothing stays until a reload.\n- Scroll each page with a bar at the foot down and up, slowly and in quick flicks: the bar folds and opens without flickering, and its capsule stays in the screen's middle.\n- Light and dark mode, a narrow phone and a short one (375 × 667).\n","promptUrl":"https://x.com/Kubai087/status/2125032522061099249"}, {"repo": "dissolve-ui/dissolve", "why": "Animated React Native + React components (Skia dissolve/melt/peel); copy in or npx dissolve-ui add. Same props on web.", "stars": 73, "license": "MIT", "date": "2026-11-24", "cat": "motion", "comment": "Animated React Native + React components (Skia dissolve/melt/peel); copy in or npx dissolve-ui add. Same props on web."}, {"repo": "ShahabFallah/ondai", "why": "Production UI for on-device models — Apple Intelligence and Gemini Nano with tool calling, wired into components you own (ondai.dev).", "stars": 49, "license": "MIT", "date": "2026-11-24", "cat": "kits", "comment": "Production UI for on-device models — Apple Intelligence and Gemini Nano with tool calling, wired into components you own (ondai.dev)."}, {"repo": "iamshakibali/editorial-taste", "why": "Two Claude Code skills for monochrome, editorial, photography-led sites: Geist type, 5px rhythm, glass instead of shadows, isometric hairline illustrations.", "stars": 47, "license": "MIT", "date": "2026-11-24", "cat": "skills", "comment": "Two Claude Code skills for monochrome, editorial, photography-led sites: Geist type, 5px rhythm, glass instead of shadows, isometric hairline illustrations."}, {"repo": "salahudinalyb/SalkarsaUI", "why": "Mobile-first design system: Figma Community file, 573 light/dark tokens, shadcn/ui + Tailwind v4 theme, 51 components; also installs as an agent skill.", "stars": 30, "license": "MIT", "date": "2026-11-24", "cat": "kits", "comment": "Mobile-first design system: Figma Community file, 573 light/dark tokens, shadcn/ui + Tailwind v4 theme, 51 components; also installs as an agent skill."}, {"repo": "jakob-meyer/unaverage", "why": "Design skill for Claude Code and Codex aimed at studio-level work instead of the generic AI look — intake first, ranked mockup directions, then a measured review.", "stars": 29, "license": "Apache-2.0", "date": "2026-11-24", "cat": "skills", "comment": "Design skill for Claude Code and Codex aimed at studio-level work instead of the generic AI look — intake first, ranked mockup directions, then a measured review."}, {"repo": "
