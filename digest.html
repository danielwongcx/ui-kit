d in — fast kit fuel."},{"repo": "christophhdesign/open-design-system-bench", "why": "Scores DS agent-readiness — lint angle we barely cover.", "stars": 103, "license": "MIT", "date": "2026-11-05", "cat": "lint", "comment": "Scores DS agent-readiness — lint angle we barely cover."},{"repo": "pedrojaques99/visant-skills-public", "why": "Fresh anti-slop pack with motion/frontend, not another mega taste skill.", "stars": 83, "license": "MIT", "date": "2026-11-05", "cat": "skills", "comment": "Fresh anti-slop pack with motion/frontend, not another mega taste skill."},{"repo": "brendanciccone/storysync", "why": "Code-truth DS → Figma with pixel measurement, not vibes.", "stars": 75, "license": "MIT", "date": "2026-11-05", "cat": "kits", "comment": "Code-truth DS → Figma with pixel measurement, not vibes."},{"repo": "Moddingflow/better-design", "why": "DESIGN.md-first art direction — matches how you lock UI in-repo.", "stars": 46, "license": "MIT", "date": "2026-11-05", "cat": "skills", "comment": "DESIGN.md-first art direction — matches how you lock UI in-repo."}, {"repo": "kubai tip 010 — liquid glass", "url": "https://x.com/Kubai087/status/2117782193108082923", "why": "Liquid glass material tokens + rim lens — Lumno-grade surface prompt", "stars": 0, "license": "", "date": "2026-11-04", "cat": "tips", "comment": "Liquid glass material tokens + rim lens — Lumno-grade surface prompt","prompt":"Give the cards and panels in my product a liquid glass material: clear glass that takes its color from the scene behind it, reads as a thick slab at the rim, adapts to what is behind it, and keeps its text readable in light and dark mode. Work inside my existing design system. This is a change of surface, not of layout: keep my markup, spacing, radii, fonts, icons and copy.\n\n0. Start from what exists\n- Find every surface that sits over an image, a wallpaper, video or a busy background: cards, players, search bars, toolbars, menus, popovers, toasts. List them with their component and where they are.\n- Find how the product switches between light and dark mode, and where its color tokens live. The glass goes into those tokens, not into each component.\n- Leave surfaces over a plain background alone; glass over a flat color only looks gray.\n\n1. The material as tokens\nBuild it as one set of variables per state, so a surface opts in by using them. The numbers are a starting point, for a UI at its normal size.\n- Light glass, dark text (the default): tint white at 6–22% (by density, step 4); backdrop filter blur(2px) saturate(180%) brightness(1.06), so the color comes from behind and stays vivid instead of milky.\n  Edge: inset 1.5px 1.5px 1px -1px white 95%, inset -1.5px -1.5px 1px -1px white 55%, inset 0 0 0 0.5px white 30%, 0 0 0 0.5px black 6%, 0 6px 24px black 8%.\n  Inner light, on a layer inside the surface: a radial highlight from the top left (white 30% fading out by 55%), and soft inset glows just inside the rim, brighter at the top and left, a little shade at the bottom.\n- Light mode over a dark area, light text: tint rgb(16 18 22) at 10–30%; filter blur(2px) saturate(170%), then brightness(0.85); edge: a faint inset white line on top and a 0.5px dark outline.\n- Dark mode: tint rgb(20 20 24) at 16–38%; filter blur(2px) saturate(160%) brightness(0.8), which dims like a multiply with black instead of going muddy; the same edge and inner light at about a third of their strength, with a darker outline and shadow.\n- Ink, one color in fixed steps, used for everything drawn on the glass:\n  on light glass black 86% (titles, icons, times, progress), rgb(60 60 67) at 70% (secondary); mix-blend-mode multiply;\n  on dark glass white 94%, rgb(235 235 245) at 64%; mix-blend-mode plus-lighter.\n  Draw icons in the opaque color and fade the whole icon with opacity: a translucent color darkens where a shape's strokes and fills overlap.\n- A highlighted row on light glass is a lighter layer of the glass: white 42% on hover, 76% when selected, with a white stroke. Never a gray wash.\n- Register the numeric and color tokens with @property so a surface glides between states instead of jumping.\n\n2. Apply it in four declarations\nEach surface changes only these, and its markup stays as it is:\n- background: the tint.\n- backdrop-filter: the material's filter, then the rim lens (step 3) last, so the color steps fold into one pass and the bend stays crisp.\n- box-shadow: the edge.\n- color: the ink, with the blend mode on everything drawn inside.\nHover brightens the tint by about 14% instead of lifting a shadow.\n\n3. The rim lens\n- Build a displacement map for each surface: red is the sideways bend, green the vertical one, 128 is none. Only a rim bends; the middle stays flat.\n- The rim is about 44px wide on a card (min(44px, the short side / 3.5), never under 4px). For a thick slab, a point d from the edge looks inward by 1.1 × rim × (1 - d / rim)^2.6: hard at the edge, where the scene folds back on itself, easing to nothing at the rim's inner edge.\n- Draw the map for the same corner the CSS draws. If the surface uses corner-shape: superellipse(), follow that curve, not a circle, or the bend and the rim light miss each other at the corners.\n- Put it in an SVG filter with feImage (the map) and feDisplacementMap (scale = 2 × the largest offset), and add url(#id) at the end of backdrop-filter.\n- Split it into colors: three passes, red 15% further and blue 15% less, each kept to its channel with feColorMatrix and added back with screen blends. Check the corners of wide rims over busy backgrounds; lower the split where it turns into a haze.\n- Only Chromium draws url() in backdrop-filter. Check CSS.supports('backdrop-filter', 'url(#a)') and skip Firefox, which parses it and draws nothing. Everywhere else the CSS-only glass stays.\n- Wait for the map image to decode before pointing a surface at the filter, or it draws without its blur. Give every filter a unique id and its own \u003csvg\u003e. Build maps once per radius and rim width and reuse them; on resize, move the map, don't rebuild it.\n- Skip the lens on surfaces under 32px, and on surfaces with will-change or their own compositing layer (menus, animated panels), where Chrome can draw the map instead of the bent backdrop.\n\n4. Adapt to what is behind\n- For each surface, sample the background under it at a 5 × 3 grid, drop the two darkest and two brightest points, and average. Luminance is (0.299 R + 0.587 G + 0.114 B) / 255; texture is the brightest point minus the darkest.\n- Ink: in light mode, light text when the luminance is under 0.5. Keep the current ink within ±0.05 of the line so a surface never flickers at it. Dark mode is always light text. Neighbouring surfaces in one row share one decision.\n- Density (0 thin, 1 dense) = 0.55 × how close the background is to the ink's own brightness + 0.7 × texture + 0.3 × chroma. It moves the tint between its thin and dense alpha.\n- Saturation kept = 1 - 0.75 × chroma, at least 0.45, so a vivid background doesn't stain the glass.\n- Sample again when the background, the theme or a surface's position changes, and remember the last ink so the next load opens in it.\n- If the background is not an image you can read (live video, cross-origin content), pick the ink from the theme and use the dense tint.\n\n5. Let people set the tint\n- Add one setting for light mode and one for dark that scale the tint, from 0 to 1.5 (1 is the material as designed). Below 1 the brightness lift in the filter thins with it, so at 0 only the blur, the rim and the shadow are left.\n- Each theme keeps its own value; switching themes glides to that theme's value.\n\n6. Keep it accessible\n- Check text contrast on the busiest and the darkest background the product allows, at the default tint; raise density, not the ink's opacity, until it passes.\n- Respect prefers-reduced-transparency and forced colors: fall back to a solid surface in the same tint at full opacity.\n- Keep focus rings, disabled states and error colors as they are; failures keep their red.\n\n7. Deliver\n- First list the surfaces you will change, which get the lens and the color split, and which you leave solid and why.\n- Then add the tokens, the lens helper and the two settings, switch the surfaces over, and list every file you touched.\n- Don't change layout, fonts, radii or copy. If a surface would need a new component to work as glass, stop and ask me first.","promptUrl":"https://x.com/Kubai087/status/2117782337698324846"}, {"repo": "kubai tip 011 — easing curves", "url": "https://x.com/Kubai087/status/2118143759984803898", "why": "Ease tokens by role (out / in / spring / overshoot) — motion timing prompt", "stars": 0, "license": "", "date": "2026-11-05", "cat": "tips", "comment": "Ease tokens by role (out / in / spring / overshoot) — motion timing prompt","prompt":"Give the motion in my product the right easing curves, so things arrive, leave and move the way they should feel. Work inside my existing code and design system: keep what each animation does, how far it goes and what triggers it. Change how it moves over time, and its duration where that is off.\n\n0. Start from what exists\n- Find every transition and animation: CSS transitions and keyframes, animation libraries (Framer Motion, GSAP, the Web Animations API) and hand-written requestAnimationFrame loops. List each with its component, its trigger, its duration and its curve.\n- Flag the ones left on the CSS default `ease`, `linear` on something that moves, and `ease-in` on something that appears.\n\n1. The curves as tokens\nDefine them once, next to the other motion tokens, and use only these:\n- --ease-out: cubic-bezier(0, 0, .58, 1). Anything that enters: toasts, menus, popovers, dialogs, drawers.\n- --ease-out-strong: cubic-bezier(.22, 1, .36, 1). Small parts settling in right after a click: an icon, a label, a selected pill. It feels the most responsive.\n- --ease-in: cubic-bezier(.42, 0, 1, 1). Anything that leaves, and only that: a toast timing out, a dialog or drawer closing, a menu collapsing, a list item swiped away. It starts slow and leaves at full speed, so on an entrance it feels late and then stops with a bump.\n- --ease-in-out: cubic-bezier(.42, 0, .58, 1). Something that stays on screen and only changes place or size: the indicator under tabs or a segmented control, a carousel turning a page, items making room during a reorder, a sidebar resizing, smooth-scrolling to an anchor. Not for coming in: its slow start reads as lag.\n- --ease-overshoot: cubic-bezier(.34, 1.56, .64, 1). Runs about 10% past its place and comes back. Small, playful confirmations: a checkbox tick, a like, a badge count popping in, a switch knob settling. Never on a dialog, a drawer or anything larger than about 64px, and not on actions people repeat all day.\n- --ease-spring: linear(0, .32, .78, 1.04, 1.09, 1.06, 1.02, 1, .99, .99, 1). Things let go after a drag or a swipe, so they settle like an object: a bottom sheet snapping open or back, a card returning after a half swipe, pull-to-refresh springing back, a reordered item dropping into place. Prefer the animation library's own spring fed with the release velocity; use this token only where there is none, and fall back to --ease-out-strong where linear() is not supported.\n- linear: only for things that run rather than move: spinners, progress bars, marquees.\n- The CSS default `ease` is not a choice. Replace it wherever a curve was left unset.\n\n2. Durations\n- Small UI (toasts, tooltips, menus, checks): 150-250ms in, 120-200ms out. Exits are shorter than entrances.\n- Medium (dialogs, popovers with content, drawers): 250-350ms.\n- Large or full-screen (sheets, page transitions): 350-500ms. Longer feels slow.\n- Springs and overshoots: about 1.5x the plain duration, since the settle takes time.\n- Keep the durations as tokens beside the curves (--duration-sm, -md, -lg).\n\n3. Apply them by role\n- Entrances: ease-out, coming from where the thing belongs (a toast from the top edge, a menu from its trigger), over a short distance (8-24px), growing from 96% and fading in a little sooner than it moves. A light blur (about 8px) that clears as it lands is a nice touch on toasts.\n- Exits: ease-in, the same path reversed, and shorter.\n- Moves on screen: ease-in-out.\n- Parts inside something that has just appeared (its icon, its text, a count) may follow 100-200ms later on the strong ease-out, so it lands in steps rather than all at once.\n- Gestures: while the pointer or finger moves, follow it 1:1 with no easing. On release, finish on the spring, from the release velocity if the library allows.\n- Hover and press: 100-150ms ease-out. Never animate layout on hover.\n- Animate transform and opacity (filter sparingly), not top, left, width or height, which lay out and repaint every frame.\n\n4. Keep it consistent and accessible\n- One curve per role across the product. Don't tune each component by hand.\n- Respect prefers-reduced-motion: keep the opacity changes, drop movement and scale, and turn springs and overshoots into a plain 150ms fade.\n- Never make a user wait on an animation: nothing blocks input, and a new action interrupts the old animation from where it is.\n\n5. Deliver\n- First list every animation you found, its current curve and duration, and the role and curve you will give it.\n- Then add the tokens, switch each animation over, and list every file you touched.\n- Don't change what animates, how far it goes or what triggers it. If an animation has no clear role, ask me first.","promptUrl":"https://x.com/Kubai087/status/2118143923571048817"}, {"repo": "Vincentwei1021/video-shotcraft", "why": "Remotion AI video skill — 124 shot recipes, motion previews, beat sync, CapCut/JianYing export for product promos.", "stars": 17132, "license": "Apache-2.0", "date": "2026-11-05", "cat": "opus", "comment": "Remotion AI video skill — 124 shot recipes, motion previews, beat sync, CapCut/JianYing export fo const grid = document.getElementById("grid");
const modal = document.getElementById("modal");
const listEl = document.getElementById("list");
const emptyEl = document.getElementById("empty");
const searchEl = document.getElementById("search");
const sortEl = document.getElementById("sort");
const titleEl = document.getElementById("panel-title");
const countEl = document.getElementById("panel-count");
const closeBtn = document.getElementById("close");
const backdrop = document.getElementById("backdrop");
const globalSearchEl = document.getElementById("q");
const clearQBtn = document.getElementById("clear-q");
const homeFind = document.getElementById("home-find");
const resultsList = document.getElementById("results-list");
const resultsMeta = document.getElementById("results-meta");
const resultsEmpty = document.getElementById("results-empty");
const SORT_KEY = "repo-scout-digest-sort";
const STYLE_KEY = "repo-scout-digest-style";
const QUERY_KEY = "repo-scout-digest-q";

let active = null;

function currentStyle() {
  return document.documentElement.getAttribute("data-style") === "award" ? "award" : "classic";
}

function syncStyleControls(style) {
  document.querySelectorAll(".digest-style").forEach((group) => {
    group.querySelectorAll("[data-style-value]").forEach((btn) => {
      const on = btn.getAttribute("data-style-value") === style;
      btn.setAttribute("aria-checked", on ? "true" : "false");
      btn.tabIndex = on ? 0 : -1;
    });
  });
}

function applyStyle(style, persist) {
  const next = style === "award" ? "award" : "classic";
  document.documentElement.setAttribute("data-style", next);
  syncStyleControls(next);
  if (persist) {
    try { localStorage.setItem(STYLE_KEY, next); } catch (_) {}
    if (next === "award") {
      document.querySelectorAll(".cat").forEach((el) => {
        el.style.animation = "none";
        void el.offsetWidth;
        el.style.animation = "";
      });
    }
  }
}

applyStyle(currentStyle(), false);

(function restoreSort() {
  try {
    const saved = localStorage.getItem(SORT_KEY);
    if (saved && [...sortEl.options].some(o => o.value === saved)) {
      sortEl.value = saved;
    }
  } catch (_) {}
})();

CATS.forEach((c) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "cat";
  btn.dataset.id = c.id;
  btn.style.setProperty("--hue", c.hue);
  btn.setAttribute("role", "option");
  btn.innerHTML = `<span class="tile">${ICONS[c.id]}</span>
    <span class="cat-label">${c.label}</span>
    <span class="cat-sub">${c.sub}</span>
    <span class="leader" aria-hidden="true"></span>
    <span class="cat-meta"><span class="cat-count">${COUNTS[c.id]}</span><span class="cat-unit"> ${c.id === "web" ? "sites" : c.id === "tips" ? "tips" : "repos"}</span></span>`;
  btn.addEventListener("click", () => openCat(c.id));
  grid.appendChild(btn);
});

function openCat(id) {
  active = id;
  document.querySelectorAll(".cat").forEach(b => b.classList.toggle("is-active", b.dataset.id === id));
  const cat = CATS.find(c => c.id === id);
  titleEl.textContent = cat.label;
  titleEl.dataset.sub = cat.sub || "";
  searchEl.value = "";
  renderList();
  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
  document.body.classList.add("modal-open");
  closeBtn.focus({ preventScroll: true });
}

function closeModal() {
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
  document.body.classList.remove("modal-open");
  document.querySelectorAll(".cat").forEach(b => b.classList.remove("is-active"));
  const back = document.querySelector('.cat[data-id="' + active + '"]');
  active = null;
  if (back) back.focus({ preventScroll: true });
}

function sortItems(items, mode) {
  const copy = items.slice();
  switch (mode) {
    case "stars-desc":
      return copy.sort((a,b) => (b.stars||0) - (a.stars||0) || (b.date||"").localeCompare(a.date||""));
    case "stars-asc":
      return copy.sort((a,b) => (a.stars||0) - (b.stars||0) || (a.date||"").localeCompare(b.date||""));
    case "date-asc":
      return copy.sort((a,b) => (a.date||"").localeCompare(b.date||"") || (b.stars||0) - (a.stars||0));
    case "name-asc":
      return copy.sort((a,b) => a.repo.localeCompare(b.repo));
    case "name-desc":
      return copy.sort((a,b) => b.repo.localeCompare(a.repo));
    case "date-desc":
    default:
      return copy.sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.stars||0) - (a.stars||0));
  }
}

function renderList() {
  if (!active) return;
  const q = (searchEl.value || "").trim().toLowerCase();
  let items = REPOS.filter(r => r.cat === active)
    .filter(r => {
      if (!q) return true;
      const hay = [r.repo, r.url, r.why, r.comment, r.license, r.prompt].join(" ").toLowerCase();
      return hay.includes(q);
    });
  items = sortItems(items, sortEl.value);

  searchEl.placeholder = active === "web" ? "Filter sites or comments…" : active === "tips" ? "Filter tips or comments…" : "Filter repos or comments…";
  countEl.textContent = items.length + " shown · " + COUNTS[active] + " in category";
  listEl.innerHTML = "";
  emptyEl.hidden = items.length > 0;

  items.forEach((r, i) => {
    const li = document.createElement("li");
    const href = r.url ? r.url : "https://github.com/" + r.repo;
    const hasPrompt = typeof r.prompt === "string" && r.prompt.length > 0;
    const card = document.createElement(hasPrompt ? "article" : "a");
    card.className = "card";
    card.style.animationDelay = (Math.min(i, 24) * 0.03) + "s";
    if (!hasPrompt) {
      card.href = href;
      card.target = "_blank";
      card.rel = "noopener noreferrer";
    }
    const quietStars = (r.cat === "web" || r.cat === "tips") && !(Number(r.stars) > 0);
    const stars = quietStars ? "" : ((r.stars != null && r.stars !== "") ? r.stars + "★" : "—★");
    const lic = r.license ? r.license : "no license noted";
    const comment = r.comment || r.why || "";
    const meta = [];
    if (stars) meta.push(`<span>${escapeHtml(String(stars))}</span>`);
    meta.push(`<span>${escapeHtml(r.date||"")}</span>`);
    meta.push(`<span>${escapeHtml(lic)}</span>`);
    const name = hasPrompt
      ? `<a class="name" href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(r.repo)}</a>`
      : `<div class="name">${escapeHtml(r.repo)}</div>`;
    const peek = hasPrompt ? `<p class="prompt-peek">${escapeHtml(promptPeek(r.prompt))}</p>` : "";
    card.innerHTML = `${name}
      <div class="comment">
        <p class="comment-body">${escapeHtml(comment)}</p>
      </div>
      ${peek}
      <div class="meta">${meta.join("")}</div>`;
    if (hasPrompt) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "copy-prompt";
      btn.textContent = "Copy prompt";
      btn.setAttribute("aria-live", "polite");
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        copyPromptText(r.prompt, btn);
      });
      const metaEl = card.querySelector(".meta");
      card.insertBefore(btn, metaEl);
    }
    li.appendChild(card);
    listEl.appendChild(li);
  });
}

function promptPeek(text) {
  const lines = String(text).split(/\r?\n/).map((s) => s.trim()).filter(Boolean).slice(0, 3);
  let out = lines.join(" ");
  if (out.length > 220) out = out.slice(0, 220).replace(/\s+\S*$/, "") + "…";
  return out;
}

function copyPromptText(text, btn) {
  const mark = () => {
    btn.textContent = "Copied";
    btn.classList.add("is-copied");
    window.clearTimeout(btn._copyTimer);
    btn._copyTimer = window.setTimeout(() => {
      btn.textContent = "Copy prompt";
      btn.classList.remove("is-copied");
    }, 1500);
  };
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "0";
    ta.style.left = "0";
    ta.style.width = "1px";
    ta.style.height = "1px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, text.length); } catch (_) {}
    let copied = false;
    try { copied = document.execCommand("copy"); } catch (_) {}
    ta.remove();
    if (copied) mark();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(mark, fallback);
  } else {
    fallback();
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function catOf(id) {
  return CATS.find(c => c.id === id);
}

function matchesCatalog(r, q) {
  const cat = catOf(r.cat);
  const hay = [r.repo, r.url, r.why, r.comment, r.license, r.prompt, r.date, r.cat, cat && cat.label, cat && cat.sub].join(" ").toLowerCase();
  return hay.includes(q);
}

function renderHome() {
  const q = (globalSearchEl.value || "").trim().toLowerCase();
  const searching = q.length > 0;
  document.body.classList.toggle("is-searching", searching);
  clearQBtn.hidden = !searching;
  if (!searching) {
    resultsList.replaceChildren();
    resultsMeta.textContent = "";
    resultsEmpty.hidden = true;
    return;
  }
  const items = sortItems(REPOS.filter(r => matchesCatalog(r, q)), sortEl.value);
  resultsMeta.textContent = items.length === 1 ? "1 match" : items.length + " matches";
  resultsEmpty.hidden = items.length > 0;
  const frag = document.createDocumentFragment();
  items.forEach((r) => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    const cat = catOf(r.cat);
    a.className = "hit";
    a.href = r.url ? r.url : "https://github.com/" + r.repo;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    if (cat) a.style.setProperty("--hue", cat.hue);
    const quietStars = (r.cat === "web" || r.cat === "tips") && !(Number(r.stars) > 0);
    const stars = quietStars ? "" : ((r.stars != null && r.stars !== "") ? String(r.stars) + "★" : "—★");
    const lic = r.license ? r.license : "no license noted";
    const comment = r.comment || r.why || "";
    const meta = [];
    if (stars) meta.push("<span>" + escapeHtml(stars) + "</span>");
    meta.push("<span>" + escapeHtml(r.date || "") + "</span>");
    meta.push("<span>" + escapeHtml(lic) + "</span>");
    a.innerHTML = '<span class="hit-cat">' + escapeHtml(cat ? cat.label : r.cat) + "</span>"
      + '<span class="hit-meta">' + meta.join("") + "</span>"
      + '<span class="hit-name">' + escapeHtml(r.repo) + "</span>"
      + '<span class="hit-why">' + escapeHtml(comment) + "</span>";
    li.appendChild(a);
    frag.appendChild(li);
  });
  resultsList.replaceChildren(frag);
}

function persistQuery() {
  try {
    const v = globalSearchEl.value;
    if (v.trim()) localStorage.setItem(QUERY_KEY, v);
    else localStorage.removeItem(QUERY_KEY);
  } catch (_) {}
}

(function restoreQuery() {
  try {
    const saved = localStorage.getItem(QUERY_KEY);
    if (saved) globalSearchEl.value = saved;
  } catch (_) {}
})();
renderHome();

closeBtn.addEventListener("click", closeModal);
backdrop.addEventListener("click", closeModal);
searchEl.addEventListener("input", renderList);
sortEl.addEventListener("change", () => {
  try { localStorage.setItem(SORT_KEY, sortEl.value); } catch (_) {}
  renderList();
  renderHome();
});
homeFind.addEventListener("submit", (e) => e.preventDefault());
globalSearchEl.addEventListener("input", () => {
  persistQuery();
  renderHome();
});
clearQBtn.addEventListener("click", () => {
  globalSearchEl.value = "";
  persistQuery();
  renderHome();
  globalSearchEl.focus();
});
document.addEventListener("click", (e) => {
  const btn = e.target.closest && e.target.closest("[data-style-value]");
  if (!btn) return;
  applyStyle(btn.getAttribute("data-style-value"), true);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modal.classList.contains("open")) {
    closeModal();
    return;
  }
  if (e.key === "Escape" && document.activeElement === globalSearchEl && globalSearchEl.value) {
    e.preventDefault();
    globalSearchEl.value = "";
    persistQuery();
    renderHome();
    return;
  }
  const group = e.target.closest && e.target.closest(".digest-style");
  if (!group) return;
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft" && e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
  e.preventDefault();
  const next = currentStyle() === "award" ? "classic" : "award";
  applyStyle(next, true);
  const focusBtn = group.querySelector('[data-style-value="' + next + '"]');
  if (focusBtn) focusBtn.focus();
});
</script>
