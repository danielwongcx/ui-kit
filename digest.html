<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Repo Scout — Digest Catalog</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem("repo-scout-digest-style");
    document.documentElement.setAttribute("data-style", saved === "award" ? "award" : "classic");
  } catch (e) {
    document.documentElement.setAttribute("data-style", "classic");
  }
})();
</script>
<style>
  :root {
    --bg: #efe9df;
    --bg2: #e8e1d5;
    --tile: #f7f3ec;
    --ink: #2a2a2a;
    --muted: #6b6560;
    --shadow-dark: rgba(160, 140, 110, 0.45);
    --shadow-light: rgba(255, 255, 255, 0.9);
    --radius: 28px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html { background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--ink);
    background: transparent;
    padding: 0;
  }
  /* Fixed wash lives on a pseudo, not background-attachment on body.
     That property is an ancestor of the sticky bar and stops it pinning.
     Page padding is on .wrap so the in-flow header starts at the scrollport top. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 80% 50% at 10% 90%, rgba(90,120,70,0.08), transparent 55%),
      radial-gradient(ellipse 60% 40% at 90% 10%, rgba(255,255,255,0.5), transparent 50%),
      linear-gradient(160deg, #f3eee6 0%, var(--bg) 45%, var(--bg2) 100%);
  }
  body.modal-open { overflow: hidden; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 40px 20px 80px; }
  .wrap > header { text-align: center; margin-bottom: 10px; }
  .wrap > header h1 {
    font-size: 1.55rem; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 8px;
  }
  .wrap > header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 28px 22px; margin: 0 auto 8px; max-width: 640px;
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 22px 16px; }
  }
  .cat {
    appearance: none; border: none; background: transparent; padding: 0;
    cursor: pointer; display: flex; flex-direction: column; align-items: center;
    gap: 12px; font: inherit; color: inherit; -webkit-tap-highlight-color: transparent;
  }
  .tile {
    width: 112px; height: 112px; border-radius: var(--radius);
    background: linear-gradient(145deg, #fffefb, var(--tile));
    box-shadow:
      10px 12px 24px var(--shadow-dark),
      -8px -8px 20px var(--shadow-light),
      inset 0 1px 0 rgba(255,255,255,0.95);
    display: grid; place-items: center;
    transition: transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1), box-shadow 0.28s ease, background 0.28s ease;
    position: relative;
  }
  .cat:hover .tile {
    transform: translateY(-4px) scale(1.03);
    box-shadow:
      12px 16px 28px var(--shadow-dark),
      -10px -10px 22px var(--shadow-light),
      inset 0 1px 0 rgba(255,255,255,0.95);
  }
  .cat:active .tile,
  .cat.is-active .tile {
    transform: translateY(2px) scale(0.97);
    background: linear-gradient(145deg, #ebe4d8, #f4efe6);
    box-shadow:
      inset 6px 6px 14px var(--shadow-dark),
      inset -5px -5px 12px var(--shadow-light),
      0 1px 2px rgba(255,255,255,0.5);
  }
  .cat.is-active .tile::after {
    content: ""; position: absolute; inset: -3px;
    border-radius: calc(var(--radius) + 3px);
    border: 2px solid color-mix(in srgb, var(--hue) 55%, transparent);
    pointer-events: none; animation: ringIn 0.35s ease;
  }
  @keyframes ringIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }
  .icon {
    width: 56px; height: 56px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.12));
    transition: transform 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  .cat:hover .icon { transform: scale(1.08) rotate(-3deg); }
  .cat.is-active .icon { transform: scale(0.95); }
  .cat-label { font-size: 0.92rem; font-weight: 560; text-align: center; line-height: 1.2; }
  .cat-meta { font-size: 0.75rem; color: var(--muted); margin-top: -8px; }

  .modal {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    visibility: hidden; pointer-events: none;
  }
  .modal.open { visibility: visible; pointer-events: auto; }
  .backdrop {
    position: absolute; inset: 0;
    background: rgba(42, 36, 28, 0.42);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    transition: opacity 0.28s ease;
  }
  .modal.open .backdrop { opacity: 1; }
  .sheet {
    position: relative; z-index: 1;
    width: min(640px, 100%);
    max-height: min(86vh, 820px);
    display: flex; flex-direction: column;
    background: linear-gradient(160deg, #fffefb, #f5f0e8);
    border-radius: 24px;
    box-shadow:
      16px 24px 48px rgba(80, 60, 40, 0.35),
      -6px -6px 20px rgba(255,255,255,0.5),
      inset 0 1px 0 rgba(255,255,255,0.9);
    transform: translateY(28px) scale(0.96);
    opacity: 0;
    transition:
      transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
      opacity 0.3s ease;
    overflow: hidden;
  }
  .modal.open .sheet {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  .sheet-head {
    display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap;
    gap: 12px; padding: 20px 20px 12px; flex-shrink: 0;
  }
  .sheet-head h2 { margin: 0; font-size: 1.2rem; font-weight: 650; }
  .sheet-head .sub { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; }
  .close {
    appearance: none; border: none; cursor: pointer;
    width: 40px; height: 40px; border-radius: 14px; flex-shrink: 0;
    background: #efe9df;
    box-shadow:
      4px 5px 10px rgba(160,140,110,0.3),
      -3px -3px 8px rgba(255,255,255,0.85);
    font-size: 1.25rem; line-height: 1; color: var(--ink);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .close:hover { transform: scale(1.05); }
  .close:active {
    transform: scale(0.95);
    box-shadow: inset 3px 3px 8px rgba(160,140,110,0.35), inset -2px -2px 6px rgba(255,255,255,0.8);
  }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px;
    padding: 0 20px 14px; flex-shrink: 0;
  }
  .search {
    flex: 1 1 160px; min-width: 140px;
    padding: 11px 14px; border: none; border-radius: 14px;
    background: #efe9df;
    box-shadow:
      inset 4px 4px 10px rgba(160,140,110,0.35),
      inset -3px -3px 8px rgba(255,255,255,0.8);
    font: inherit; font-size: 0.92rem; color: var(--ink); outline: none;
  }
  .search::placeholder { color: #9a9288; }
  .sort {
    flex: 0 0 auto;
    padding: 11px 14px; border: none; border-radius: 14px;
    background: #efe9df;
    box-shadow:
      4px 5px 10px rgba(160,140,110,0.28),
      -3px -3px 8px rgba(255,255,255,0.85);
    font: inherit; font-size: 0.88rem; color: var(--ink);
    cursor: pointer; outline: none;
  }
  .sheet-body {
    overflow-y: auto; padding: 0 16px 20px;
    -webkit-overflow-scrolling: touch;
  }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .card {
    display: block; padding: 14px 16px; border-radius: 16px;
    background: #faf7f2;
    box-shadow:
      4px 5px 12px rgba(160,140,110,0.22),
      -3px -3px 8px rgba(255,255,255,0.85);
    text-decoration: none; color: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    animation: cardIn 0.4s ease both;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow:
      6px 8px 16px rgba(160,140,110,0.28),
      -4px -4px 10px rgba(255,255,255,0.9);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card .name {
    font-weight: 600; font-size: 0.98rem; color: #1a5fb4; word-break: break-all;
  }
  .card .comment {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    background: #efe9df;
    box-shadow:
      inset 2px 2px 6px rgba(160,140,110,0.22),
      inset -2px -2px 5px rgba(255,255,255,0.7);
  }
  .card .comment-label {
    display: block;
    font-size: 0.72rem;
    font-weight: 650;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .card .comment-body {
    margin: 0;
    font-size: 0.92rem;
    line-height: 1.45;
    color: #3a3632;
  }
  .card .meta {
    display: flex; flex-wrap: wrap; gap: 8px 14px;
    margin-top: 10px; font-size: 0.78rem; color: var(--muted);
  }
  .empty {
    text-align: center; color: var(--muted); padding: 36px 12px; font-size: 0.95rem;
  }

  html:not([data-style="award"]) .kicker,
  html:not([data-style="award"]) .folio,
  html:not([data-style="award"]) .cat-sub,
  html:not([data-style="award"]) .leader,
  html:not([data-style="award"]) .award-br { display: none; }
  .style-bar {
    display: flex;
    justify-content: center;
    position: sticky;
    top: var(--site-header-h, 56px);
    z-index: 40;
    padding: 2px 0 26px;
    background: color-mix(in srgb, #efe9df 92%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .digest-style {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: stretch;
    padding: 3px;
    border-radius: 999px;
    background: #efe9df;
    box-shadow:
      inset 4px 4px 10px rgba(160,140,110,0.35),
      inset -3px -3px 8px rgba(255,255,255,0.85);
  }
  .digest-style::before {
    content: "";
    position: absolute;
    z-index: 0;
    top: 3px;
    bottom: 3px;
    left: 3px;
    width: calc(50% - 3px);
    border-radius: 999px;
    background: linear-gradient(145deg, #fffefb, #f7f3ec);
    box-shadow:
      3px 4px 8px rgba(160,140,110,0.32),
      -2px -2px 6px rgba(255,255,255,0.9);
    transition: left 0.4s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s ease, box-shadow 0.3s ease;
  }
  .style-opt {
    position: relative;
    z-index: 1;
    appearance: none;
    border: 0;
    background: transparent;
    color: #6b6560;
    font: inherit;
    font-size: 12px;
    font-weight: 650;
    letter-spacing: 0.02em;
    min-height: 40px;
    min-width: 88px;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .style-opt[aria-checked="true"] { color: #2a2a2a; }
  .style-opt:focus-visible {
    outline: 2px solid #1e6851;
    outline-offset: 2px;
  }
  .sheet-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    margin-left: auto;
  }
  .cat:focus-visible {
    outline: 2px solid #1e6851;
    outline-offset: 4px;
    border-radius: 18px;
  }


  /* Award — editorial index. Classic rules above stay the default. */
  html[data-style="award"] {
    --bg: #e7e1d4;
    --ink: #1c1914;
    --muted: #5c564c;
    --paper: #f7f3ea;
    --line: rgba(28, 25, 20, 0.14);
    --signal: #8c3014;
    --serif: "Iowan Old Style", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, "Times New Roman", "Liberation Serif", "DejaVu Serif", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Liberation Sans", sans-serif;
    --site-ink: #1c1914;
    --site-muted: #5c564c;
    --site-line: rgba(28, 25, 20, 0.12);
    --site-bar-bg: color-mix(in srgb, #e7e1d4 88%, transparent);
    --site-pill: #f7f3ea;
    --site-accent: #8c3014;
    background: var(--bg);
    color-scheme: light;
  }
  html[data-style="award"] body {
    font-family: var(--sans);
    color: var(--ink);
    background: transparent;
  }
  html[data-style="award"] body::before {
    background:
      radial-gradient(ellipse 50% 42% at 100% 0%, rgba(140, 48, 20, 0.09), transparent 60%),
      radial-gradient(ellipse 42% 36% at 0% 100%, rgba(31, 92, 72, 0.07), transparent 62%),
      linear-gradient(180deg, #ebe6da 0%, #e7e1d4 38%, #ddd4c4 100%);
  }
  html[data-style="award"] ::selection {
    background: #1c1914;
    color: #f7f3ea;
  }
  html[data-style="award"] .wrap {
    display: flex;
    flex-direction: column;
    max-width: 1120px;
    padding: 0 clamp(18px, 4vw, 56px) 108px;
  }
  html[data-style="award"] .style-bar { order: 0; }
  html[data-style="award"] .mast { order: 1; }
  html[data-style="award"] .grid { order: 2; }

  html[data-style="award"] .style-bar {
    justify-content: flex-end;
    margin: 0 calc(-1 * clamp(18px, 4vw, 56px));
    padding: 12px clamp(18px, 4vw, 56px);
    background: rgba(235, 230, 218, 0.94);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  html[data-style="award"] .digest-style {
    background: transparent;
    border: 1px solid rgba(28, 25, 20, 0.22);
    box-shadow: none;
  }
  html[data-style="award"] .digest-style::before {
    left: 50%;
    background: #1c1914;
    box-shadow: none;
  }
  html[data-style="award"] .style-opt {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #5c564c;
  }
  html[data-style="award"] .style-opt[aria-checked="true"] { color: #f7f3ea; }
  html[data-style="award"] .style-opt:focus-visible {
    outline-color: var(--signal);
  }

  html[data-style="award"] .mast {
    position: relative;
    text-align: left;
    margin: 0 0 28px;
    padding: 36px 0 18px;
    min-height: clamp(240px, 34vw, 380px);
  }
  html[data-style="award"] .kicker {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin: 0 0 28px;
    font-family: var(--sans);
    font-size: 0.72rem;
    font-weight: 650;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    position: relative;
    z-index: 1;
  }
  html[data-style="award"] .mast h1 {
    position: relative;
    z-index: 1;
    margin: 0;
    max-width: 8ch;
    font-family: var(--serif);
    font-weight: 500;
    font-style: italic;
    font-size: clamp(4.4rem, 11vw, 8.6rem);
    letter-spacing: -0.045em;
    line-height: 0.84;
    color: var(--ink);
  }
  html[data-style="award"] .h-scout,
  html[data-style="award"] .h-sep { display: none; }
  html[data-style="award"] .lede {
    position: relative;
    z-index: 1;
    margin: 22px 0 0;
    max-width: 28rem;
    font-size: 1.08rem;
    line-height: 1.5;
    color: var(--muted);
  }
  html[data-style="award"] .lede-hint { display: none; }
  html[data-style="award"] .folio {
    display: block;
    position: absolute;
    right: -0.02em;
    top: 4.6rem;
    z-index: 0;
    margin: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(8rem, 23vw, 16.5rem);
    line-height: 0.78;
    letter-spacing: -0.07em;
    color: transparent;
    -webkit-text-stroke: 1.25px rgba(28, 25, 20, 0.2);
    pointer-events: none;
    user-select: none;
  }

  html[data-style="award"] .grid {
    counter-reset: cat;
    max-width: none;
    width: 100%;
    grid-template-columns: 1fr;
    gap: 0;
    margin: 0;
  }
  html[data-style="award"] .cat {
    counter-increment: cat;
    position: relative;
    isolation: isolate;
    display: grid;
    grid-template-columns: 4.6rem minmax(0, max-content) minmax(20px, 1fr) auto;
    grid-template-areas:
      "num label leader count"
      "num sub   .      count";
    column-gap: 18px;
    row-gap: 4px;
    align-items: center;
    width: 100%;
    min-height: 118px;
    padding: 30px 8px 26px 20px;
    border-radius: 0;
    background: transparent;
    text-align: left;
    box-shadow: inset 3px 0 0 var(--hue);
    border-bottom: 1px solid var(--line);
    transition: box-shadow 0.35s ease;
  }
  html[data-style="award"] .cat:first-child { border-top: 1px solid var(--line); }
  html[data-style="award"] .cat::before {
    content: counter(cat, decimal-leading-zero);
    grid-area: num;
    font-family: var(--serif);
    font-size: 1.02rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    color: var(--muted);
  }
  html[data-style="award"] .cat::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: color-mix(in srgb, var(--hue) 18%, transparent);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  }
  html[data-style="award"] .cat:hover,
  html[data-style="award"] .cat:focus-visible,
  html[data-style="award"] .cat.is-active {
    box-shadow: inset 7px 0 0 var(--hue);
  }
  html[data-style="award"] .cat:hover::after,
  html[data-style="award"] .cat:focus-visible::after,
  html[data-style="award"] .cat.is-active::after {
    transform: scaleX(1);
  }
  html[data-style="award"] .cat:active { transform: scale(0.995); }
  html[data-style="award"] .cat:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 3px;
  }
  html[data-style="award"] .tile { display: none; }
  html[data-style="award"] .cat-label {
    grid-area: label;
    margin: 0;
    text-align: left;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(2.35rem, 4.4vw, 3.9rem);
    letter-spacing: -0.035em;
    line-height: 0.95;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  html[data-style="award"] .cat:hover .cat-label,
  html[data-style="award"] .cat:focus-visible .cat-label {
    transform: translateX(10px);
  }
  html[data-style="award"] .cat-sub {
    grid-area: sub;
    display: block;
    margin: 0;
    text-align: left;
    font-size: 0.84rem;
    line-height: 1.3;
    color: var(--muted);
  }
  html[data-style="award"] .leader {
    grid-area: leader;
    height: 1px;
    align-self: end;
    margin-bottom: 0.42em;
    background-image: linear-gradient(90deg, rgba(28, 25, 20, 0.34) 33%, transparent 0);
    background-size: 7px 1px;
    background-repeat: repeat-x;
    transition: background-image 0.35s ease;
  }
  html[data-style="award"] .cat:hover .leader,
  html[data-style="award"] .cat:focus-visible .leader {
    background-image: linear-gradient(90deg, var(--hue) 45%, transparent 0);
  }
  html[data-style="award"] .cat-meta {
    grid-area: count;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
    margin: 0;
    text-align: right;
    color: var(--ink);
    white-space: nowrap;
  }
  html[data-style="award"] .cat-count {
    font-family: var(--serif);
    font-size: clamp(1.7rem, 2.8vw, 2.55rem);
    font-weight: 500;
    letter-spacing: -0.04em;
    line-height: 0.9;
    font-variant-numeric: tabular-nums;
  }
  html[data-style="award"] .cat-unit {
    font-size: 0.66rem;
    font-weight: 650;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  html[data-style="award"] .cat {
    animation: award-rise 0.72s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  html[data-style="award"] .mast {
    animation: award-rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  html[data-style="award"] .cat:nth-child(1) { animation-delay: 0.04s; }
  html[data-style="award"] .cat:nth-child(2) { animation-delay: 0.09s; }
  html[data-style="award"] .cat:nth-child(3) { animation-delay: 0.14s; }
  html[data-style="award"] .cat:nth-child(4) { animation-delay: 0.19s; }
  html[data-style="award"] .cat:nth-child(5) { animation-delay: 0.24s; }

const grid = document.getElementById("grid");
const modal = document.getElementById("modal");
const listEl = document.getElementById("list");
const emptyEl = document.getElementById("empty");
const searchEl = document.getElementById("search");
const sortEl = document.getElementById("sort");
const titleEl = document.getElementById("panel-title");
const countEl = document.getElementById("panel-count");
const closeBtn = document.getElementById("close");
const backdrop = document.getElementById("backdrop");
const SORT_KEY = "repo-scout-digest-sort";
const STYLE_KEY = "repo-scout-digest-style";

let active = null;

function currentStyle() {
  return document.documentElement.getAttribute("data-style") === "award" ? "award" : "classic";
}

function syncStyleControls(style) {
  document.querySelectorAll(".digest-style").forEach((group) => {
    group.querySelectorAll("[data-style-value]").forEach((btn) => {
      const on = btn.getAttribute("data-style-value") === style;
      btn.setAttribute("aria-checked", on ? "true" : "false");
      btn.tabIndex = on ? 0 : -1;
    });
  });
}

function applyStyle(style, persist) {
  const next = style === "award" ? "award" : "classic";
  document.documentElement.setAttribute("data-style", next);
  syncStyleControls(next);
  if (persist) {
    try { localStorage.setItem(STYLE_KEY, next); } catch (_) {}
    if (next === "award") {
      document.querySelectorAll(".cat").forEach((el) => {
        el.style.animation = "none";
        void el.offsetWidth;
        el.style.animation = "";
      });
    }
  }
}

applyStyle(currentStyle(), false);

(function restoreSort() {
  try {
    const saved = localStorage.getItem(SORT_KEY);
    if (saved && [...sortEl.options].some(o => o.value === saved)) {
      sortEl.value = saved;
    }
  } catch (_) {}
})();

CATS.forEach((c) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "cat";
  btn.dataset.id = c.id;
  btn.style.setProperty("--hue", c.hue);
  btn.setAttribute("role", "option");
  btn.innerHTML = `<span class="tile">${ICONS[c.id]}</span>
    <span class="cat-label">${c.label}</span>
    <span class="cat-sub">${c.sub}</span>
    <span class="leader" aria-hidden="true"></span>
    <span class="cat-meta"><span class="cat-count">${COUNTS[c.id]}</span><span class="cat-unit"> ${c.id === "web" ? "sites" : c.id === "tips" ? "tips" : "repos"}</span></span>`;
  btn.addEventListener("click", () => openCat(c.id));
  grid.appendChild(btn);
});

function openCat(id) {
  active = id;
  document.querySelectorAll(".cat").forEach(b => b.classList.toggle("is-active", b.dataset.id === id));
  const cat = CATS.find(c => c.id === id);
  titleEl.textContent = cat.label;
  titleEl.dataset.sub = cat.sub || "";
  searchEl.value = "";
  renderList();
  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
  document.body.classList.add("modal-open");
  closeBtn.focus({ preventScroll: true });
}

function closeModal() {
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
  document.body.classList.remove("modal-open");
  document.querySelectorAll(".cat").forEach(b => b.classList.remove("is-active"));
  const back = document.querySelector('.cat[data-id="' + active + '"]');
  active = null;
  if (back) back.focus({ preventScroll: true });
}

function sortItems(items, mode) {
  const copy = items.slice();
  switch (mode) {
    case "stars-desc":
      return copy.sort((a,b) => (b.stars||0) - (a.stars||0) || (b.date||"").localeCompare(a.date||""));
    case "stars-asc":
      return copy.sort((a,b) => (a.stars||0) - (b.stars||0) || (a.date||"").localeCompare(b.date||""));
    case "date-asc":
      return copy.sort((a,b) => (a.date||"").localeCompare(b.date||"") || (b.stars||0) - (a.stars||0));
    case "name-asc":
      return copy.sort((a,b) => a.repo.localeCompare(b.repo));
    case "name-desc":
      return copy.sort((a,b) => b.repo.localeCompare(a.repo));
    case "date-desc":
    default:
      return copy.sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.stars||0) - (a.stars||0));
  }
}

function renderList() {
  if (!active) return;
  const q = (searchEl.value || "").trim().toLowerCase();
  let items = REPOS.filter(r => r.cat === active)
    .filter(r => {
      if (!q) return true;
      const hay = [r.repo, r.url, r.why, r.comment, r.license].join(" ").toLowerCase();
      return hay.includes(q);
    });
  items = sortItems(items, sortEl.value);

  searchEl.placeholder = active === "web" ? "Filter sites or comments…" : active === "tips" ? "Filter tips or comments…" : "Filter repos or comments…";
  countEl.textContent = items.length + " shown · " + COUNTS[active] + " in category";
  listEl.innerHTML = "";
  emptyEl.hidden = items.length > 0;

  items.forEach((r, i) => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.className = "card";
    a.href = r.url ? r.url : "https://github.com/" + r.repo;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.style.animationDelay = (Math.min(i, 24) * 0.03) + "s";
    const quietStars = (r.cat === "web" || r.cat === "tips") && !(Number(r.stars) > 0);
    const stars = quietStars ? "" : ((r.stars != null && r.stars !== "") ? r.stars + "★" : "—★");
    const lic = r.license ? r.license : "no license noted";
    const comment = r.comment || r.why || "";
    const meta = [];
    if (stars) meta.push(`<span>${escapeHtml(String(stars))}</span>`);
    meta.push(`<span>${escapeHtml(r.date||"")}</span>`);
    meta.push(`<span>${escapeHtml(lic)}</span>`);
    a.innerHTML = `<div class="name">${escapeHtml(r.repo)}</div>
      <div class="comment">
        <span class="comment-label">My comment</span>
        <p class="comment-body">${escapeHtml(comment)}</p>
      </div>
      <div class="meta">${meta.join("")}</div>`;
    li.appendChild(a);
    listEl.appendChild(li);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

closeBtn.addEventListener("click", closeModal);
backdrop.addEventListener("click", closeModal);
searchEl.addEventListener("input", renderList);
sortEl.addEventListener("change", () => {
  try { localStorage.setItem(SORT_KEY, sortEl.value); } catch (_) {}
  renderList();
});
document.addEventListener("click", (e) => {
  const btn = e.target.closest && e.target.closest("[data-style-value]");
  if (!btn) return;
  applyStyle(btn.getAttribute("data-style-value"), true);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modal.classList.contains("open")) {
    closeModal();
    return;
  }
  const group = e.target.closest && e.target.closest(".digest-style");
  if (!group) return;
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft" && e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
  e.preventDefault();
  const next = currentStyle() === "award" ? "classic" : "award";
  applyStyle(next, true);
  const focusBtn = group.querySelector('[data-style-value="' + next + '"]');
  if (focusBtn) focusBtn.focus();
});
</script>
