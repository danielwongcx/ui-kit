effects lose their meaning when everything shines, so one card per screen.\n2. Finish: one of the six in section 3 (Prism recommended), several to choose from (for tiers or rarity), or my brand colors (then derive the base, foil, glare, rim and edge from them and show me the values).\n3. Feel: Quiet, Standard (recommended) or Lively (section 9), or my own tilt angle, springs and sway.\n4. Interactions: tilt toward the pointer (on), the idle sway (on), turning over on click (needs a back: say what goes on it, such as a QR code or terms), tilting with the phone's motion on mobile (off; needs permission on iOS).\n5. If it turns over: the thickness (Thin, Standard recommended, Thick) and the flip spring (section 9).\n6. Depth: which parts of the card's artwork get their own layer, and how deep (None, Subtle, Standard recommended; section 9).\n7. Background: leave the page behind the card as it is (recommended for most products), or add the slow fluid behind it (section 7).\nThen sum up my choices with their values in one table, propose how you will build it on my platform (section 8 is a starting point), with the cost and any fallback, and wait for my go-ahead.\n\n0. Start from what exists\n- Find the card: its component, size, corner radius, artwork and content, where it sits, and what is around it. Check whether a back already exists (terms, a code, details).\n- Find how the screen draws (DOM, a native view tree, a GPU renderer), the platform version range, whether there is a dark mode, and how pointer and touch input reach the card.\n- Tell me in a few lines what you found before asking.\n\n1. Tilt and light (Standard)\n- With the pointer at (fx, fy) in 0..1 across the card, nx = fx * 2 - 1 and ny = fy * 2 - 1, the target is rotateY = nx * 12deg and rotateX = -ny * 12deg. Perspective 1600px on the card's parent.\n- The tilt follows its target on a spring, so it overshoots a little when the pointer leaves: acceleration = 140 * (target - angle) - 15 * velocity, per second.\n- The light sits where the pointer is (lx = fx * 100%, ly = fy * 100%) and follows on a spring without overshoot (stiffness 160, damping 2 * sqrt(160) ≈ 25.3). With no pointer on the card, it rests up and to the left (34%, 22%), like a lamp in the room.\n- Hover strength `on` goes from 0 to 1 while the pointer is on the card, easing at 1 - exp(-7 * dt) per frame; it brightens the foil and the glare.\n- Left alone, the card sways as if held: rotateX = 2.2deg * sin(0.9t + 0.6) + 0.8deg * sin(2.3t), rotateY = 3.2deg * sin(0.7t) + 0.9deg * sin(1.9t + 1.2), t in seconds, and the light moves with it (lx = 34% + rotateY * 3, ly = 22% - rotateX * 3).\n- Touch: dragging on the card tilts it the same way (touch-action: none on the card only). Phone motion, if chosen, maps the device's tilt to the same target, clamped to the same angles.\n- The shadow under the card: a blurred ellipse (black at 60%, blur 24px, 84% of the card's width, 70px tall, 30px below it) that slides away from the side that lifts: x = -rotateY * 1.8px, y = rotateX * 1.2px.\n\n2. The layers of a face, back to front\n- Art: the card's own base color or picture.\n- Foil: the finish (section 3), blended over the art, brightest near the light.\n- Print: everything printed on the card (text, logo, artwork window), above the foil so it stays readable.\n- Glare: a radial gradient centered on the light, white at 60% in the middle, 14% at 28%, then black at 30% at 95% (farthest corner), blended with overlay; opacity 0.35 + on * 0.65.\n- Rim: a 1.5px ring around the edge (mask with content-box exclude): a faint base color all round, plus a radial gradient at the light in the rim's light color, fading out by 42%; opacity 0.6 + on * 0.4. It should come and go as the card moves, never read as a solid outline.\n- A hologram seal, if the card has a place for one: a 44px disc, conic-gradient(from \u003cangle\u003e, rgb(255 154 200), rgb(255 224 138), rgb(164 255 207), rgb(143 220 255), rgb(183 155 255), repeated twice), with fine rings over it (white at 35%, 1px every 3.5px) and a 1px white rim at 60%. The angle = atan2(ly - 50%, lx - 50%) * 1.5 + rotateY * 6.\n- Corners: 32px on a 440 x 616 card (scale with the card), on a continuous curve where the platform has one.\n\n3. Finishes (recommended values; pick, mix or derive from my brand)\nEach lists: base, foil, glare and rim if they differ from section 2, ink, edge color (for the thickness), and the glow behind the card (section 7).\n- Prism (recommended): deep blue glass lit from inside.\n  - Base: radial-gradient(60% 40% at 50% 0%, rgb(90 150 255 / 0.55), transparent), linear-gradient(170deg, rgb(13 35 168), rgb(8 18 102) 55%, rgb(22 15 92)). Ink rgb(244 244 246).\n  - The artwork window holds the light: radial-gradient(46% 50% at the light, rgb(255 175 235) at 0.55, 0.4 at 18%, 0.22 at 38%, 0.09 at 60%, 0.02 at 82%, transparent), radial-gradient(54% 56% at (100% - lx, 74%), rgb(125 225 255) at 0.45, 0.32 at 18%, 0.17 at 38%, 0.07 at 60%, 0.015 at 82%, transparent), radial-gradient(70% 55% at 30% 100%, rgb(150 255 210 / 0.3), transparent 75%), over linear-gradient(170deg, rgb(59 98 230), rgb(42 63 191) 55%, rgb(58 47 168)). Many stops, so it reads as glow, not spots. Its frame: rgb(140 170 255 / 0.1) with a 1px line at rgb(170 200 255 / 0.28).\n  - Foil: a 2px lit rim, radial-gradient(at the light, rgb(170 220 255 / 0.9), transparent 60%), masked to the ring; opacity 0.15 + on * 0.45. Glare opacity 0.25 + on * 0.45.\n  - Edge rgb(26 42 138). Glow hue 228.\n- Rainbow: bands of color that slide as it tilts.\n  - Base: radial-gradient(130% 80% at 25% 0%, rgb(59 62 76), rgb(27 28 35) 62%). Ink rgb(245 245 247).\n  - Foil: repeating-linear-gradient(115deg, rgb(255 95 126) 0%, rgb(255 184 107) 2.6%, rgb(244 255 107) 5.2%, rgb(107 255 181) 7.8%, rgb(95 210 255) 10.4%, rgb(139 123 255) 13%, rgb(255 107 214) 15.6%, rgb(255 95 126) 18%), background-size 200%, background-position at the light, under a grating repeating-linear-gradient(125deg, transparent 0 2px, rgb(0 0 0 / 0.3) 2px 3px); mix-blend-mode color-dodge, filter brightness(0.72) saturate(1.25), opacity 0.3 + on * 0.6, masked by radial-gradient(farthest-corner at the light, rgb(0 0 0) 5%, rgb(0 0 0 / 0.16) 72%).\n  - Edge rgb(42 44 53). Glow hue 285.\n- Pearl: a white card with a pastel sheen, strongest toward its edges like a frame.\n  - Base: linear-gradient(160deg, rgb(253 252 255), rgb(241 238 248)). Ink rgb(23 21 46).\n  - Foil: linear-gradient(115deg, rgb(255 196 225) 0%, rgb(201 184 255) 12%, rgb(180 233 255) 24%, rgb(194 255 216) 36%, rgb(255 243 184) 48%, then the same again), background-size 260%, position at the light, multiply, opacity 0.7 + on * 0.3, masked by radial-gradient(70% 60% at 50% 45%, rgb(0 0 0 / 0.35) 30%, rgb(0 0 0) 100%).\n  - Glare: soft-light, white at 90% fading out by 55%, opacity 0.5 + on * 0.5. Rim: base rgb(60 50 120 / 0.06), light white at 95%.\n  - Edge rgb(230 226 242). Glow hue 300.\n- Sparkle: fine glitter.\n  - Base: radial-gradient(120% 80% at 75% 5%, rgb(40 51 106), rgb(16 20 43) 65%). Ink rgb(238 240 255).\n  - Glitter: a 240px tile of about 950 dots, radius 0.45 to 1.85px (most small), alpha 0.35 to 1, used as an alpha mask.\n  - Foil, blended with screen, two layers, each masked by the glitter (the second offset by 117px, 71px) and by radial-gradient(at the light, rgb(0 0 0), rgb(0 0 0 / 0.3) 45%, rgb(0 0 0 / 0.12)):\n    first: repeating-linear-gradient(60deg, rgb(255 139 210) 0 3%, transparent 5% 8%, rgb(139 243 255) 10% 13%, transparent 15% 18%, rgb(255 243 139) 20% 23%, transparent 25% 28%), size 260%, position (lx * 1.6, ly);\n    second: repeating-linear-gradient(-35deg, rgb(169 139 255) 0 3%, transparent 5% 9%, rgb(139 255 196) 11% 14%, transparent 16% 20%, rgb(255 255 255) 22% 24%, transparent 26% 30%), size 260%, position (100% - lx, ly * 1.4).\n    The dark gaps make each fleck light at its own angle and go out again.\n  - Edge rgb(26 32 72). Glow hue 235.\n- Chrome: a silver mirror whose highlights travel against the tilt.\n  - Base: linear-gradient(125deg, rgb(228 230 234) 0%, rgb(141 147 158) 16%, rgb(246 247 249) 30%, rgb(124 130 141) 46%, rgb(217 220 225) 60%, rgb(148 154 165) 76%, rgb(241 242 244) 100%), background-size 220%, background-position (100% - lx, 100% - ly). Ink rgb(27 29 36).\n  - Foil: linear-gradient(115deg, rgb(255 143 199), rgb(255 226 143) 14%, rgb(149 255 208) 28%, rgb(143 214 255) 42%, rgb(192 155 255) 56%, then again), size 240%, position at the light, overlay, opacity 0.3 + on * 0.35.\n  - Glare: soft-light, white at 85%, 10% at 30%, black at 18% at 95%. Rim: base white at 18%, light white at 95%. An engraved look for printed lines: text-shadow 0 -1px 0 rgb(60 64 76 / 0.55), 0 1px 0 rgb(255 255 255 / 0.95).\n  - Edge rgb(180 184 194). Glow hue 200.\n- Etched: a pattern you only see in the light.\n  - Base: matte rgb(18 18 20) with fine concentric rings, repeating-radial-gradient(circle at the artwork's center, rgb(255 255 255 / 0.05) 0 1.2px, transparent 1.6px 7px). Ink rgb(237 237 238).\n  - Foil: linear-gradient(115deg, rgb(255 95 126), rgb(255 184 107) 10%, rgb(244 255 107) 20%, rgb(107 255 181) 30%, rgb(95 210 255) 40%, rgb(139 123 255) 50%, then again), size 300%, position at the light, masked by the same rings and by radial-gradient(at the light, rgb(0 0 0), rgb(0 0 0 / 0.5) 18%, transparent 42%); opacity 0.25 + on * 0.75. Glare opacity 0.2 + on * 0.4.\n  - Keep the artwork window a plain matte panel (radial-gradient(70% 60% at 50% 35%, rgb(29 29 33), rgb(15 15 17))) so the rings stop at it.\n  - Edge rgb(27 27 30). Glow hue 190.\n- On every finish, the rim's base color is white at 5% unless listed, and its light color white at 50%. Text stays readable at every angle: check the lightest and darkest moment of the foil under it.\n\n4. Turning over (only if chosen; Standard values)\n- A click (or tap, or Enter and Space when focused) turns the card 180deg around its vertical axis on a spring (stiffness 70, damping 11), so it settles with a small overshoot in about 0.8s; the same again turns it back.\n- It lifts toward the viewer while it turns: translateZ(|sin(angle)| * 40px); the shadow narrows by up to 45% and drops 14px at edge-on.\n- Thickness 10px: the front sits 5px in front of the card's middle and the back 5px behind it, turned 180deg, both with backface-visibility hidden; between them, 10 copies of the card's outline in the finish's edge color, evenly spaced. Draw the edge only while turning.\n- The back carries the same finish, glare and rim, with the light mirrored (lx becomes 100% - lx). Lay it out on the same margins as the front.\n- Anything that changes the front (another finish, new content) changes while the card is edge-on, so it is never seen switching.\n\n5. Depth inside the artwork (Standard values)\n- Give each part of the artwork its own depth d behind the card's face (negative: in front of it), and move it by d * sin(angle): x = -d * sin(rotateY + turn), y = d * sin(rotateX). This is what real 3D would do.\n- In the demo: the picture behind it 90px, the compass dial 50px, its middle ring 34px, the dashed ring 20px, the needle 12px in front (-12); the print in the corners sits on the surface and does not move. Draw the backmost layer larger than its window (100px on each side) so its edges never show.\n- If the artwork can respond, let it: the compass needle springs toward the pointer (acceleration = 60 * angle difference - 5.5 * velocity, the short way round) and drifts by 12deg * sin(0.77t) + 6deg * sin(2.16t) when left alone; the dial turns 9deg a second and the dashed ring 18deg a second the other way. Small, slow, and one moving idea.\n\n6. Rhythm and accessibility\n- Hover in and out, tilt and light are continuous; the flip settles in about 0.8s.\n- Switching finishes: cross-fade the faces over 420ms, or swap them while edge-on during a flip.\n- Reduced motion: no tilt, no sway and no flip animation (the flip becomes an instant swap or a 200ms cross-fade); the light may still follow the pointer; the background stands still.\n- The card keeps its role: a link or button stays one, the back is reachable by keyboard and announced, and nothing important is only visible at one angle.\n\n7. The background (only if chosen)\n- A glow behind the card: radial-gradient(closest-side, hsl(\u003cfinish's hue\u003e 85% 64% / 0.3), transparent), 860px across, its opacity (0.04 + 0.12 * on) / 0.3.\n- A slow fluid behind it: value noise in fBm (4 octaves, each turned by the matrix (1.6, 1.2; -1.2, 1.6), amplitude halving), warped twice: p = position / height * 1.25 + flow; q = (fbm(p), fbm(p + (5.2, 1.3) - flow.yx)); r = (fbm(p + 3.5q + (1.7, 9.2) + 1.3 * flow), fbm(p + 3.5q + (8.3, 2.8) - flow)); f = fbm(p + 3r). Color = mix(a, b, clamp(2.4f²)), then mix toward c by clamp(0.95 * |q| - 0.35), times 0.5 + 1.1f². Fade to the page color with smoothstep(0.82, 0.18, distance from (50%, 56%), y stretched 1.2). The flow moves round a circle of radius 0.33 about once every 40s; shift the field by (-rotateY, rotateX) * 0.008 so it answers the tilt.\n- Palettes (a, b, c): Prism rgb(10 20 80), rgb(58 42 156), rgb(26 108 192); Rainbow rgb(44 12 64), rgb(12 68 80), rgb(90 32 52); Pearl rgb(51 40 94), rgb(28 74 74), rgb(92 44 80); Sparkle rgb(12 20 56), rgb(38 51 122), rgb(74 58 22); Chrome rgb(24 28 36), rgb(44 54 70), rgb(22 64 74); Etched rgb(13 15 18), rgb(26 36 40), rgb(38 42 50). Ease between palettes over about a second.\n- Draw it at a third of its size, 30 times a second, and scale it up; it is soft, so nobody can tell.\n\n8. How to build it, by platform\nThese are suggestions; check them against my stack and its versions, and choose what fits.\n- Web (as in the demo): CSS 3D transforms with the layers as stacked elements and mix-blend-mode. Set the tilt as a transform on the card itself and the light as custom properties on the face only, never as inherited variables on a parent: changing a variable restyles everything under it. Move the glare as a 2x-sized layer with a transform, put the foil and the animated artwork on their own layers (will-change: transform), draw only the face that shows, and skip writes when a value has not changed. Drive everything from one requestAnimationFrame loop; the fluid is a small WebGL canvas.\n- iOS (SwiftUI): rotation3DEffect with a perspective, the layers as overlays with .blendMode(.colorDodge / .overlay / .multiply), gradients positioned from the light, spring animations for tilt and flip; DragGesture for touch and CoreMotion (CMMotionManager deviceMotion) for phone tilt. A Metal [[stitchable]] colorEffect can draw the foil in one pass.\n- Android (Compose): Modifier.graphicsLayer { rotationX; rotationY; cameraDistance = 12 * density }, Brush gradients drawn with BlendMode in drawWithContent, Animatable springs, pointerInput for drag, SensorManager (TYPE_GAME_ROTATION_VECTOR) for phone tilt. On API 33+, an AGSL RuntimeShader can draw the foil.\n- Flutter: Transform with Matrix4.identity()..setEntry(3, 2, 0.0006)..rotateX()..rotateY(), the layers in a Stack with ShaderMask or CustomPainter blend modes, a FragmentProgram for the foil and the fluid, sensors_plus for phone tilt.\n- Rust (wgpu, Bevy, egui): draw the card as one quad with a fragment shader that computes the foil, glare and rim from the light uniform, and transform it in 3D; the flip and edge are a second quad and a thin box.\n\n9. Presets (around the Standard values; offer these when asking)\n- Feel:\n  Quiet: tilt 6deg, spring 120 / 18 (no visible overshoot), sway at half (about 1 to 1.5deg), hover strength capped at 0.7.\n  Standard (recommended): tilt 12deg, spring 140 / 15, sway 2 to 3deg (section 1).\n  Lively: tilt 16deg, spring 180 / 12 (a clear bounce), sway 3 to 4deg.\n- Thickness: Thin 6px (6 layers), Standard 10px (10 layers, recommended), Thick 16px (16 layers); lift 30, 40 or 56px.\n- Flip spring: Soft 55 / 9 (slower, more overshoot), Standard 70 / 11 (recommended), Crisp 110 / 18 (fast, no overshoot).\n- Depth: None; Subtle (every depth halved); Standard (section 5, recommended).\n- Pearl-like restraint for everyday products: Pearl with Quiet; Rainbow and Sparkle with Standard or Lively for moments worth celebrating.\n\n10. Check\n- Every finish at the four corners and in the middle: the text stays readable, the glare never washes out the print, the rim never reads as a solid line.\n- Flip it many times quickly: it never shows both faces at once or a gap at the edge.\n- The values built match the table I approved.\n- It runs at the display's frame rate on a mid-range phone, and costs nothing when off screen; reduced motion and keyboard both work; light and dark pages both checked.","promptUrl":"https://x.com/Kubai087/status/2121892403212964060"},{"repo": "kubai tip 017 — waiting states", "url": "https://x.com/Kubai087/status/2121449185014845794", "why": "Spinner, skeleton, progress, optimistic, and streaming waits — diagnose-then-restyle prompt", "stars": 0, "license": "", "date": "2026-11-14", "cat": "tips", "comment": "Spinner, skeleton, progress, optimistic, and streaming waits — diagnose-then-restyle prompt","prompt":"Review how my product handles waiting, and decide for each wait which loading state fits: nothing, a spinner, a skeleton, progress, an optimistic change, or an AI answer written as it arrives. Then, if I want it, change them along the lines below. This is about judgment first: diagnose and recommend, and change only what I approve.\n\nThis is a change to my product, not a demo. Work inside my code, on my stack, with my components, tokens, motion values and copy style. Do not add a dependency, a data library or a new visual pattern without asking. Every value below is a default to start from.\n\n0. Read the product first\n- Find every place a person waits: page and route loads, lists and tables, search and filters, buttons that call the server (save, send, sync, delete), uploads, imports and exports, background jobs, and AI calls.\n- For each one, note: what starts it; how long it usually takes (measure it, or estimate from the call: cached, one request, several, a job); what is shown meanwhile (a spinner, a skeleton, nothing, a blocking overlay); whether the layout moves when the data arrives; whether the person can keep working; what happens when it fails; and whether it can be cancelled.\n- Find the shared pieces: the spinner, skeleton and progress components, the data layer (a fetch wrapper, React Query, SWR, Apollo, a store), and any global loading bar or overlay.\n- Tell me in a few lines what you found before going on.\n\n1. The kinds of waiting\na. Under 300ms: show no separate loader (no spinner, skeleton or bar): one that appears and goes in under 300ms reads as a flicker. The one exception is a button whose own icon already means the action, which turns from the press (b). The result is the feedback: when it shows where the person is looking, nothing more is needed; when it doesn't (a sync, a copy, a save off-screen), confirm it with a short toast.\nb. A short wait for one action, length unknown (about 0.3 to 3s): show it where the person acted, with the label and the width unchanged. If the button's icon already means the action (sync, refresh), turn that icon from the press: at least one whole turn even when the answer is instant, and on until the answer lands, always stopping on a whole turn. Otherwise the icon becomes a spinner, started only after 300ms and kept at least 500ms. Block a second press while it runs, but never grey out the page. When it is done, the button goes back as it was and a short toast gives the result (Synced, 1 task updated): at the top centre, a few words, gone after about 3s.\nc. Content whose layout is known (a page, a list, a card, a table): a skeleton.\n  - Show what does not depend on the data at once: the title, tabs, filters, column headers.\n  - After 300ms, draw skeleton shapes for the rest, at the real sizes and places: the same row height and avatar size, lines a little shorter than the text, their lengths varying a little.\n  - A light band crosses the whole list together, every 1.2s.\n  - When the data arrives, the real rows take the same places, top to bottom, each fading in over 200ms, 40ms apart. Nothing jumps. If fewer rows come back, the extra shapes fade out.\n  - Never put a lone spinner in the middle of an empty page instead.\nd. Long work that can be counted (uploads, imports, exports, batch jobs, over about 3s): progress.\n  - Say what it is doing, how far (a count or a percentage, and a bar), and the time left once there is a second of data to estimate from; before that, \"Estimating…\".\n  - Show it in a notification at the top right when the work goes on while the person moves on (an import, an export, a batch job): it keeps the page free, stays on every page and is kept until handled. Work that only concerns one item can show in that item's place instead, at the same size, so nothing on the page moves.\n  - Keep the page usable and offer Cancel. If it can go on without the person, let it run in the background and tell them when it is done.\n  - Show it once the work has run 300 to 500ms; a job done sooner needs only the result.\n  - At the end it turns into the result in place, and opens it when clicked.\n  - Long work that cannot be counted: name the stage it is in (Connecting, Processing 3 files) rather than an endless spinner; after about 10s, say it is taking longer than usual and offer to keep it running in the background.\ne. An action that almost always works and is easy to reverse (mark done, like, rename, reorder, move, add a comment): optimistic.\n  - Show the result at once, before the server answers, everywhere it appears (the tick, the status, the totals), and save behind it. Say quietly that it is saving, in a fixed place on the item (Saving, then Saved, fading after a moment), never with a spinner over the change itself.\n  - If the save fails, put every part of the change back, say why on the item in a few words (Couldn’t save), and offer Retry in the place of the saving status. Keep what the person typed.\n  - Not for payments, deleting for good, sending something to other people, or anything that cannot be quietly put back.\nf. AI answers and other results that arrive in pieces:\n  - First say what it is doing, as steps (Reading 4 tasks, Checking 3 events, Writing the summary), each turning into a check.\n  - Then write the answer as the words arrive, each fading in from a slight blur as the next begins, with a caret after the last.\n  - Keep the answer's space from the start (a card at its final size, or a minimum height that only grows downward), so the page does not move as it writes.\n  - At the end, show Copy and Retry. Offer a way to stop only when answers often run long.\n  - Aim for the first words within 1 to 2s; when that is not possible, the steps must keep moving.\ng. Waits the person does not need to see (prefetching, saving a draft, syncing in the background): nothing, or a quiet status in a fixed place (Saved). Never block the page for them.\n\n2. Rules for every kind\n- Thresholds: under 300ms nothing but a button's own icon turning; 300ms to 1s a spinner or skeleton; 1 to 10s a skeleton, or progress that says what it is doing; over 10s progress, the time left and a way out. Measure on a slow mobile network, not on localhost.\n- Delay and minimum: what appears after 300ms stays at least 500ms. Write one helper for this and use it everywhere.\n- The layout never moves when content arrives: reserve the space (skeletons at real size, minimum heights, fixed image ratios).\n- One indicator per wait: never a spinner on the button, an overlay on the page and a bar at the top all at once.\n- Keep what is known: when refreshing, keep showing the old data with a quiet refresh state, rather than a skeleton.\n- Failures stay where they happened, say what failed and what to do, and offer Retry. A toast that disappears is not enough for something the person has to fix.\n- Reduced motion: keep every state; drop the moving band and the spin, and use a soft opacity pulse or nothing.\n- Accessibility: aria-busy on the region that is loading, a polite live region for done and failed, focus left where it was, and a busy button still reachable by keyboard.\n\n3. Report before changing anything\nGive me a table first, and do not change code yet. One row per wait:\n- Where: the screen or component, and what starts the wait.\n- Now: how long it takes, and what is shown.\n- Should be: nothing, spinner, skeleton, progress, optimistic, AI answer, or background; and why, in a phrase that points to the rule above.\n- Change: what you would do, in a phrase.\nGroup the rows by kind. Then list the shared pieces you would add or change (the delay helper, skeleton shapes, the progress notification). Wait for me to choose what to change.\n\n4. How it looks (defaults; fit them to my design)\n- Spinner: the loading icon from my icon set (or a ring segment on a faint track), 12 to 16px, a turn every 0.9s, in the accent or the text colour. In a button, an icon that already means the action turns instead, speeding up over the first 18% and slowing over the last 18% so it starts and stops at rest: one turn in 640ms at the least, and on at about 600° a second for longer waits (three turns in 1.7s), always ending on a whole turn; otherwise the icon cross-fades into the spinner over 180ms with a little blur and scale. The label and width stay.\n- Toast: 40px tall with a 16px corner, a check on a soft tile and a few words, top centre of the content; it comes down 10px from a slight blur over 500ms, and leaves after about 3s.\n- Skeleton: shapes in the raised grey (rgb(240 240 242) on white; on dark, white at 8%), 6px corners for lines, circles for pictures, 12px lines for 14px text. The band is white at 75%, 320px wide, crossing the whole list at once.\n- Progress in a notification: 344px wide, 24px corners, 14px padding (16px on the right), at the top right. A 32px icon tile centred on the words beside it, holding the file's type as a two-tone filled icon at 18px, the title (Importing tasks.csv), the count and time left in one line (568 of 1,240 rows · About 2s left), and a 4px bar in the accent on the accent at 10%; no row of buttons: the card opens what it is about, and a close mark on hover cancels. It comes down 56px onto the page out of a 4px blur and from 96% over 420ms. When it is done, the same card changes in place: the old words blur out over 160ms and the new ones in over 420ms (Imported 1,240 tasks, Added to Backlog.), the bar folds away and the tile turns solid green with a heavy white check, the same 18px. It then stays until opened or closed.\n- Optimistic: a 20px checkbox in the task icon's place, shown on hover and filled green when ticked; totals roll to the new figure over 320ms; Saving with a 12px spinner, then Saved with a check, at the start of the row's last column, in 12px grey. When a save fails the row shakes 6px, twice, over 360ms, the reason in red takes the place of the row's counts, and Retry takes the place of Saving, until it is fixed.\n- AI answer: steps at 13px with a 16px spinner that turns into a check; the answer at 15/24; the caret 2px wide in the accent; Retry and Copy at the end.\n\n5. How to build it, by platform\nThese are suggestions; check them against my stack and its versions, and prefer what the product already uses.\n- Web: the delay and minimum as one hook or helper, for example useDelayedFlag(loading, 300, 500). React: Suspense with a skeleton fallback, startTransition to keep the old content while the new loads, useOptimistic or a mutation's onMutate with a rollback; React Query or SWR keep the previous data while they refetch. Read streamed answers from fetch with a ReadableStream, or the AI SDK's useChat. Draw the band as one gradient fixed to the list, moved by background-position, and stop it under prefers-reduced-motion.\n- iOS: .redacted(reason: .placeholder) for skeletons, ProgressView for progress, Task cancellation for Cancel, optimistic changes in the view model with a rollback, AsyncSequence for streamed text.\n- Android: a shimmer brush over placeholder shapes in Compose, LinearProgressIndicator with a value, Paging's LoadState for lists, optimistic state in the ViewModel with a rollback, Flow for streamed text.\n- Flutter: the real widgets as placeholders under a shimmer (or Skeletonizer), LinearProgressIndicator(value:), a Stream for streamed text.\n- Rust and other native desktops (egui, iced, GPUI, Tauri): the same states in the UI model, with the 300 and 500ms timers in the update loop.\n\n6. Check\n- Throttle the network (Slow 4G) and time every wait: nothing shows a separate loader under 300ms, nothing flashes, nothing moves the layout when the data comes.\n- Turn the network off during an optimistic change: it goes back, says why, and Retry works.\n- Cancel a long job, and leave the page during one: nothing is lost, nothing keeps spinning.\n- A screen reader hears loading and done; reduced motion has no moving band; light and dark both checked; existing tests still pass.","promptUrl":"https://x.com/Kubai087/status/2121449497171841362"},{"repo": "longbridge/nsh", "why": "Native Shell — Rust UI framework for iOS, Android, macOS, Windows, Linux and the web.", "stars": 2630, "license": "Apache-2.0", "date": "2026-11-13", "cat": "kits", "comment": "Native Shell — Rust UI framework for iOS, Android, macOS, Windows, Linux and the web."},{"repo": "ppmpreetham/BUI", "why": "Blender's GPU-accelerated UI, extracted and usable from Rust, Python, JS, Lua, C and C++.", "stars": 2505, "license": "GPL-3.0", "date": "2026-11-13", "cat": "kits", "comment": "Blender's GPU-accelerated UI, extracted and usable from Rust, Python, JS, Lua, C and C++."},{"repo": "caru-ini/stack-diagram", "why": "Agent skill: describe your stack in a sentence, get an architecture diagram with official logos.", "stars": 2457, "license": "MIT", "date": "2026-11-13", "cat": "skills", "comment": "Agent skill: describe your stack in a sentence, get an architecture diagram with official logos."},{"repo": "shinyobjectz/raea", "why": "Render Anything Engine — describe a video, motion graphic, 3D or game in React/TS; renders on your GPU.", "stars": 2284, "license": "FSL-1.1-ALv2", "date": "2026-11-13", "cat": "motion", "comment": "Render Anything Engine — describe a video, motion graphic, 3D or game in React/TS; renders on your GPU."},{"repo": "vercel-labs/ui", "why": "Headless UI behaviors for agents, with React, Solid, Svelte, Vue and MCP/WebMCP hooks.", "stars": 1558, "license": "Apache-2.0", "date": "2026-11-13", "cat": "kits", "comment": "Headless UI behaviors for agents, with React, Solid, Svelte, Vue and MCP/WebMCP hooks."},{"repo": "yappologistic/CUI", "why": "~150 native C UI components with spring motion and full keyboard support, no dependencies.", "stars": 966, "license": "MIT", "date": "2026-11-13", "cat": "kits", "comment": "~150 native C UI components with spring motion and full keyboard support, no dependencies."},{"repo": "declarative-dragging/dragology", "why": "Declarative dragging for SVG on the web (React + TypeScript).", "stars": 654, "license": "MIT", "date": "2026-11-13", "cat": "kits", "comment": "Declarative dragging for SVG on the web (React + TypeScript)."},{"repo": "JDhruv14/line-art-animation", "why": "Claude skill plus TypeScript library for animated line-art SVG figures and day/night scenes.", "stars": 589, "license": "MIT", "date": "2026-11-13", "cat": "motion", "comment": "Claude skill plus TypeScript library for animated line-art SVG figures and day/night scenes."},{"repo": "kubai tip 016 — toast vs notification", "url": "https://x.com/Kubai087/status/2120682993563922586", "why": "Toast vs notification (status/action/progress vs inbox) — diagnose-then-restyle prompt", "stars": 0, "license": "", "date": "2026-11-12", "cat": "tips", "comment": "Toast vs notification (status/action/progress vs inbox) — diagnose-then-restyle prompt","prompt":"Review how my product tells people that something happened, and decide for each message whether it should be a toast, a notification, or neither. Then, if I want it, restyle the toasts and notifications along the lines below. This is about judgment first: diagnose and recommend, and change only what I approve.\n\nThis is a change to my product, not a demo. Work inside my code, on my stack, with my components, tokens, corner scale, fonts and copy style. Do not add a dependency, a new state library or a new visual pattern without asking. Every value below is a default to start from.\n\n0. Read the product first\n- Find every place that shows a message about an event: toasts and snackbars, alerts and banners, notification lists, inbox or activity panels, badges and counts, inline success and error text, and browser or push notifications.\n- For each one, note: what triggers it (the person's own action, another person, the system, a background job), what it says, any buttons, where it appears, how long it stays, and whether it can be found again later.\n- Find the components behind them and where they are mounted (one per page, or one for the whole app). Note how they announce themselves to screen readers.\n- Tell me in a few lines what you found before going on.\n\n1. What each one is for\n- Toast: answers something the person just did, in the place they are working. It is short, it does not interrupt, and it goes away by itself. It comes in three kinds:\n  a. Status: confirms a result, so the person does not have to go and check. An icon and a few words, no buttons. Example: \"Link copied\".\n  b. Action: the action has already been done, and the toast holds the one step that may follow, usually Undo. One line and one button, plus a close. It stays long enough to use the button, with the time left shown.\n  c. Progress: work that takes a moment. It shows that the work is under way, then turns into the result in the same place, with a button to see it. Example: \"Uploading brand-guide.pdf\" turns into \"Uploaded to Files, Open\".\n- Notification: news the person did not cause just now, from other people or from the system: a mention, a reply, a payment, a deadline, a security alert, a finished report. It can carry more: a title, a few lines and up to two actions. It is shown on every page, stays until it is opened, handled or closed, and several can be shown at once. It is also kept somewhere the person can find it again (an inbox or a list behind a bell, with a count).\n- Neither:\n  - A form error or a problem with one field: show it next to the field.\n  - A failure the person has to fix (an upload that failed, a payment that did not go through): keep it on the item, with a way to fix it, until it is fixed. A toast that disappears after a few seconds is not enough.\n  - An action that cannot be undone: ask before doing it (a confirm next to the button, or a dialog for something with a large impact). A toast after the fact is too late.\n  - Something only worth seeing when the person looks: a badge, a dot or a change of state in place, with no message at all.\n\n2. Questions that settle a case\n- Who caused it? The person, just now: toast. Someone else, the system, or the person a while ago in another place: notification.\n- Does the person need to act? No: status toast. One quick step that may follow (Undo, View): action toast. A real decision or a reply: notification. Something that must be fixed: keep it on the item.\n- Can the action be undone? Then do it at once and offer Undo in a toast instead of asking first. If it cannot be undone, confirm before, not after.\n- How much is there to say? A few words: toast. A sentence or two, a name, an amount, a place: notification.\n- Would it matter if the person missed it? No: toast. Yes: notification, kept until handled.\n- Is the work still running when the person leaves? If it ends while they are still on the page, a toast is enough. If they have moved to another tab or app, a browser or system notification (with permission) is the only way to reach them; inside the product, it also goes into the notification list.\n- Several at once? Toasts: one at a time; a new one replaces the old one, or waits. Notifications: they stack.\n\n3. Report before changing anything\nGive me a table first, and do not change code yet. One row per message:\n- Where: the screen or component, and what triggers it.\n- Now: how it is shown today, in a few words.\n- Should be: status toast, action toast, progress toast, notification, or neither (and which).\n- Why: one line, using the questions above.\n- Change: what would change (kind, wording, buttons, how long it stays, where it is kept).\nMark the ones that are already right. Mark the ones that could go either way and say what decides between them, as a question for me. Then list anything missing: an action that should offer Undo, a failure that only shows a toast, a background job that never says it is done, news with no place to find it again.\nThen ask me which rows to change and wait.\n\n4. Optional: restyle the toast and the notifications\nAfter the table, offer these as a separate choice, and wait for my answer:\nA. Restyle the toast only.\nB. Restyle the notifications only.\nC. Both.\nD. Neither; just fix the kinds and wording.\nFor each one I pick, show me a short before and after (values and motion), in my product's own colours and corners, and wait for my go-ahead before building.\n\n4A. Toast\n- Place: the top centre of the page, 12 under the top bar, over the content. One at a time.\n- Shape: 40 tall, 16 corners (or the nearest step in my corner scale), a white surface with a soft top-to-bottom gradient (#ffffff to #f7f9fc), a 1px border rgba(214, 219, 227, 0.95), and a soft shadow (0 16px 36px rgba(17, 24, 39, 0.08), 0 3px 10px rgba(17, 24, 39, 0.05)). Inner shapes are concentric with it: the icon, 8 in, is 24 with 8 corners; a button or the close, 6 in, is 28 with 10 corners.\n- Content: icon, then one line of 14/20 text, then the button and the close if there are any. The done icon is a check on a soft tile in my accent colour; work in progress is a ring; the time left to undo is a ring that empties, with the seconds in its centre. The button is accent-coloured text, with a tint only on hover. Keep the gaps tight: 8 between the icon and the text, the button and the close next to each other.\n- Enter: in 500ms on cubic-bezier(0.25, 0.1, 0.25, 1), the whole toast comes down from 10px above, grows from 96% and clears from an 8px blur; it is fully opaque a little before the end. Text and controls move with it as one piece, not letter by letter.\n- Leave: 220ms, ease-in: up 6px, blur 6px, fade out.\n- Sheen: a light band crosses it once (900ms, ease-out) only when something is done: a status toast as it enters, a progress toast as it turns into its result, an Undo toast after Undo. An action toast that still waits for a choice enters without it.\n- Change in place (progress to result, archived to restored): the old line (text, button and close together) blurs out and moves 5px up in 180ms; the new line blurs in from 5px below between 100 and 400ms; the toast takes its new width in 380ms on cubic-bezier(0.32, 0.72, 0, 1). Only the icon has a move of its own: the old one shrinks and blurs away while the new one turns in from -40 degrees and half size.\n- After Undo: the change is reverted, and the toast says so (\"Task restored\") for about 1.5 seconds before it leaves.\n- Timing: a status toast stays 3 to 5 seconds, longer for longer text; an action toast at least 5 seconds; a progress toast stays while the work runs, then 3 seconds. The timer pauses while the pointer is over the toast or focus is inside it.\n\n4B. Notifications\n- Place: the top right, 12 under the top bar, the same on every page, above the content. 344 wide.\n- Card: 24 corners with 12 of padding, so the picture (32, a person's photo or the product's logo) and the buttons (32 tall, 12 corners) are concentric with it. A title (14/20, semibold) with the time on the right, up to three lines of 13/20 text, then up to two buttons on the bottom right, the main one last.\n- A stack: the newest is in front. The older ones are cut to the front one's height and peek out 12 below it, at 95% and 90%, showing only their edge; at most three show.\n- A new one arrives: it slides down onto the stack from 56px above in 560ms on cubic-bezier(0.32, 0.72, 0, 1), clearing from a light blur, while the others are pushed down and back a step. The one it covers keeps its content until the new one is on its way over it, so it reads as stacking, not replacing.\n- Hover: the stack spreads into a list at the cards' own heights, 8 apart, in 380ms on the same curve. In the list each card keeps to a hairline and a light shadow, so no shadow falls on the card below; stacked, only the front card has the deep shadow.\n- Close one, as on macOS: a small close button (24, 10 corners) appears over a card's top-left corner while the pointer is on that card. Handling a card with one of its buttons also removes it. A removed card slides 48px to the right and fades in 260ms, and the ones below close the gap in 400ms. \"Clear all\" sits under the last card while the list is spread out.\n- Counts: the bell shows how many are waiting, and so does the page title, so a tab in the background shows it too. Notifications that need a decision (security, payments) stay in the list behind the bell even when they are cleared from the screen.\n\n4C. For both\n- Reduced motion: keep the change of state and a short fade (about 150ms); drop the movement, scaling and blur.\n- Screen readers: toasts are announced politely (role=\"status\"); a notification that needs attention is announced once as it arrives. Neither takes focus away from what the person is doing. Their buttons can be reached by keyboard, and Escape closes the one in focus.\n- Touch: the same places, with swipe to dismiss; there is no hover, so the stack spreads on tap.\n- Dark mode: the same rules on my dark surfaces; the sheen is fainter.\n\n5. Build what I pick\n- List the files you will touch and wait for my go-ahead.\n- Change one thing at a time and keep what each action does. Then check:\n  - Short and long text, a missing picture, many notifications at once, several toasts in a row.\n  - Undo used, ignored and closed; a progress that fails; leaving the page while something is still running.\n  - Phone and desktop layouts, light and dark, reduced motion, keyboard and screen reader.\n  - Existing tests still pass.\n- Web: CSS transitions or the Web Animations API for the toast; for the stack, measure each card's height and animate transform and height together. Sonner (React) has a similar stack and can be adapted, but ask before adding it. iOS, Android and Flutter: use the platform's own animation tools with the same values; for messages that reach people outside the app, use the system's notifications.","promptUrl":"https://x.com/Kubai087/status/2120685913441456371"},{"repo": "nateherkai/scroll-craft", "why": "Agent skill for premium scroll-driven / scrollytelling sites. Also ships as a Claude Code plugin.", "stars": 4944, "license": "MIT", "date": "2026-11-12", "cat": "skills", "comment": "Agent skill for premium scroll-driven / scrollytelling sites. Also ships as a Claude Code plugin."},{"repo": "artemnovitckii/claude-animation-skills", "why": "Six no-footage reel skills — 3D cartoon explainer, stick figure, line art, map route, exploded view, line graph.", "stars": 647, "license": "Other", "date": "2026-11-12", "cat": "motion", "comment": "Six no-footage reel skills — 3D cartoon explainer, stick figure, line art, map route, exploded view, line graph."},{"repo": "sirioberati/YouTube-AI-Motion-Graphics", "why": "74 HTML explainer boards (charts, Venn, timeline, heatmap) synced to voice with Whisper, exported via Chrome + FFmpeg; prompts and Claude skills included.", "stars": 193, "license": "MIT", "date": "2026-11-12", "cat": "motion", "comment": "74 HTML explainer boards (charts, Venn, timeline, heatmap) synced to voice with Whisper, exported via Chrome + FFmpeg; prompts and Claude skills included."},{"repo": "albertirgi/replica", "why": "Rebuild a UI from a site, screenshot or recording, then score the clone on layout, style, pixels and motion until it passes.", "stars": 104, "license": "MIT", "date": "2026-11-12", "cat": "lint", "comment": "Rebuild a UI from a site, screenshot or recording, then score the clone on layout, style, pixels and motion until it passes."},{"repo": "alextraykov/glyph-kit", "why": "Product-design figures as text — research, flows, wireframes and motion in four shades and a few lines, for Claude Code and Codex.", "stars": 84, "license": "MIT", "date": "2026-11-12", "cat": "skills", "comment": "Product-design figures as text — research, flows, wireframes and motion in four shades and a few lines, for Claude Code and Codex."},{"repo": "rjmahesh/ui-redline-walkthrough", "why": "Turns before/after UI screenshots into an animated redline walkthrough (red ink, morphing UI, MP4 export).", "stars": 56, "license": "MIT", "date": "2026-11-12", "cat": "motion", "comment": "Turns before/after UI screenshots into an animated redline walkthrough (red ink, morphing UI, MP4 export)."},{"repo": "Ludi-Herry/mobile-design-system-skill", "why": "iOS/Android design-system skill for Cursor and Claude — mobile UI/UX component specs agents can execute.", "stars": 40, "license": "MIT", "date": "2026-11-12", "cat": "skills", "comment": "iOS/Android design-system skill for Cursor and Claude — mobile UI/UX component specs agents can execute."}, {"repo": "kubai tip 015 — continuity transitions", "url": "https://x.com/Kubai087/status/2120320609255043510", "why": "Shared-element continuity (nav, card, player, search, chart, menu, tabs) — diagnose-then-build prompt", "stars": 0, "license": "", "date": "2026-11-11", "cat": "tips", "comment": "Shared-element continuity (nav, card, player, search, chart, menu, tabs) — diagnose-then-build prompt","prompt":"Find the places in my product where the interface jumps from one state to the next, and make the important ones continuous: the element I touched should carry into what comes next instead of disappearing and being replaced. First diagnose and suggest; build only what I pick.\n\nThis is a change to my product, not a demo. Work inside my code, on my stack, with my components, tokens and layout. Keep what every action does, what each screen shows and where things end up; change only how one state becomes the next. Do not copy a demo scene (no phone frame, backdrop, sample content or fonts). Do not add a dependency or a router change without asking. Every value below is a default to start from. It applies to phone and desktop layouts alike; section 3 says where they differ.\n\n0. Read the product first\n- Find the screens, routes, panels, sheets, dialogs, menus and lists, and how one opens from another: navigation stack or router, modal and sheet presenters, popover and menu components, list and grid components.\n- Find what animates today and how: CSS transitions, the View Transitions API, Motion or Framer Motion, GSAP, SwiftUI or UIKit transitions, Compose animations, Flutter Hero or implicit animations. Note the motion tokens (durations, curves, springs) and reduced-motion handling, and reuse them.\n- Note which layouts exist (phone, tablet, desktop window, split view) and the input on each (touch, mouse, keyboard).\n- Tell me in a few lines what you found before going on.\n\n1. What to look for\nA jump is where I act on one element and the next state appears from nowhere: a hard cut, a cross-fade of whole screens, or something sliding in from an unrelated edge. Look for these, the most common first:\na. A row or item opens its detail page. Continuous: the row's title grows into the page title; its picture into the header; the previous page's title shrinks into the back button. When the page scrolls, the large title tucks into the top bar, centred on the control row. Going back reverses all of it.\nb. A card opens into a full view or a dialog. Continuous: the card itself grows into the view (its frame, corners and picture), its title stays the same line of type and only scales, and the rest fades in once the card is mostly open. Closing, or dragging it down, shrinks it back into the same card in the same place.\nc. A compact bar opens into a full panel: a mini player, a chat bubble, an upload or download pill, a toast with details. Continuous: the bar is the panel; its cover, title and main button grow into their places in it. The panel stays opaque all the way, and the page behind steps back (scale about 0.94, dimmed about 30%).\nd. Search or filter. Continuous: the field moves up into the top row as the page title leaves and a Cancel or close slides in; while typing, the matching items slide from where they are to their place in the results and the rest fade out. On desktop the same applies to a command palette opening from its field.\ne. A summary opens into its detail: a metric tile into a chart, a progress ring into a report, a thumbnail into a gallery. Continuous: the small marks become the large ones (the sparkline is the chart's line, the small bars are the chart's bars), the label moves into the title, and the number scales up rather than being redrawn.\nf. A control opens what it controls: a ⋯ or + button into its menu or form, a select into its list, a date field into its picker. Continuous: the panel grows out of the control from the control's own corner, its items fade in after it is mostly open (about 25ms apart), and the highlight slides from item to item with the pointer or finger. When an action adds, removes or moves something, it appears in its place and the others move to make room; nothing jumps.\ng. Tabs, segmented controls, bottom bars and side navigation. Continuous: one indicator travels from the old tab to the new one. Its leading edge leaves first and the trailing edge follows, so it stretches on the way and settles as it lands (a small squash of about 15% of its height at the longest is enough); labels collapse and expand while the other items make room. New content enters from the side of the tab that was chosen.\nh. Layout changes: grid to list, sort, reorder, insert, delete, expand and collapse. Continuous: each item moves from where it was to where it goes; items that change row leave at the end of their row and come in at the start of the next, so nothing crosses the grid.\n\n2. How to make it continuous\n- One element, not two. The thing that moves is the same element (or a shared element the framework matches by id), measured where it starts and where it ends. Animate between the two boxes with transforms; never animate width, height, top or margin on things that reflow.\n- What only one state has fades: content that exists only at the end fades in after about 45-55% of the move, and content that exists only at the start fades out in the first 25-35%. Text that changes size scales; it is not cross-faded with a copy.\n- Keep layers honest: a panel that grows is opaque all the way, so nothing shows through it; the moving element stays above its neighbours while it moves, and goes back to its place in the stack when it lands.\n- Shapes keep their corners: the radius changes smoothly between start and end, using the product's own corner curve. Nested shapes keep equal padding and concentric corners.\n- Timing: open and close with a fast start and a long settle, cubic-bezier(.32, .72, 0, 1) or the product's own spring. Phones: 450-700ms for something that becomes a full screen, 350-500ms for menus and sheets, 400-450ms for an indicator. Desktop: about two thirds of that, and shorter still when it was triggered from the keyboard. Moves within a screen use ease-in-out. Staggers stay between 20 and 50ms.\n- Gestures: while a finger or the pointer drags, follow it 1:1 (a dragged card shrinks to about 0.82 as it goes); on release, finish with the release velocity, toward whichever end is nearer.\n- Interruptions: a new action takes over from wherever the animation is; nothing waits for an animation to finish, and input is never blocked.\n- Reduced motion: keep the change of state and a short cross-fade (about 150ms), drop the movement and scaling.\n- Accessibility: focus moves to the new state's heading or first control, and back to the element that opened it when it closes; screen readers announce the new state as they do now.\n\n3. Phone and desktop\n- Phone: everything above, with gestures (swipe back, drag to dismiss) driving the same animation as the buttons, and safe areas respected at every frame.\n- Desktop: the same patterns, smaller and quicker. A card or row usually opens into a side panel or dialog rather than a full window; grow it from the card into that panel. Do not zoom whole windows. Hover never starts a layout animation. Keep pointer targets in place while they animate, so a second click lands where it aims. In split views, animate inside the pane that changes.\n- Window resizing and responsive breakpoints are not transitions; do not animate them.\n\n4. Report before building\nGo through the product and give me a ranked list, at most 10 entries, each with:\n- Where: the screen or component, and the action that triggers it (on phone, desktop or both).\n- Now: what happens today, in one line.\n- Pattern: which of a-h it is, and which element should carry over.\n- Change: what moves to where, the duration and curve, in two or three lines.\n- Value: high, medium or low, from how often people do it and how lost they could get without it.\n- Cost: what has to change in the code, and any risk (routing, virtualized lists, shared state).\nPut the frequent, disorienting ones with low cost first. Then ask me which ones to build and wait.\n\n5. Build what I pick\n- Describe the approach for each on my platform (section 6 is a starting point), and list the files you will touch. Wait for my go-ahead.\n- Build them one at a time. For each, list the files you touched, and check:\n  - The first and last frame match the real states exactly; nothing jumps when the moving element hands over to the real one.\n  - Real data: long and short text, missing images, the first and last item, an empty list, a scrolled list.\n  - Fast repeated taps or clicks, going back during the animation, and gestures cancelled half way.\n  - Phone and desktop layouts, light and dark, reduced motion, keyboard and screen reader.\n  - At rest every screen looks exactly as before, and existing tests still pass.\n\n6. How, by platform (check against my versions)\n- Web: the View Transitions API with view-transition-name on the shared elements (same-document, and cross-document where pages are separate), with a plain update as the fallback. Otherwise FLIP: measure first, apply the change, measure last, animate the inverse with transforms (Motion's layout and layoutId do this; so do Svelte's flip and crossfade, and Vue's TransitionGroup). For router-driven pages, start the transition from the router's navigation hook.\n- iOS: SwiftUI matchedGeometryEffect for shared elements in one view, navigationTransition(.zoom(sourceID:in:)) with matchedTransitionSource on iOS 18 and later for pushes and sheets; UIKit preferredTransition = .zoom on iOS 18, or a custom UIViewControllerAnimatedTransitioning with UIViewPropertyAnimator for interruptible, gesture-driven ones.\n- Android: Compose SharedTransitionLayout with Modifier.sharedElement and sharedBounds, AnimatedContent, Modifier.animateItem for lists, and predictive back for gesture-driven returns; with Views, MaterialContainerTransform and shared element transitions.\n- Flutter: Hero for shared elements between routes, OpenContainer from the animations package for card to page, AnimatedList and implicit animations for layout changes.\n- Desktop apps: Electron and Tauri take the web route (Tauri uses the system WebView, so test View Transitions there and keep the fallback); native apps use the same ideas with their own animation tools.","promptUrl":"https://x.com/Kubai087/status/2120321469817483516"}, {"repo": "logoicon.cn", "url": "https://logoicon.cn", "why": "App icon collection — browse by category, palette, and designer when icons feel generic", "stars": 0, "license": "", "date": "2026-11-11", "cat": "web", "comment": "App icon collection — browse by category, palette, and designer when icons feel generic"}, {"repo": "rossark0/rossark-motion-skill", "why": "Claude skill for living illustration motion: one clock, real pivots, follow-through; React Native and SwiftUI templates", "stars": 778, "license": "MIT", "date": "2026-11-11", "cat": "motion", "comment": "Claude skill for living illustration motion: one clock, real pivots, follow-through; React Native and SwiftUI templates"}, {"repo": "CityPulso/PulsoIcon", "why": "9,955 icons with per-icon hover motion — Svelte 5, React, Vue, Compose, and SwiftUI, Lucide-compatible names", "stars": 569, "license": "ISC", "date": "2026-11-11", "cat": "icon", "comment": "9,955 icons with per-icon hover motion — Svelte 5, React, Vue, Compose, and SwiftUI, Lucide-compatible names"}, {"repo": "YusufCeng1z/ding", "why": "Toasts with a real spring solver that morph in place — Svelte 5, React, Vue, or plain DOM, no extra deps", "stars": 445, "license": "MIT", "date": "2026-11-11", "cat": "kits", "comment": "Toasts with a real spring solver that morph in place — Svelte 5, React, Vue, or plain DOM, no extra deps"}, {"repo": "ShuaiMXu/happyhands", "why": "Agent UI review harness: capture real pages and tasks, scope a fix in a worktree, and compare before/after evidence", "stars": 395, "license": "MIT", "date": "2026-11-11", "cat": "skills", "comment": "Agent UI review harness: capture real pages and tasks, scope a fix
