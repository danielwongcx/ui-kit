<style>
  :root {
    --bg: #efe9df;
    --bg2: #e8e1d5;
    --tile: #f7f3ec;
    --ink: #2a2a2a;
    --muted: #6b6560;
    --shadow-dark: rgba(160, 140, 110, 0.45);
    --shadow-light: rgba(255, 255, 255, 0.9);
    --radius: 28px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse 80% 50% at 10% 90%, rgba(90,120,70,0.08), transparent 55%),
      radial-gradient(ellipse 60% 40% at 90% 10%, rgba(255,255,255,0.5), transparent 50%),
      linear-gradient(160deg, #f3eee6 0%, var(--bg) 45%, var(--bg2) 100%);
    background-attachment: fixed;
    padding: 40px 20px 80px;
  }
  body.modal-open { overflow: hidden; }
  .wrap { max-width: 920px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 36px; }
  header h1 {
    font-size: 1.55rem; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 8px;
  }
  header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 28px 22px; margin: 0 auto 8px; max-width: 640px;
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 22px 16px; }
  }
  .cat {
    appearance: none; border: none; background: transparent; padding: 0;
    cursor: pointer; display: flex; flex-direction: column; align-items: center;
    gap: 12px; font: inherit; color: inherit; -webkit-tap-highlight-color: transparent;
  }
  .tile {
    width: 112px; height: 112px; border-radius: var(--radius);
    background: linear-gradient(145deg, #fffefb, var(--tile));
    box-shadow:
      10px 12px 24px var(--shadow-dark),
      -8px -8px 20px var(--shadow-light),
      inset 0 1px 0 rgba(255,255,255,0.95);
    display: grid; place-items: center;
    transition: transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1), box-shadow 0.28s ease, background 0.28s ease;
    position: relative;
  }
  .cat:hover .tile {
    transform: translateY(-4px) scale(1.03);
    box-shadow:
      12px 16px 28px var(--shadow-dark),
      -10px -10px 22px var(--shadow-light),
      inset 0 1px 0 rgba(255,255,255,0.95);
  }
  .cat:active .tile,
  .cat.is-active .tile {
    transform: translateY(2px) scale(0.97);
    background: linear-gradient(145deg, #ebe4d8, #f4efe6);
    box-shadow:
      inset 6px 6px 14px var(--shadow-dark),
      inset -5px -5px 12px var(--shadow-light),
      0 1px 2px rgba(255,255,255,0.5);
  }
  .cat.is-active .tile::after {
    content: ""; position: absolute; inset: -3px;
    border-radius: calc(var(--radius) + 3px);
    border: 2px solid color-mix(in srgb, var(--hue) 55%, transparent);
    pointer-events: none; animation: ringIn 0.35s ease;
  }
  @keyframes ringIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }
  .icon {
    width: 56px; height: 56px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.12));
    transition: transform 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  .cat:hover .icon { transform: scale(1.08) rotate(-3deg); }
  .cat.is-active .icon { transform: scale(0.95); }
  .cat-label { font-size: 0.92rem; font-weight: 560; text-align: center; line-height: 1.2; }
  .cat-meta { font-size: 0.75rem; color: var(--muted); margin-top: -8px; }

  .modal {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    visibility: hidden; pointer-events: none;
  }
  .modal.open { visibility: visible; pointer-events: auto; }
  .backdrop {
    position: absolute; inset: 0;
    background: rgba(42, 36, 28, 0.42);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    transition: opacity 0.28s ease;
  }
  .modal.open .backdrop { opacity: 1; }
  .sheet {
    position: relative; z-index: 1;
    width: min(640px, 100%);
    max-height: min(86vh, 820px);
    display: flex; flex-direction: column;
    background: linear-gradient(160deg, #fffefb, #f5f0e8);
    border-radius: 24px;
    box-shadow:
      16px 24px 48px rgba(80, 60, 40, 0.35),
      -6px -6px 20px rgba(255,255,255,0.5),
      inset 0 1px 0 rgba(255,255,255,0.9);
    transform: translateY(28px) scale(0.96);
    opacity: 0;
    transition:
      transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
      opacity 0.3s ease;
    overflow: hidden;
  }
  .modal.open .sheet {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  .sheet-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; padding: 20px 20px 12px; flex-shrink: 0;
  }
  .sheet-head h2 { margin: 0; font-size: 1.2rem; font-weight: 650; }
  .sheet-head .sub { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; }
  .close {
    appearance: none; border: none; cursor: pointer;
    width: 40px; height: 40px; border-radius: 14px; flex-shrink: 0;
    background: #efe9df;
    box-shadow:
      4px 5px 10px rgba(160,140,110,0.3),
      -3px -3px 8px rgba(255,255,255,0.85);
    font-size: 1.25rem; line-height: 1; color: var(--ink);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .close:hover { transform: scale(1.05); }
  .close:active {
    transform: scale(0.95);
    box-shadow: inset 3px 3px 8px rgba(160,140,110,0.35), inset -2px -2px 6px rgba(255,255,255,0.8);
  }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px;
    padding: 0 20px 14px; flex-shrink: 0;
  }
  .search {
    flex: 1 1 160px; min-width: 140px;
    padding: 11px 14px; border: none; border-radius: 14px;
    background: #efe9df;
    box-shadow:
      inset 4px 4px 10px rgba(160,140,110,0.35),
      inset -3px -3px 8px rgba(255,255,255,0.8);
    font: inherit; font-size: 0.92rem; color: var(--ink); outline: none;
  }
  .search::placeholder { color: #9a9288; }
  .sort {
    flex: 0 0 auto;
    padding: 11px 14px; border: none; border-radius: 14px;
    background: #efe9df;
    box-shadow:
      4px 5px 10px rgba(160,140,110,0.28),
      -3px -3px 8px rgba(255,255,255,0.85);
    font: inherit; font-size: 0.88rem; color: var(--ink);
    cursor: pointer; outline: none;
  }
  .sheet-body {
    overflow-y: auto; padding: 0 16px 20px;
    -webkit-overflow-scrolling: touch;
  }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .card {
    display: block; padding: 14px 16px; border-radius: 16px;
    background: #faf7f2;
    box-shadow:
      4px 5px 12px rgba(160,140,110,0.22),
      -3px -3px 8px rgba(255,255,255,0.85);
    text-decoration: none; color: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    animation: cardIn 0.4s ease both;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow:
      6px 8px 16px rgba(160,140,110,0.28),
      -4px -4px 10px rgba(255,255,255,0.9);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card .name {
    font-weight: 600; font-size: 0.98rem; color: #1a5fb4; word-break: break-all;
  }
  .card .comment {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    background: #efe9df;
    box-shadow:
      inset 2px 2px 6px rgba(160,140,110,0.22),
      inset -2px -2px 5px rgba(255,255,255,0.7);
  }
  .card .comment-label {
    display: block;
    font-size: 0.72rem;
    font-weight: 650;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .card .comment-body {
    margin: 0;
    font-size: 0.92rem;
    line-height: 1.45;
    color: #3a3632;
  }
  .card .meta {
    display: flex; flex-wrap: wrap; gap: 8px 14px;
    margin-top: 10px; font-size: 0.78rem; color: var(--muted);
  }
  .empty {
    text-align: center; color: var(--muted); padding: 36px 12px; font-size: 0.95rem;
  }
</style>
</head>

const grid = document.getElementById("grid");
const modal = document.getElementById("modal");
const listEl = document.getElementById("list");
const emptyEl = document.getElementById("empty");
const searchEl = document.getElementById("search");
const sortEl = document.getElementById("sort");
const titleEl = document.getElementById("panel-title");
const countEl = document.getElementById("panel-count");
const closeBtn = document.getElementById("close");
const backdrop = document.getElementById("backdrop");
const SORT_KEY = "repo-scout-digest-sort";

let active = null;

(function restoreSort() {
  try {
    const saved = localStorage.getItem(SORT_KEY);
    if (saved && [...sortEl.options].some(o => o.value === saved)) {
      sortEl.value = saved;
    }
  } catch (_) {}
})();

CATS.forEach((c) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "cat";
  btn.dataset.id = c.id;
  btn.style.setProperty("--hue", c.hue);
  btn.setAttribute("role", "option");
  btn.innerHTML = `<span class="tile">${ICONS[c.id]}</span>
    <span class="cat-label">${c.label}</span>
    <span class="cat-meta">${COUNTS[c.id]} repos</span>`;
  btn.addEventListener("click", () => openCat(c.id));
  grid.appendChild(btn);
});

function openCat(id) {
  active = id;
  document.querySelectorAll(".cat").forEach(b => b.classList.toggle("is-active", b.dataset.id === id));
  const cat = CATS.find(c => c.id === id);
  titleEl.textContent = cat.label;
  searchEl.value = "";
  renderList();
  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
  document.body.classList.add("modal-open");
  closeBtn.focus({ preventScroll: true });
}

function closeModal() {
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
  document.body.classList.remove("modal-open");
  document.querySelectorAll(".cat").forEach(b => b.classList.remove("is-active"));
  active = null;
}

function sortItems(items, mode) {
  const copy = items.slice();
  switch (mode) {
    case "stars-desc":
      return copy.sort((a,b) => (b.stars||0) - (a.stars||0) || (b.date||"").localeCompare(a.date||""));
    case "stars-asc":
      return copy.sort((a,b) => (a.stars||0) - (b.stars||0) || (a.date||"").localeCompare(b.date||""));
    case "date-asc":
      return copy.sort((a,b) => (a.date||"").localeCompare(b.date||"") || (b.stars||0) - (a.stars||0));
    case "name-asc":
      return copy.sort((a,b) => a.repo.localeCompare(b.repo));
    case "name-desc":
      return copy.sort((a,b) => b.repo.localeCompare(a.repo));
    case "date-desc":
    default:
      return copy.sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.stars||0) - (a.stars||0));
  }
}

function renderList() {
  if (!active) return;
  const q = (searchEl.value || "").trim().toLowerCase();
  let items = REPOS.filter(r => r.cat === active)
    .filter(r => {
      if (!q) return true;
      const hay = [r.repo, r.why, r.comment, r.license].join(" ").toLowerCase();
      return hay.includes(q);
    });
  items = sortItems(items, sortEl.value);

  countEl.textContent = items.length + " shown · " + COUNTS[active] + " in category";
  listEl.innerHTML = "";
  emptyEl.hidden = items.length > 0;

  items.forEach((r, i) => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.className = "card";
    a.href = "https://github.com/" + r.repo;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.style.animationDelay = (Math.min(i, 24) * 0.03) + "s";
    const stars = (r.stars != null && r.stars !== "") ? r.stars + "★" : "—★";
    const lic = r.license ? r.license : "no license noted";
    const comment = r.comment || r.why || "";
    a.innerHTML = `<div class="name">${escapeHtml(r.repo)}</div>
      <div class="comment">
        <span class="comment-label">My comment</span>
        <p class="comment-body">${escapeHtml(comment)}</p>
      </div>
      <div class="meta"><span>${escapeHtml(String(stars))}</span><span>${escapeHtml(r.date||"")}</span><span>${escapeHtml(lic)}</span></div>`;
    li.appendChild(a);
    listEl.appendChild(li);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

closeBtn.addEventListener("click", closeModal);
backdrop.addEventListener("click", closeModal);
searchEl.addEventListener("input", renderList);
sortEl.addEventListener("change", () => {
  try { localStorage.setItem(SORT_KEY, sortEl.value); } catch (_) {}
  renderList();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modal.classList.contains("open")) closeModal();
});
</script>
